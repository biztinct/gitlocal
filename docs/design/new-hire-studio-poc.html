<meta charset="utf-8">
<title>New Hire Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: one screen, three columns. Left = the 7 steps with live status (3 required, 4 optional).
   Centre = the one question you are answering now. Right = the employee record building itself, with a first-payslip example.
   Single light look on purpose: it mirrors the product screen it proposes to replace. */
:root{
  --ink:#1E1B2E; --muted:#64748B; --faint:#94A0B4; --line:#E2E8F0; --line2:#EEF0F6;
  --canvas:#F4F5FB; --card:#FFFFFF; --soft:#FAFAFD; --rail:#10122E; --rail-ink:#A9AFD1;
  --p:#5A4BB0; --p-h:#4A3D96; --p-soft:#EDEAF8; --p-light:#CBC2EE; --p-dark:#241F52;
  --ok:#2E7D4F; --ok-soft:#E4F3EA; --warn:#B45309; --warn-soft:#FDF1DD; --err:#DC2668; --err-soft:#FCE7EF;
  --teal:#0F8B8D; --teal-soft:#E0F2F2; --blue:#2563EB; --blue-soft:#E5EDFD;
  --display:'Manrope','Inter',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(30,27,46,.05),0 8px 24px rgba(30,27,46,.06);
}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--p);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

.app{display:flex;min-height:100vh}
.siderail{width:60px;background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;align-items:center;gap:18px;padding:14px 0;flex:none}
.siderail .logo{width:34px;height:34px;border-radius:10px;background:var(--p);color:#fff;display:grid;place-items:center;font:800 16px var(--display);margin-bottom:6px}
.siderail .on{color:#fff;background:#2A2C5C;border-radius:9px;padding:7px;display:grid}
.shell{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.crumb{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumb b{color:var(--ink);font-family:var(--display);font-size:15px}
.demo{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:99px}
.top .sp{flex:1}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.prog .bar{width:110px;height:6px;border-radius:9px;background:var(--line2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .4s}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:8px 14px;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--p-light);background:var(--p-soft)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}
.btn.pri:hover{background:var(--p-h)}
.btn.out{color:var(--p);border-color:var(--p-light)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--line2);color:var(--ink)}
.btn.big{padding:12px 20px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .ic{width:16px;height:16px}

.work{display:grid;grid-template-columns:236px minmax(0,1fr) 328px;gap:20px;align-items:start;
  padding-block:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;flex-direction:column;gap:2px}
.steps h3{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 10px 6px}
.steps h3:first-child{padding-top:0}
.step{display:flex;gap:11px;align-items:flex-start;text-align:left;border:0;background:transparent;border-radius:12px;padding:9px 10px;width:100%}
.step:hover{background:#ECEDF6}
.step.cur{background:var(--card);box-shadow:var(--shadow)}
.step .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font:700 12px var(--body);background:var(--line2);color:var(--muted);margin-top:1px}
.step.cur .dot{background:var(--p);color:#fff}
.step.done .dot{background:var(--ok-soft);color:var(--ok)}
.step.warn .dot{background:var(--warn-soft);color:var(--warn)}
.step .dot .ic{width:14px;height:14px;stroke-width:3}
.step b{display:block;font-weight:600;font-size:13.5px}
.step small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.step.warn small{color:var(--warn)}
.step.done small{color:var(--ok)}

.stage{min-width:0;display:flex;flex-direction:column;gap:16px}
.q{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.q .t{flex:1;min-width:240px}
.eyebrow{font-size:12px;font-weight:600;color:var(--p);letter-spacing:.06em;text-transform:uppercase}
.q h1{font-size:27px;font-weight:800;line-height:1.15;margin:2px 0 4px}
.q p{color:var(--muted);max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px 18px}
.card h3{font-size:15px;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.nav{display:flex;justify-content:space-between;gap:10px;padding-top:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--line2);color:var(--muted);white-space:nowrap}
.chip .ic{width:13px;height:13px}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.p{background:var(--p-soft);color:var(--p)} .chip.teal{background:var(--teal-soft);color:var(--teal)}
.hint{display:flex;gap:9px;align-items:flex-start;background:var(--p-soft);color:var(--p-dark);border-radius:12px;padding:10px 13px;font-size:13px}
.hint .ic{color:var(--p);margin-top:1px}
.hint.warn{background:var(--warn-soft);color:#7A3A06}.hint.warn .ic{color:var(--warn)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.f em{font-style:normal;color:var(--err)}
.f i{font-style:normal;font-weight:400;color:var(--faint)}
.f input,.f select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--card);font-size:14px;color:var(--ink);font-weight:500;width:100%;min-width:0}
.f input:focus,.f select:focus{outline:2px solid var(--p-light);border-color:var(--p)}
.f .why{font-size:11.5px;color:var(--teal);font-weight:600;display:flex;gap:4px;align-items:center}
.f .why .ic{width:12px;height:12px}
.seg{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tog{width:38px;height:22px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on{background:var(--p)} .tog.on::after{left:19px}

/* step 1: ways to start */
.ways{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.way{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);padding:13px 14px}
.way:hover{border-color:var(--p-light)}
.way.on{border-color:var(--p);background:var(--p-soft)}
.way b{display:block;font-weight:600}
.way small{color:var(--muted);font-size:12.5px;line-height:1.35;display:block}
.tile{width:34px;height:34px;border-radius:10px;background:var(--p-soft);color:var(--p);display:grid;place-items:center;flex:none}
.way.on .tile{background:var(--p);color:#fff}
.cand{display:flex;gap:12px;align-items:center;padding:11px 18px;border-top:1px solid var(--line2);flex-wrap:wrap}
.cand .who{flex:1;min-width:160px}
.av{width:34px;height:34px;border-radius:50%;background:var(--p-soft);color:var(--p);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}

/* step 2: what this decides */
.decides{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.dec{border:1px dashed var(--line);border-radius:12px;padding:11px 12px;background:var(--soft);display:flex;flex-direction:column;gap:3px;min-width:0}
.dec.set{border:1px solid var(--teal);background:var(--teal-soft)}
.dec span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:flex;gap:6px;align-items:center}
.dec.set span{color:var(--teal)}
.dec span .ic{width:13px;height:13px}
.dec b{font-weight:600;font-size:13.5px}
.dec:not(.set) b{color:var(--faint);font-weight:500}

/* step 3: pay */
.paidby{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.paidby .tile{background:var(--teal-soft);color:var(--teal)}
.wage{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:6px 14px;background:var(--card);max-width:340px}
.wage:focus-within{border-color:var(--p);outline:2px solid var(--p-light)}
.wage span{font:700 18px var(--display);color:var(--muted)}
.wage input{border:0;outline:0;font:800 26px var(--display);width:100%;min-width:0;background:transparent;color:var(--ink)}
.wage small{color:var(--muted);white-space:nowrap}
.band{position:relative;height:8px;border-radius:9px;background:var(--line2);margin:22px 0 6px}
.band u{position:absolute;inset:0 0 0 0;left:15%;right:15%;background:var(--p-light);border-radius:9px}
.band i{position:absolute;top:-5px;width:18px;height:18px;border-radius:50%;background:var(--p);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transform:translateX(-50%);transition:left .25s}
.bandl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line2);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .txt{flex:1;min-width:180px}
.row .txt b{font-weight:600;display:block}
.row .txt small{color:var(--muted);display:block;font-size:12.5px}
.row .extra{flex-basis:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;background:var(--soft);border:1px solid var(--line2);border-radius:12px;padding:12px}
.drop{border:1.5px dashed var(--p-light);border-radius:10px;background:var(--card);padding:12px;color:var(--p);font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center;width:100%}
.drop.has{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.cardh{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line2)}

/* week strip */
.wkstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:420px}
.wkstrip div{border-radius:8px;padding:6px 0;text-align:center;font-size:11px;background:#F6F7FB;color:var(--faint);line-height:1.3}
.wkstrip div.h{background:var(--p-soft);color:var(--p);font-weight:700}
.wkstrip div span{display:block;color:var(--muted);font-weight:500}

/* phone */
.invite{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:center}
.phone{background:var(--ink);border-radius:30px;padding:9px;box-shadow:0 18px 40px rgba(36,31,82,.28)}
.phone .scr{background:var(--canvas);border-radius:22px;padding:16px 13px 13px;display:flex;flex-direction:column;gap:10px;min-height:330px}
.phone .hi{font:800 16px var(--display);line-height:1.2}
.phone .todo{background:var(--card);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:12px;font-weight:500;animation:rise .25s}
.phone .todo::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--p-light);flex:none}
.phone .go{margin-top:auto;background:var(--p);color:#fff;border-radius:10px;text-align:center;padding:9px;font-weight:600;font-size:12.5px}
.phone .none{color:var(--muted);font-size:12px;text-align:center;margin:auto}
@keyframes rise{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl .ev{display:grid;grid-template-columns:92px 18px minmax(0,1fr);gap:10px;align-items:start;font-size:13.5px}
.tl .when{color:var(--muted);font-size:12.5px;text-align:right;padding-top:1px}
.tl .ln{position:relative;align-self:stretch;display:flex;justify-content:center}
.tl .ln::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.tl .ev:last-child .ln::before{bottom:auto;height:8px}
.tl .ln i{position:relative;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--p);margin-top:5px}
.tl .ev.day .ln i{background:var(--p);width:14px;height:14px;margin-top:3px}
.tl .what{padding-bottom:14px}
.tl .what small{color:var(--muted);display:block;font-size:12px}
.kit{display:flex;gap:8px;flex-wrap:wrap}
.kit button{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 11px;font-weight:600;font-size:13px}
.kit button.on{border-color:var(--p);background:var(--p-soft);color:var(--p-dark)}
.kit button .ic{width:15px;height:15px}

/* check + done */
.check{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line2)}
.check:first-child{border-top:0}
.check .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--ok-soft);color:var(--ok)}
.check.bad .dot{background:var(--warn-soft);color:var(--warn)}
.check.wait .dot{background:var(--p-soft);color:var(--p)}
.check .dot .ic{width:14px;height:14px;stroke-width:3}
.check div{flex:1;min-width:0}
.check small{color:var(--muted);display:block}
.launch{padding:20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--p-soft);border-color:var(--p-light)}
.launch h2{font-size:20px}
.then{counter-reset:n;display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.then li{counter-increment:n;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.then li::before{content:counter(n);width:22px;height:22px;border-radius:50%;background:var(--p-soft);color:var(--p);font-weight:700;font-size:12px;display:grid;place-items:center;flex:none}
.done-hero{padding:34px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.done-hero .tick{width:60px;height:60px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.done-hero .tick .ic{width:30px;height:30px;stroke-width:3}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}

/* live record */
.pv{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;flex-direction:column;overflow:hidden}
.pv-h{padding:14px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line2)}
.ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--ok) calc(var(--v)*1%),var(--line2) 0);transition:--v .4s}
.ring b{width:48px;height:48px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font:800 16px var(--display);border:3px solid var(--card)}
.ring.empty b{background:var(--line2);color:var(--faint)}
.pv-h .nm{min-width:0}
.pv-h .nm b{font:800 17px var(--display);display:block;overflow-wrap:anywhere;line-height:1.2}
.pv-h .nm small{color:var(--muted);font-size:12.5px;display:block}
.pv-b{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.lab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;font-size:13px}
.facts span{color:var(--muted)}
.facts b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.facts b.no{color:var(--faint);font-weight:400}
.ready{display:flex;flex-direction:column;gap:6px;font-size:13px}
.ready div{display:flex;gap:8px;align-items:center}
.ready .ic{width:15px;height:15px}
.ready .y{color:var(--ok)} .ready .w{color:var(--warn)} .ready .n{color:var(--faint)}
.pvo{background:var(--p-dark);color:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:9px}
.pvo p{font-size:12.5px;color:#D8D3F2;line-height:1.45}
.pvo p b{color:#fff}
.pvo .rows{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;border-top:1px solid rgba(255,255,255,.14);padding-top:9px}
.pvo .rows span:nth-child(odd){color:#BDB6E6}
.pvo .rows span:nth-child(even){font-weight:700;text-align:right}
.pvo .tot{font:800 22px var(--display)}
.pvo .eb{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#BDB6E6}
.empty{color:var(--muted);font-size:13px;background:#F8F9FC;border-radius:10px;padding:12px}
.split{display:flex;height:8px;border-radius:9px;overflow:hidden;background:var(--line2)}
.split i{display:block;transition:flex .3s}
.splitl{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.splitl i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}

/* drawer + toast */
.scrim{position:fixed;inset:0;background:rgba(16,18,46,.42);z-index:40;display:flex;justify-content:flex-end;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.drawer{width:min(520px,100%);background:var(--card);height:100%;display:flex;flex-direction:column;animation:slide .22s ease-out;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes slide{from{transform:translateX(40px);opacity:.4}}
.drawer header{padding:18px 20px 12px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line2)}
.drawer header h2{font-size:20px}
.drawer header p{color:var(--muted);font-size:13px}
.drawer .body{padding:18px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.find{display:grid;grid-template-columns:22px 1fr;gap:8px 10px;font-size:13.5px}
.find .ic{margin-top:2px}
.find small{color:var(--muted);display:block}
.find b{font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:rise .2s;max-width:calc(100% - 32px);font-size:13.5px}

@media (max-width:1180px){.work{grid-template-columns:210px minmax(0,1fr)}.pv{position:static;grid-column:2}}
@media (max-width:820px){
  .siderail{display:none}
  .work{grid-template-columns:minmax(0,1fr);gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .steps{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .steps h3{display:none}

      ${s?`<div class="pvo"><div class="eb">First payslip · ${s.month} · example</div>
        <p>${s.part<s.all?`${f} starts part-way through ${s.month}, so the first pay covers <b class="num">${s.part} of ${s.all}</b> working days.`:`${f} works the whole of ${s.month}, so the first pay is a full month.`}</p>
        <div class="rows num"><span>Wage for the month</span><span>${money(s.gross)}</span>${s.lines.map(l=>`<span>${l[0]}</span><span>− ${money(l[1])}</span>`).join('')}
          <span>${S.country==='SG'?'Income tax (paid yearly by the employee)':'Income tax'}</span><span>${S.country==='SG'?'none':'− '+money(s.tax)}</span></div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><span style="color:#BDB6E6;font-size:13px">Take-home</span><span class="tot num">${money(s.net)}</span></div>
        <p style="font-size:11.5px">Rounded example. The real payslip is worked out by ${esc(S.scheme)}.</p></div>`
      :`<div class="empty">Choose a country of work and type a wage to see the first payslip here.</div>`}
      ${c?`<div><div class="lab" style="margin-bottom:6px">Who does what</div><div class="split"><i style="flex:${t.me+t.got};background:var(--p)"></i><i style="flex:${t.emp};background:var(--teal)"></i><i style="flex:${t.other};background:var(--warn)"></i></div>
        <div class="splitl num" style="margin-top:6px"><span><i style="background:var(--p)"></i>You ${t.me+t.got}</span><span><i style="background:var(--teal)"></i>${f} ${t.emp}</span><span><i style="background:var(--warn)"></i>Manager and IT ${t.other}</span></div></div>`:''}
    </div>`;
}

/* ---------- findings drawer ---------- */
function renderDrawer(){if(!S.drawer){$('drawer').innerHTML='';return}
  const row=(i,col,b,s)=>`<span style="color:var(--${col})">${ic(i)}</span><div><b>${b}</b><small>${s}</small></div>`;
  $('drawer').innerHTML=`<div class="scrim" data-a="closeDrawer"><div class="drawer" role="dialog" aria-label="What I found"><header><div style="flex:1"><h2>What I found</h2><p>From studying how adding and welcoming a new person works in Payobook today.</p></div><button class="btn sm ghost" data-a="closeDrawer" aria-label="Close">${ic('x')}</button></header>
  <div class="body">
    <div><div class="lab" style="margin-bottom:10px">What the current Add employee window gets wrong</div><div class="find">
      ${row('alert','warn','It asks for a "Salary structure"','That choice no longer decides how someone is paid. The pay scheme does, and it is picked from the team. The window never shows it.')}
      ${row('alert','warn','"Country" saves the nationality','It does not set the Country of work. That is why the "Fill Country of Work" button exists and still shows 4 people.')}
      ${row('alert','warn','The wage always shows the company currency','Someone hired in India is asked for a wage with the wrong currency sign.')}
      ${row('alert','warn','It stops too early','No trial period end, no tax or insurance numbers, no papers, no sign-in, no joining checklist and none of your own fields.')}
      ${row('check','ok','One thing it does well, kept here','A second person approves the hire and the bank account.')}</div></div>
    <div><div class="lab" style="margin-bottom:10px">Already built, but not connected to the button</div><div class="find">
      ${row('check','ok','New joiners board','A 9-step joining checklist with buddy, laptop, welcome card and check-ins. Today it only starts from Hiring, not from Add employee.')}
      ${row('check','ok','My Payobook','The employee can already enter personal details, bank account, tax numbers and upload papers, each checked by HR.')}
      ${row('check','ok','Hiring','Candidates already send their papers and bank details. Those files are not carried over to the employee record today.')}
      ${row('check','ok','Sign-ins, letters, equipment, working weeks, trial periods','All exist as separate screens. This design calls them from one place instead of rebuilding them.')}</div></div>
    <div><div class="lab" style="margin-bottom:10px">What the best products do, and what I took</div><div class="find">
      ${row('spark','p','Gusto, Employment Hero, Deel','HR types about six things. The new person finishes the rest from a phone before day one. This is step 5.')}
      ${row('spark','p','Rippling','Choosing the role and place decides everything else by itself. This is "What this decides" in step 2.')}
      ${row('spark','p','BambooHR, HiBob','A welcome pack and a dated task list for the manager, IT and buddy. This is step 6.')}
      ${row('spark','p','Workday','A hire is an approved, dated event, not a saved form. This is step 7.')}
      ${row('info','muted','Where this comes from','My own knowledge of those products, not fresh research this week.')}</div></div>
    <div><div class="lab" style="margin-bottom:10px">New things that would need building</div><div class="find">
      ${row('plus','blue','A list of required papers for each country','Today no paper is ever marked as missing.')}
      ${row('plus','blue','Carrying a candidate\'s files and bank details across','Bank account, tax and ID numbers and each paper move from Hiring to the employee record, so nothing is typed or asked for twice. Shown in step 1 and step 5.')}
      ${row('plus','blue','Trial end date from the country rule','The rule exists, but nothing applies it when someone joins.')}
      ${row('plus','blue','The first-payslip example','A preview from the real pay scheme, as on the Workforce setup screen.')}
      ${row('info','muted','Not in this design','Signing the contract on screen. Today only offer letters can be signed that way.')}</div></div>
  </div></div></div>`;
}

/* ---------- render + events ---------- */
const VIEWS={who:vWho,role:vRole,pay:vPay,sched:vSched,docs:vDocs,welcome:vWelcome,check:vCheck};
function render(){const a=document.activeElement&&document.activeElement.id;
  renderChrome();$('stage').innerHTML=VIEWS[S.step]();renderPv();renderDrawer();
  if(a&&$(a)&&a.startsWith('f-'))$(a).focus();}
let tt;function toast(m){$('toast').innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(tt);tt=setTimeout(()=>$('toast').innerHTML='',3600)}
function go(k){S.step=k;S.seen.add(k);render();window.scrollTo({top:0,behavior:'smooth'})}
function setCountry(k){S.country=k;const c=C();if(c){S.scheme=c.schemes[0];S.status=0;S.u1=S.u2=true;S.items={};S.files={}}}
function setDept(k){S.dept=k;const d=DEPTS[k];if(d){const old=S.country;S.mgr=d.mgr;S.week=d.week;S.loc=d.loc;if(!d.jobs.includes(S.job))S.job='';if(old!==d.c){setCountry(d.c);S.wage=C().wage}}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='closeDrawer'){if(e.target.closest('.drawer')&&!e.target.closest('button'))return;S.drawer=false;return renderDrawer()}
  if(a==='findings'){S.drawer=true;return renderDrawer()}
  if(a==='go')return go(v);
  if(a==='next'){const i=STEPS.findIndex(s=>s.k===S.step);return go(STEPS[i+1].k)}
  if(a==='soon')return toast(v);
  if(a==='src'){S.src=v}
  if(a==='pick'){const h=HIRED[+v];Object.assign(S,{name:h.name,email:h.email,pemail:h.email,start:h.start,job:h.job});setDept(h.dept);S.job=h.job;S.wage=h.wage;S.got=new Set(h.got);S.gotv=h.vals;toast(`${h.name} brought across from Hiring, with ${h.got.length} items already received.`)}
  if(a==='tog')S[v]=!S[v];
  if(a==='ctype')S.ctype=v;
  if(a==='grp')S.grp=v;
  if(a==='login')S.login=v;
  if(a==='kit'){S.kit.has(v)?S.kit.delete(v):S.kit.add(v)}
  if(a==='who'){const[k,m]=v.split('|');S.items[k]=m}
  if(a==='allwho'){items().forEach(i=>{if(!S.got.has(i.k))S.items[i.k]=v})}
  if(a==='file'){S.files[v]=S.files[v]?'':first().toLowerCase()+'-'+v.slice(2)+'.pdf'}
  if(a==='send'){S.sent=true;render();return window.scrollTo({top:0,behavior:'smooth'})}
  if(a==='again'){Object.assign(S,{step:'who',src:'type',seen:new Set(['who']),sent:false,name:'',email:'',pemail:'',items:{},got:new Set(),gotv:{},files:{},x:{},buddy:''})}
  render();
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.i;if(!k)return;let v=e.target.value;
  if(k==='wage'){S.wage=+v.replace(/[^\d]/g,'')||0;if($('band'))$('band').innerHTML=bandHtml()}
  else if(k.startsWith('x.'))S.x[k.slice(2)]=v;else S[k]=v;
  renderChrome();renderPv();
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.i){if(t.dataset.i==='wage'||t.type==='date'||t.dataset.i==='name')render();return}
  const k=t.dataset.c;if(!k)return;const v=t.value;
  if(k==='dept')setDept(v);else if(k==='country'){setCountry(v);if(C())S.wage=C().wage}else if(k==='status')S.status=+v;else S[k]=v;
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.drawer){S.drawer=false;renderDrawer()}});
render();
</script>
