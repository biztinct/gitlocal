<title>Payobook Updates Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: one product-style shell. Top switch = Prototype / What others do / Overlaps and plan.
   Prototype is a 4-step flow whose centre of gravity is the before-and-after review grid. */
:root{
  --bg:#F4F5FB; --surface:#FFFFFF; --sunk:#F8F8FC; --ink:#1E1B2E; --muted:#64748B; --line:#E2E8F0;
  --pri:#5A4BB0; --pri-h:#4A3D96; --pri-soft:#EDEAF8; --on-pri:#FFFFFF;
  --ok:#2E7D4F; --ok-soft:#E6F4EC; --info:#2563EB; --info-soft:#E3ECFF;
  --warn:#B45309; --warn-soft:#FEF3C7; --err:#C81E5B; --err-soft:#FCE7EF;
  --shadow:0 1px 2px rgba(30,27,46,.06),0 8px 24px rgba(30,27,46,.06);
  --display:"Plus Jakarta Sans","Inter",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14121F; --surface:#1D1A2C; --sunk:#191727; --ink:#ECEAF6; --muted:#9A9BB5; --line:#322E48;
  --pri:#8F81E0; --pri-h:#A396EA; --pri-soft:#2A2548; --on-pri:#14121F;
  --ok:#5CC08A; --ok-soft:#173326; --info:#7FA6FF; --info-soft:#1B2647;
  --warn:#F0B45A; --warn-soft:#3A2C10; --err:#F27AA6; --err-soft:#3D1626;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#14121F; --surface:#1D1A2C; --sunk:#191727; --ink:#ECEAF6; --muted:#9A9BB5; --line:#322E48;
  --pri:#8F81E0; --pri-h:#A396EA; --pri-soft:#2A2548; --on-pri:#14121F;
  --ok:#5CC08A; --ok-soft:#173326; --info:#7FA6FF; --info-soft:#1B2647;
  --warn:#F0B45A; --warn-soft:#3A2C10; --err:#F27AA6; --err-soft:#3D1626;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800} h2{font-size:19px;font-weight:700} h3{font-size:15px;font-weight:700}
p{margin:0} .muted{color:var(--muted)} .small{font-size:12.5px} .num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:6px}

.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.crumb{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.crumb b{color:var(--ink);font-weight:600}
.badge-poc{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pri);background:var(--pri-soft);padding:3px 8px;border-radius:999px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--pri);color:var(--on-pri)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:20px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:9px 16px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--pri)}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)} .btn.pri:hover{background:var(--pri-h)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip .ic{width:13px;height:13px}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.chip.pri{background:var(--pri-soft);color:var(--pri);border-color:transparent}

/* hero */
.hero{background:var(--pri-soft);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.hero p{max-width:62ch;color:var(--muted);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.tile{text-align:left;padding:18px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--pri)}
.tile .ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center}
.ib.a{background:var(--pri-soft);color:var(--pri)} .ib.b{background:var(--ok-soft);color:var(--ok)} .ib.c{background:var(--info-soft);color:var(--info)} .ib.d{background:var(--warn-soft);color:var(--warn)}
.tile .rec{align-self:flex-start}

/* stepper */
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.step{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:13px}
.step .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-size:12px;background:var(--surface)}
.step.on{color:var(--ink)} .step.on .dot{border-color:var(--pri);color:var(--pri)}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)} .step.done .dot .ic{width:14px;height:14px;stroke-width:3}
.step + .step::before{content:"";width:28px;height:2px;background:var(--line);margin-right:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

/* topic picker */
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.topic{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.topic[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft)}
.topic .box{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center;color:var(--on-pri)}
.topic[aria-pressed="true"] .box{background:var(--pri);border-color:var(--pri)} .topic .box .ic{width:12px;height:12px;stroke-width:3.5}
.topic[disabled]{opacity:.6;cursor:default}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--sunk)}

/* tables */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;background:var(--sunk);padding:9px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.sample{color:var(--muted);font-size:12.5px;white-space:nowrap}
.kind{font-size:11.5px;font-weight:600;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.kind .ic{width:14px;height:14px}
.k-person{color:var(--info)} .k-ongoing{color:var(--ok)} .k-oneoff{color:var(--warn)} .k-key{color:var(--muted)}

/* review grid */
.sum{font-family:var(--display);font-size:20px;font-weight:700;text-wrap:balance}
.sum b{color:var(--pri)} .sum .att{color:var(--err)} .sum .fine{color:var(--ok)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:12.5px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--pri-soft);color:var(--pri);border-color:transparent}
.rv td{white-space:nowrap;min-width:108px}
.rv td.who{min-width:170px;position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line)}
.rv th.who{position:sticky;left:0;z-index:2;border-right:1px solid var(--line)}
.who b{display:block;font-weight:600} .who span{font-size:12px;color:var(--muted)}
.c-same{color:var(--muted)} .c-blank{color:var(--line)}
.c-na{background:var(--sunk);color:var(--muted);font-size:12px;font-style:italic}
.c-change{background:var(--pri-soft)} .c-add{background:var(--ok-soft)} .c-clear{background:var(--warn-soft)}
.c-error{background:var(--err-soft);cursor:pointer} .c-warn{background:var(--warn-soft);cursor:pointer}
.c-error:hover,.c-warn:hover{box-shadow:inset 0 0 0 2px currentColor}
.c-error{color:var(--err)} .c-warn{color:var(--warn)}
.was{display:block;font-size:11.5px;color:var(--muted);text-decoration:line-through}
.now{font-weight:600;color:var(--ink)} .c-add .now{color:var(--ok)}
.cellrow{display:flex;gap:6px;align-items:center} .cellrow .ic{width:14px;height:14px}
tr.skip td{opacity:.4;text-decoration:line-through}
.fix td{background:var(--sunk);white-space:normal;padding:14px}
.fixbox{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;animation:in .18s ease-out}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
@keyframes in{from{opacity:.4;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* apply */
.dest{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px}
.dest .ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.dest h3{font-size:14px} .dest .n{margin-left:auto;font-family:var(--display);font-weight:800;font-size:20px}
.prog{height:8px;background:var(--pri-soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}
.hist{display:flex;flex-direction:column}
.hrow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.hrow .t{flex:1 1 260px;min-width:0} .hrow .t b{font-weight:600}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--info-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:13px}
.note .ic{color:var(--info);margin-top:1px}
.prose{max-width:74ch} .prose p + p{margin-top:10px}
.ins td{white-space:normal;vertical-align:top;min-width:150px} .ins td:first-child{font-weight:600}
.verdict{font-weight:700;white-space:nowrap}
.v-keep{color:var(--ok)} .v-merge{color:var(--pri)} .v-move{color:var(--warn)}
ol.plan{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
</style>

<div class="wrap">
  <div class="top">
    <div class="crumb"><span>Payobook</span><span>›</span><span>People</span><span>›</span><b>Updates</b><span class="badge-poc">Concept prototype · sample data</span></div>

  <div id="app" class="stack"></div>
</div>

/* ---------- logic ---------- */
function st(r,f){
  if(r.skip) return 'skip';
  if(r.cur.no&&r.cur.no.includes(f.k)) return 'na';
  const is=r.issues[f.k]; if(is&&!is.done) return is.level;
  const v=r.file[f.k];
  if(v===''||v==null) return 'blank';
  if(f.k==='eff') return 'date';
  if(v==='CLEAR') return 'clear';
  if(f.kind==='oneoff') return 'add';
  return v===r.cur[f.k]?'same':'change';
}
const isChange=s=>s==='change'||s==='add'||s==='clear';
function openIssues(r){return r.skip?[]:Object.entries(r.issues).filter(([k,i])=>!i.done)}
function tally(){
  let changes=0,people=0,att=0,byKind={person:0,ongoing:0,oneoff:0},bank=0,bonusSum=0,future=0,same=0;
  ROWS.forEach(r=>{
    const held=S.partial&&openIssues(r).length; att+=openIssues(r).length;
    if(r.skip||held) return;
    let n=0; F.forEach(f=>{const s=st(r,f); if(isChange(s)){n++;byKind[f.kind]++; if(f.sensitive)bank++; if(f.k==='bonus')bonusSum+=r.file.bonus;}});
    if(n){people++;changes+=n; if(r.file.eff>'2026-12-01')future++;} else same++;
  });
  return {changes,people,att,byKind,bank,bonusSum,future,same};
}
function rowHasChange(r){return F.some(f=>isChange(st(r,f)))}

function cell(r,f,i){
  const s=st(r,f), v=r.file[f.k], c=r.cur[f.k];
  if(s==='skip') return `<td>${v===''?'':esc(fmt(v))}</td>`;
  if(s==='na') return `<td class="c-na" title="${esc(f.label)} is not part of the ${esc(r.cur.scheme)}">${v===''?'Not in their scheme':`<span class="was">${esc(fmt(v))}</span>Not in their scheme, left out`}</td>`;
  if(s==='error'||s==='warn') return `<td class="c-${s}" data-fix="${i}:${f.k}" tabindex="0" role="button"><span class="cellrow">${ic('alert')}<span><span class="now" style="color:inherit">${v===''?'Missing':esc(fmt(v))}</span></span></span></td>`;
  if(s==='blank') return `<td class="c-blank num" title="Blank in your file, so nothing changes">${c===''||c==null||f.k==='eff'?'':'<span class="c-same">'+esc(fmt(c))+'</span>'}</td>`;
  if(s==='same') return `<td class="c-same num">${esc(fmt(c))}</td>`;
  if(s==='date') return `<td class="num">${dfmt(v)}${v>'2026-12-01'?` <span class="chip info">${ic('clock')}Later</span>`:''}</td>`;
  if(s==='add') return `<td class="c-add num"><span class="now">+ ${esc(fmt(v))}</span></td>`;
  if(s==='clear') return `<td class="c-clear num"><span class="was">${esc(fmt(c))}</span><span class="cellrow" style="color:var(--warn)">${ic('minus')}<b>Removed</b></span></td>`;
  return `<td class="c-change num"><span class="was">${esc(fmt(c))}</span><span class="cellrow"><span class="now">${esc(fmt(v))}</span>${f.sensitive?ic('shield'):''}</span></td>`;

  <div class="card pad stack"><h2>Where the built-in import falls short</h2>
    <div class="scroll"><table class="ins"><tr><th>What a payroll team needs</th><th>Built-in import today</th></tr>
    <tr><td>One file that updates the person, the contract and the pay items</td><td>One kind of record per file. Three files, in the right order.</td></tr>
    <tr><td>See what will change</td><td>A test tells you whether the file loads. It does not show old value against new value.</td></tr>
    <tr><td>A raise that starts on the 1st</td><td>No start dates. The value is overwritten on the spot and the old one is lost.</td></tr>
    <tr><td>Find people by the client's employee number</td><td>Works best with internal record IDs that clients never see.</td></tr>
    <tr><td>Approval, history, undo</td><td>None of the three.</td></tr>
    <tr><td>Plain column names</td><td>Field names written for administrators.</td></tr></table></div>
    <p class="muted small">It stays available behind the scenes for administrators. It should not be what a client's payroll officer is given.</p></div>`;
}
function vPlan(){
  const ov=[
   ['Pay data file inside the pay run','Loads the month\'s figures. With "Update Payobook" it also changes employees and contracts for good, and can add new joiners.','move','Keep it for this month\'s figures only (hours, overtime, one-offs). Lasting changes move to Updates.'],
   ['Records screen','A grid of employee and contract values with its own file upload, a before-and-after check, approval and undo.','merge','This is already 70% of the engine. Updates becomes its front door instead of a second engine.'],
   ['Pay workbook download and upload','Downloads a workbook of current values for a pay scheme, takes it back, shows a review.','merge','Becomes "Download a ready-to-fill sheet". Same idea, no longer tied to one scheme and one month.'],
   ['"Keep for future, or this run only?" after a pay run','Asks, value by value, whether what came in the pay file should stick.','keep','Stays as a safety net. It should fire far less once lasting changes arrive through Updates.'],
   ['Older employee import','An early wizard where column names are typed in by hand.','move','Hide it. Updates covers everything it does.'],
   ['Pay Review','Plans raises on screen and applies them.','keep','Different job: deciding the raises. Later it can accept a sheet and should record pay history the same way Updates does.'],
   ['Attendance file import','Loads clock-in data with a trial run first.','keep','Stays separate, as you suggested. It gets the same four steps and look.'],
   ['Built-in import','Generic, one kind of record per file.','keep','Administrators only. Never shown to a client.'],
  ];
  const lab={keep:'Keep',merge:'Merge in',move:'Move out'};
  return `
  <div class="card pad stack"><h2>The main finding: most of this already exists, in five different places</h2>
    <div class="prose"><p>Today a spreadsheet can change employee or pay data from five screens. Each was built for a good reason, but a client cannot tell which one to use, and two of them find the employee in slightly different ways.</p>
    <p>So the recommendation is not a new import engine. It is <b>one front door called Updates</b>, built on the Records screen that already does upload, review, approval and undo, plus the handful of things that are missing.</p></div>
    <div class="scroll"><table class="ins"><tr><th>What exists today</th><th>What it does</th><th>Verdict</th><th>Recommendation</th></tr>
    ${ov.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><span class="verdict v-${r[2]}">${lab[r[2]]}</span></td><td>${r[3]}</td></tr>`).join('')}</table></div></div>

  <div class="grid2">
    <div class="card pad stack"><h2>The split that removes the double-up</h2>
      <div class="dest"><span class="ib b">${ic('money')}</span><div><h3>Updates: things that last</h3><p class="muted small">Who people are, what they are paid from now on. Any day of the month. Approved, dated, undoable.</p></div></div>
      <div class="dest"><span class="ib d">${ic('cal')}</span><div><h3>Pay run: this month only</h3><p class="muted small">Hours, overtime, days absent, one-off amounts. The pay run opens with a line saying what Updates changed since last month.</p></div></div>
      <p class="muted small">One-off bonuses can come in either way. From Updates they simply wait inside the pay month you name.</p></div>
    <div class="card pad stack"><h2>What is really new to build</h2>
      <ol class="plan">
        <li><b>No need to pick a pay scheme first.</b> Today you choose one scheme and get its columns. Updates reads each person's scheme from their contract, offers the pay items of those schemes, and greys out a value that does not belong to a person's scheme. New joiners need a "Pay scheme" column.</li>
        <li><b>Start dates, including future ones.</b> Today a change is written the moment you apply and the old value is overwritten.</li>
        <li><b>New joiners from the sheet.</b> Today that only works through the pay run file.</li>
        <li><b>One-offs sent to a pay month</b> from the same sheet.</li>
        <li><b>One way of finding the person</b> instead of two.</li>
        <li><b>Second-person check on bank details.</b></li>
        <li><b>One history</b> across every kind of update.</li>
      </ol></div>
  </div>

  <div class="card pad stack"><h2>Built to grow: every sheet is the same four steps</h2>
    <p class="muted prose">A "sheet type" only has to say three things: which columns it has, how to find the record a row belongs to, and which of the three kinds each column is. Start, Match, Review, Apply and the history never change.</p>
    <div class="scroll"><table class="ins"><tr><th>Sheet type</th><th>Shape</th><th>Status</th></tr>
      <tr><td>People and pay</td><td>One row per person</td><td><span class="chip pri">This prototype</span></td></tr>
      <tr><td>Timesheets and attendance</td><td>One row per person per day</td><td><span class="chip ok">Import exists, gets the new look</span></td></tr>
      <tr><td>Leave balances</td><td>One row per person per leave type</td><td><span class="chip warn">Nothing today</span></td></tr>
      <tr><td>Year-to-date figures for a mid-year start</td><td>One row per person per pay item</td><td><span class="chip warn">Nothing today</span></td></tr>
      <tr><td>Departments, jobs, locations</td><td>One row per item</td><td><span class="chip">Later</span></td></tr>
      <tr><td>Training records, assets, documents due</td><td>One row per person per item</td><td><span class="chip">Later</span></td></tr></table></div></div>

  <div class="card pad stack"><h2>Suggested order of work</h2>
    <ol class="plan">
      <li><b>The front door.</b> Updates home, upload your own file, remembered column matching, the review grid, history and undo. Sits on the Records screen's engine. Clients can use it for same-day changes straight away.</li>
      <li><b>Dates.</b> "Starts from" on pay changes, future-dated updates that wait, pay history kept. One-offs into a named pay month.</li>
      <li><b>Tidy-up.</b> New joiners from the sheet, bank second check, the "what changed since last run" line in the pay run. The pay run file stops making lasting changes, and the older employee import is hidden.</li>
      <li><b>More sheet types.</b> Timesheets and attendance in the new look, then leave balances and year-to-date figures.</li>
    </ol></div>

  <div class="card pad stack"><h2>Decided on 11 Nov 2026</h2>
    <ol class="plan">
      <li><b>The pay run file becomes month-only.</b> It carries this month's figures. Lasting changes come through Updates.</li>
      <li><b>One contract with a pay history.</b> A salary or allowance change adds a dated entry to the history. No new contract each time.</li>
      <li><b>Approval is split by type.</b> Details about the person apply at once. Anything that changes pay goes to approval. Bank details always need a second person.</li>
    </ol></div>`;
}

/* ---------- render + events ---------- */
const app=document.getElementById('app');
function render(){
  document.querySelectorAll('#pageTabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.page===S.page));
  app.innerHTML = S.page==='others'?vOthers(): S.page==='plan'?vPlan():
    ({home:vHome,start:vStart,match:vMatch,review:vReview,apply:vApply,done:vDone})[S.view]();
}
function resetSample(){const f=JSON.parse(FRESH);ROWS.forEach((r,i)=>{r.id=f[i].id;r.file=f[i].file;r.skip=false;Object.values(r.issues).forEach(x=>x.done=false)});S.fix=null;S.partial=false;S.filter='all';S.prog=0;}
document.getElementById('pageTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.page=b.dataset.page;render();}});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.fix){e.preventDefault();e.target.click();}});
app.addEventListener('change',e=>{
  const t=e.target; if(t.dataset.col!==undefined){const c=COLS[+t.dataset.col];c.f=t.value;c.how=t.value?'ok':'none';render();}
  if(t.id==='nm')S.name=t.value;
});
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-topic],[data-okcol],[data-filter],[data-fix],[data-opt],[data-hist],#dl,#reset,#partial,#apply,#undoNow'); if(!t||t.disabled) return;
  if(t.dataset.go){ if(t.dataset.go==='start'&&S.view==='home')resetSample(); if(t.dataset.go==='review')S.partial=false; S.view=t.dataset.go; S.fix=null; }
  else if(t.dataset.topic){S.topics[t.dataset.topic]=!S.topics[t.dataset.topic];}
  else if(t.dataset.okcol){COLS[+t.dataset.okcol].how='ok';}
  else if(t.dataset.filter){S.filter=t.dataset.filter;S.fix=null;}
  else if(t.dataset.fix){const [i,k]=t.dataset.fix.split(':');S.fix=(S.fix&&S.fix.i===+i&&S.fix.k===k)?null:{i:+i,k};}
  else if(t.dataset.opt){const [i,k,j]=t.dataset.opt.split(':');const r=ROWS[+i];r.issues[k].opts[+j][1](r);r.issues[k].done=true;S.fix=null;if(S.filter==='att'&&!ROWS.some(x=>openIssues(x).length))S.filter='all';}
  else if(t.dataset.hist){const h=S.hist[+t.dataset.hist];
    if(h.act==='Undo'||h.act==='Cancel'){h.st=h.act==='Undo'?'Undone':'Cancelled';h.c='';h.d+=' · put back 11 Nov 2026';h.act=null;}
    else if(h.act==='Open'){resetSample();S.view='review';S.filter='att';}}
  else if(t.id==='dl'){render();document.getElementById('dlmsg').textContent='In the real product this downloads "Payobook update sheet, 11 Nov 2026.xlsx" with '+Object.values(S.topics).filter(Boolean).length+' topic groups for the people you chose.';return;}
  else if(t.id==='reset'){resetSample();}
  else if(t.id==='partial'){S.partial=true;S.view='apply';}
  else if(t.id==='apply'){S.name=(document.getElementById('nm')||{}).value||S.name;S.prog=4;render();
    const tm=setInterval(()=>{S.prog=Math.min(100,S.prog+16);render();if(S.prog>=100){clearInterval(tm);setTimeout(()=>{const x=tally();
      S.hist.unshift({n:S.name,st:'Applied · pay changes awaiting approval',c:'ok',d:'11 Nov 2026 · '+x.changes+' changes for '+x.people+' people · by you',act:'Undo'});
      S.view='done';S.prog=0;render();},350);}},220);return;}
  else if(t.id==='undoNow'){const h=S.hist[0];h.st='Undone';h.c='';h.act=null;h.d+=' · put back 11 Nov 2026';S.view='home';}
  render();
});
render();
</script>
