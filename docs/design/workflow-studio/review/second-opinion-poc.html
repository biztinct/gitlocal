<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Workflow Studio Proposal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: the existing Studio shell (steps on the left, the process in the middle, settings on the right)
   with one renderer for stages that can be laid out as a Journey, a board By stage, or a Flowchart. */
:root{
  --bg:#F4F5FB; --card:#FFFFFF; --ink:#1E1B2E; --muted:#5F6B7F; --line:#E2E8F0;
  --brand:#5A4BB0; --brand-hover:#4A3D96; --brand-soft:#EDEAF8; --brand-light:#CBC2EE; --on-brand:#FFFFFF;
  --ok:#2E7D4F; --ok-soft:#E3F3EA; --info:#2563EB; --info-soft:#E6EEFE;
  --warn:#B45F06; --warn-soft:#FDF1DD; --err:#C81E5B; --err-soft:#FCE7EF; --locked:#EEF0F6;
  --shadow:0 1px 2px rgba(30,27,46,.05),0 6px 18px rgba(30,27,46,.05);
  --font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15131F; --card:#1F1C2D; --ink:#ECEAF6; --muted:#A3A7BD; --line:#34304A;
  --brand:#A99BF0; --brand-hover:#BDB2F5; --brand-soft:#2C2748; --brand-light:#4A4080; --on-brand:#17132B;
  --ok:#62C792; --ok-soft:#1B3327; --info:#82ADFF; --info-soft:#1B2947;
  --warn:#F0A94A; --warn-soft:#3A2C14; --err:#F47AA6; --err-soft:#3D1B2A; --locked:#262338;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15131F; --card:#1F1C2D; --ink:#ECEAF6; --muted:#A3A7BD; --line:#34304A;
  --brand:#A99BF0; --brand-hover:#BDB2F5; --brand-soft:#2C2748; --brand-light:#4A4080; --on-brand:#17132B;
  --ok:#62C792; --ok-soft:#1B3327; --info:#82ADFF; --info-soft:#1B2947;
  --warn:#F0A94A; --warn-soft:#3A2C14; --err:#F47AA6; --err-soft:#3D1B2A; --locked:#262338;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand-light);outline-offset:2px;border-radius:8px}
.wrap{max-width:1440px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
#view{display:flex;flex-direction:column;gap:14px;min-width:0}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.2px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--locked);color:var(--muted)}
.tag.new{background:var(--ok-soft);color:var(--ok)}
.tag.yours{background:var(--brand-soft);color:var(--brand)}
.tag.live{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--locked);padding:4px;border-radius:12px}
.seg button{border:0;background:none;padding:7px 13px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);min-height:36px;display:inline-flex;gap:7px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nav button{border:1px solid transparent;background:none;padding:9px 14px;border-radius:10px;font-weight:600;color:var(--muted);min-height:40px;display:inline-flex;gap:8px;align-items:center}
.nav button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
h1{font-size:24px;line-height:1.25;letter-spacing:-.5px;margin:0;text-wrap:balance}
h2{font-size:18px;margin:0;letter-spacing:-.2px}
h3{font-size:15px;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--brand-light)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.ghost{border-color:transparent;background:none;color:var(--brand)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.head{display:flex;flex-direction:column;gap:12px}
.etabs{display:flex;gap:20px;flex-wrap:wrap;border-top:1px solid var(--line);margin:0 -18px -16px;padding:0 18px}
.etabs button{border:0;background:none;padding:12px 2px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;display:inline-flex;gap:7px;align-items:center}
.etabs button[aria-pressed="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.say{font-size:18px;font-weight:600;letter-spacing:-.2px;line-height:1.8;border:0;background:none;text-align:left;padding:0}
.chip{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:0 9px;font-weight:600}
/* three-column builder */
.builder{display:grid;grid-template-columns:232px minmax(0,1fr);gap:14px;align-items:start}
.builder.has-side{grid-template-columns:232px minmax(0,1fr) 340px}
.palette{position:sticky;top:10px;display:flex;flex-direction:column;gap:6px;padding:14px 10px;max-height:calc(100vh - 20px);overflow:auto}
.palette label{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px;padding:0 4px 6px}
.palette select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 8px;font-size:14px;width:100%}
.pitem{border:0;background:none;display:flex;gap:9px;align-items:center;padding:6px;border-radius:9px;text-align:left;font-weight:600;font-size:13.5px;width:100%;line-height:1.3}
.pitem:hover{background:var(--brand-soft)}
.pitem small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-top:4px}
.palette.flash{box-shadow:0 0 0 3px var(--brand-light)}
.work{min-width:0;display:flex;flex-direction:column;gap:10px}
.boardwrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;gap:12px}
.l-board{grid-auto-flow:column;grid-auto-columns:minmax(244px,1fr);min-width:min-content}
.l-journey{max-width:720px;margin:0 auto;width:100%}
.l-flow{justify-items:center;gap:0}
.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-width:0}
.stage.yours{border-color:var(--brand-light)}
.stage.grp{border-style:dashed}
.stage.here{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.stagehead{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.stagename{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;flex-wrap:wrap}
.stagename .n{width:24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.stagename .n.done{background:var(--ok-soft);color:var(--ok)}
.owner,.gate{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.owner .ic,.gate .ic{width:14px;height:14px;margin-top:2px}
.stagebody{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.native{background:var(--locked);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.native .ic{width:15px;height:15px;margin-top:2px;color:var(--muted)}
.native .from{display:block;color:var(--muted);font-size:12px}
.native button{border:0;background:none;color:var(--brand);font-weight:600;font-size:12px;padding:0;margin-left:auto;white-space:nowrap}
.steps{display:flex;flex-direction:column;gap:8px;min-height:8px}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px 10px 11px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow);position:relative;transition:border-color .15s;text-align:left;width:100%}
.step:hover{border-color:var(--brand-light)}
.step.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.step.dragging{opacity:.35}
.step .body{min-width:0;flex:1}
.step .t{font-weight:600;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.step .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.badge{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.badge .ic{width:16px;height:16px}
.badge.sm{width:24px;height:24px;border-radius:7px}
.c-info{background:var(--info-soft);color:var(--info)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-grey{background:var(--locked);color:var(--muted)}
.c-brand{background:var(--brand-soft);color:var(--brand)}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.grip{border:0;background:none;color:var(--muted);padding:4px 2px;touch-action:none;cursor:grab;border-radius:6px;opacity:.6}
.paths{display:grid;gap:6px;margin-top:8px}
.pathrow{border:1px dashed var(--line);border-radius:9px;padding:6px 8px;font-size:13px;min-width:0}
.pathrow b{display:block;font-weight:600}
.mini{display:flex;gap:6px;align-items:center;color:var(--muted)}
.mini .ic{width:13px;height:13px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.who{display:inline-flex;align-items:center;gap:5px}
.dropline{height:4px;border-radius:4px;background:var(--brand);width:100%}
.ghost-card{position:fixed;z-index:50;pointer-events:none;width:240px;transform:rotate(1.5deg);opacity:.95}
.add{border:1px dashed var(--brand-light);background:none;color:var(--brand);border-radius:10px;padding:8px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;justify-content:center;min-height:38px;width:100%}
.add:hover{background:var(--brand-soft)}
.exit{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.exit .ic{width:15px;height:15px;margin-top:2px;color:var(--err)}
/* flowchart layout */
.l-flow .stage{background:none;border:0;align-items:center;width:100%}
.l-flow .stagehead{border:1px solid var(--brand-light);background:var(--brand-soft);border-radius:999px;padding:6px 16px;align-items:center;text-align:center;margin-top:18px;position:relative}
.l-flow .stagehead .owner,.l-flow .stagehead .gate{display:none}
.l-flow .stagebody{align-items:center;width:100%;padding:0;gap:0}
.l-flow .label{display:none}
.l-flow .steps{align-items:center;width:100%;gap:0}
.l-flow .step,.l-flow .native,.l-flow .add{width:min(360px,100%);margin-top:18px;position:relative}
.l-flow .step::before,.l-flow .native::before,.l-flow .add::before,.l-flow .stagehead::before{content:"";position:absolute;left:50%;top:-19px;height:18px;width:2px;background:var(--brand-light)}
.l-flow .stage:first-child .stagehead::before{display:none}
.l-flow .paths{grid-auto-flow:column;grid-auto-columns:1fr}
.l-flow .add{border-style:dotted;min-height:30px;padding:3px;font-size:12px}
/* snake */
.snake{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;gap:6px;align-items:stretch}
.srow.rev{flex-direction:row-reverse}
.scell{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:6px}
.srow.rev .scell{flex-direction:row-reverse}
.spill{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;overflow-wrap:anywhere;background:var(--card)}
.spill.st{background:var(--brand-soft);border-color:var(--brand-light);color:var(--brand)}
.spill.nat{background:var(--locked);border-color:transparent;font-weight:500}
.sarrow{color:var(--muted);flex:none}
.srow.rev .sarrow{transform:scaleX(-1)}
.sturn{display:flex;color:var(--muted);padding:0 14px}
.sturn.r{justify-content:flex-end}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.pcol{background:var(--locked);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
/* inspector + forms */
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
.fld{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:5px}
.fld.inline{flex-direction:row;align-items:center;gap:8px;font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 10px;min-height:40px;width:100%;font-size:15px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand)}
.warnbox{background:var(--warn-soft);border-radius:12px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.warnbox b{color:var(--warn);display:flex;gap:6px;align-items:center}
.q{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:6px}
.rulebox{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px}
.rulebox .r3{display:grid;grid-template-columns:1fr 1fr;gap:6px}
/* stages manager */
.overlay{position:fixed;inset:0;background:rgba(20,16,40,.45);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(680px,100%);height:100%;overflow:auto;padding:22px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:12px}
.srowm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.srowm.yours{border-color:var(--brand-light)}
.between{border:0;background:none;color:var(--brand);font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center;justify-content:center;padding:2px;opacity:.75;width:100%}
.between:hover{opacity:1}
.opt{border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;gap:10px;align-items:flex-start;font-size:14px;background:var(--card);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt small{display:block;color:var(--muted)}
/* record + activity */
.hero{background:var(--brand-soft);border:1px solid var(--brand-light);border-radius:16px;padding:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.hero .line{font-size:20px;font-weight:700;letter-spacing:-.3px;line-height:1.35;text-wrap:balance}
.state{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.st-done{background:var(--ok-soft);color:var(--ok)} .st-now{background:var(--brand);color:var(--on-brand)} .st-next{background:var(--locked);color:var(--muted)}
.step.now{border-color:var(--brand);animation:pulse 1.8s ease-in-out 2}
.step.done{opacity:.8}
.seat{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--brand-soft)}50%{box-shadow:0 0 0 6px var(--brand-soft)}}
.bar{height:10px;border-radius:6px;background:var(--brand-light)}
.bar.slow{background:var(--warn)}
.checkrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.checkrow:last-child{border-bottom:0}
.checkrow .ic{margin-top:2px}
.inbox{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.inbox.open{grid-template-columns:minmax(0,380px) minmax(0,1fr)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.item.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.item .due{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.form{display:flex;flex-direction:column;gap:14px;max-width:640px}
.form .f{display:flex;flex-direction:column;gap:6px}
.form .f>label,.form legend{font-weight:600;font-size:15px;padding:0}
.form fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.yn{display:flex;gap:8px}
.yn button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;min-height:40px;font-weight:600}
.yn button[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.errt{color:var(--err);font-size:13px} .req{color:var(--err)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
tr:last-child td{border-bottom:0}
tr.grp td{background:var(--locked);font-weight:700;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;max-width:min(92vw,560px);font-size:14px;z-index:60;box-shadow:var(--shadow)}
#toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline}
#toast.bad{background:var(--err);color:#fff}
@media (max-width:1100px){
  .builder,.builder.has-side{grid-template-columns:minmax(0,1fr)}
  .palette,.side{position:static;max-height:none}
  .palette .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px}
  .pitem small{display:none}
}
@media (max-width:900px){
  .inbox.open{grid-template-columns:minmax(0,1fr)}
  .l-board{grid-auto-flow:row;grid-auto-columns:auto;min-width:0}
  .nav{margin-left:0}
  h1{font-size:21px} .hero .line{font-size:17px} .say{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark" id="mark"></span>Workflow Studio <span class="tag">Proposed · made-up data</span></div>
    <nav class="nav" id="nav" aria-label="Screens"></nav>
  </header>
  <main id="view"></main>
</div>
<div id="sheet"></div>
<div id="toast" hidden role="status" aria-live="polite"></div>

<script>
'use strict';
const P={
 lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
 email:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
 task:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 12 2 2 4-4"/>',
 form:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/>',
 wait:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
 path:'<path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',

/* ---------- helpers ---------- */
let toastTimer;
function toast(text,undoable=false,bad=false){const t=document.getElementById('toast');t.className=bad?'bad':'';t.innerHTML=`<span>${esc(text)}</span>${undoable?'<button data-act="undo">Undo</button>':''}`;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,bad?7000:5000);}
const snap=()=>{S.hist.push(JSON.stringify({ex:S.ex,data:cur()}));if(S.hist.length>40)S.hist.shift();};
function undo(){const h=S.hist.pop();if(!h)return toast('Nothing to undo.');const o=JSON.parse(h);EX[o.ex]=o.data;S.ex=o.ex;S.sel=null;S.warn=null;S.ns=null;render();toast('Undone.');}
function place(id){const st=cur().stages;for(let i=0;i<st.length;i++){const j=st[i].steps.indexOf(id);if(j>=0)return [i,j];}return null;}
const before=(a,b)=>a[0]<b[0]||a[0]===b[0]&&a[1]<b[1];
function check(){const d=cur();for(const [id,s] of Object.entries(d.steps)){if(s.needs&&d.steps[s.needs]){const a=place(s.needs),b=place(id);if(a&&b&&!before(a,b))return `“${s.title}” uses what “${d.steps[s.needs].title}” collects, so it has to come after it.`;}}return '';}
function countsAs(i){const st=cur().stages;for(let j=i;j>=0;j--)if(st[j].kind==='core')return st[j].name;return '';}
function gateText(st,i){if(st.kind==='core')return st.gate;if(st.kind==='group')return 'Not a real stage. It only groups steps in this picture.';
 if(st.enter==='person')return `${st.enterWho||'A person'} presses “Move to ${st.name}”`;if(st.enter==='rule'&&st.rule)return st.rule.text;return i===0?'The workflow starts':'The steps before are finished';}
function sub(s){const a=[];
 if(s.type==='form')a.push(`${(s.qs||[]).length} questions`);
 if(s.due&&s.due!=='No due date'&&HUMAN.includes(s.type))a.push('Due in '+low(s.due));
 if(s.type==='email')a.push('Saved message: '+(s.msg||'choose one'));
 if(s.type==='wait')a.push(s.waitv||'Choose how long');
 if(s.type==='stage')a.push('To: '+(s.target||'choose a stage'));
 if(s.type==='back')a.push('Back to: '+(s.target||'choose a step'));
 if(s.type==='update')a.push(`${s.field||'Choose a field'} → ${s.value||'value'}`);
 if(s.type==='create')a.push(s.make||'Choose what to create');
 if(s.type==='start')a.push(s.wf||'Choose a workflow');
 if(s.type==='approval')a.push('Route from Approval Matrix');
 if(s.type==='each')a.push('For each '+(s.per||'line'));
 return a.join(' · ');}
function ruleOk(r,vals){if(!r)return true;const x=vals[r.k];if(r.op==='>')return Number(x)>Number(r.v);if(r.op==='<')return Number(x)<Number(r.v);if(r.op==='is')return String(x)===String(r.v);return String(x)!==String(r.v);}
function ruleText(r){const f=cur().tests.find(t=>t.k===r.k);if(!f)return '';return f.t==='yn'?`${f.label} is ${r.op==='is'?'':'not '}${r.v==='yes'?'Yes':'No'}`:`${f.label} is ${r.op==='>'?'over':r.op==='<'?'under':r.op==='is'?'exactly':'not'} ${fmt(r.v)}${f.unit||''}`;}
function ruleBuilder(target,current){const d=cur();return `<div class="rulebox"><span class="small">${current?`Now: <b>${esc(current.text)}</b>`:'Now: <b>Always</b>'}</span>
  <select id="r-k" aria-label="What to look at">${d.tests.map(t=>`<option value="${t.k}">${esc(t.label)}</option>`).join('')}<option disabled>More fields from ${esc(d.area==='you'?'earlier answers':d.area)}…</option></select>
  <div class="r3"><select id="r-op" aria-label="Compare"><option value=">">is over</option><option value="<">is under</option><option value="is">is</option><option value="not">is not</option></select><input type="text" id="r-v" placeholder="Value, or yes / no" aria-label="Value"></div>
  <div class="row"><button class="btn sm" data-act="setrule" data-target="${target}">Use this rule</button>${current?`<button class="btn sm ghost" data-act="clearrule" data-target="${target}">Always</button>`:''}</div></div>`;}
function readRule(){const k=document.getElementById('r-k').value,f=cur().tests.find(t=>t.k===k);let op=document.getElementById('r-op').value,v=document.getElementById('r-v').value.trim().toLowerCase();
 if(!f||!v){toast('Type a value for the rule.',false,true);return null;}
 if(f.t==='yn'){if(!['yes','no'].includes(v)){toast('For this one, type yes or no.',false,true);return null;}if(op==='>'||op==='<')op='is';}
 else{v=Number(v.replace(/[^0-9.]/g,''));if(!(v>=0)){toast('Type a number.',false,true);return null;}}
 const r={k,op,v};r.text=ruleText(r);return r;}

/* ---------- step cards + stages (one renderer, three layouts) ---------- */
function whoHtml(s){return `<span class="who">${S.people?`<span class="dot" style="background:${PEOPLE[s.who]||'#64748B'}"></span>`:''}${esc(s.who)}</span>`;}
function pathsHtml(s){return s.paths?`<div class="paths">${s.paths.map(p=>`<div class="pathrow"><b>${esc(p.label)}</b>${p.rule?`<span class="muted">${esc(ruleText(p.rule))}</span>`:''}${p.steps.map(m=>`<span class="mini">${ic(m[0])}${esc(m[1])} · ${esc(m[2])}</span>`).join('')||'<span class="muted">Nothing extra</span>'}</div>`).join('')}</div>`:'';}
function stepCard(id,edit,state){const s=cur().steps[id];if(!s)return '';const m=sub(s);
 const st=state?`<span class="state st-${state}">${{done:'Done',now:'Now',next:'Later'}[state]}</span>`:'';
 return `<div class="step ${S.sel===id&&edit?'sel':''} ${state||''}" data-id="${id}" ${edit?`tabindex="0" role="button" aria-label="${esc(T[s.type][0])}: ${esc(s.title)}. Enter to edit. Alt and arrow keys to move."`:''}>
  <span class="badge ${T[s.type][2]}">${ic(s.type)}</span>
  <span class="body"><span class="t">${esc(s.title)}</span><br><span class="s">${whoHtml(s)}${m?' · '+esc(m):''}</span>${s.when?`<br><span class="tag yours">Only when: ${esc(s.when.text)}</span>`:''}${s.must?` <span class="tag">Must finish before leaving</span>`:''}${pathsHtml(s)}</span>

function nativeRow(n,extra){return `<div class="native">${ic(n.k)}<span>${esc(n.text)}<span class="from">${esc(n.from)}</span>${extra||''}</span>${n.open&&!extra?`<button data-act="matrix">Open</button>`:''}</div>`;}
function stageTag(st,i){const d=cur();return st.kind==='core'?`<span class="owner">${ic('lock')}${esc(d.area)} owns this stage</span>`:st.kind==='group'?`<span class="owner">${ic('list')}Heading only</span>`:`<span class="owner">${ic('stage')}Your stage${d.locked?` · counts as “${esc(countsAs(i))}” in ${esc(d.area)}`:''}${st.sla?` · target ${esc(st.sla)}`:''}</span>`;}
function stagesView(layout){const d=cur();
 return `<div class="boardwrap"><div class="board l-${layout}" ${layout==='flow'?`style="zoom:${S.zoom}"`:''}>${d.stages.map((st,i)=>`<section class="stage ${st.kind==='yours'&&d.locked?'yours':''} ${st.kind==='group'?'grp':''}" data-stage="${i}" aria-label="Stage ${i+1}: ${esc(st.name)}">
   <div class="stagehead"><div class="stagename"><span class="n">${i+1}</span>${esc(st.name)}</div>${stageTag(st,i)}<span class="gate">${ic('arrow')}<span>Gets here when: ${esc(low(gateText(st,i)))}</span></span></div>
   <div class="stagebody">${st.native.length?`<span class="label">Already happens here</span>${st.native.map(n=>nativeRow(n)).join('')}<span class="label">Your added steps</span>`:''}
    <div class="steps" data-list="${i}">${st.steps.map(id=>stepCard(id,true)).join('')}</div>
    <button class="add" data-act="addto" data-stage="${i}">${ic('plus')} Add a step</button></div></section>`).join('')}</div></div>
  <p class="exit">${ic('exit')}<span>${esc(d.exit)}</span></p>`;}
function snake(){const d=cur(),seq=[];
 d.stages.forEach((st,i)=>{seq.push({c:'st',h:`${i+1}. ${esc(st.name)}`});st.native.forEach(n=>seq.push({c:'nat',h:ic(n.k)+esc(n.from==='Approval Matrix'?'Approval route':n.text.split(':')[0])}));st.steps.forEach(id=>{const s=d.steps[id];seq.push({c:'',id,h:`<span class="badge sm ${T[s.type][2]}">${ic(s.type)}</span>${esc(s.title)}`});});});
 const w=(document.querySelector('.work')?.clientWidth||900)-40,cols=Math.max(2,Math.min(5,Math.floor(w/190))),rows=[];
 for(let i=0;i<seq.length;i+=cols){const r=seq.slice(i,i+cols),rev=(i/cols)%2===1,last=i+cols>=seq.length;
  rows.push(`<div class="srow ${rev?'rev':''}">${Array.from({length:cols},(_,j)=>r[j]?`<div class="scell"><div class="spill ${r[j].c}" ${r[j].id?`data-pick="${r[j].id}" role="button" tabindex="0"`:''}>${r[j].h}</div>${j<r.length-1?`<span class="sarrow">${ic('arrow')}</span>`:''}</div>`:'<div class="scell"></div>').join('')}</div>`);
  if(!last)rows.push(`<div class="sturn ${rev?'':'r'}">${ic('down')}</div>`);}
 return `<section class="card snake" aria-label="The whole process in order"><p class="small muted" style="margin-bottom:6px">Left to right, then right to left on the next row. Purple are stages, grey already happens, white are your steps. Click a step to open it.</p>${rows.join('')}</section>`;}
function peopleView(){const d=cur(),g={};d.stages.forEach(st=>st.steps.forEach(id=>{const s=d.steps[id];(g[s.who]??=[]).push([id,st.name]);(s.paths||[]).forEach(p=>p.steps.forEach(m=>{if(m[2]!==s.who)(g[m[2]]??=[]).push([null,st.name,m]);}));}));

function fsel(label,prop,opts,val){return `<label class="fld">${label}<select data-f="${prop}">${opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;}
function inspector(){const d=cur();
 if(S.sel==='start')return `<aside class="card side" aria-label="When it starts"><div class="row"><h2 class="grow">When it starts</h2><button class="btn ghost sm" data-act="close" aria-label="Close">${ic('x')}</button></div>
  <label class="fld">Start when ${esc(d.what)}<select id="i-event">${['is created','is started by a person','has a field changed','reaches a date on the record','has its approval finished','is due on a schedule (every week or month)'].map(o=>`<option ${o===d.event?'selected':''}>${o}</option>`).join('')}</select></label>

 const s=d.steps[S.sel];if(!s)return '';const p=place(S.sel),h=HUMAN.includes(s.type);
 const warn=S.warn===S.sel?`<div class="warnbox"><b>${ic('alert')} This may be a double-up</b><span>${esc(S.warnText)}</span><div class="row"><button class="btn sm" data-act="remove">Do not add it</button><button class="btn sm" data-act="keep">Keep it, it is different</button></div></div>`:'';
 let x='';

 else x+=fsel(h?'Who does it':s.type==='email'||s.type==='notify'?'Who gets it':'Runs as',  'who',Object.keys(PEOPLE),s.who);
 if(h&&s.type!=='approval')x+=fsel('Due','due',DUE,s.due||DUE[0])+fsel('If nobody acts in time','late',LATE,s.late||LATE[0]);
 if(s.type==='task'||s.type==='confirm')x+=fsel('Buttons the person sees','out',['Done','Done / Cannot do','Yes / No','Agree'],s.out||'Done');
 if(s.type==='form')x+=`<span class="label">Questions</span>${s.qs.map((q,i)=>`<div class="q"><input type="text" value="${esc(q[0])}" data-q="${i}" aria-label="Question ${i+1}"><select data-qt="${i}" aria-label="Answer type">${['Short answer','Long answer','Amount','Number','Date','Yes / No','Choose one','Choose many','Person','File','List of lines'].map(o=>`<option ${o===q[1]?'selected':''}>${o}</option>`).join('')}</select></div>`).join('')}<div class="row"><button class="btn sm" data-act="addq">${ic('plus')} Add a question</button><span class="small muted">Each can be required, or shown only after an earlier answer.</span></div>`;
 if(s.type==='email')x+=fsel('Saved message','msg',['Claim paid','Reminder','Thank you','Ready to collect'],s.msg)+`<button class="btn sm" data-act="msgedit">${ic('update')} Edit this message</button>`;

 if(s.type==='back')x+=fsel('Send back to','target',Object.values(d.steps).filter(t=>HUMAN.includes(t.type)&&t!==s).map(t=>t.title),s.target)+`<p class="small muted">The person gets it again with your note. Steps in between run again.</p>`;
 if(s.type==='update')x+=fsel('Field','field',['Note','Priority','Payment date','Cost centre'],s.field)+`<label class="fld">Set it to<input type="text" data-f="value" value="${esc(s.value||'')}"></label><p class="small muted">Only fields the app area marks as safe appear here. Status and money fields are never in this list.</p>`;

 if(s.type==='start')x+=fsel('Workflow','wf',['Joiner checklist','Leaver checklist','Equipment request'],s.wf);

 return `<aside class="card side" aria-label="Step settings"><div class="row"><h2 class="grow">${T[s.type][0]}</h2><button class="btn ghost sm" data-act="close" aria-label="Close">${ic('x')}</button></div>${warn}
  <label class="fld">Name<input type="text" data-f="title" value="${esc(s.title)}"></label>${x}
  ${fsel('Stage','_stage',d.stages.map(t=>t.name),d.stages[p[0]].name)}

 const form=i=>{const n=S.ns;return `<div class="card" style="display:grid;gap:10px;border-color:var(--brand)"><h3>New stage after “${esc(d.stages[i-1]?.name||'the start')}”</h3>

  <button class="opt" data-act="nskind" data-v="group" aria-pressed="${n.kind==='group'}">${ic('list')}<span><b>Just a heading</b><small>Groups steps in this picture only. This is what Sections do today.</small></span></button>
  ${n.kind==='yours'?`<span class="label">How does a record get here?</span>
  <button class="opt" data-act="nsenter" data-v="auto" aria-pressed="${n.enter==='auto'}">${ic('arrow')}<span><b>By itself</b><small>As soon as the steps in the stage before are finished.</small></span></button>
  <button class="opt" data-act="nsenter" data-v="person" aria-pressed="${n.enter==='person'}">${ic('user')}<span><b>A person moves it</b><small>They get a “Move to” button on the record.</small></span></button>
  ${n.enter==='person'?`<label class="fld">Who may move it<select id="ns-who">${Object.keys(PEOPLE).filter(p=>p!=='Automatic').map(p=>`<option ${p===n.enterWho?'selected':''}>${p}</option>`).join('')}</select></label>`:''}
  <button class="opt" data-act="nsenter" data-v="rule" aria-pressed="${n.enter==='rule'}">${ic('path')}<span><b>When a rule is true</b><small>${n.rule?esc(n.rule.text):'For example: amount is over 20,000,000 ₫.'}</small></span></button>
  ${n.enter==='rule'?ruleBuilder('ns',n.rule):''}
  <label class="fld">Target time in this stage<select id="ns-sla">${['No target','1 day','3 days','1 week','2 weeks'].map(o=>`<option ${o===n.sla?'selected':''}>${o}</option>`).join('')}</select></label>
  <label class="fld inline"><input type="checkbox" id="ns-must" ${n.must?'checked':''}> A record cannot leave until every step here is finished</label>`:''}
  <div class="row" style="justify-content:flex-end"><button class="btn" data-act="nscancel">Cancel</button><button class="btn primary" data-act="nssave" data-i="${i}">Add this stage</button></div></div>`;};
 const rows=d.stages.map((st,i)=>`${S.ns&&S.ns.at===i?form(i):i>0||!d.locked?`<button class="between" data-act="nsopen" data-i="${i}">${ic('plus')} Add a stage here</button>`:''}
  <div class="srowm ${st.kind!=='core'?'yours':''}"><span class="stagename grow"><span class="n">${i+1}</span>${st.kind==='core'?esc(st.name):`<input type="text" value="${esc(st.name)}" data-sname="${i}" aria-label="Stage name" style="max-width:220px">`}
   <span class="tag ${st.kind==='core'?'':'yours'}">${st.kind==='core'?'Owned by '+esc(d.area):st.kind==='group'?'Heading only':'Yours'}</span>${st.sla?`<span class="tag">Target ${esc(st.sla)}</span>`:''}</span>
   ${st.kind==='core'?`<button class="btn sm ghost" data-act="openarea">${ic('lock')} Open in ${esc(d.area)}</button>`:`<button class="btn sm" data-act="stup" data-i="${i}" aria-label="Move earlier" ${i<=(d.locked?1:0)?'disabled':''}>${ic('up')}</button><button class="btn sm" data-act="stdn" data-i="${i}" aria-label="Move later" ${i>=d.stages.length-1?'disabled':''}>${ic('dn')}</button><button class="btn sm" data-act="stdel" data-i="${i}" aria-label="Delete stage" ${d.stages.length<2?'disabled':''}>${ic('trash')}</button>`}
   <span class="small muted" style="flex-basis:100%">Gets here when: ${esc(low(gateText(st,i)))}${st.kind==='yours'&&d.locked?` · counts as “${esc(countsAs(i))}” in ${esc(d.area)}`:''} · ${st.steps.length} step${st.steps.length===1?'':'s'}</span></div>`).join('');
 const end=S.ns&&S.ns.at===d.stages.length?form(d.stages.length):`<button class="between" data-act="nsopen" data-i="${d.stages.length}">${ic('plus')} Add a stage at the end</button>`;
 return `<div class="overlay" data-act="stagesclose"><div class="sheet" role="dialog" aria-label="Stages" data-stop>

  ${rows}${end}
  <p class="small muted">${ic('exit')} ${esc(d.exit)}</p></div></div>`;}
function stageOp(a,b){const d=cur(),i=Number(b.dataset.i);
 if(a==='nsopen'){S.ns={at:i,name:'',kind:'yours',enter:'auto',enterWho:'Finance officer',sla:'No target',must:false,rule:null};return true;}
 if(a==='nscancel'){S.ns=null;return true;}
 if(a==='nskind'||a==='nsenter'){readNs();S.ns[a==='nskind'?'kind':'enter']=b.dataset.v;return true;}
 if(a==='nssave'){readNs();const n=S.ns;if(!n.name.trim()){toast('Give the stage a name.',false,true);return true;}if(n.enter==='rule'&&n.kind==='yours'&&!n.rule){toast('Choose the rule, or pick another way in.',false,true);return true;}
  snap();d.stages.splice(i,0,{name:n.name.trim().slice(0,40),kind:n.kind,enter:n.enter,enterWho:n.enterWho,rule:n.rule,sla:n.sla==='No target'||n.kind==='group'?'':n.sla,must:n.must,native:[],steps:[]});S.ns=null;S.addTo=i;
  toast(`Stage “${n.name.trim()}” added. Now add steps to it.`,true);return true;}
 if(a==='stup'||a==='stdn'){const j=a==='stup'?i-1:i+1;if(j<(d.locked?1:0)||j>=d.stages.length)return true;snap();const [st]=d.stages.splice(i,1);d.stages.splice(j,0,st);const pr=check();if(pr){undo();toast(pr,false,true);}return true;}
 if(a==='stdel'){snap();const [st]=d.stages.splice(i,1);const to=d.stages[Math.max(0,i-1)];to.steps.push(...st.steps);S.addTo=0;const pr=check();if(pr){undo();toast(pr,false,true);return true;}toast(`Stage removed. Its ${st.steps.length} step${st.steps.length===1?'':'s'} moved to “${to.name}”.`,true);return true;}
 if(a==='openarea'){toast(`In the real app this opens ${d.area} settings and brings you back here.`);return true;}
 return false;}
function readNs(){if(!S.ns)return;const g=id=>document.getElementById(id);if(g('ns-name'))S.ns.name=g('ns-name').value;if(g('ns-who'))S.ns.enterWho=g('ns-who').value;if(g('ns-sla'))S.ns.sla=g('ns-sla').value;if(g('ns-must'))S.ns.must=g('ns-must').checked;}

/* ---------- try it out ---------- */

 const inputs=d.tests.map(t=>`<label class="fld">${esc(t.label)}${t.t==='yn'?`<select data-tv="${t.k}"><option value="yes" ${v[t.k]==='yes'?'selected':''}>Yes</option><option value="no" ${v[t.k]==='no'?'selected':''}>No</option></select>`:`<input type="number" data-tv="${t.k}" value="${esc(v[t.k])}">`}</label>`).join('');
 let out='';
 if(S.preview===S.ex){if(!ruleOk(d.rule,v))out=`<div class="card"><b>This record would not start the workflow.</b><p class="muted">${esc(d.rule.text)} is not true for these values.</p></div>`;

   ${st.native.map(n=>`<span class="mini">${ic(n.k)}Already happens: ${esc(n.text)}</span>`).join('')}
   ${st.steps.map(id=>{const s=d.steps[id],ok=ruleOk(s.when,v);const taken=s.type==='path'?s.paths.find(p=>!p.rule||ruleOk(p.rule,v)):null;
    return `<span class="mini" style="${ok?'color:var(--ink)':'text-decoration:line-through'}">${ic(ok?'check':'x')}${esc(s.title)}${ok?'':' · skipped, '+esc(low(s.when.text))+' is not true'}${taken?` · takes “${esc(taken.label)}”${taken.steps.length?': '+esc(taken.steps.map(m=>m[1]).join(', ')):''}`:''}</span>`;}).join('')}</span></div>`).join('')}</div>`;}
 return `<div class="card" style="display:grid;gap:12px;max-width:760px"><div><h2>Try it with example values</h2><p class="muted">Nothing is sent and no record changes.</p></div><div class="row" style="align-items:flex-end">${inputs}<button class="btn primary" data-act="simulate">${ic('start')} Show what would happen</button></div></div>${out}`;}

 Object.values(d.steps).forEach(s=>{if(s.type==='stage'&&!s.target)issues.push(`“${s.title}” needs a stage to move to.`);if(s.type==='email'&&!s.msg)issues.push(`“${s.title}” needs a saved message.`);});
 d.stages.forEach(st=>{if(st.kind==='yours'&&!st.steps.length&&st.enter==='auto'&&d.locked)issues.push(`Stage “${st.name}” has no steps, so records would pass straight through it.`);});

 <div class="card" style="max-width:820px;display:grid;gap:6px"><h3>Already happens for these records</h3>${nat.map(t=>`<span class="mini">${ic('lock')}${esc(t)}</span>`).join('')||'<span class="muted small">Nothing built in. This process is all yours.</span>'}</div>
 <div class="card" style="max-width:820px;display:grid;gap:10px"><label class="fld">What changed? (optional)<input type="text" id="v-note" placeholder="For example: added a Payment scheduled stage"></label>

/* ---------- activity: one record + where time goes ---------- */
function autoRun(){const d=cur(),r=d.record,st=d.stages[r.stage];if(!st)return;const route=st.native.find(n=>n.route);if(route&&r.seat<route.route.length)return;for(const id of st.steps){if(r.done.includes(id))continue;if(HUMAN.includes(d.steps[id].type))return;r.done.push(id);}}
function recItems(i){const d=cur(),st=d.stages[i],r=d.record,out=[];
 st.native.filter(n=>n.route).forEach(n=>n.route.forEach((seat,k)=>out.push({key:'seat'+k,who:seat[1],what:`${seat[0]} check`,done:i<r.stage||k<r.seat})));
 st.steps.forEach(id=>out.push({key:id,who:d.steps[id].who,what:d.steps[id].title,done:r.done.includes(id),auto:!HUMAN.includes(d.steps[id].type)}));return out;}
function recFinished(){const d=cur(),r=d.record;return r.stage>=d.stages.length||(r.stage===d.stages.length-1&&!recItems(r.stage).some(x=>!x.done));}
function activityTab(){const d=cur(),r=d.record,fin=recFinished(),pending=fin?[]:recItems(r.stage).filter(x=>!x.done&&!x.auto),nx=d.stages[r.stage+1];
 const line=fin?'Everything is finished for this record.':pending.length?`Waiting for ${pending[0].who}: ${low(pending[0].what)}.`:nx&&nx.kind==='yours'&&nx.enter==='person'?`Waiting for ${nx.enterWho} to move it to ${nx.name}.`:`Nobody is holding this up. Next: ${nx?low(gateText(nx,r.stage+1)):'the last step finishes'}.`;
 const max=Math.max(...d.time.map(t=>t[1]),1);
