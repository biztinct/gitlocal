<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Payobook Workflow Studio — a working prototype of the proposed product experience."><title>Workflow Studio · Payobook</title><style>/* STYLES */</style></head>
<body>
<a class="skip-link" href="#workarea">Skip to workflow</a>
<div class="app"><div class="workspace">
<header class="topbar">
  <div class="breadcrumb"><a class="brand" href="#" aria-label="Payobook Workflow Studio">p<span>·</span></a><span class="product-name">Payobook</span><span class="crumb-divider">/</span><button class="text-btn" data-action="templates">Workflows</button><span class="crumb-divider">/</span><strong>Workflow Studio</strong></div>
  <div class="top-right"><span class="prototype-label"><span></span> Product preview</span><button class="icon-btn" data-action="help" aria-label="Help with workflows" title="Help">?</button><button class="text-btn design-notes" data-action="compare">Design notes</button><span class="avatar user-avatar" aria-label="Demo user">AD</span></div>
</header>
<main class="studio">
  <div class="studio-title">
    <button class="back-button icon-btn" data-action="templates" aria-label="Choose a workflow" title="Choose a workflow"><span data-icon="back"></span></button>
    <div class="process-icon" id="process-icon" aria-hidden="true"></div>
    <div class="process-title"><div class="title-line"><h1 id="process-title"></h1><span class="badge draft" id="save-status">Draft</span></div><div class="contextbar"><span id="process-subtitle"></span><span class="context-divider">·</span><button class="context-pill" data-action="scope"><span id="scope-summary"></span><span aria-hidden="true">⌄</span></button><button class="context-pill event-context" data-action="scope"><span data-icon="trigger"></span><span id="trigger-summary"></span></button></div></div>
    <div class="title-actions"><div class="history-controls"><button class="icon-btn" data-action="undo" title="Undo (⌘/Ctrl Z)" aria-label="Undo"><span data-icon="undo"></span></button><button class="icon-btn" data-action="redo" title="Redo (⌘/Ctrl Shift Z)" aria-label="Redo"><span data-icon="redo"></span></button></div><button class="button white" data-action="simulate"><span data-icon="play"></span> Try it out</button><button class="button primary" data-action="publish">Review & save <span data-icon="arrow"></span></button><details class="more-menu"><summary class="icon-btn" aria-label="More workflow options">⋯</summary><div><button class="mobile-history" data-action="undo"><span data-icon="undo"></span> Undo</button><button class="mobile-history" data-action="redo"><span data-icon="redo"></span> Redo</button><button data-action="export"><span data-icon="download"></span> Export workflow</button><button data-action="history"><span data-icon="history"></span> Version history</button><button data-action="people"><span data-icon="people"></span> People & cover</button></div></details></div>
  </div>
  <nav class="mode-tabs" aria-label="Workflow lifecycle"><button data-mode="design" class="selected"><span data-icon="design"></span><b>Build</b></button><button data-mode="rehearse"><span data-icon="play"></span><b>Try it out</b></button><button data-mode="review"><span data-icon="check"></span><b>Review</b></button><button data-mode="monitor"><span data-icon="activity"></span><b>Activity</b></button><span class="autosave"><span class="ready-dot"></span><span id="draft-status">Saved in this browser</span></span></nav>
  <div id="design-panel">
    <div class="design-toolbar"><div class="options" aria-label="Three views of your workflow"><button class="option selected" data-view="journey"><span data-icon="journey"></span><strong>Journey</strong></button><button class="option" data-view="canvas"><span data-icon="flow"></span><strong>Flowchart</strong></button><button class="option" data-view="blueprint"><span data-icon="people"></span><strong>People</strong></button></div><div class="toolbar-actions"><button class="text-btn add-library" data-action="show-library"><span data-icon="plus"></span>Add a step</button><button class="text-btn" data-action="focus" aria-pressed="false"><span data-icon="focus"></span><span id="focus-label">Focus view</span></button><span class="toolbar-divider"></span><button class="readiness" id="readiness" data-action="readiness"></button></div></div>
    <div class="editor">
      <aside class="library" aria-label="Step library"><div class="library-heading"><h2>Add a step</h2><button class="icon-btn" data-action="hide-library" aria-label="Hide step library"><span data-icon="panel"></span></button></div><p class="hint">Drag it in, or click to add.</p><label class="search-box"><span data-icon="search"></span><input class="palette-search" data-palette-search aria-label="Find a step" placeholder="Find a step…"></label><div id="palette"></div><button class="template-card" data-action="components"><span data-icon="subprocess"></span><span><strong>Your saved groups</strong><small>Good work, ready to reuse</small></span><span data-icon="arrow"></span></button><button class="text-btn library-template" data-action="templates"><span data-icon="templates"></span> Start from a template</button></aside>
      <section class="design-area" aria-label="Workflow editor"><div class="view-header"><div><h2 id="view-title"></h2><p id="view-hint"></p></div><button class="icon-btn" data-action="scope" aria-label="Workflow settings" title="Workflow settings"><span data-icon="settings"></span></button></div><div id="workarea" tabindex="-1"></div><div class="design-footer"><span id="workflow-summary"></span><button class="text-btn" data-action="architecture">How it connects <span data-icon="arrow"></span></button></div></section>
      <aside id="inspector" class="inspector" aria-label="Selected step settings" hidden></aside>
    </div>
  </div>
  <div id="mode-content" hidden></div>
</main>
<footer class="page-footer"><span><span class="preview-dot"></span> Preview with fictional data</span><span>Changes stay in this browser · no live actions</span></footer>
</div></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-top"><div><div class="eyebrow" id="modal-eyebrow"></div><h2 id="modal-title"></h2></div><button class="icon-btn" data-action="close" aria-label="Close dialog">×</button></div><div id="modal-body"></div></dialog>
<script>/* SCRIPT */</script>
</body></html>
