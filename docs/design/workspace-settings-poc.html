const find = s => document.querySelector(s);
const escape = s => String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
const icon = name => '<svg aria-hidden="true" viewBox="0 0 24 24">'+(paths[name]||paths.layers)+'</svg>';
const access = ['Hiring','Payroll','People'];
const proposed = ['Expenses','Workforce','Talent','Learning','Insights','Compliance'];
const summaries = {Expenses:'Manage travel allowances, expense categories and claim payments.',People:'Configure job levels, pay ranges and employee lifecycle documents.',Hiring:'Configure recruitment stages, application forms and interview standards.',Home:'Manage the announcements that appear on Home.',Calendar:'Manage personal connections and company calendar providers.',Payroll:'Manage bank file layouts, insurance contributions and tax rules.',Workforce:'Manage working time, attendance rules and time clocks.',Insights:'Manage reusable reports for the Insights workspace.',Compliance:'Manage statutory tables and safeguards for young workers.',Talent:'Manage goal cycles, review forms and survey questions.',Learning:'Configure course enrolment, reminders and training feedback.',Help:'Manage the product guidance your team sees.',Settings:'Manage shared company details, navigation and system behaviour.'};
const paymentPreview = {route:'By finance'};
function paymentForm(){
 return '<fieldset><legend>Example company · payment settings</legend><p>Which channel should pay newly approved claims?</p>'+['By finance','In the next pay run'].map(route=>'<label class="choice"><input type="radio" name="route" value="'+route+'" '+(route===paymentPreview.route?'checked':'')+'> '+route+'</label>').join('')+'<p>Previously approved claims keep their payment channel.</p><button class="action" id="applyRoute">Apply to preview</button> <span role="status" id="saved"></span></fieldset>';
}
const subIcons={Trips:'plane',Claims:'receipt',Insights:'barChart',Pay:'banknote',Employees:'users',Contracts:'fileText',Interviews:'calendar',Roles:'briefcase','Job boards':'globe',Overview:'layoutGrid',Settings:'settings',Access:'shield',Applicants:'list',Offers:'send','Resume bank':'bookOpen',Location:'mapPin'};
let workspace=location.hash==='#payrun'?'Payroll':'Expenses', view='settings', term='';
const current=()=>menus[workspace];
const label=()=>view==='settings'?'Settings':view==='access'?'Access & delegation':view;
function go(name,next='settings'){
 workspace=name;view=next;term='';render();find('.page').scrollTop=0;
}
function navButton(text,key,symbol){
 return '<button class="navbtn" data-view="'+escape(key)+'" aria-current="'+(key===view)+'" title="'+escape(text)+'">'+icon(symbol)+'<span>'+escape(text)+'</span></button>';
}
function render(){
 const m=current();
 find('#picker').value=workspace;
 find('#brand').innerHTML=icon(m.icon);
 find('.places').innerHTML=Object.entries(menus).map(([name,d])=>'<button class="place" aria-label="'+name+'" title="'+name+'" data-menu="'+name+'" aria-current="'+(workspace===name)+'">'+icon(d.icon)+'</button>').join('');
 find('.crumb').innerHTML=workspace+'<span>›</span><b>'+escape(label())+'</b>';
 find('.work').innerHTML=m.sub.map((s,i)=>navButton(s,s,subIcons[s]||['layoutGrid','calendar','fileText','list','table','layers'][i%6])).join('');
 find('.foot').innerHTML=navButton('Settings','settings','settings')+((access.includes(workspace)||proposed.includes(workspace))?navButton('Access','access','shield'):'');
 const isGear=view==='settings',isGroup=workspace==='Settings' && !isGear;
 const title=isGear?(workspace==='Settings'?'Platform settings':workspace+' settings'):label();
 find('.heading').innerHTML='<div class="eyebrow">'+workspace+' workspace</div><h1>'+escape(title)+'</h1><p>'+escape(isGear?summaries[workspace]:view==='access'?'Who can use this workspace and who can manage its settings.':isGroup?'Central settings directory':'Working screen · Navigation preview')+'</p>';
 if(isGear||isGroup){
  find('#content').innerHTML='<div class="tools"><strong>Configurators</strong><label class="search">'+icon('search')+'<input type="search" placeholder="Find a setting" aria-label="Find a setting"></label></div><div class="groups"></div><p class="note"><b>Design note</b> · '+escape(m.note)+'</p>';
  find('input').oninput=e=>{term=e.target.value.trim().toLowerCase();drawCards()};
  drawCards();
 }else if(view==='access'){
  const existing=access.includes(workspace);
  find('#content').innerHTML='<h2>'+workspace+' access</h2><p class="guide">'+(existing?'Existing workspace in Access & delegation.':'Proposed workspace filter for Access & delegation. This scope needs a catalogue mapping before release.')+'</p><div class="panel"><h2>'+icon('shield')+'Workspace scope</h2><div class="empty">'+(existing?'Inspect roles, assignments and delegations for '+workspace+'.':'Review access to '+m.sub.slice(0,3).join(', ')+' and the local configurators.')+'</div></div><p class="note">The design inherits each destination’s company, record and action permissions. Management controls require the existing server authorisation.</p>';
 }else{
  find('#content').innerHTML='<h2>'+escape(workspace)+' navigation</h2><p class="muted">Use the Settings gear at the foot of this submenu to configure '+escape(workspace)+'.</p><p><button class="action" data-view="settings">'+icon('settings')+' Open '+escape(workspace)+' settings</button></p>';
 }
}
function nativeDirectory(){
 const apps = new Map();
 for (const [app, path, id] of nativeSettingsMenus) {
  if (!(app+' '+path+' '+id).toLowerCase().includes(term)) continue;
  if (!apps.has(app)) apps.set(app, []);
  apps.get(app).push('<li>'+escape(path)+'<small>'+escape(id)+'</small></li>');
 }
 if (!apps.size) return '';
 return '<section class="panel wide native"><h2>Original application menus</h2><p>Platform administrator reference. Expand an application to see its existing settings paths. Availability depends on installed modules and permissions.</p>'+
  [...apps].map(([app,items])=>'<details><summary>'+escape(app)+' ('+items.length+')</summary><ul>'+items.join('')+'</ul></details>').join('')+'</section>';
}
function drawCards(){
 const groupMap=view==='settings'?current().groups:{[view]:Object.keys(cards).filter(k=>cards[k][4]===view)};
 const fragments=[];
 for(const [group,names] of Object.entries(groupMap)){
  const hits=names.filter(n=>(group+' '+n+' '+cards[n][0]).toLowerCase().includes(term));
  if(!hits.length)continue;
  fragments.push('<section class="panel"><h2>'+escape(group)+' <span>'+hits.length+'</span></h2>'+hits.map(n=>'<button class="row" data-card="'+escape(n)+'"><span class="tile">'+icon(cards[n][3])+'</span><span><strong>'+escape(n)+'</strong><small>'+escape(cards[n][0])+'</small></span><span class="arrow">'+icon('chevron')+'</span></button>').join('')+'</section>');
 }
 if(workspace==='Settings' && view==='System'){
  const directory=nativeDirectory();
  if(directory)fragments.push(directory);
 }
 find('.groups').innerHTML=fragments.join('')||'<p role="status">No settings match your search.</p>';
}
function show(html){find('#detail').innerHTML=html;find('dialog').showModal()}
function routeDetail(name){
 if(name==='The left menu')return '<dt>Starting view</dt><dd>Screens in Access &amp; delegation</dd>';
 if(name==='Attendance connectors')return '<dt>Installed destination</dt><dd>Workforce setup › Time clocks</dd>';
 if(name==='Hiring set-up')return '<dt>Inside Hiring set-up</dt><dd>Hiring connections, Stages, Application forms, Scorecards, Emails and languages, Automations, Who does what, Consent &amp; retention, Before they join, Channels and Agencies. Choosing Stages scrolls to the editor in this screen.</dd>';
 return '';
}
function inspect(name){
 const [desc,source,target,,group]=cards[name];
 show('<div class="eyebrow">'+workspace+' / '+label()+'</div><h2>'+escape(name)+'</h2><p>'+escape(desc)+'</p>'+(name==='How claims are paid'?paymentForm():'')+'<dl><dt>Current destination</dt><dd>'+escape(group?'Settings › '+group:'Workspace configurator')+'</dd><dt>Existing action or screen</dt><dd><code>'+escape(target)+'</code></dd>'+routeDetail(name)+'<dt>Source</dt><dd><code>'+escape(source)+'</code></dd></dl><p class="guide">The proposed shortcut opens this configurator with its existing permissions and returns to '+workspace+' when closed.</p>');
}
find('#picker').innerHTML=Object.keys(menus).map(k=>'<option>'+k+'</option>').join('');
find('#picker').onchange=e=>go(e.target.value);
find('#study').onclick=()=>show('<div class="eyebrow">Navigation design</div><h2>Menu study</h2><p>The same 13 active sidebar entries appear in payobook, payobook_template, p0clone and rize. Submenus below combine core screens and optional module registrations. A person’s visible screens depend on their company and role.</p><p>The seven main Settings groups account for all 49 registered cards across the four installations, including conditional entries. Settings › System also indexes the original application menus. Editors nested inside a configurator remain reachable through its parent screen.</p><p>Keep daily screens in the scrolling upper rail. Pin Settings and eligible Access entries below it, including on short screens. Show a settings entry only when at least one installed destination passes its visibility check. Recheck access on the server when opening it.</p><p>Use the same action in the central directory and local menu. Shared rules such as Insurance &amp; Tax can have two contextual links. Global company, tenancy and system administration stay in Settings.</p><p>Hiring, People and Payroll already have scoped Access. Six additional workspace filters are proposed. Calendar, Help and Home use the permissions of their individual settings.</p>'+Object.entries(menus).map(([n,m])=>'<details><summary>'+n+'</summary><p>'+escape(m.note)+'</p><b>Work screens</b><p>'+escape(m.sub.join(' · '))+'</p><b>Local settings</b><p>'+escape(Object.values(m.groups).flat().join(' · '))+'</p><button class="action" data-menu="'+n+'">Inspect '+n+'</button></details>').join(''));
document.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b)return;
 if(b.classList.contains('close'))find('dialog').close();
 if(b.dataset.menu){if(find('dialog').open)find('dialog').close();go(b.dataset.menu)}
 if(b.dataset.view)go(workspace,b.dataset.view);
 if(b.dataset.card)inspect(b.dataset.card);
 if(b.id==='applyRoute'){
  paymentPreview.route=find('input[name=route]:checked').value;
  find('#saved').textContent='Preview updated';
 }
});
render();
</script></body></html>
