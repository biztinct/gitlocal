<title>Pay Run Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: the live Payobook hub frame (dark rail + lens rail) around one board.
   Hero = "this month" card; three step lanes; a peek panel on the right.
   Single light look on purpose: the product is light-only. */
:root{
  --bg:#F4F5FB; --lane:#ECEDF6; --card:#FFFFFF; --ink:#1E1B2E; --ink2:#3F3B57; --muted:#6F6B86; --faint:#9D99B4;
  --line:#E4E5F1; --line2:#D6D7E8;
  --p:#5A4BB0; --p600:#4A3D96; --p-deep:#241F52; --p-soft:#EDEAF8; --p-soft2:#DDD6F2; --p-wash:#F3F0FB; --p-ring:rgba(90,75,176,.22);
  --amber:#B45309; --amber-soft:#FEF3C7; --amber-line:#FCD34D;
  --green:#0F7B4F; --green-soft:#D9F2E4; --green-line:#A3DBBE;
  --rose:#DC2655; --rose-soft:#FFE4E8; --rose-line:#FDA4B4;
  --slate:#64748B; --slate-soft:#EDF0F4;
  --navy:#0E1133; --hub:#1E1B4B;
  --sh-1:0 1px 2px rgba(30,27,46,.06),0 1px 1px rgba(30,27,46,.03);
  --sh-2:0 12px 30px rgba(60,50,130,.13),0 2px 6px rgba(30,27,46,.06);
  --sh-3:0 24px 60px rgba(36,31,82,.22),0 4px 12px rgba(30,27,46,.08);
  --r-lane:20px; --r-card:14px; --r-btn:10px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input{font-family:inherit}
.ic{display:inline-flex;width:1em;height:1em;flex:none;vertical-align:-.12em}
.ic svg{width:100%;height:100%;display:block}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--p);outline-offset:2px;border-radius:6px}

/* ============================================================ frame */
.app{display:grid;grid-template-columns:68px 1fr;height:100%;min-height:0}
.rail{background:var(--navy);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px}
.rail .logo{width:34px;height:34px;border-radius:10px;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;margin-bottom:14px}
.rail .ri{width:40px;height:38px;border-radius:10px;display:grid;place-items:center;color:#9A97C7;font-size:17px;border:0;background:transparent}
.rail .ri.on{background:var(--p);color:#fff}
.rail .spacer{flex:1}
.rail .av{width:32px;height:32px;border-radius:50%;background:#2E2A6B;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.main{display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0}
.hubbar{height:52px;background:var(--hub);display:flex;align-items:center;gap:14px;padding:0 18px;color:#fff}
.hubbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.hubbar .brand .bi{width:26px;height:26px;border-radius:8px;background:var(--p);display:grid;place-items:center;font-size:13px}
.hubbar .chip{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:4px 10px;color:#D9D6F5}
.hubbar .hs{flex:0 1 360px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:7px 12px;color:#B9B6DD;font-size:12.5px;margin-left:10px}
.hubbar .hs kbd{margin-left:auto;font:600 10px var(--font);background:rgba(255,255,255,.12);border-radius:5px;padding:2px 6px;color:#D9D6F5}
.hubbar .hsp{flex:1}
.hubbar .hi{color:#B9B6DD;font-size:16px;background:none;border:0}
.hubbar .hav{width:28px;height:28px;border-radius:50%;background:#3E3A86;display:grid;place-items:center;font-size:11px;font-weight:700}
.hubbar .co{font-size:12.5px;color:#D9D6F5;font-weight:600}
.body{display:grid;grid-template-columns:62px 1fr;min-height:0}
.lens{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.lens .li{width:40px;height:38px;border-radius:10px;display:grid;place-items:center;color:#7A7794;font-size:17px;border:0;background:transparent;position:relative}
.lens .li.on{background:var(--p-soft);color:var(--p)}
.lens .li:hover{background:var(--bg)}
.scroll{overflow:auto;min-height:0;position:relative}
.wrap{max-width:1500px;margin:0 auto;padding-block:22px 120px;padding-inline:28px}

/* ============================================================ top row */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.top h1{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:0}
.top .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:#fff;color:var(--ink2);border-radius:var(--r-btn);padding:8px 13px;font-size:12.5px;font-weight:700;line-height:1;transition:background .14s,border-color .14s,color .14s,transform .12s,box-shadow .14s;white-space:nowrap}
.btn:hover{border-color:var(--p-soft2);background:var(--p-wash);color:var(--p-deep)}
.btn.primary{background:var(--p);border-color:var(--p);color:#fff;box-shadow:0 4px 12px rgba(90,75,176,.22)}
.btn.primary:hover{background:var(--p600);border-color:var(--p600);color:#fff;transform:translateY(-1px)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--p-wash);color:var(--p-deep);border-color:transparent}
.btn.danger{color:var(--rose)}
.btn.danger:hover{background:var(--rose-soft);border-color:var(--rose-line);color:var(--rose)}
.btn.lg{padding:11px 18px;font-size:13.5px;border-radius:12px}
.btn.icon{padding:8px;width:32px;height:32px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn .ic{font-size:14px}

/* ============================================================ hero */
.hero{display:grid;grid-template-columns:minmax(260px,1.05fr) minmax(300px,1.4fr) minmax(240px,.9fr);gap:0;background:var(--p-wash);border:1px solid var(--p-soft2);border-radius:var(--r-lane);margin-bottom:18px;overflow:hidden;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.hero > div{padding:20px 24px;min-width:0}
.hero .h-a{border-right:1px solid var(--p-soft2)}
.hero .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--p);display:flex;align-items:center;gap:7px}
.hero .eyebrow .ic{font-size:13px}
.hero .month{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;color:var(--p-deep)}
.hero .range{font-size:12.5px;color:var(--muted);font-weight:600}
.journey{display:flex;align-items:flex-start;margin-top:16px;position:relative}
.journey .jn{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;min-width:0}
.journey .jn::before{content:"";position:absolute;top:10px;left:50%;right:-50%;height:2px;background:var(--p-soft2)}
.journey .jn:last-child::before{display:none}
.journey .jn.done::before{background:var(--p)}
.journey .dot{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--p-soft2);display:grid;place-items:center;position:relative;z-index:1;font-size:11px;color:#fff;transition:all .3s}
.journey .jn.done .dot{background:var(--p);border-color:var(--p)}
.journey .jn.now .dot{border-color:var(--p);box-shadow:0 0 0 5px var(--p-ring);animation:pulse 2.4s ease-in-out infinite}
.journey .jn.now .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--p)}
.journey .jl{font-size:10.5px;font-weight:700;color:var(--faint);text-align:center;line-height:1.2;white-space:nowrap}
.journey .jn.done .jl,.journey .jn.now .jl{color:var(--p-deep)}
.hero .stage{margin-top:12px;font-size:12px;color:var(--muted);font-weight:600}
.hero .stage b{color:var(--p-deep)}
.hero .h-b{display:flex;flex-direction:column;justify-content:center;gap:10px;border-right:1px solid var(--p-soft2)}
.hero .say{font-size:17px;font-weight:600;line-height:1.45;color:var(--ink);text-wrap:balance;letter-spacing:-.005em}
.hero .say button{all:unset;cursor:pointer;color:var(--p);font-weight:800;border-bottom:2px solid var(--p-soft2);transition:border-color .14s}
.hero .say button:hover{border-color:var(--p)}
.hero .say button.on{background:var(--p-soft);border-radius:4px;border-color:var(--p);padding:0 3px}
.hero .ask{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.hero .ask.amber{color:var(--amber)}
.hero .ask .pd{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9}
.hero .ask.amber .pd{animation:pulse 2s ease-in-out infinite}
.hero .h-c{display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero .lbl{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.025em;color:var(--p-deep);line-height:1.05}
.hero .big small{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:0;margin-left:6px}
.hero .meta{font-size:12.5px;color:var(--muted);font-weight:600}
.hero .next{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero .next .why{font-size:12px;color:var(--muted);font-weight:600}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--p-ring)}50%{box-shadow:0 0 0 9px rgba(90,75,176,.08)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============================================================ toolbar */
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--p);color:#fff}
.seg button:not(.on):hover{color:var(--ink)}
.vsep{width:1px;height:22px;background:var(--line2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line2);background:#fff;color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;transition:all .14s;display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--ink);border-color:var(--p-soft2)}
.chip.on{background:var(--p-soft);border-color:var(--p);color:var(--p)}
.chip .mg{width:16px;height:16px;border-radius:5px;font-size:8px;font-weight:800;display:grid;place-items:center}
.tools .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:0 10px;height:34px;width:240px;color:var(--muted)}
.search:focus-within{border-color:var(--p);box-shadow:0 0 0 3px var(--p-ring)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:12.5px;color:var(--ink)}
.search kbd{font:600 10px var(--font);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
.showing{font-size:12px;color:var(--muted);margin:-6px 0 12px;display:flex;align-items:center;gap:8px;min-height:18px}
.showing b{color:var(--ink)}
.showing .lnk{all:unset;cursor:pointer;color:var(--p);font-weight:700;border-bottom:1px solid var(--p-soft2)}

/* ============================================================ lanes */
.board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;align-items:start;transition:grid-template-columns .45s cubic-bezier(.2,.8,.2,1)}
.board.f1{grid-template-columns:1fr 64px 64px}
.board.f2{grid-template-columns:64px 1fr 64px}
.board.f3{grid-template-columns:64px 64px 1fr}
.lane{background:var(--lane);border-radius:var(--r-lane);padding:8px;min-height:240px;display:flex;flex-direction:column;position:relative;min-width:0;transition:background .3s}
.lane.collapsed{padding:8px 0;min-height:420px;align-items:center;cursor:pointer;overflow:hidden}
.lane.collapsed:hover{background:#E4E5F1}
.lane .lh{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px 11px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;box-shadow:var(--sh-1);transition:box-shadow .15s,border-color .15s,background .15s;position:relative}
.lane .lh:hover{border-color:var(--p-soft2);box-shadow:var(--sh-2)}
.lane .lh.on{border-color:var(--p);box-shadow:0 0 0 3px var(--p-ring)}
.lh .row{display:flex;align-items:center;gap:10px}
.lh .n{font-size:11px;font-weight:800;color:#fff;background:var(--slate);border-radius:7px;padding:3px 7px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.lane.l-waiting .lh .n{background:var(--amber)}
.lane.l-done .lh .n{background:var(--green)}
.lh .t{font-size:14px;font-weight:800;flex:1;letter-spacing:-.005em}
.lh .c{font-size:11.5px;font-weight:800;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;transition:transform .2s}
.lh .c.bump{animation:bump .4s ease}
.lh .c.has{color:var(--ink)}
.lh .flag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:4px 9px;align-self:flex-start}
.lh .flag.rose{color:var(--rose);background:var(--rose-soft)}
.lh .flag.me{animation:glow 2.4s ease-in-out infinite}
.lh .flag .ic{font-size:13px}
.lh .hint{font-size:11.5px;color:var(--faint);font-weight:600}
.lh .arrow{position:absolute;right:-21px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--line2);display:grid;place-items:center;color:var(--faint);font-size:12px;z-index:2;box-shadow:var(--sh-1)}
.lane:last-child .lh .arrow{display:none}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(180,83,9,0)}50%{box-shadow:0 0 0 4px rgba(180,83,9,.14)}}
.lane.collapsed .lh{display:none}
.lane .slim{display:none}
.lane.collapsed .slim{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:8px;width:100%}
.lane .slim .n{font-size:11px;font-weight:800;color:#fff;background:var(--slate);border-radius:7px;padding:3px 7px}
.lane.l-waiting .slim .n{background:var(--amber)}
.lane.l-done .slim .n{background:var(--green)}
.lane .slim .vt{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12.5px;font-weight:800;color:var(--ink2);letter-spacing:.01em}
.lane .slim .ct{font-size:11.5px;font-weight:800;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 8px}
.lane .slim .mg{width:22px;height:22px;border-radius:7px;font-size:9px}
.lane .slimmg{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.lane .cards{display:flex;flex-direction:column;gap:10px;padding-top:10px;min-width:0}
.lane.collapsed .cards,.lane.collapsed .empty{display:none}
.lane.wide .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));align-items:start}
.lane.wide .mdiv,.lane.wide .mhead,.lane.wide .mcol{grid-column:1/-1}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.5;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ei{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--faint);font-size:18px}
.empty b{color:var(--ink2)}
.mdiv{display:flex;align-items:center;gap:10px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:6px 6px 0}
.mdiv::after{content:"";flex:1;height:1px;background:var(--line2)}
.mhead{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 8px 4px;color:var(--ink2);width:100%;box-sizing:border-box}
.mhead .ch{font-size:13px;color:var(--faint);transition:transform .2s;display:inline-flex}
.mhead.open .ch{transform:rotate(90deg)}
.mhead .mt{font-size:12.5px;font-weight:800;flex:1;display:flex;align-items:baseline;gap:8px}
.mhead .mt span{font-size:11.5px;font-weight:600;color:var(--muted)}
.mhead .mm{font-size:12px;font-weight:800;color:var(--green)}
.mhead .mgs{display:flex;gap:3px}
.mhead .mgs .mg{width:18px;height:18px;border-radius:5px;font-size:7.5px}
.mcol{height:0;overflow:hidden}

/* ============================================================ card */
.mg{display:grid;place-items:center;font-weight:800;letter-spacing:.02em;flex:none}
.mg.indigo{background:var(--p-soft);color:var(--p)} .mg.teal{background:#D6F1EC;color:#0F766E} .mg.blue{background:#DCE8FD;color:#1D4ED8}
.mg.amber{background:var(--amber-soft);color:var(--amber)} .mg.rose{background:var(--rose-soft);color:#BE123C} .mg.violet{background:#F0E4FF;color:#7E22CE}
.mg.slate{background:var(--slate-soft);color:var(--slate)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--sh-1);position:relative;transition:box-shadow .18s,border-color .18s,transform .18s;min-width:0}
.card:hover{box-shadow:var(--sh-2);border-color:var(--p-soft2);transform:translateY(-2px)}
.card.sel{border-color:var(--p);box-shadow:0 0 0 3px var(--p-ring)}
.card.cur{border-color:var(--p)}
.card.busy{pointer-events:none}
.card.busy::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.7) 50%,rgba(255,255,255,0) 100%);background-size:200% 100%;animation:shimmer 1s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.card.me{border-color:var(--amber-line)}
.card.me::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--amber)}
.card .main{padding:13px 14px 10px;cursor:pointer}
.card .ct{display:flex;gap:11px;align-items:flex-start}
.card .mg{width:34px;height:34px;border-radius:10px;font-size:11.5px;margin-top:1px}
.card .nm{font-size:13.5px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.005em}
.card .pd{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .pd .k{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--rose);background:var(--rose-soft);border-radius:5px;padding:1px 6px}
.card .pd .k.b{color:var(--p);background:var(--p-soft)}
.card .ck{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line2);background:#fff;display:grid;place-items:center;color:#fff;font-size:11px;opacity:0;transition:opacity .14s,background .14s,border-color .14s;z-index:1}
.card:hover .ck,.card.sel .ck,.board.selecting .ck{opacity:1}
.card.sel .ck{background:var(--p);border-color:var(--p)}
.card .money{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:12px}
.card .money .l{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card .money .v{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--ink)}
.card .money .v.cn{color:var(--rose)}
.card .sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:5px}
.card .sub b{color:var(--ink2);font-weight:700}
.note{margin-top:10px;border-radius:9px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.4}
.note .ic{font-size:14px;margin-top:1px;flex:none}
.note .hd{font-weight:800;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;display:block;margin-bottom:1px}
.note .nx{display:block;font-weight:700;margin-top:2px}
.note.amber{background:var(--amber-soft);color:var(--ink)}.note.amber .hd,.note.amber .ic,.note.amber .nx{color:var(--amber)}

  const allDraft = rs.every(r => r.state === 'draft'), net = rs.reduce((s, r) => s + r.net, 0);
  return `<div class="bulk" role="toolbar"><span class="n">${plural(rs.length,'pay run','pay runs')} selected<small class="num">${fmt(net)} net</small></span>
    ${allDraft ? `<button class="btn primary" data-act="bulksubmit-sel">${I('send')} Submit for approval</button>` : ''}
    <button class="btn" data-act="bulkexcel">${I('sheet')} Download Excel</button><button class="btn ghost" data-act="clearsel" style="color:#C9C4EE">Clear</button></div>`;
}
function sheet() {
  if (!S.sheet) return '';
  if (S.sheet.kind === 'submit') {
    const rs = S.sheet.ids.map(id => S.runs.find(r => r.id === id));
    return `<div class="sheet-bg" data-act="closesheet"><div class="sheet" data-stop="1" role="dialog" aria-label="Submit for approval"><h2>Submit ${plural(rs.length,'pay run','pay runs')} for approval?</h2><p>Each one goes to its own sign-off route. You can still reject a run while it waits.</p>
      <div class="lst">${rs.map(r => `<div class="it">${mono(r)}<span>${esc(r.name)}</span><span class="v num">${fmt(r.net)}</span></div>`).join('')}</div>
      <div class="a"><button class="btn" data-act="closesheet">Not now</button><button class="btn primary" data-act="bulksubmit-go">${I('send')} Submit ${rs.length > 1 ? 'all ' + rs.length : ''}</button></div></div></div>`;
  }
  if (S.sheet.kind === 'keys') return `<div class="sheet-bg" data-act="closesheet"><div class="sheet" data-stop="1" role="dialog" aria-label="Keyboard"><h2>Keyboard</h2><p>Move around the board without the mouse.</p>
    <div class="keys"><div>Move between runs<span><kbd>↑</kbd> <kbd>↓</kbd></span></div><div>Move between steps<span><kbd>←</kbd> <kbd>→</kbd></span></div><div>Quick look<span><kbd>Enter</kbd></span></div><div>Select / unselect<span><kbd>Space</kbd></span></div><div>Submit a draft<span><kbd>S</kbd></span></div><div>Find a run<span><kbd>/</kbd></span></div><div>Close / clear<span><kbd>Esc</kbd></span></div><div>This help<span><kbd>?</kbd></span></div></div>
    <div class="a"><button class="btn primary" data-act="closesheet">Got it</button></div></div></div>`;
  return '';
}
function kbd() { return `<div class="kbd-hint"><span><kbd>↑↓←→</kbd> move</span><span><kbd>Enter</kbd> quick look</span><span><kbd>Space</kbd> select</span><span><kbd>S</kbd> submit</span><span><kbd>?</kbd> all keys</span></div>`; }

/* ---------------------------------------------------------------- toasts */
function toast(msg, tone = 'ok') { const t = document.createElement('div'); t.className = 'toast ' + tone; t.innerHTML = `${I(tone === 'ok' ? 'checkc' : 'sparkles')}<span>${msg}</span>`; document.getElementById('toasts').appendChild(t); setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3200); }

/* ---------------------------------------------------------------- actions */
function bumpCount(k) { const el = root.querySelector(`[data-count="${k}"]`); if (el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } }
function submit(ids) {
  ids = ids.filter(id => { const r = S.runs.find(x => x.id === id); return r && r.state === 'draft'; }); if (!ids.length) return;
  S.busy = ids[0]; S.menu = null; render();
  setTimeout(() => {
    ids.forEach(id => { const r = S.runs.find(x => x.id === id); r.state = 'waiting'; r.sentBack = null; r.route = {step:1,title:ROUTE[0],with:['lan'],doneBy:[]}; r.history.push(['Submitted for approval','11 Oct 2026']); S.selected.delete(id); });
    S.busy = null; render(); bumpCount('waiting'); bumpCount('draft');
    toast(ids.length === 1 ? 'Pay run sent in for approval.' : `${ids.length} pay runs sent in for approval.`);
  }, 650);
}
function act(el, ev) {
  const a = el.dataset.act, id = +el.dataset.id, k = el.dataset.k; const r = id ? S.runs.find(x => x.id === id) : null;
  switch (a) {
    case 'newrun': toast('Opens the Run step (the pay run wizard).', 'info'); break;
    case 'hero': S.hero = S.hero === k ? '' : k; S.focus = ''; render(); break;
    case 'div': S.division = k; render(); break;
    case 'period': S.period = k; render(); break;
    case 'view': S.view = k; render(); break;
    case 'focus': S.focus = S.focus === k ? '' : k; S.hero = ''; render(); break;
    case 'showall': S.focus = ''; S.hero = ''; S.division = 'all'; S.period = 'all'; S.q = ''; render(); break;
    case 'month': if (S.openMonths.has(k)) S.openMonths.delete(k); else S.openMonths.add(k); render(); break;
    case 'sel': if (ev.shiftKey && S.lastSel) { const col = colRuns(r.state).map(x => x.id); const a1 = col.indexOf(S.lastSel), b1 = col.indexOf(id); if (a1 > -1 && b1 > -1) col.slice(Math.min(a1,b1), Math.max(a1,b1)+1).forEach(x => S.selected.add(x)); } else if (S.selected.has(id)) S.selected.delete(id); else S.selected.add(id); S.lastSel = id; render(); break;
    case 'clearsel': S.selected.clear(); render(); break;
    case 'peek': S.peek = id; S.menu = null; S.cur = id; render(); break;
    case 'closepeek': S.peek = null; render(); break;
    case 'menu': S.menu = S.menu === id ? null : id; render(); break;
    case 'submit': submit([id]); S.peek = null; break;
    case 'bulksubmit': S.sheet = {kind:'submit', ids: monthRuns().filter(x => x.state === 'draft').map(x => x.id)}; render(); break;
    case 'bulksubmit-sel': S.sheet = {kind:'submit', ids:[...S.selected]}; render(); break;
    case 'bulksubmit-go': { const ids = S.sheet.ids; S.sheet = null; submit(ids); break; }
    case 'bulkexcel': toast(`Preparing one Excel file for ${plural(S.selected.size,'pay run','pay runs')}…`, 'info'); break;
    case 'closesheet': S.sheet = null; render(); break;
    case 'approve': toast('Opens this request in Approvals, where you decide.', 'info'); S.menu = null; break;
    case 'reject': S.confirming = id; S.rejectNote = ''; S.menu = null; S.peek = null; render(); setTimeout(() => { const t = root.querySelector(`[data-why="${id}"]`); t && t.focus(); }, 30); break;
    case 'keep': S.confirming = null; S.rejectNote = ''; render(); break;
    case 'reject-go': { const why = S.rejectNote.trim(); if (!why) return; r.state = 'cancel'; r.rejected = {by:'You', why, on:'11 Oct 2026'}; S.confirming = null; S.rejectNote = ''; S.selected.delete(id); render(); toast('Pay run rejected.'); break; }
    case 'rej': S.showRejected = !S.showRejected; render(); break;
    case 'paydeliver': toast('Opens Pay & Deliver for this run (bank file, payslips, journals).', 'info'); S.menu = null; S.peek = null; render(); break;
    case 'report': toast('Opening the payroll report…', 'info'); S.menu = null; render(); break;
    case 'excel': toast('Downloading the Excel file…', 'info'); S.menu = null; render(); break;
    case 'journals': toast('Opens the journals for this run.', 'info'); S.menu = null; render(); break;
    case 'payments': toast('Opens the payments for this run.', 'info'); S.menu = null; render(); break;
    case 'open': toast('Opens the full pay run record.', 'info'); S.menu = null; S.peek = null; render(); break;
    case 'keysheet': S.sheet = {kind:'keys'}; render(); break;
    case 'sort': S.sort = S.sort.k === k ? {k, d:-S.sort.d} : {k, d: k === 'name' ? 1 : -1}; render(); break;
  }
}
document.addEventListener('click', (ev) => {
  const stop = ev.target.closest('[data-stop]'); const el = ev.target.closest('[data-act]');
  if (!el) { if (S.menu) { S.menu = null; render(); } return; }
  if (stop && !stop.contains(el)) return;
  if (el.dataset.act === 'peek' && ev.target.closest('.card .ck, .foot, .confirm')) return;
  if (el.dataset.act === 'focus' && el.classList.contains('lane') && ev.target.closest('.card')) return;
  ev.stopPropagation(); act(el, ev);
});
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'q') { S.q = ev.target.value; const pos = ev.target.selectionStart; render(); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos); }
  if (ev.target.dataset.why) { S.rejectNote = ev.target.value; const b = root.querySelector('[data-act="reject-go"]'); if (b) b.disabled = !S.rejectNote.trim(); }
});
document.addEventListener('keydown', (ev) => {
  const tag = (ev.target.tagName || '').toLowerCase(); const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
  if (ev.key === 'Escape') { if (typing && ev.target.id === 'q') { S.q = ''; ev.target.blur(); render(); return; } if (ev.target.dataset && ev.target.dataset.why) { S.confirming = null; S.rejectNote=''; render(); return; } if (S.sheet) { S.sheet = null; render(); return; } if (S.peek) { S.peek = null; render(); return; } if (S.menu) { S.menu = null; render(); return; } if (S.selected.size) { S.selected.clear(); render(); return; } if (S.focus || S.hero) { S.focus = ''; S.hero = ''; render(); } return; }
  if (typing) { if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey) && ev.target.dataset.why) { const id = +ev.target.dataset.why; if (S.rejectNote.trim()) act({dataset:{act:'reject-go', id}}, ev); } return; }
  if (ev.key === '/') { ev.preventDefault(); const q = document.getElementById('q'); q && q.focus(); return; }
  if (ev.key === '?') { S.sheet = {kind:'keys'}; render(); return; }
  if (S.view !== 'board' || S.loading) return;
  const cols = COLS.map(c => colRuns(c.k).filter(r => c.k !== 'done' || S.openMonths.has(r.month) || S.q || colRuns('done').every(x=>x.month===r.month)).map(r => r.id));
  let ci = cols.findIndex(c => c.includes(S.cur)), ri = ci > -1 ? cols[ci].indexOf(S.cur) : -1;
  const move = (dc, dr) => { if (ci < 0) { ci = cols.findIndex(c => c.length); ri = 0; } else { if (dc) { let n = ci; do { n = (n + dc + 3) % 3; } while (!cols[n].length && n !== ci); ci = n; ri = Math.min(ri, cols[ci].length - 1); } if (dr) ri = Math.max(0, Math.min(cols[ci].length - 1, ri + dr)); } if (ci < 0 || !cols[ci] || !cols[ci].length) return; S.cur = cols[ci][ri]; render(); const el = root.querySelector(`[data-card="${S.cur}"]`); el && el.scrollIntoView({block:'nearest', behavior:'smooth'}); };
  if (ev.key === 'ArrowDown') { ev.preventDefault(); move(0, 1); } else if (ev.key === 'ArrowUp') { ev.preventDefault(); move(0, -1); }
  else if (ev.key === 'ArrowRight') { ev.preventDefault(); move(1, 0); } else if (ev.key === 'ArrowLeft') { ev.preventDefault(); move(-1, 0); }
  else if (ev.key === 'Enter' && S.cur) { S.peek = S.cur; render(); }
  else if (ev.key === ' ' && S.cur) { ev.preventDefault(); if (S.selected.has(S.cur)) S.selected.delete(S.cur); else S.selected.add(S.cur); render(); }
  else if ((ev.key === 's' || ev.key === 'S') && S.cur) { submit([S.cur]); }
});
