# A standalone, sample-data design preview on payobook.com only.
location = /preview/payroll-templates {
    return 302 /preview/payroll-templates/;
}
location ^~ /preview/payroll-templates/ {
    alias /var/www/payobook-previews/payroll-templates/;
    index index.html;
    types { text/html html; }
    default_type text/html;
    autoindex off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
}
