t{max-width:180px}.journey-heading{display:block}.journey-heading .btn{margin-top:12px}.holistic-grid{display:block;padding:20px 16px}.journey-lane{margin-bottom:25px}.j-wires{display:none}.journey-lane-label{font-size:10px}.j-row{font-size:11px;min-height:40px;padding:9px 12px}.journey-node .node-head h3{font-size:13px}.journey-context{align-items:start;flex-wrap:wrap;padding:12px 16px}.j-legend{gap:10px;padding:0 16px 18px}.j-legend span{font-size:9px}.detail-strip{grid-template-columns:1fr;gap:15px}.trace-cards{flex-direction:column}.priority-lane{flex-wrap:wrap;padding:12px}.priority-lane .lane-switch{margin-left:auto}.impact-item{font-size:11px;flex-wrap:wrap}.r-subbar .sample-switch{max-width:180px}.r-subbar .row{flex-wrap:wrap}.rev-card h3{font-size:17px}.feature-tile{flex-wrap:wrap;padding:15px}.feature-tile .btn{margin-left:0}.scenario-line{flex-wrap:wrap}.notice-inline{font-size:10px}.reading{padding:0}}

<body>
<header class="labbar">
 <a class="brand" href="#review" style="color:inherit;text-decoration:none"><span class="brandmark" aria-hidden="true">↗</span> Payobook <span class="muted" style="font-weight:450">/ Mapping revised</span></a>
 <nav class="labnav" aria-label="Design review"><a href="#review" data-page="review">What changed</a><a href="#workspace" data-page="workspace">Connection desk</a><a href="#transformations" data-page="transformations">Transformations</a><a href="#preserved" data-page="preserved">Feature check</a><a href="#journey" data-page="journey">Journey</a></nav>
 <span class="lablabel">Direction A · Revision 2 · Interactive HTML</span>
</header>
<main id="main"></main><div id="overlay"></div><div id="notification" aria-live="polite"></div>
<script>
'use strict';
(()=>{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>structuredClone(x),main=$('#main'),overlay=$('#overlay');
const B=(label,action,cls='',attrs='')=>`<button type="button" class="btn ${cls}" data-action="${action}" ${attrs}>${label}</button>`;
const tag=(label,cls='')=>`<span class="tag ${cls}">${label}</span>`;
const kindLabels={feed:'System field',rule:'Rule output',excel:'Spreadsheet',employee_field:'Employee record',contract_field:'Contract record',bank_account:'Bank record',contract_component:'Contract component',pay_run:'This pay run'};
const laneOf=k=>['feed','rule'].includes(k)?'api':k==='excel'?'excel':k==='pay_run'?'payrun':'records';
const kindOrder={feed:0,rule:1,excel:0,employee_field:0,contract_field:1,bank_account:2,contract_component:3,pay_run:0};
const S=(kind,key,value,extra={})=>({kind,key,value,verified:true,...extra});
const initial=[
 {id:'code',letter:'A',name:'Employee code',vn:'Mã nhân viên',code:'EMPLOYEE_CODE',kind:'Identifier',group:'Identity',role:'Information only',sources:[S('excel','Salary | Employee code','00017'),S('employee_field','Employee ID','00017')],destination:'Employee · Employee ID'},
 {id:'name',letter:'B',name:'Full name',vn:'Họ và tên',code:'FULL_NAME',kind:'Text',group:'Identity',role:'Information only',sources:[S('excel','Salary | Full name','Example employee'),S('employee_field','Employee name','Example employee')],destination:'Employee · Name'},
 {id:'nationality',letter:'F',name:'Nationality',vn:'Quốc tịch',code:'NATIONALITY',kind:'Text',group:'Contract',role:'Information only',sources:[S('excel','Salary | Nationality','Vietnamese'),S('contract_component','NATIONALITY','Vietnamese')],destination:'Contract text component'},
 {id:'uniform',letter:'P',name:'Uniform allowance',vn:'Đồng phục',code:'UNIFORM_ALLOWANCE',kind:'Money',group:'Allowances',role:'Adds to net pay',sources:[S('feed','uniform_allowance',null),S('excel','Salary | Uniform allowance',0),S('contract_component','UNIFORM_ALLOWANCE',300000)],destination:'Contract amount component'},
 {id:'days',letter:'M',name:'Standard working days',vn:'Ngày công chuẩn',code:'STANDARD_DAYS',kind:'Money',group:'Attendance',role:'Information only',issue:'type',sources:[S('excel','Salary | Standard days',22)],destination:'Scheme only'},
 {id:'overtime',letter:'O',name:'Overtime hours',vn:'Giờ làm thêm',code:'OVERTIME_HOURS',kind:'Hours',group:'Attendance',role:'Information only',sources:[S('excel','Attendance | Overtime hours',8)],destination:'Scheme only'},
 {id:'department',letter:'AT',name:'Department',vn:'Phòng ban',code:'DEPARTMENT',kind:'Text',group:'Employee profile',role:'Information only',suggestion:true,sources:[],suggestedSource:S('excel','Salary | Department','Operations'),destination:'Employee · Department'},
 {id:'start',letter:'G',name:'Contract start date',vn:'Ngày ký hợp đồng',code:'CONTRACT_START',kind:'Date',group:'Contract',role:'Information only',sources:[S('excel','Salary | Contract start',null),S('contract_field','Contract start date','2026-01-01')],destination:'Contract · Start date'},
 {id:'rate',letter:'AY',name:'Allowance rate',vn:'Tỷ lệ phụ cấp',code:'ALLOWANCE_RATE',kind:'Percent',group:'Reference',role:'Information only',sources:[S('excel','Salary | Allowance rate',12)],destination:'Scheme only'},
 {id:'notes',letter:'AZ',name:'Shift note',vn:'Ghi chú ca làm',code:'SHIFT_NOTE',kind:'Text',group:'Reference',role:'Information only',issue:'storage',sources:[S('excel','Salary | Shift note','Night shift')],destination:'Not decided'},
 {id:'period',letter:'BK',name:'Period start',vn:'Bắt đầu kỳ lương',code:'PERIOD_START',kind:'Date',group:'Reference',role:'Information only',sources:[S('pay_run','Period start date','2026-10-01')],destination:'Scheme only'},
 {id:'salary',letter:'Q',name:'Actual salary',vn:'Lương tháng',code:'ACTUAL_SALARY',kind:'Money',group:'Earnings',role:'Adds to net pay',calculated:true,fixedValue:20000000,sources:[],destination:'Calculated in the scheme'}
];
let data=clone(initial),order=['api','excel','records'],enabled={api:true,excel:true,records:true},selected='uniform',view='sources',filter='all',search='',scenario='normal',page='review',viewer=false,journeySelected='',journeyFocus=false,journeyQuery='',showWrites=false,collapsed=new Set(),history=[],lastUndo=null,toastTimer,modal=null,focusReturn=null,wizard=null;
const laneNames={api:'Connected systems',excel:'Spreadsheets',records:'Employee & contract records',payrun:'This pay run'};
const current=()=>data.find(r=>r.id===selected)||data[0];
const isEmpty=x=>x===null||x===undefined||(typeof x==='string'&&!x.trim());
function allSources(r,ord=order,en=enabled){return r.sources.map(s=>({...s,excluded:laneOf(s.kind)!=='payrun'&&!en[laneOf(s.kind)]})).sort((a,b)=>{let lanes=[...ord,'payrun'];return lanes.indexOf(laneOf(a.kind))-lanes.indexOf(laneOf(b.kind))||kindOrder[a.kind]-kindOrder[b.kind]}).map((s,i,a)=>({...s,rank:s.excluded?0:a.slice(0,i+1).filter(x=>!x.excluded).length}));}
function effectiveSources(r,ord=order,en=enabled){let list=allSources(r,ord,en);if(r.id==='uniform')list=list.map(s=>{if(scenario==='file-empty'&&s.kind==='excel')return {...s,value:null};if(scenario==='system-value'&&s.kind==='feed')return {...s,value:250000};if(scenario==='system-false'&&s.kind==='feed')return {...s,value:false};if(scenario==='all-empty')return {...s,value:null};return s});return list.map(s=>s.kind==='feed'&&s.conversion!==undefined&&!isEmpty(s.value)?{...s,value:Number(s.value)*s.conversion}:s);}
function resolve(r,ord=order,en=enabled){if(r.calculated)return{value:r.fixedValue,source:null,calculated:true,list:[]};const list=effectiveSources(r,ord,en),winner=list.find(s=>!s.excluded&&!isEmpty(s.value));return{value:winner?.value,source:winner||null,list};}
function display(value,kind){if(isEmpty(value))return 'No value';if(value===false)return 'False';if(kind==='Money')return Number.isFinite(Number(value))?Number(value).toLocaleString('en-US')+' ₫':'Type mismatch';if(kind==='Days')return value+' days';if(kind==='Hours')return value+' hours';if(kind==='Percent')return value+'%';return String(value);}
const issue=r=>r.suggestion?'suggestion':r.issue||(!r.calculated&&!allSources(r).some(s=>!s.excluded)?'source':resolve(r).source?.error?'rule-error':'');
const reviewCount=()=>data.filter(r=>issue(r)).length;
function stateTag(r){const i=issue(r);return i==='suggestion'?tag('Suggested · 98%','purple'):i==='type'?tag('Check unit','warn'):i==='storage'?tag('Choose storage','warn'):i==='source'?tag('No active source','error'):i==='rule-error'?tag('Rule failed','error'):r.calculated?tag('Calculated'):tag('Ready','ok');}
function sourceChips(r){const list=allSources(r).filter(s=>!s.excluded),result=resolve(r);if(r.calculated)return tag('Calculated');if(!list.length)return tag(r.suggestion?'Suggestion to review':'No active source',r.suggestion?'purple':'error');return `<div class="source-chips">${list.map(s=>`<span class="priority-chip ${result.source?.kind===s.kind?'chosen':''}">${list.length>1?`<span class="rank" aria-label="Priority ${s.rank}">${s.rank}</span>`:''}${kindLabels[s.kind]}</span>`).join('')}</div>`;}
function pills(items,active,action,label){return `<div class="pills" role="group" aria-label="${label}">${items.map(([v,n])=>`<button type="button" class="${v===active?'active':''}" aria-pressed="${v===active}" data-action="${action}:${v}">${n}</button>`).join('')}</div>`;}
function appHeader(active){return `<header class="r-header"><div class="product" style="font-weight:750">payobook<span style="color:var(--purple)">.</span></div><div class="app-title"><span class="key">VN</span>Vietnam payroll <span class="env-chip">Demo scheme</span></div><span class="spacer"></span>${B('Tools','tools','tool-btn')}${B('+ Component','component:new','primary',viewer?'disabled':'')}<nav class="appnav" aria-label="Mapping workspace"><button class="${active==='workspace'?'active':''}" data-action="nav:workspace">Connections</button><button class="${active==='transformations'?'active':''}" data-action="nav:transformations">Transformations</button><button class="${active==='journey'?'active':''}" data-action="whole-journey">Journey</button></nav></header>${viewer?'<div class="access-banner">Viewer mode · Inspect everything. Editing is unavailable until you switch back to Editor in Tools.</div>':''}`;}
const footer=()=>`<footer class="demo-footer"><span>Fictional examples · ${data.length} demo components · One shared configuration</span><span>Prototype only · No payroll connection, jobs, or email</span></footer>`;
function appWrapper(body,active){return `<div class="rev-shell" style="max-width:1600px"><div class="design-bar"><span><strong>Revised direction A</strong> · ${active==='journey'?'The holistic Journey stays as a dedicated view':active==='transformations'?'Existing rule powers, a clearer creation flow':'Priority is visible without drawing every wire'}</span>${B('Reset demo','reset','tiny')}</div><section class="revised-app" aria-label="Revised mapping prototype">${appHeader(active)}${body}${footer()}</section><p class="reference">All examples and changes stay in this page. This design review does not change your live application. <a href="#review">Read the decisions</a> · <a href="explorations.html">Original three concepts</a></p></div>`;}
function rail(){return `<aside class="rail" aria-label="Source and setup tools"><div class="rail-label">Browse sources</div><button class="active" data-action="filter:all">All connections</button><button data-action="source-filter:excel">Spreadsheets</button><button data-action="source-filter:api">Connected systems</button><button data-action="tool:records">Employee & contract</button><div class="rail-break"></div><div class="rail-label">Scheme setup</div><button data-action="priority">Source priority</button><button data-action="tool:treatment">Component treatment</button><button data-action="tool:workforce">Who is paid by what</button><button data-action="tool:cycles">Mid ↔ end cycle</button><button data-action="tool:templates">Templates</button></aside>`;}
function desk(){let rows=data.filter(r=>(filter==='all'||filter==='review'&&issue(r)||filter==='multiple'&&allSources(r).filter(s=>!s.excluded).length>1||filter==='excel'&&r.sources.some(s=>s.kind==='excel')||filter==='api'&&r.sources.some(s=>laneOf(s.kind)==='api'))&&[r.name,r.vn,r.code,...r.sources.map(s=>s.key)].join(' ').toLowerCase().includes(search.toLowerCase()));return appWrapper(`<div class="r-subbar"><div><b>Example employee · 00017</b><p>October 2026 · Simulated values, not a pay run</p></div><div class="row"><span class="small muted">Scheme order</span>${B(order.map(k=>laneNames[k].replace('Employee & contract records','Records')).join(' → '),'priority','tiny')}</div></div><div class="r-work">${rail()}<div class="r-main"><div class="r-title"><div><h2>Connections</h2><p>Every configured source, its order, and the value used by this example.</p></div>${B('Review suggestions','suggestions','',viewer?'disabled':'')}</div><div class="r-tools">${pills([['all','All'],['review','Needs review · '+reviewCount()],['multiple','Multiple sources']],filter,'filter','Filter connections')}<label class="search"><span class="sr">Find a component, field, or code</span><input type="search" id="desk-search" placeholder="Find a component, field, or code…" value="${esc(search)}"></label></div><div class="r-grid"><div class="r-table-scroll"><table class="r-table"><thead><tr><th>Component</th><th>Sources · priority order</th><th>Example uses</th></tr></thead><tbody>${rows.map(r=>{let a=resolve(r);return `<tr class="${selected===r.id?'on':''}"><td><button class="row-link" aria-label="Inspect ${esc(r.name)}" data-action="select:${r.id}"><span class="component-name">${esc(r.name)}</span><span class="secondary">${esc(r.vn)} · ${esc(r.kind)}</span></button></td><td><button class="row-link" aria-label="Inspect source priority for ${esc(r.name)}" data-action="select:${r.id}">${sourceChips(r)}<span class="secondary">${allSources(r).some(s=>s.excluded)?'Some source lanes are off':r.calculated?'No incoming mapping needed':'First available value wins'}</span></button></td><td><button class="row-link" aria-label="Explain the value for ${esc(r.name)}" data-action="select:${r.id}"><b class="num" style="font-size:12px">${esc(display(a.value,r.kind))}</b><span class="secondary">${a.calculated?'Formula':a.source?kindLabels[a.source.kind]:'No value selected'}</span>${issue(r)?`<span style="display:block;margin-top:6px">${stateTag(r)}</span>`:''}</button></td></tr>`}).join('')}</tbody></table>${rows.length?'':`<div class="empty"><h3>No matching components</h3>${B('Clear filters','clear-filter','quiet')}</div>`}</div>${inspector()}</div></div></div>`,'workspace');}
function inspector(){let r=current(),a=resolve(r);return `<aside class="r-inspector" aria-label="Selected component"><div class="r-inspector-head"><div class="row between"><span class="eyebrow">Component ${esc(r.letter)}</span>${stateTag(r)}</div><h3>${esc(r.name)}</h3><span class="mono">${esc(r.code)}</span><div class="sample-big num">${esc(display(a.value,r.kind))}</div><div class="sample-meta">${a.source?'Used '+kindLabels[a.source.kind]+' · priority '+a.source.rank:a.calculated?'Calculated inside the scheme':'No source delivered a value'} · simulated example</div></div>${pills([['sources','Sources'],['storage','Storage'],['payroll','Use in payroll']],view,'detail','Component details')}<div class="r-inspector-body">${view==='sources'?sourceDetails(r,a):view==='storage'?storageDetails(r):treatmentDetails(r)}</div></aside>`;}
function sourceDetails(r,a){return r.calculated?`<div class="note">This component is calculated. Source priority does not replace its formula.</div><div class="detail-block"><span class="label">Illustrative formula</span><code>CONTRACT_SALARY / STANDARD_DAYS * PAID_DAYS</code></div>${B('Trace this component','trace','', '')}`:`<div class="ranked-sources">${a.list.map(s=>`<div class="ranked-source ${a.source?.kind===s.kind?'used':''}"><div class="line1"><b>${s.excluded?'Off':s.rank+'.'} ${kindLabels[s.kind]}</b>${s.excluded?tag('Lane disabled'):a.source?.kind===s.kind?tag(s.error?'Default after error':'Used here',s.error?'error':'ok'):isEmpty(s.value)?tag('No value'):tag('Available')}</div><div class="line2">${esc(s.key)}<br>Example: <strong>${isEmpty(s.value)?'Blank / not delivered':esc(s.value===false?'False':s.value)}</strong>${s.error?'<br><span style="color:var(--red)">Rule failed. The current engine returned its configured default; that value can block fallback.</span>':''}</div></div>`).join('')||`<div class="note warn">No source is connected. ${r.suggestion?'Review the proposed match before accepting it.':'Choose a source or deliberately keep it as reference.'}</div>`}</div>${r.id==='uniform'?`<div class="scenario-line"><label for="sample-scenario">Try fallback</label><select id="sample-scenario" class="small-choice"><option value="normal" ${scenario==='normal'?'selected':''}>File supplies zero</option><option value="file-empty" ${scenario==='file-empty'?'selected':''}>File is blank</option><option value="system-value" ${scenario==='system-value'?'selected':''}>System supplies an amount</option><option value="system-false" ${scenario==='system-false'?'selected':''}>System supplies False</option><option value="all-empty" ${scenario==='all-empty'?'selected':''}>All sources are blank</option></select></div>`:''}<div class="source-legend"><b>1 = first choice, 2 = fallback.</b> Numbers are relative to this component’s enabled sources. The scheme sets their order. Blank / missing falls through; <b>0 and False are values.</b></div><div class="r-action-stack">${B('Manage sources','manage-sources','',viewer?'disabled':'')}${r.sources.some(s=>s.kind==='feed')?B('Quick conversion on system field','quick-transform','',viewer?'disabled':''):''}${B('Trace this component','trace')}${r.id==='overtime'?B('Create a transformation →','new-rule:overtime','',viewer?'disabled':''):''}</div>`;}
function storageDetails(r){return `<div class="detail-block"><span class="label">On import · write</span><b>${esc(r.destination)}</b><p class="sub">${r.destination==='Scheme only'?'No record write configured.':r.destination==='Not decided'?'Decide whether this value belongs on a record.':'A record write follows the scheme’s source-ownership rules. A lower-priority source may only fill an empty box owned by a higher one.'}</p></div><div class="detail-block"><span class="label">During payroll · read</span><b>${r.sources.some(s=>laneOf(s.kind)==='records')?'Record source is configured':'No record fallback configured'}</b><p class="sub">Record reads sit in the ranked source list. Their existence does not mean a record wins every run.</p></div><div class="r-action-stack">${B('Choose an existing record field','destination','',viewer?'disabled':'')}${B('Aa · Make text component','component:text','',viewer?'disabled':'')}${B('# · Make amount component','component:amount','',viewer?'disabled':'')}${r.issue==='storage'?B('Keep as reference only','reference','',viewer?'disabled':''):''}</div><div class="note">Adding contract storage keeps the spreadsheet or system source. It adds a record option to the same component; it does not create a duplicate or automatically change net pay.</div>`;}
function treatmentDetails(r){return `<div class="detail-block"><span class="label">Value type</span><b>${esc(r.kind)}</b><p class="sub">Meaning and formatting of the value.</p></div><div class="detail-block"><span class="label">Pay role</span><b>${esc(r.role)}</b><p class="sub">Group: ${esc(r.group)} · ${r.subtotal?'Included in another total':'Not a subtotal'}</p></div>${r.issue==='type'?'<div class="note warn">Working days currently look like currency. Confirm Days to show “22 days.”</div>':''}<div class="r-action-stack">${B('Edit type & payroll treatment','edit-treatment','',viewer?'disabled':'')}${B('Review stored vs current value','history')}</div><p class="save-note">Saving settings does not recompute existing payslip results. Stored and newly previewed values should be clearly labeled.</p>`;}
function assessment(){return `<div class="rev-shell"><section class="rev-heading"><div><div class="eyebrow">Direction A · Revised after your feedback</div><h1>A calm desk. The full Journey. No lost depth.</h1><p>The recommendation stays: a connection desk for everyday work, a focused explanation when needed, and the existing holistic Journey as its own destination. Priority and transformation creation now have a concrete design.</p></div><a class="btn primary" href="#workspace">Try the revised design →</a></section><div class="revision-banner"><span class="key">02</span><p><b>Two corrections to the first prototype</b>It oversimplified multi-source mappings, and its Journey button led to a simplified concept rather than your full Journey. This revision corrects both. The original concepts remain available for comparison.</p></div><section class="rev-cards"><article class="rev-card"><span class="answer-id">01 · Priority</span><h3>Keep numbered source tags. Explain the winner.</h3><p>Each component shows its configured sources in order: <b>1 Spreadsheet, 2 Contract component</b>, for example. The inspector expands them into a readable fallback list and labels which one supplied the selected sample.</p><p style="margin-top:12px">Numbers are relative to enabled sources on that component, as today. Scheme-level source order controls precedence; this design does not invent independent per-component drag ordering.</p><div class="source-chips" style="margin-top:17px"><span class="priority-chip"><span class="rank">1</span>System field</span><span class="priority-chip chosen"><span class="rank">2</span>Spreadsheet · used here</span><span class="priority-chip"><span class="rank">3</span>Contract component</span></div><p style="margin-top:12px">Try Uniform allowance: the system is blank, the file says <b>0</b>, and the contract says 300,000. The file wins. A zero must not fall through to an older amount.</p><div class="hero-actions">${B('Try source priority','demo-priority','tiny')}</div></article><article class="rev-card"><span class="answer-id">02 · Journey</span><h3>Your holistic Journey stays.</h3><p><b>Journey is the final primary navigation item.</b> It opens the whole scheme: files and systems, transformation rules where present, scheme components, and employee/contract records with relationship lines.</p><p style="margin-top:12px"><b>Trace this component</b> opens a focused explanation beside the desk. That is a separate local detail view. It does not replace the holistic Journey. Opening a component in Journey clearly announces focus and offers Show whole Journey.</p><p style="margin-top:12px">The proposed implementation reuses and improves the existing Journey board, not a second disconnected graph. This HTML is an illustrative recreation for review, not an embedded live screen.</p><div class="hero-actions"><a class="btn tiny" href="#journey">Open holistic Journey →</a></div></article><article class="rev-card"><span class="answer-id">03 · Transformations</span><h3>Improve a good wizard; keep its capabilities.</h3><p>I opened the current creation flow in Chrome and reviewed its code. <b>Take / Keep / Derive / Call it is a good foundation.</b> Recipes, descriptions, nested tables, live row previews, unit conversion, date rules, formula mode, and read-only advanced rules are valuable.</p><p style="margin-top:12px">The issues are the large first recipe gallery, unverified source fields, unclear employee/period scope, and the gap between saving a rule and connecting its output. With no synced data, a default of zero can look like a proven result.</p><p style="margin-top:12px">The revised builder uses <b>Data → Filter → Calculate → Name & connect</b>, a persistent evidence panel, compact recipe categories, and a final preview showing which component receives the rule and which fallbacks remain.</p><div class="hero-actions">${B('Try the revised rule builder','new-rule:overtime','tiny')}</div></article><article class="rev-card"><span class="answer-id">04 · What was missing</span><h3>Preserve the details that make this mature.</h3><p>The first POC did not demonstrate every useful feature. The revised feature check explicitly covers <b>source-lane switches, pay-run fallback, configured vs observed sources, multiple sheets, unknown field catalogs, bank destinations, remaining-column reconciliation, and manual classification.</b></p><p style="margin-top:12px">It also keeps vendor templates, suggestion rejection, conflict reviews, nested tables, all/any filters, duration units, date/formula/Python paths, read-only permissions, change history, and optional expert canvas gestures.</p><div class="hero-actions"><a class="btn tiny" href="#preserved">Review the preservation check →</a></div></article><article class="rev-card full"><span class="answer-id">05 · Final recommendation</span><h3>One configuration, three ways to understand it.</h3><div class="detail-strip"><div><h4>Daily work · Connection desk</h4><p>Quiet list, source priority tags, clear sample provenance, inspector, and bulk review. Text and amount creation are visible under Storage and + Component.</p></div><div><h4>Specialist work · Transformations</h4><p>Keep quick conversions on a system-field mapping. Use the full rule builder when a connected feed needs filtering, nested rows, aggregation, dates, or a formula.</p></div><div><h4>Whole picture · Journey</h4><p>Retain the holistic view and its wires. Focus/hover highlights a relationship without losing the overview; open an editor with the same component and scheme.</p></div><div><h4>Exceptions · Review inside the desk</h4><p>Actionable component-level decisions, not another permanent global warning strip. Intentionally ignored reference columns do not masquerade as broken mappings.</p></div></div><p style="margin-top:17px">This is a navigation and explanation redesign. It must retain the payroll resolver, enabled-lane rules, ownership/writeback behavior, and stored-result semantics. Source priority changes are explicit scheme-wide changes with an impact preview.</p></article></section><div class="long-section"><div class="section-intro"><h2>Try these review paths</h2><p>The examples are fictional. You can test the decisions without touching a payroll database.</p></div><div class="findings"><div class="finding"><span>1</span><div><h4>Does priority feel understandable?</h4><p>Open Uniform allowance, switch the file from zero to blank, then preview a scheme-wide priority change. Watch which source wins and why.</p></div></div><div class="finding"><span>2</span><div><h4>Is Journey still the screen you value?</h4><p>Open Journey from the primary navigation. Select a component to highlight its lines. Use focus, then return to the whole view or to its desk editor.</p></div></div><div class="finding"><span>3</span><div><h4>Can you build a transformation confidently?</h4><p>Create approved overtime hours. Check kept/excluded rows and units, then save and connect while retaining the spreadsheet fallback.</p></div></div><div class="finding"><span>4</span><div><h4>Are the important creation actions visible?</h4><p>Open Shift note → Storage → Make text component. Or create an amount component from + Component. Neither action silently changes the payroll role.</p></div></div></div></div><p class="footer">No production changes in this phase. The design is ready for review, with a capability checklist separating working POC interactions from production behavior to retain. <a href="explorations.html">View the original three alternatives</a>.</p></div>`;}

function preserved(){return `<div class="rev-shell"><div class="rev-heading"><div><div class="eyebrow">No capability left without a home</div><h1>Preserve the depth. Change the presentation.</h1><p>This is the explicit gap check against the current mapping implementation. A static HTML prototype cannot execute the production backend; the last column tells you what is demonstrated and what must be retained from the real product.</p></div><a href="#workspace" class="btn">Back to the desk</a></div><div class="comparison"><table class="rev-table capability-matrix"><thead><tr><th>Current capability</th><th>Where it lives</th><th>What must survive</th><th>This prototype</th></tr></thead><tbody>${capabilities.map(c=>`<tr>${c.map(t=>`<td>${t}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="revision-banner"><p><b>Three implementation rules</b>Reuse the existing resolver and Journey board. Extend the current rule composer rather than create a competing engine. Use a shared component/source identity so priority and provenance agree across the desk, Transformations, and Journey.</p></div><div class="rev-cards"><article class="rev-card"><h3>What remains deliberately unchanged</h3><p>Read precedence, enabled-source filtering, the pay run’s final fallback position, source ownership during record writes, formula calculation, and stored payslip values. A visual redesign cannot redefine these silently.</p></article><article class="rev-card"><h3>What needs testing before production</h3><p>Multiple source kinds, system direct mapping vs rule output order, nested tables, empty/zero/False, failure defaults, period inputs, disabled lanes, source replacement within a kind, record write protection, permissions, templates, and unchanged stored results.</p></article></div></div>`;}
function transformHome(){return appWrapper(`<div class="transform-home"><div class="row between"><div><div class="eyebrow">Connected-feed rules</div><h2 style="margin-top:7px">Transformations</h2><p class="intro">Turn a system’s records into a value a component can read. Simple per-field conversions stay on their mapping; rules handle rows, conditions, aggregation, dates, and formulas.</p></div>${B('New transformation','new-rule:overtime','primary',viewer?'disabled':'')}</div><div class="recipe-grid">${[['overtime','∑','Add up approved hours','Filter overtime rows, convert units, and sum the matching values.'],['count','#','Count matching records','Count approved rows, dependants, or items in a nested table.'],['conversion','↗','Convert a field','Seconds, minutes, durations, or a numeric scaling.'],['date','D','Work with dates','Length of service, date comparisons, and period-based calculations.'],['formula','ƒ','Write a formula','Keep the current formula lane and searchable field insertion.'],['more','≡','Vendor recipes & advanced','Search the full catalog; keep existing rules and admin-only code paths.']].map(([v,k,h,p])=>`<button class="recipe-card" data-action="new-rule:${v}" ${viewer?'disabled':''}><span class="key">${k}</span><h3>${h}</h3><p>${p}</p></button>`).join('')}</div><div class="tf-list"><div class="row between"><h3 style="font-size:16px">Rules in this demo</h3><span class="small muted">${rules.length} saved · ${rules.filter(r=>r.target).length} connected</span></div>${rules.map(r=>`<div class="option-tile"><span class="key">ƒ</span><div><h4>${esc(r.name)}</h4><p>${esc(r.summary)}<br><span class="mono">${esc(r.key)}</span></p><div class="recipe-meta">${r.target?'Feeds '+esc(data.find(x=>x.id===r.target)?.name||'component'):'Saved without a binding'} · ${r.result===null?'Unverified':esc(r.result)+' '+esc(r.unit)} · simulated data</div></div>${B('Inspect','inspect-rule:'+r.id,'tiny')}</div>`).join('')||'<div class="note" style="margin-top:17px">No rules function wizardDefault(recipe){return{recipe,step:1,source:'Demo time system',feed:'Overtime records',recordSource:'records',nested:'Overtime entries',join:'all',conditions:recipe==='count'?[{field:'approval',op:'is',value:'Approved'}]:[{field:'approval',op:'is',value:'Approved'},{field:'band',op:'is',value:'150%'}],operation:recipe==='count'?'count':'sum',field:recipe==='conversion'?'seconds':'hours',unit:recipe==='conversion'?'seconds':'number',outputType:recipe==='count'?'Number':'Hours',mode:recipe==='formula'?'formula':'guided',formula:'[hours]',name:recipe==='count'?'Approved overtime entries':'Approved overtime 150% hours',key:recipe==='count'?'OTCOUNT':'OTHRS150',description:'',defaultValue:'0',target:'overtime',case:'rows',dirty:false,aiDraft:false};}
function fieldValue(row,field,unit){let val=row[field];if(unit==='seconds')return Number(val)/3600;if(unit==='minutes')return Number(val)/60;if(unit==='duration'){const parts=String(val).split(':');return Number(parts[0])+Number(parts[1]||0)/60}return Number(val);}
function rowMatch(row,c){let v=row[c.field];return c.op==='is'?String(v)===c.value:c.op==='is not'?String(v)!==c.value:c.op==='contains'?String(v).toLowerCase().includes(c.value.toLowerCase()):c.op==='present'?!isEmpty(v):c.op==='blank'?isEmpty(v):Number(v)>=Number(c.value);}
function calculate(w=wizard){if(w.case==='no-data')return{error:'No synced data is available. This is an unverified configuration, not a proven zero.',rows:[],kept:0,result:null,unverified:true};if(w.case==='error')return{error:'Simulated rule error. The current engine returns the configured default on failure; do not present that as a successful calculation.',rows:[],kept:0,result:Number(w.defaultValue),usedDefault:true};const rows=sampleRows.map(row=>{let flags=w.conditions.map(c=>rowMatch(row,c)),keep=w.case==='no-match'?false:!flags.length||w.join==='all'&&flags.every(Boolean)||w.join==='any'&&flags.some(Boolean),value=fieldValue(row,w.field,w.unit);if(w.mode==='formula'){let f=w.formula.replace(/\s/g,'');if(f==='[hours]')value=row.hours;else if(f==='[seconds]/3600')value=row.seconds/3600;else if(f==='[hours]*1.5')value=row.hours*1.5;else value=NaN;}return{...row,keep,value,reason:keep?'Matches conditions':w.case==='no-match'?'No matching records':w.conditions.filter(c=>!rowMatch(row,c)).map(c=>c.field==='approval'?'Not approved':'Different overtime band').join(' · ')}});const kept=rows.filter(r=>r.keep),vals=kept.map(r=>r.value);if(w.operation!=='count'&&vals.some(v=>!Number.isFinite(v)))return{error:'The sample calculation is invalid. Check the selected field, unit, or supported demo formula.',rows,kept:kept.length,result:null};const sum=vals.reduce((a,b)=>a+b,0),result=!kept.length?Number(w.defaultValue):w.operation==='count'?kept.length:w.operation==='avg'?sum/kept.length:w.operation==='min'?Math.min(...vals):w.operation==='max'?Math.max(...vals):sum;return{rows,kept:kept.length,result:Math.round(result*10000)/10000,usedDefault:!kept.length};}

function wizardStep(){let w=wizard;return w.step===1?`<h3>Which data should this rule read?</h3><p>Start with the connected system and feed. Keep the employee and period in view, so a total never looks like it covers the whole workforce.</p><div class="form-grid"><div class="field"><label for="wizard-source">System</label><select id="wizard-source"><option>Demo time system</option></select></div><div class="field"><label for="wizard-feed">Feed</label><select id="wizard-feed"><option>Overtime records</option></select></div></div><div class="field"><label for="wizard-record-source">Read from</label><select id="wizard-record-source"><option value="records" ${w.recordSource==='records'?'selected':''}>Each record</option><option value="nested" ${w.recordSource==='nested'?'selected':''}>Rows inside a table in each record</option></select></div>${w.recordSource==='nested'?'<div class="field" style="margin-top:14px"><label for="wizard-nested">Nested table</label><select id="wizard-nested"><option>Overtime entries</option></select><span class="small muted" style="font-weight:400">Demo flattening uses the same four fictional rows. Actual nested paths come from the selected feed.</span></div>':''}<div class="note" style="margin-top:18px"><b>Data confidence is explicit.</b> This prototype uses simulated data. In the live app, show last sync, actual discovered fields, and “unverified field” when a vendor recipe names something the source has never delivered.</div><div class="ai-row"><div class="field"><label for="wizard-ai">Or describe the rule</label><input class="input" id="wizard-ai" placeholder="Add approved 150% overtime hours"></div>${B('Draft example','wizard-ai','tiny')}</div>${w.aiDraft?'<div class="draft-warning">Example recipe draft loaded locally. No AI service was called. Review every step.</div>':''}`:w.step===2?`<h3>Keep the rows you mean.</h3><p>Conditions are readable, with the data showing which rows qualify and why others are excluded.</p>${pills([['all','All conditions'],['any','Any condition']],w.join,'wizard-join','Condition join')}<div style="margin-top:16px">${w.conditions.map((c,i)=>`<div class="condition-row"><select aria-label="Condition ${i+1} field" data-cond="${i}" data-key="field">${[['approval','Approval status'],['band','Overtime band'],['hours','Hours']].map(([v,l])=>`<option value="${v}" ${c.field===v?'selected':''}>${l}</option>`).join('')}</select><select aria-label="Condition ${i+1} operator" data-cond="${i}" data-key="op">${[['is','is'],['is not','is not'],['contains','contains'],['present','is present'],['blank','is blank'],['atleast','is at least']].map(([v,l])=>`<option value="${v}" ${c.op===v?'selected':''}>${l}</option>`).join('')}</select><input class="input" aria-label="Condition ${i+1} value" data-cond="${i}" data-key="value" value="${esc(c.value)}" ${['present','blank'].includes(c.op)?'disabled':''}><button data-action="wizard-drop:${i}" aria-label="Remove condition ${i+1}">×</button></div>`).join('')||'<div class="note">No conditions: keep every row.</div>'}</div>${B('+ Add condition','wizard-condition','quiet tiny')}<p class="save-note">The production operator vocabulary and searchable field picker stay available. The POC uses a short catalog.</p>`:w.step===3?`<h3>Turn those rows into one value.</h3><p>The operation, the incoming unit, and the output meaning are separate. Show the arithmetic rather than only the result.</p>${pills([['guided','Guided calculation'],['formula','Formula']],w.mode,'wizard-mode','Calculation mode')}<div class="form-grid"><div class="field"><label for="wizard-operation">Across matching records</label><select id="wizard-operation">${[['sum','Add up values'],['count','Count records'],['avg','Average'],['min','Minimum'],['max','Maximum']].map(([v,n])=>`<option value="${v}" ${w.operation===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label for="wizard-output-type">Result means</label><select id="wizard-output-type">${['Hours','Days','Number','Money','Percent'].map(v=>`<option ${w.outputType===v?'selected':''}>${v}</option>`).join('')}</select></div></div>${w.operation==='count'?'<div class="calculation-story">Each kept row counts as <b>1</b>. No value field is needed.</div>':w.mode==='formula'?`<div class="field"><label for="wizard-formula">Formula per matching row</label><input class="input mono" id="wizard-formula" value="${esc(w.formula)}"></div><div class="note" style="margin-top:13px">Demo formulas: <code>[hours]</code>, <code>[seconds]/3600</code>, <code>[hours]*1.5</code>. The production formula editor retains its full functions, field insertion, additive fields and run-period inputs.</div>`:`<div class="calculation-story">Take <select id="wizard-field" aria-label="Value field">${[['hours','Hours'],['seconds','Duration in seconds'],['duration','Hours:minutes']].map(([v,l])=>`<option value="${v}" ${w.field===v?'selected':''}>${l}</option>`).join('')}</select><br>This field contains <select id="wizard-unit" aria-label="Incoming unit">${[['number','A number'],['seconds','Seconds'],['minutes','Minutes'],['duration','Hours and minutes, e.g. 2:30'],['days','Days']].map(([v,l])=>`<option value="${v}" ${w.unit===v?'selected':''}>${l}</option>`).join('')}</select><p class="small muted" style="margin-top:9px">${w.unit==='seconds'?'Example: 7,200 seconds ÷ 3,600 = 2 hours.':w.unit==='duration'?'Example: 2:30 = 2.5 hours.':'The example value is used as a number.'}</p></div>`}<div class="wizard-default"><label for="wizard-default">If nothing matches or the rule errors, use</label><input class="input" id="wizard-default" type="number" value="${esc(w.defaultValue)}"><p>The current engine uses the same default for these cases. Keep the failure visible; changing execution policy needs a separate explicit decision.</p></div>`:`<h3>Name it. Then decide where it goes.</h3><p>Saving a reusable rule and connecting its output are distinct decisions, made together when that is what you intend.</p><div class="form-grid"><div class="field"><label for="wizard-name">Rule name</label><input class="input" id="wizard-name" value="${esc(w.name)}"></div><div class="field"><label for="wizard-key">Output key</label><input class="input mono" id="wizard-key" value="${esc(w.key)}"><span class="small muted" style="font-weight:400">Capital letters and digits; no underscore, as today.</span></div><div class="field span2"><label for="wizard-description">Description</label><input class="input" id="wizard-description" value="${esc(w.description)}" placeholder="Why this rule exists"></div><div class="field span2"><label for="wizard-target">Connect the output to</label><select id="wizard-target"><option value="">Save rule only · connect later</option>${data.filter(r=>!r.calculated).map(r=>`<option value="${r.id}" ${w.target===r.id?'selected':''}>${esc(r.name)} · ${esc(r.kind)}</option>`).join('')}</select></div></div>${bindingPreview()}<label class="checkline"><input id="wizard-confirm" type="checkbox"><span>I reviewed the sample, result type, and retained fallback sources.</span></label><div class="note">The production save must validate the rule, permissions, and binding together or clearly recover if binding fails. It must not report “connected” after saving only the rule.</div>`;}
function bindingPreview(){let target=data.find(r=>r.id===wizard.target);if(!target)return `<div class="note">This saves a rule without connecting any component. No source will be replaced.</div>`;const sources=[...target.sources.filter(s=>s.kind!=='rule'),S('rule',wizard.key,calculate().result)];const after={...target,sources};const compatible=target.kind===wizard.outputType||['Number','Hours','Days','Percent'].includes(target.kind)&&target.kind===wizard.outputType;return `<div class="change-preview"><div class="cp-row"><label>Output</label><span>${esc(wizard.key)}</span><span>→</span><b>${esc(target.name)}</b></div><div class="cp-row"><label>Result type</label><span>${esc(wizard.outputType)}</span><span>→</span><b>${esc(target.kind)} ${compatible?'✓':'· mismatch'}</b></div></div><div class="note ${compatible?'':'warn'}" style="margin-top:12px">${compatible?'Existing spreadsheet and record sources stay connected.':'Choose a compatible component or review its type separately. The demo blocks this binding.'} ${target.sources.some(s=>s.kind==='rule')?'This replaces the rule output within the Rule source kind. Other source kinds remain.':''}</div><div style="margin-top:12px"><div class="eyebrow" style="font-size:10px">Priority after connecting</div><div style="margin-top:7px">${sourceChips(after)}</div><p class="save-note">Scheme order determines the rank. A direct system field can precede a transformation within the systems lane.</p></div>`;}
function mobileProof(){let p=calculate();return `<div class="mobile-proof"><span><b>${p.result===null?'Unverified':esc(p.result)+' '+esc(wizard.outputType.toLowerCase())}</b> · ${p.kept} matching rows${p.error?' · Needs review':''}</span>${B('See evidence','wizard-evidence','tiny')}</div>`;}
function renderWizard(){modal={type:'wizard'};const w=wizard,proofHTML=proof();openDialog(w.recipe==='conversion'?'Convert an incoming value':'Create transformation',`<div class="wizard-nav" role="group" aria-label="Transformation steps">${[['Data','Choose the records'],['Filter','Keep the right rows'],['Calculate','Derive one value'],['Name & connect','Preview the binding']].map(([n,p],i)=>`<button class="${w.step===i+1?'active':''}" aria-pressed="${w.step===i+1}" data-action="wizard-step:${i+1}">${i+1} · ${n}<span>${p}</span></button>`).join('')}</div>${mobileProof()}<div class="wizard-layout"><div class="wizard-edit">${wizardStep()}</div>${proofHTML}</div>`,`<small>Unsaved rule · Demo system · Fictional data</small><div class="row">${B(w.step===1?'Cancel':'← Back',w.step===1?'request-close':'wizard-back')}${w.step===4?B(w.target?'Save rule & connect':'Save rule only','wizard-save','primary',viewer?'disabled':''):B('Continue →','wizard-next','primary')}</div>`,true,'Rule builder · keeps the current engine','tf-wizard');}
function advancedRecipes(which){openDialog(which==='date'?'Date rules remain available':'More recipes and advanced rules',`<p class="module-note">The revision does not remove the deeper creation paths. They reuse the current composer and backend. This short POC demonstrates the main numeric rule flow; the options below explain what must remain.</p><div class="advanced-list"><details open><summary>Vendor recipe catalog</summary><p>Keep vendor recipes grouped and searchable: overtime bands, dependants, working hours, leave share and other source-specific cases. Show “Already on this connector” and field-discovery confidence.</p></details><details ${which==='date'?'open':''}><summary>Date difference and date checks</summary><p>Choose an actual date field, compare with the run’s start/end or an explicit date, and select days/months/years or a comparison. Preserve the period source note and existing date semantics.</p></details><details><summary>Nested rows, additive fields, and formula functions</summary><p>Keep table-path discovery, field samples, “plus another field,” all/any operators, duration conversion and formula insertion. Switching modes should retain the unsaved guided draft.</p></details><details><summary>Advanced / Python rules and permissions</summary><p>Keep readable summaries, admin-only code/legacy provenance, error evidence and the supported backend editor. Do not expose executable Python as a casual mapping control.</p></details><details><summary>Plain-language drafts</summary><p>Retain drafting and recipe-based fallback, state which generated the result, and require review. The POC’s “Draft example” loads a local recipe; it does not call an AI service.</p></details></div><div class="actions-row">${B('Try the full sample flow','new-rule:overtime','primary')}</div>`,B('Close','close-modal'),true,'Advanced capabilities · retained, not reimplemented');}
function buildJourney(){const inputs=data.filter(r=>!r.calculated),fed=inputs.filter(r=>allSources(r).some(s=>!s.excluded)).length;return appWrapper(`<div class="journey-full"><div class="journey-heading"><div><div class="eyebrow">Holistic view · existing Journey retained</div><h2 style="margin-top:6px">Vietnam payroll</h2><p>${inputs.length} inputs · ${fed} with a configured source · ${inputs.length-fed} without one · ${data.filter(r=>r.calculated).length} calculated</p></div>${B('Back to connection desk','nav:workspace')}</div><div class="journey-controls"><div class="row wrap">${B('Show whole Journey','journey-all','tiny',!journeyFocus&&!journeySelected?'disabled':'')}${B(journeyFocus?'Show all related rows':'Focus on selected component','journey-focus','tiny',journeySelected?'':'disabled')}<label class="checkline" style="margin:0;font-size:10px"><input type="checkbox" id="journey-writes" ${showWrites?'checked':''}>Show import writes</label></div><label class="search"><span class="sr">Filter the Journey</span><input id="journey-search" type="search" placeholder="Filter the Journey…" value="${esc(journeyQuery)}"></label></div>${journeySelected?`<div class="journey-context"><span><b>${journeyFocus?'Focused view: ':'Highlighted: '}${esc(data.find(r=>r.id===journeySelected)?.name)}</b> · ${journeyFocus?'Only this component and its connected rows are shown.':'Other components remain visible.'}</span><span class="spacer"></span>${B('Open in desk','journey-open:'+journeySelected,'tiny')}${B('Trace','journey-trace:'+journeySelected,'tiny')}</div>`:''}<div class="holistic-grid" id="holistic-stage"><svg class="j-wires" aria-hidden="true"></svg>${journeySources()}<div></div><div class="journey-lane"><div class="journey-lane-label">Scheme · ${data.length} components</div><article class="journey-node"><div class="node-head"><span class="key">VN</span><div style="flex:1"><h3>Vietnam payroll</h3><p>${fed} inputs have a configured source</p><div class="coverage-track"><i style="width:${fed/inputs.length*100}%"></i></div><div class="coverage-readout"><span>${fed} configured</span><span>${inputs.length-fed} not configured</span></div></div></div>${inputs.filter(journeyMatches).map(r=>jrow(r,'scheme',r.id)).join('')}${data.filter(r=>r.calculated).filter(journeyMatches).map(r=>`<div class="j-group">Calculated · no incoming mapping</div>${jrow(r,'scheme',r.id)}`).join('')}</article></div><div></div>${journeyRecords()}</div><div class="j-legend"><span><i></i>File/system/rule → scheme input</span><span><i class="records"></i>Record → scheme read</span>${showWrites?'<span><i class="write"></i>Scheme → record import write (subject to ownership rules)</span>':''}<span>On narrow screens, select a component and use Trace for its ordered route.</span></div></div>`,'journey');}
function journeyMatches(r){return(!journeyFocus||r.id===journeySelected)&&(!journeyQuery||[r.name,r.code,r.vn,...r.sources.map(s=>s.key)].join(' ').toLowerCase().includes(journeyQuery.toLowerCase()));}
function jrow(r,node,key,label,kind){let on=journeySelected===r.id,dim=!!journeySelected&&!on;return `<button class="j-row ${on?'on':''} ${dim?'dim':''} ${issue(r)?'needs':''}" data-action="journey-select:${r.id}" data-anchor="${node}:${key}" aria-label="Highlight ${esc(r.name)} in ${esc(node)}"><span class="j-letter">${esc(r.letter)}</span><span class="j-label">${esc(label||r.name)}</span>${kind?`<span class="j-kind">${esc(kind)}</span>`:''}</button>`;}
function journeySources(){let fileRows=data.filter(r=>r.sources.some(s=>s.kind==='excel')).filter(journeyMatches),systemRows=data.filter(r=>r.sources.some(s=>s.kind==='feed')).filter(journeyMatches),ruleRows=rules.filter(rule=>!journeyFocus||rule.target===journeySelected);return `<div class="journey-lane"><div class="journey-lane-label">Files & systems${rules.length?' · rules':''}</div>${jnode('file','Vietnam_monthly_demo.xlsx',fileRows.length+' configured columns',fileRows.map(r=>jrow(r,'file',r.id,r.sources.find(s=>s.kind==='excel').key.split(' | ').at(-1))).join(''))}${jnode('system','Demo time system',systemRows.length+' direct field mappings',systemRows.map(r=>jrow(r,'system',r.id,r.sources.find(s=>s.kind==='feed').key)).join(''))}${ruleRows.length?jnode('rule','Transformation rules',ruleRows.length+' saved output(s)',ruleRows.map(rule=>`<button class="j-row ${journeySelected===rule.target?'on':''}" data-action="inspect-rule:${rule.id}" data-anchor="rule:${rule.target||'unbound-'+rule.id}"><span class="j-letter">ƒ</span><span class="j-label">${esc(rule.name)}</span><span class="j-kind">${esc(rule.key)}</span></button>`).join('')):''}</div>`;}
function jnode(id,name,sub,body){const closed=collapsed.has(id);return `<article class="journey-node"><div class="node-head"><span class="key">${id==='file'?'X':id==='system'?'S':'ƒ'}</span><button data-action="collapse:${id}" aria-expanded="${!closed}"><h3>${esc(name)}</h3><p>${esc(sub)} · ${closed?'Expand':'Collapse'}</p></button></div>${closed?'':body||'<div class="empty" style="padding:18px;font-size:11px">No matching rows.</div>'}</article>`;}
function journeyRecords(){const groups=[['Employee',['employee_field']],['Contract',['contract_field','bank_account']],['Contract components',['contract_component']],['This pay run · last fallback',['pay_run']]];return `<div class="journey-lane"><div class="journey-lane-label">Employee, contract & pay run</div><article class="journey-node"><div class="node-head"><span class="key">R</span><div><h3>Payobook records</h3><p>Record reads follow configured priority. Import writes are a separate overlay.</p></div></div>${groups.map(([name,kinds])=>{const rs=data.filter(journeyMatches).flatMap(r=>r.sources.filter(s=>kinds.includes(s.kind)).map(s=>({r,s})));return rs.length?`<div class="j-group">${name}</div>${rs.map(({r,s})=>jrow(r,'record',r.id+':'+s.kind,s.key,r.kind)).join('')}`:''}).join('')||'<div class="empty" style="padding:18px;font-size:11px">No matching record rows.</div>'}</article></div>`;}

function drawJourney(){const stage=$('#holistic-stage'),svg=$('.j-wires');if(!stage||!svg)return;let rect=stage.getBoundingClientRect(),paths=[];const path=(from,to,cls)=>{let a=$(`[data-anchor="${from}"]`,stage),b=$(`[data-anchor="${to}"]`,stage);if(!a||!b)return;let ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();const reverse=ar.left>br.left,x1=(reverse?ar.left:ar.right)-rect.left,x2=(reverse?br.right:br.left)-rect.left,y1=ar.top+ar.height/2-rect.top,y2=br.top+br.height/2-rect.top,c=(x1+x2)/2;paths.push(`<path class="${cls}" d="M${x1} ${y1} C${c} ${y1} ${c} ${y2} ${x2} ${y2}" marker-end="url(#journey-arrow)"/>`)};data.filter(journeyMatches).forEach(r=>{let chosen=!journeySelected||journeySelected===r.id,active=journeySelected===r.id?' active':journeySelected?' faint':'';for(let s of allSources(r)){if(s.excluded)continue;const node=s.kind==='excel'?'file':s.kind==='feed'?'system':s.kind==='rule'?'rule':'record';path(node+':'+r.id+(node==='record'?':'+s.kind:''),'scheme:'+r.id,(node==='record'?'record':'')+active);if(showWrites&&node==='record'&&s.kind!=='pay_run')path('scheme:'+r.id,'record:'+r.id+':'+s.kind,'storage'+(chosen?'':' faint'));}});svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);svg.innerHTML=`<defs><marker id="journey-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" style="fill:#a89bc6;stroke:none"/></marker></defs>`+paths.join('');}
function render(){main.innerHTML=page==='workspace'?desk():page==='transformations'?transformHome():page==='journey'?buildJourney():page==='preserved'?preserved():assessment();$$('.labnav a').forEach(a=>{a.classList.toggle('active',a.dataset.page===page);if(a.dataset.page===page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(page==='journey')requestAnimationFrame(drawJourney);}
function go(p,clear=true){if(clear&&p==='journey'){journeySelected='';journeyFocus=false;journeyQuery=''}if(location.hash==='#'+p){page=p;render();window.scrollTo(0,0)}else location.hash=p;}
window.addEventListener('hashchange',()=>{page=['workspace','transformations','journey','preserved'].includes(location.hash.slice(1))?location.hash.slice(1):'review';closeDialog(false);render();window.scrollTo(0,0)});window.addEventListener('resize',()=>{if(page==='journey')requestAnimationFrame(drawJourney)});
function snap(){lastUndo={data:clone(data),order:[...order],enabled:{...enabled},rules:clone(rules),history:clone(history),scenario};}
function apply(fn,msg){if(viewer)return;snap();fn();history.push({text:msg,at:'This demo session'});closeDialog(false);render();toast(msg,true);}
function undo(){if(!lastUndo)return;({data,order,enabled,rules,history,scenario}=lastUndo);lastUndo=null;if(!data.some(r=>r.id===selected))selected='uniform';render();toast('Last demo change undone.');}
function toast(msg,canUndo=false){clearTimeout(toastTimer);$('#notification').innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${canUndo?B('Undo','undo','tiny'):''}<button data-action="dismiss-toast" aria-label="Dismiss notification">×</button></div>`;toastTimer=setTimeout(()=>{$('#notification').innerHTML=''},14000);}
function openDialog(title,body,foot='',wide=false,kicker='Demo editor',cls=''){if(!overlay.innerHTML)focusReturn=document.activeElement;overlay.innerHTML=`<div class="modal-backdrop"><section class="modal ${wide?'wide':''} ${cls}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-head"><div><div class="eyebrow">${kicker}</div><h2 id="dialog-title">${title}</h2><p>Fictional examples · No live payroll writes</p></div><button class="close" data-action="request-close" aria-label="Close dialog">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-footer">${foot}</div>`:''}</section></div>`;document.body.style.overflow='hidden';setTimeout(()=>$('.modal .close')?.focus(),0);}

function requestClose(){if(wizard&&modal?.type==='wizard'&&wizard.dirty){modal={type:'discard-wizard'};openDialog('Keep this unsaved rule?',`<p class="module-note">Your changes have not been saved. Keep editing, or discard this demo draft. Nothing has been connected.</p>`,`${B('Discard draft','discard-wizard')}${B('Keep editing','resume-wizard','primary')}`);return}wizard=null;closeDialog();}
function error(msg){let n=$('.modal-error');if(!n){n=document.createElement('div');n.className='modal-error';n.setAttribute('role','alert');$('.modal-body').prepend(n)}n.textContent=msg;}
function trace(id=selected){selected=id;let r=current(),a=resolve(r);modal={type:'trace'};openDialog('Trace · '+esc(r.name),`<p class="module-note">A focused explanation, separate from the whole Journey. Example employee 00017 · October 2026 · simulated data.</p>${r.calculated?`<div class="note">Calculated in the scheme. No incoming mapping is required.</div>`:`<div class="ranked-sources">${a.list.map(s=>`<div class="ranked-source ${a.source?.kind===s.kind?'used':''}"><div class="line1"><b>${s.excluded?'Off':s.rank+'.'} ${kindLabels[s.kind]}</b>${a.source?.kind===s.kind?tag('Used in this example','ok'):isEmpty(s.value)?tag('Blank / missing'):tag(s.excluded?'Lane off':'Fallback available')}</div><div class="line2">${esc(s.key)} → ${esc(isEmpty(s.value)?'No value':String(s.value))}</div></div>`).join('')}</div>`}<div class="trace-cards"><div class="trace-card"><b>Scheme component</b><p>${esc(r.name)}<br>${esc(display(a.value,r.kind))} · ${esc(r.kind)}</p></div><div class="trace-card"><b>Record storage</b><p>${esc(r.destination)}<br>Import write is subject to source ownership; payroll reads follow priority.</p></div><div class="trace-card"><b>Use in payroll</b><p>${esc(r.role)}<br>Group: ${esc(r.group)}</p></div></div><div class="note">Configured priority and a sample’s winner are different facts. In production, historical provenance must name its actual pay run and selected employee.</div>`,`<small>No need to leave your connection list to understand this route.</small><div class="row">${B('Close','close-modal')}${B('Open this in Journey','open-focused-journey','primary')}</div>`,true,'Focused trace · not the holistic Journey');}

:()=>{$('.wizard-proof')?.scrollIntoView({block:'start',behavior:'smooth'})},'wizard-next':()=>{wizard.step=Math.min(4,wizard.step+1);renderWizard()},'wizard-back':()=>{wizard.step=Math.max(1,wizard.step-1);renderWizard()},'wizard-condition':()=>{wizard.conditions.push({field:'approval',op:'is',value:'Approved'});wizard.dirty=true;renderWizard()},'wizard-ai':()=>{wizard.conditions=[{field:'approval',op:'is',value:'Approved'},{field:'band',op:'is',value:'150%'}];wizard.aiDraft=true;wizard.dirty=true;renderWizard()},'wizard-save':saveWizard,'demo-priority':()=>{selected='uniform';view='sources';go('workspace')},'download-template':()=>{const csv='Employee code,Full name,Uniform allowance,Standard days,Overtime hours,Shift note\n00017,Example employee,0,22,8,Night shift\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='mapping-demo-template.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Fictional CSV template downloaded.')},'payrun-preview':()=>openDialog('Pay-run handoff stays separate',`<div class="timeline"><div><b>Read headings & examples</b><p>Prepare mappings without committing payroll values.</p></div><div><b>Choose file, period and matches</b><p>Open the existing pay data load cockpit, validate employee identity and rows.</p></div><div><b>Explicitly commit / process</b><p>The mapping screen does not secretly create or pay a run.</p></div></div>`,B('Close','close-modal')),'template-preview':()=>openDialog('Preview template application',`<p class="module-note">Demo template: Spreadsheet Department → Department. Other source kinds remain. No current source of this kind is replaced in this example.</p><div class="note">A real template preview shows affected rows, same-kind replacements, conflicts, and unsupported/unverified fields.</div>`,`${B('Cancel','close-modal')}${B('Apply demo template','template-apply','primary',viewer?'disabled':'')}`),'template-apply':()=>{let r=data.find document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el||el.disabled)return;let a=el.dataset.action;if(actions[a])return actions[a]();let [k,...rest]=a.split(':'),v=rest.join(':');if(k==='nav'){closeDialog(false);go(v);return}if(k==='filter'){filter=v;render();return}if(k==='source-filter'){filter=v;render();return}if(k==='select'){selected=v;render();return}if(k==='detail'){view=v;render();return}if(k==='tool'){tool(v);return}if(k==='component'){componentEditor(v);return}if(k==='component-mode'){let fresh=modal.fresh,old={name:$('#component-name').value,code:$('#component-code').value,sample:$('#component-sample').value};componentEditor(fresh?'new-'+v:v);if(fresh){$('#component-name').value=old.name;$('#component-code').value=old.code;$('#component-sample').value=v==='amount'&&!Number.isFinite(Number(old.sample))?'300000':old.sample;}componentPreview();return}if(k==='treatment-row'){selected=v;treatmentEditor();return}if(k==='open-storage'){selected=v;view='storage';closeDialog(false);go('workspace');return}if(k==='journey-select'){journeySelected=journeySelected===v&&!journeyFocus?'':v;render();return}if(k==='journey-open'){selected=v;view='sources';closeDialog(false);go('workspace');return}if(k==='journey-trace'){trace(v);return}if(k==='collapse'){collapsed.has(v)?collapsed.delete(v):collapsed.add(v);render();return}if(k==='lane-up'||k==='lane-down'){let i=modal.draftOrder.indexOf(v),j=i+(k==='lane-up'?-1:1);[modal.draftOrder[i],modal.draftOrder[j]]=[modal.draftOrder[j],modal.draftOrder[i]];renderPriority();return}if(k==='new-rule'){newRule(v);return}if(k==='wizard-step'){wizard.step=Number(v);renderWizard();return}if(k==='wizard-drop'){wizard.conditions.splice(Number(v),1);wizard.dirty=true;renderWizard();return}if(k==='wizard-join'){wizard.join=v;wizard.dirty=true;renderWizard();return}if(k==='wizard-mode'){wizard.mode=v;wizard.dirty=true;renderWizard();return}if(k==='inspect-rule'){let r=rules.find(r=>r.id===v);modal={type:'inspect-rule'};openDialog(esc(r.name),`<div class="detail-block"><span class="label">Rule output</span><b>${esc(r.key)} = ${r.result===null?'Unverified':esc(r.result)+' '+esc(r.unit)}</b><p class="sub">${esc(r.summary)} · simulated data</p></div><div class="note">${r.target?'Connected to '+esc(data.find(x=>x.id===r.target)?.name)+'. Other source kinds remain connected.':'Saved without a binding.'}</div><div class="actions-row">${r.target?B('Inspect component','open-storage:'+r.target,'primary'):''}</div>`,B('Close','close-modal'));return}});
function refreshInput(id,fn){const node=$('#'+id),pos=node?.selectionStart;fn();render();const fresh=$('#'+id);if(fresh){fresh.focus();try{fresh.setSelectionRange(pos,pos)}catch{}}}
document.addEventListener('input',e=>{let id=e.target.id;if(id==='desk-search'){let val=e.target.value;refreshInput(id,()=>search=val);return}if(id==='journey-search'){let val=e.target.value;refreshInput(id,()=>journeyQuery=val);return}if(['component-sample','component-kind'].includes(id))componentPreview();if(id==='treatment-kind')$('#treatment-after').textContent=display(resolve(current()).value,e.target.value);if(wizard&&modal?.type==='wizard'&&(id.startsWith('wizard-')||e.target.dataset.cond!==undefined)){saveWizardField(e.target,false)}});
function saveWizardField(node,repaint){const id=node.id;if(node.dataset.cond!==undefined)wizard.conditions[Number(node.dataset.cond)][node.dataset.key]=node.value;else{const map={'wizard-record-source':'recordSource','wizard-feed':'feed','wizard-source':'source','wizard-nested':'nested','wizard-operation':'operation','wizard-output-type':'outputType','wizard-field':'field','wizard-unit':'unit','wizard-formula':'formula','wizard-default':'defaultValue','wizard-name':'name','wizard-key':'key','wizard-description':'description','wizard-target':'target','wizard-case':'case'};let prop=map[id];if(!prop)return;wizard[prop]=node.value;if(prop==='field'){wizard.unit=node.value==='seconds'?'seconds':node.value==='duration'?'duration':'number'}}wizard.dirty=true;if(repaint)renderWizard();else{const rail=$('.wizard-proof');if(rail)rail.outerHTML=proof();const mobile=$('.mobile-proof');if(mobile)mobile.outerHTML=mobileProof();}}
