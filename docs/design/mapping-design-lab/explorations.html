function intro(code,title,description){return `<div class="direction-intro"><div><div class="eyebrow">Direction ${code.toUpperCase()} ${code==='a'?'· Recommended foundation':''}</div><h1>${title}</h1><p>${description}</p></div>${btn(preferred===code?'✓ Marked as preferred':'Mark as preferred','prefer:'+code,'preference '+(preferred===code?'primary':''),'aria-pressed="'+(preferred===code)+'"')}</div>`}
function trybar(text){return `<div class="trybar"><strong>Try the prototype</strong><span>${text}</span><span class="spacer"></span><button type="button" data-action="reset">Reset demo</button></div>`}
function selectionNote(){return preferred?`<div class="selection-note"><span class="key">${preferred.toUpperCase()}</span><span><b>Your preferred direction is ${preferred.toUpperCase()}.</b> This is saved only in this browser. Tell me your choice in chat to approve implementation.</span><button class="btn quiet tiny" data-action="clear-preference">Clear</button></div>`:''}
function overview(){return `<div class="shell"><section class="hero"><div><div class="eyebrow">Mapping design exploration</div><h1>Keep the power.<br>Give it room to breathe.</h1><p class="lead">The richness is valuable. The chaos comes from showing every relationship, every tool, and every exception at the same time. These three directions change how that power is revealed.</p><div class="hero-actions"><a class="btn primary" href="#a">Explore A · Recommended</a><a class="btn" href="#comparison">Compare all three</a></div><p class="small muted" style="margin-top:18px">Clickable HTML prototypes with fictional examples. Nothing connects to live payroll.</p></div><div class="principle"><div class="eyebrow">The core idea</div><h3 style="margin-top:9px">One value. A clear story.</h3><div class="route-demo"><div class="route-step"><span class="muted">Arrives from</span><b>A file or system</b></div><span style="color:var(--purple)">→</span><div class="route-step"><span class="muted">Means</span><b>Text, money, days…</b></div><span style="color:var(--purple)">→</span><div class="route-step"><span class="muted">Used by</span><b>Records & payroll</b></div></div><ul><li><span class="tick">✓</span> Show the important decision, then its details.</li><li><span class="tick">✓</span> Keep text and amount component creation easy to find.</li><li><span class="tick">✓</span> Use the whole Journey for context; focus to make changes.</li></ul></div></section>
<section><div class="section-intro"><h2>Three real alternatives</h2><p>Each prototype lets you inspect a mapping, create a text or amount component, fix an issue, and reach advanced tools.</p></div><div class="concepts">
<article class="concept recommended"><div class="mini mini-a" aria-hidden="true"><div class="mini-bar"></div>${Array.from({length:5},()=>'<div class="mini-row"><i></i><span>→</span><i></i></div>').join('')}</div><div class="concept-body"><span class="tag purple">A · Recommended</span><h3>Connection desk</h3><p>A calm, paired list of connections. Scan many mappings quickly, then open one clear story on the right. No web of crossing lines.</p><dl><dt>Best for</dt><dd>Daily setup and maintaining many fields.</dd><dt>Tradeoff</dt><dd>Less visual drama; stronger at precise work.</dd></dl><a href="#a" class="btn primary">Try Connection desk →</a></div></article>
<article class="concept"><div class="mini mini-b" aria-hidden="true"><div class="mini-bar"></div><div class="mini-nodes"><div class="mini-node"><i></i><i></i></div><span>→</span><div class="mini-node center"><i></i><i></i><i></i></div><span>→</span><div class="mini-node"><i></i><i></i></div></div></div><div class="concept-body"><span class="tag">B · Most visual</span><h3>Focused journey</h3><p>Journey becomes a place to work. Choose one component and see only its route, with the whole scheme one click away.</p><dl><dt>Best for</dt><dd>Understanding, explaining, and tracing a value.</dd><dt>Tradeoff</dt><dd>Slower when checking dozens of similar mappings.</dd></dl><a href="#b" class="btn">Try Focused journey →</a></div></article>
<article class="concept"><div class="mini mini-c" aria-hidden="true"><div class="mini-bar"></div><div class="mini-work"><div class="mini-list"><i></i><i></i><i></i></div><div class="mini-choice"><i style="width:70%"></i><i></i><i style="width:80%"></i><b></b></div></div></div><div class="concept-body"><span class="tag">C · Most guided</span><h3>Guided review</h3><p>Replace “configure everything” with a short list of decisions. Explain each issue, offer choices, and preview the result.</p><dl><dt>Best for</dt><dd>First setup and resolving unfamiliar exceptions.</dd><dt>Tradeoff</dt><dd>Experts need a fast route to the full connection list.</dd></dl><a href="#c" class="btn">Try Guided review →</a></div></article></div></section>
${findings()}${compare()}${selectionNote()}<footer class="footer">Design proposals based on your four screenshots and the existing mapping implementation. Mock values and counts are illustrative, not a fresh audit of your configuration. No screenshots or employee data are embedded.</footer></div>`}
const findingList=[
 ['The map asks you to trace too many lines','Two long lists, crossing wires, and separate scrolling make one connection difficult to follow. Pair connected items in A, or show only the selected route in B. Keep the full map as an intentional overview.'],
 ['Eight tabs mix different jobs','Connecting a file, deciding who is paid, and defining a value type are different tasks. Give daily connections a home; group the other tools under plain task names. All existing tools remain reachable.'],
 ['A destination can be misunderstood','“Employee & contract ⇆” compresses two jobs into one symbol. Say “On import: store in Contract” and “During payroll: read back when applicable.” Never imply that import and payroll always use the same direction.'],
 ['Great creation tools are hidden','Make text component and Make amount component are valuable, but a three-dot menu hides them. Offer them beside the component’s storage choice and in a central creation flow. Preserve the quick menu for experts.'],
 ['Type, storage, and payroll role get confused','A text component is not an earning. An amount stored on a contract is not automatically added to net pay. Ask separately what the value is, where it is stored, and how payroll uses it.'],
 ['A global error is hard to repair','“15 mappings…” is a symptom, not a next step. Put an issue on the affected row, explain the mismatch, and open its repair. The count should lead to an actionable list. Do not treat the count in these demos as your live error count.'],
 ['Suggestions need evidence','A percentage alone does not explain a match. Show heading, type, example, and conflicts. Keep bulk acceptance, but preview eligible rows and exclusions before saving. Confidence is supporting evidence, not a guarantee.'],
 ['Too much screen height is spent on controls','Repeated From/To headers, searches, filter rows, and file actions push the work down. Use one context header and one search. Show file maintenance and specialist actions when their source is selected.'],
 ['Successful mappings look as loud as problems','Tinting every mapped card gives routine success too much attention. Keep healthy connections quiet. Use color plus readable labels for an active selection, an unresolved decision, or an error.'],
 ['Off-screen wires create uncertainty','“Wires below” reports hidden geometry, not where a value goes. A connection row can name the destination even when it is off-screen. A focused Journey can show both ends together.'],
 ['Changing a source has hidden consequences','Replacing a source, detaching storage, or changing value type needs a before/after preview. Explain fallback and payroll impact. Keep existing stored results unchanged until an explicit recompute.'],
 ['The experience needs a calmer small-screen mode','A two-list canvas and floating assistant can obscure the work. Stack a single route on narrow screens; use a sheet for details. Put assistance in the header rather than over mapping controls.']
];
function findings(){return `<section class="long-section" id="gaps"><div class="section-intro"><h2>What needs to change</h2><p>The goal is to reduce simultaneous decisions while keeping the same depth. This is a change to the working model, not just more whitespace.</p></div><div class="findings">${findingList.map(([h,p],i)=>`<article class="finding"><span>${String(i+1).padStart(2,'0')}</span><div><h4>${h}</h4><p>${p}</p></div></article>`).join('')}</div></section>`}
function compare(){return `<section class="long-section" id="comparison-content"><div class="section-intro"><h2>Compare the directions</h2><p>These are design judgments, not measured usability scores. There is no need to build three separate mapping engines.</p></div><div class="comparison"><table><thead><tr><th>Decision</th><th>A · Connection desk</th><th>B · Focused journey</th><th>C · Guided review</th></tr></thead><tbody><tr><td>Default view</td><td class="compare-recommend">A searchable list of complete connections</td><td>One component’s route, with an overview toggle</td><td>A queue of questions that need an answer</td></tr><tr><td>What makes it calmer</td><td class="compare-recommend">Pairs replace crossing wires; one inspector</td><td>One route at a time; grouped overview</td><td>One decision at a time; evidence beside it</td></tr><tr><td>Working with many fields</td><td class="compare-recommend">Strongest: scan, filter, review in batches</td><td>Needs a list companion for bulk work</td><td>Good for issues; full list needed for routine work</td></tr><tr><td>Learning the system</td><td class="compare-recommend">Plain-language details teach while you work</td><td>Strongest visual explanation of value flow</td><td>Strongest step-by-step introduction</td></tr><tr><td>Text / amount creation</td><td class="compare-recommend">Visible in storage inspector and + Component</td><td>Visible at the record end of the route</td><td>Explained choices in the guided decision</td></tr><tr><td>Main risk</td><td class="compare-recommend">A table can feel technical if labels get terse</td><td>Too many nodes could recreate today’s clutter</td><td>Too many steps could frustrate frequent users</td></tr><tr><td>Build effort, relative</td><td class="compare-recommend">Medium: new presentation over existing actions</td><td>Medium–high: responsive graph and focus behavior</td><td>High: reliable issue rules, ordering, recovery</td></tr></tbody></table></div>
<div class="recommendation"><div><div class="eyebrow">My recommendation</div><h2>Choose A as the foundation.<br>Bring Journey into the detail.</h2><p>Your users need to maintain many connections as well as understand them. A gives them an efficient daily workspace. Its inspector should borrow B’s clear route story. C’s guidance belongs inside “Needs review,” where it helps without turning routine work into a wizard.</p><p>If your top priority is a visual product identity and teaching the system, B is a credible alternative. I would still give B a connection-list switch for bulk work.</p><div class="hero-actions"><a class="btn" href="#a">Try the recommendation</a><a class="btn" href="#b">Compare with Journey</a></div></div><ol><li><strong>One shared connection model</strong>All views read the same component, sources, record destination, transformations, and treatment. Changing a view cannot change payroll behavior.</li><li><strong>A clear route on demand</strong>Source → transform → component, then a separate explanation of record storage and payroll reads. Calculated components say why no incoming mapping exists.</li><li><strong>Visible, reversible editing</strong>Offer text and amount component creation in context. Preview changes, identify conflicts, and keep an undo path or explicit change history.</li><li><strong>A review queue that earns its place</strong>Prioritize unresolved sources, incompatible types, and invalid destinations. Healthy components should not need repeated confirmation.</li></ol></div>
<div class="long-section"><div class="section-intro"><h2>Nothing valuable disappears</h2><p>Proposed homes for the existing capabilities. The prototype exercises key interactions; it is not a replacement payroll implementation.</p></div><div class="comparison"><table><thead><tr><th>Existing capability</th><th>Proposed home in A</th><th>What to preserve</th></tr></thead><tbody>${[
['System fields → Scheme','Files & systems → select a connector','Endpoint selection, discovered fields, samples, source replacement and conflict handling.'],
['Spreadsheet columns → Scheme','Files & systems → select a file','Read headings and examples, replace/forget file, download template, load a pay run as a separate explicit action.'],
['Mapping suggestions','Connections → Review suggestions','Reasons, confidence, accept/reject, high-confidence batch acceptance and templates.'],
['Employee & contract ⇆','Storage tab + Employee & contract tool','Employee field mapping, contract fields, contract amount/text components, detach/change destination, import-write and payroll-read explanations.'],
['Transformations','Route tab + Transformations tool','Source inputs, multi-input rules, sample preview, output bindings. Advanced code stays in the supported rule editor.'],
['Component treatment','Use in payroll tab + bulk treatment tool','Value type, grouping, pay role, subtotal and signals. Manual choices remain authoritative.'],
['Who is paid by what','Scheme setup → Who is paid by what','Workforce assignment rules and the scheme context. It must not be mixed into a field-mapping save.'],
['Mid ↔ End cycle','Scheme setup → Mid ↔ end cycle','Carry-over component links and their direction. No accidental pay-run creation.'],
['Journey','Header → Journey overview / focused route','Whole-source context, drill-down and back navigation. A filtered route must announce its scope.'],
['Expert workflows','Search, batch review, templates, contextual shortcuts','Keep fast paths; add keyboard access, visible focus, cancel, recoverable errors, and permission-aware read-only states.']
].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
<div class="long-section"><div class="section-intro"><h2>What the next implementation should prove</h2></div><div class="findings"><article class="finding"><span>01</span><div><h4>Do common work without drawing a wire</h4><p>Map a file field, create text and amount storage, replace a source with a conflict, and undo a change using labeled controls. Keep canvas gestures as optional expert shortcuts.</p></div></article><article class="finding"><span>02</span><div><h4>Make every value explainable</h4><p>Preserve identifier zeros and text; label units. Show an actual sample and where it came from. Unknown or missing values must not silently become a meaningful zero.</p></div></article><article class="finding"><span>03</span><div><h4>Preserve the mature behavior</h4><p>Test source precedence, record fallback, formula outputs, multiple transformations, bulk templates, read-only permissions, and historical stored results against the same backend.</p></div></article><article class="finding"><span>04</span><div><h4>Check clarity with users</h4><p>Ask a new user to explain a value’s route and an experienced user to fix several mappings. Compare time, mistakes, and confidence before choosing details such as default view and density.</p></div></article></div></div>
<div class="note" style="margin-top:28px"><b>Prototype boundary:</b> These demos use nine fictional components, a short destination catalog, and local changes. File ingestion, backend permissions, real payroll calculations, source-resolution precedence, and saving to a pay run are not implemented here. Secondary tools show proposed interaction patterns using local demo state.</div></section>`}
function filtered(){return data.filter(r=>(filter==='all'||filter==='review'&&needs(r)||filter==='mapped'&&['mapped','calculated'].includes(r.status))&&(!query||[r.name,r.vn,r.code,r.field,r.destination,r.kind].join(' ').toLowerCase().includes(query.toLowerCase())))}
function desk(){const r=current(), rows=filtered();return `<div class="prototype">${intro('a','Connection desk','Pair the two ends. Use the inspector to understand and change one value without leaving the list.')}${trybar('Select Nationality → Storage → Make text component. Then review the working-days issue.')}<section class="app" aria-label="Connection desk prototype">${header('mapping')}<div class="app-content">${rail()}<div class="work"><div class="work-head"><div class="row between"><div><h2>Connections</h2><p>Where values come from, where they are kept, and how payroll reads them.</p></div>${btn('Review suggestions','suggestions')}</div><div class="summaryline"><span><strong>${data.length}</strong> components in this demo</span><span class="pipe"></span><span><strong>${data.filter(r=>r.source!=='None'&&r.source!=='Calculated'&&r.status!=='suggested').length}</strong> connected inputs</span><span class="pipe"></span><button class="btn quiet tiny" data-action="filter:review" style="padding:0;min-height:0;color:var(--amber)">${reviewCount()} need review →</button></div></div><div class="table-tools">${tabs([['all','All'],['review','Needs review · '+reviewCount()],['mapped','Ready']],filter,'filter')}${search()}</div><div class="desk-main"><div class="route-list"><table class="routes"><thead><tr><th>Component</th><th>Source → record storage</th><th>State</th></tr></thead><tbody>${rows.map(x=>`<tr class="${selected===x.id?'selected':''}"><td><button class="route-link" data-action="select:${x.id}" aria-label="Inspect ${esc(x.name)}"><strong>${esc(x.name)}</strong><span class="sub">${esc(x.vn)} · ${esc(x.kind)}</span></button></td><td><button class="route-link" data-action="select:${x.id}" aria-label="View route for ${esc(x.name)}"><span class="route-target">${esc(x.source)} <span class="arrow">→</span></span><span class="sub">${esc(x.destination)}</span></button></td><td><button class="status-button" data-action="select:${x.id}" aria-label="${esc(x.name)}: ${esc((statuses[x.status]||[])[0])}">${tag(x)}</button></td></tr>`).join('')}</tbody></table>${!rows.length?`<div class="empty"><h3>No matching connections</h3><p>Try another name, source, or type.</p>${btn('Clear filters','clear-search','quiet')}</div>`:''}</div>${inspector(r)}</div></div></div>${appFooter()}</section>${conceptNotes('a')}${selectionNote()}</div>`}
function inspector(r){return `<aside class="inspector" aria-label="Selected component"><div class="inspector-head"><div class="row between"><span class="eyebrow">Component ${esc(r.letter)}</span>${tag(r)}</div><h3>${esc(r.name)}</h3><span class="mono">${esc(r.code)}</span><div class="sample num">${esc(format(r))}</div><span class="small muted">Example value · ${esc(r.kind)}</span></div>${tabs([['route','Route'],['storage','Storage'],['payroll','Use in payroll']],detailTab,'detail')}<div class="inspector-body">${detailTab==='route'?routeDetail(r):detailTab==='storage'?storageDetail(r):payrollDetail(r)}</div></aside>`}
function routeDetail(r){return `<div class="timeline"><div><b>${r.source==='Calculated'?'Calculated in this scheme':r.source==='None'?'No source connected':esc(r.source)}</b><p>${esc(r.field)}</p></div>${r.transform?`<div><b>${esc(r.transform.label)}</b><p>Example ${esc(r.sample)} → ${esc(transformed(r.sample,r.transform))}</p></div>`:''}<div><b>${esc(r.name)}</b><p>Read as ${esc(r.kind.toLowerCase())}</p></div></div>${needs(r)?`<div class="warning">${issueCopy(r)}</div>`:''}<div class="action-stack">${r.source==='Calculated'?btn('View calculation','formula'):btn(r.source==='None'?'Choose a source':'Change source','source')}${r.source!=='Calculated'&&r.source!=='None'?btn(r.transform?'Edit transformation':'Add transformation','transform'):''}${btn('See focused Journey →','focus-journey','quiet')}</div>`}
function storageDetail(r){return `<div class="detail-block"><span class="label">On import</span><b>${r.store==='None'?'No employee or contract storage':esc(r.destination)}</b><p class="sub">${r.store==='None'?'The scheme can still use its incoming value.':r.source==='Contract'?'This component already lives on the contract.':'Write the imported value to this destination.'}</p></div><div class="detail-block"><span class="label">During payroll</span><b>${r.store==='None'?'Use the configured source':'Read back when applicable'}</b><p class="sub">${r.store==='None'?'No record fallback has been configured.':'Use the stored record value under the scheme’s source-resolution rules. A file or system may take precedence.'}</p></div><div class="action-stack">${btn('Choose an existing field','destination')}${btn('Make text component','make:text')}${btn('Make amount component','make:amount')}${r.store!=='None'?btn('Detach record storage…','detach','quiet'):''}</div><p class="small muted" style="margin-top:12px;font-size:11px">Text keeps words and identifiers. Amount stores a number that formulas can read. Neither choice automatically changes net pay.</p>`}
function payrollDetail(r){return `<div class="detail-block"><span class="label">Value type</span><b>${esc(r.kind)}</b><p class="sub">${r.kind==='Identifier'?'Leading zeros are preserved.':r.kind==='Money'?'Display with the scheme currency.':'Display the value with its own meaning.'}</p></div><div class="detail-block"><span class="label">Pay role</span><b>${esc(r.role)}</b><p class="sub">Group: ${esc(r.group)} · ${r.rollup?'Already in another total':'Not marked as a subtotal'}</p></div>${r.status==='type'?`<div class="warning">“22 ₫” looks like money. Working days should be displayed as “22 days.”</div>`:''}<div class="action-stack">${btn('Edit type & payroll treatment','edit-treatment')}${btn('Inspect all component treatment','module:treatment','quiet')}</div><p class="small muted" style="margin-top:12px;font-size:11px">Saving configuration does not rewrite stored payslip results. Recompute is a separate action.</p>`}
function issueCopy(r){return r.status==='storage'?'No record destination is set. Choose a field, create contract storage, or keep this as a scheme input only.':r.status==='type'?'The sample is formatted as money. Confirm whether this value should be days.':r.status==='unmapped'?'No source is connected. Choose a file column, system field, or supported record source.':r.status==='suggested'?'A suggested match needs review. Check the heading, type, and example before accepting.':''}
function journey(){const r=current();return `<div class="prototype">${intro('b','Focused journey','Work inside a single value’s journey. Keep the holistic overview, without showing every wire while you edit.')}${trybar('Switch components, inspect the source, and create text or amount storage at the record end.')}<section class="app" aria-label="Focused journey prototype">${header('mapping')}<div class="journey-toolbar"><div><span class="view-label">${journeyView==='focus'?'One component in focus':'The whole scheme'}</span><span class="small muted" style="margin-left:10px">${journeyView==='focus'?'Only connected steps are shown':'Grouped connections, no individual wires'}</span></div><span class="spacer"></span>${tabs([['focus','Focused route'],['overview','Whole journey']],journeyView,'journey-view')}${btn('Needs review · '+reviewCount(),'module:review','tiny')}</div><div class="journey-main"><div class="component-strip" role="group" aria-label="Choose a component">${data.map(x=>`<button class="${selected===x.id?'active':''}" aria-pressed="${selected===x.id}" data-action="journey-select:${x.id}">${needs(x)?'<i class="tiny-dot" aria-hidden="true"></i>':''}${esc(x.name)}</button>`).join('')}</div>${journeyView==='focus'?focusedJourney(r):wholeJourney()}</div>${appFooter()}</section>${conceptNotes('b')}${selectionNote()}</div>`}
function focusedJourney(r){const calculated=r.source==='Calculated',none=r.source==='None';return `<div class="focus-stage"><article class="path-card"><div class="path-top">${calculated?'Calculation':none?'Source needed':'Arrives from'} <span aria-hidden="true">01</span></div><div class="path-body"><span class="tag ${none?'error':''}">${esc(r.source)}</span><h3 style="margin-top:12px">${esc(r.field)}</h3><p>${calculated?'Produced by the scheme; no incoming mapping is needed.':none?'No source has been chosen yet.':r.source==='Spreadsheet'?esc(importName):'Saved values on the employee’s contract.'}</p>${r.transform?`<div class="note" style="margin-top:13px;padding:8px">${esc(r.transform.label)} · ${esc(r.sample)} → ${esc(transformed(r.sample,r.transform))}</div>`:''}</div><div class="path-action"><span>${calculated?'Formula output':'Example: '+esc(r.sample)}</span>${btn(calculated?'View formula':none?'Connect':'Change',calculated?'formula':'source','tiny')}</div></article><div class="path-arrow" aria-hidden="true">→</div><article class="path-card focus"><div class="path-top">Scheme component <span>${esc(r.letter)}</span></div><div class="path-body"><h3>${esc(r.name)}</h3><div class="mono" style="margin-top:5px">${esc(r.code)}</div><div class="path-value num">${esc(format(r))}</div><p>${esc(r.kind)} · ${esc(r.role)}</p></div><div class="path-action">${tag(r)}${btn('Edit treatment','edit-treatment','tiny')}</div></article><div class="path-arrow" aria-hidden="true">${calculated?'·':'→'}</div><article class="path-card"><div class="path-top">Record storage <span aria-hidden="true">03</span></div><div class="path-body"><span class="tag ${r.store==='None'?'':'ok'}">${r.store==='None'?'Optional':esc(r.store)}</span><h3 style="margin-top:12px">${esc(r.destination)}</h3><p>${r.store==='None'?'Keep it in the scheme, map to an existing field, or create a contract component.':'On import: store here. During payroll: read back when applicable under the source rules.'}</p></div><div class="path-action"><span>${r.store==='None'?'No record write configured':'Import write / payroll read'}</span>${btn('Configure','destination','tiny')}</div></article></div><p class="focus-message">${r.source==='Calculated'?'Calculated component: this is an explanation of a formula, not an imported connection.':r.store==='None'?'The source feeds the scheme. Record storage is a separate choice.':'The route above describes import. Payroll may read the stored record value; it is not a second simultaneous data flow.'}</p><div class="focus-editor"><div class="section"><h4>Shape the value</h4><p>${r.source==='Calculated'?'See the formula that produces the result.':'Transform an incoming value before the component reads it. Preview an example first.'}</p>${btn(r.source==='Calculated'?'View calculation':r.transform?'Edit transformation':'Add transformation',r.source==='Calculated'?'formula':'transform','tiny')}</div><div class="section"><h4>Make it a contract component</h4><p>Keep words as text, or store an amount that payroll formulas can read.</p><div class="row wrap">${btn('Aa · Text','make:text','tiny')}${btn('# · Amount','make:amount','tiny')}</div></div><div class="section"><h4>${needs(r)?'A decision needs you':'How payroll uses it'}</h4><p>${needs(r)?issueCopy(r):esc(r.role)+'. Grouped under '+esc(r.group)+'.'}</p>${btn(needs(r)?'Review this component':'Inspect treatment',needs(r)?'review-this':'edit-treatment','tiny')}</div></div>`}
function wholeJourney(){const sourceGroups=[['Spreadsheet',data.filter(r=>r.source==='Spreadsheet')],['Contract',data.filter(r=>r.source==='Contract')],['Calculated',data.filter(r=>r.source==='Calculated')]];return `<div class="overview-journey"><article class="overview-card"><div class="eyebrow">Sources</div><h3 style="margin-top:9px">Files & systems</h3><p class="ov-sub">Grouped by origin</p>${sourceGroups.map(([name,rows])=>`<button class="overview-row" data-action="overview-source:${name}"><span>${name}</span><b class="tag">${rows.length}</b><span style="flex:0">↗</span></button>`).join('')}<div class="node-foot">Select a group to inspect its connections.</div></article><div class="overview-arrow" aria-hidden="true">→</div><article class="overview-card" style="border-color:#b0a0df"><div class="eyebrow">Scheme</div><h3 style="margin-top:9px">Vietnam payroll</h3><div class="ov-sub">${data.length} illustrative components · ${reviewCount()} decisions remain</div>${data.map(x=>`<button class="overview-row" data-action="journey-select:${x.id}"><span>${esc(x.name)}</span><span class="tag ${needs(x)?'warn':'ok'}" style="flex:none">${needs(x)?'Review':x.source==='Calculated'?'Formula':'Ready'}</span></button>`).join('')}</article><div class="overview-arrow" aria-hidden="true">→</div><article class="overview-card"><div class="eyebrow">Records</div><h3 style="margin-top:9px">Employee & contract</h3><p class="ov-sub">Stored once; available when payroll reads records</p>${data.filter(r=>r.store!=='None').map(x=>`<button class="overview-row" data-action="journey-select:${x.id}"><span>${esc(x.destination)}</span><span style="flex:0">↗</span></button>`).join('')}<div class="node-foot">Full relationship detail appears only when a component is selected.</div></article></div>`}
const tasks=['nationality','days','overtime','department'];
function inbox(){let r=data.find(x=>x.id===inboxTask)||data[2];return `<div class="prototype">${intro('c','Guided review','Turn configuration into a manageable set of decisions. Experts can still open any connection or advanced tool.')}${trybar('Choose how to keep Nationality, preview the change, then apply it and continue to the next task.')}<section class="app inbox-app" aria-label="Guided review prototype">${header('mapping')}<div class="inbox-head"><div><h2>Let’s resolve what needs you.</h2><p>${reviewCount()?reviewCount()+' questions in this demo. Healthy connections stay out of the way.':'All demo decisions resolved. You can still inspect every connection.'}</p></div>${btn('Browse all connections','browse-connections')}</div><div class="inbox-layout"><aside class="task-list" aria-label="Review queue"><div class="task-label">Your decisions</div>${tasks.map(id=>{let t=data.find(x=>x.id===id),done=completed.has(id)||!needs(t);return `<button class="task ${inboxTask===id?'active':''} ${done?'done':''}" aria-pressed="${inboxTask===id}" data-action="task:${id}"><span class="task-icon">${done?'✓':id==='nationality'?'Aa':id==='days'?'#':id==='overtime'?'↗':'?'}</span><span class="task-text"><strong>${esc(t.name)}</strong><small>${done?'Resolved':id==='nationality'?'Decide where to keep it':id==='days'?'Confirm days, not currency':id==='overtime'?'Connect a missing source':'Review a suggested match'}</small></span></button>`}).join('')}<div class="queue-progress">${tasks.filter(id=>!needs(data.find(x=>x.id===id))).length} of ${tasks.length} decisions resolved<div class="progress-track"><i style="width:${tasks.filter(id=>!needs(data.find(x=>x.id===id))).length/tasks.length*100}%"></i></div></div></aside><div class="task-panel">${taskBody(r)}</div></div>${appFooter()}</section>${conceptNotes('c')}${selectionNote()}</div>`}
function taskBody(r){const done=!needs(r);if(done)return `<div class="eyebrow">Decision resolved</div><h3 style="margin-top:12px">${esc(r.name)} is ready.</h3><p class="lead">${r.id==='days'?'The example now reads “22 days.”':r.id==='department'?'The suggested department match has been accepted.':r.id==='overtime'?'An incoming source is connected.':r.store==='None'?'The value stays in the scheme, with no record write.':r.store==='Contract text component'?'The value is kept as text on the contract.':r.store==='Contract amount component'?'The value is kept as a number on the contract.':'A record destination has been selected.'}</p><div class="evidence"><span class="key">✓</span><div><div class="label">Example after your decision</div><div class="value num">${esc(format(r))}</div></div><span class="spacer"></span><span class="tag ok">${esc(r.kind)}</span></div><div class="note ok">This was applied to demo state only. Stored payslip results have not changed.</div><div class="task-bottom">${btn('Next decision →','next-task','primary')}${btn('Inspect connection','inspect-task')}</div>`;
 if(inboxStep===2)return taskPreview(r);
 const headlines={nationality:'Where should Nationality be kept?',days:'Is this money or a number of days?',overtime:'Where do overtime hours come from?',department:'Does this suggested match look right?'};

 let choices=r.id==='nationality'?[['text','Create contract text component','Keeps “Vietnamese” exactly as text. Available for record reads.'],['field','Use an existing record field','Find the appropriate employee or contract field.'],['scheme','Keep it in this scheme only','Use the incoming value without writing to a record.']]:r.id==='days'?[['Days','Days','Display “22 days.” Keep the pay role as information only.'],['Money','Money','Keep currency formatting. Requires a reason in the real product.']]:r.id==='overtime'?[['sheet','Spreadsheet · Overtime hours','Example 8 · numeric hours · matching heading.'],['system','Time system · Approved overtime','Example 8 · hours · illustrative connector.']]:[['accept','Accept this match','Department column → Department component. No current source to replace.'],['reject','Reject this suggestion','Leave the component unconnected for manual setup.']];
 return `<div class="stepper"><span class="active">1 · Understand & choose</span><i></i><span>2 · Preview</span><i></i><span>3 · Apply</span></div><div class="eyebrow">${esc(r.name)}</div><h3 style="margin-top:9px">${headlines[r.id]||'Review this component'}</h3><p class="lead">${explanations[r.id]||issueCopy(r)}</p><div class="evidence"><div><div class="label">Incoming example</div><div class="value num">${esc(r.sample)}</div></div><span style="font-size:20px;color:#b4aabb">→</span><div><div class="label">Currently shown as</div><div class="value num">${esc(format(r))}</div></div><span class="spacer"></span><span class="tag">${esc(r.kind)}</span></div><div class="choices">${choices.map(([v,h,p])=>`<button class="choice ${inboxChoice===v?'active':''}" aria-pressed="${inboxChoice===v}" data-action="task-choice:${v}"><span class="radio-dot"></span><span><strong>${h}</strong><p>${p}</p></span></button>`).join('')}</div><div class="task-bottom">${btn('Preview change →','task-preview','primary',!inboxChoice?'disabled':'')}${btn('Inspect full connection','inspect-task','quiet')}</div>`}
function taskPreview(r){let proposed=r.id==='nationality'?(inboxChoice==='text'?'Contract text component':inboxChoice==='field'?'Choose existing field':'Scheme only'):r.id==='days'?inboxChoice:r.id==='overtime'?(inboxChoice==='sheet'?'Spreadsheet · Overtime hours':'Time system · Approved overtime'):inboxChoice==='accept'?'Accept mapping':'Reject suggestion';let before=r.id==='days'?format(r):r.id==='department'?'Suggested only':r.id==='overtime'?'No source':r.destination;let after=r.id==='days'?format(r,inboxChoice):proposed;return `<div class="stepper"><span>1 · Choose</span><i></i><span class="active">2 · Preview</span><i></i><span>3 · Apply</span></div><div class="eyebrow">Before you apply</div><h3 style="margin-top:9px">${esc(r.name)}</h3><p class="lead">Review the change and what stays the same.</p><div class="change-preview"><div class="cp-row"><label>Change</label><del>${esc(before)}</del><span>→</span><b>${esc(after)}</b></div><div class="cp-row"><label>Example value</label><span>${esc(r.sample)}</span><span>→</span><b>${esc(r.id==='days'?format(r,inboxChoice):r.sample)}</b></div><div class="cp-row"><label>Payroll role</label><span>${esc(r.role)}</span><span>→</span><span>${esc(r.role)}</span></div></div><div class="note" style="margin-top:18px">${r.id==='days'&&inboxChoice==='Money'?'Keeping the currency type does not resolve the suspected unit mismatch. The task will stay open.':r.id==='department'&&inboxChoice==='reject'?'Rejecting removes the suggestion, but the component will still need a source.':inboxChoice==='field'?'Next, choose an existing field and review the record write.':r.id==='nationality'?'Record storage does not automatically add a value to net pay. Existing payslip results stay stored until explicitly recomputed.':'This changes the demo configuration only. It does not create or recompute a pay run.'}</div><div class="task-bottom">${btn(inboxChoice==='field'?'Choose field →':'Apply to demo','task-apply','primary')}${btn('← Change my choice','task-back','quiet')}</div>`}
function conceptNotes(v){const notes={a:[['Why it feels calmer','One context, one search, paired connections. The selected component owns the detail area. Healthy rows stay quiet.'],['What stays powerful','The inspector separates Route, Storage, and Use in payroll. The task rail keeps transformations, treatment, assignment, cycle, and templates nearby.'],['Watch this tradeoff','Use full labels and useful examples so it does not become a technical grid. Keep a focused Journey action for visual understanding.']],b:[['What it borrows from Journey','Sources, the scheme, and records remain understandable places. The selected component tells a complete story across them.'],['What keeps it usable','Only one component’s connections are visible. The whole view groups relationships instead of redrawing every individual wire.'],['Watch this tradeoff','A visual route is slower for repetitive bulk work. Add a connection-list switch before making this the only interface.']],c:[['What makes it approachable','The user answers a practical question. The screen explains why it matters and shows a before/after before applying.'],['What keeps experts fast','Browse all connections and All tools remain available. Healthy mappings do not require a trip through the wizard.'],['Watch this tradeoff','Reliable issue detection and recovery are essential. Do not manufacture tasks or force a wizard for every routine edit.']]};return `<div class="concept-notes">${notes[v].map(([h,p])=>`<div><h4>${h}</h4><p>${p}</p></div>`).join('')}</div><div class="reference"><b>Working prototype:</b> local mapping changes, type previews, text/amount creation, suggestions, undo, focused route and advanced-tool examples. The production backend is not connected.</div>`}
function render(){main.innerHTML=page==='a'?desk():page==='b'?journey():page==='c'?inbox():overview();$$('.labnav a').forEach(a=>{const on=a.dataset.page===page;a.classList.toggle('active',on);on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});if(page==='comparison')setTimeout(()=>$('#comparison-content')?.scrollIntoView({block:'start',behavior:'auto'}),0)}

function snapshot(){lastUndo={data:structuredClone(data),completed:[...completed],treatmentDraft:structuredClone(treatmentDraft),assignment,cycleChoice,importName,templateSaved}}
function undo(){if(!lastUndo)return;data=lastUndo.data;completed=new Set(lastUndo.completed);treatmentDraft=lastUndo.treatmentDraft;assignment=lastUndo.assignment;cycleChoice=lastUndo.cycleChoice;importName=lastUndo.importName;templateSaved=lastUndo.templateSaved;lastUndo=null;render();toast('Last demo change undone.',false)}
function toast(msg,canUndo=false){clearTimeout(toastTimer);$('#notification').innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${canUndo?'<button data-action="undo">Undo</button>':''}<button data-action="dismiss-toast" aria-label="Dismiss notification">×</button></div>`;toastTimer=setTimeout(()=>{$('#notification').innerHTML=''},10000)}
function mutate(fn,msg){snapshot();fn();render();toast(msg,true)}
function openModal(title,body,footer='',wide=false,kicker='Demo editor'){restoreFocus=document.activeElement;overlay.innerHTML=`<div class="modal-backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modal-head"><div><div class="eyebrow">${kicker}</div><h2 id="dialog-title">${title}</h2><p>Illustrative data · Changes stay in this prototype.</p></div><button class="close" data-action="close-modal" aria-label="Close dialog">×</button></header><div class="modal-body">${body}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}</section></div>`;document.body.style.overflow='hidden';setTimeout(()=>$('.modal .close')?.focus(),0)}
function closeModal(refocus=true){overlay.innerHTML='';document.body.style.overflow='';modalState=null;if(refocus&&restoreFocus?.isConnected)restoreFocus.focus()}
function modalError(msg){let node=$('.modal-error');if(!node){node=document.createElement('div');node.className='modal-error';node.setAttribute('role','alert');$('.modal-body').prepend(node)}node.textContent=msg;node.scrollIntoView({block:'nearest'})}
function kindForm(kind='text',isNew=false){let r=current(),money=kind==='amount',name=isNew?'':r.name,code=isNew?'':r.code;modalState={type:'component',kind,isNew};openModal(isNew?'Create a component':'Make a contract component',`<p class="module-note">${isNew?'Create a named scheme component. Choose what it holds, then decide whether a contract should keep it.':'Add contract storage for the selected scheme component. The existing component is reused; no duplicate is created.'}</p><div class="kind-options" role="group" aria-label="Component type"><button class="kind-option ${!money?'active':''}" aria-pressed="${!money}" data-action="component-kind:text"><span class="kind-glyph">Aa</span><span><strong>Text component</strong><small>Words, codes, notes</small></span></button><button class="kind-option ${money?'active':''}" aria-pressed="${money}" data-action="component-kind:amount"><span class="kind-glyph">#</span><span><strong>Amount component</strong><small>A number formulas can read</small></span></button></div><div id="component-type-note" class="note">${money?'An amount component stores a number. Choose Money or Number explicitly. Its payroll role is a separate decision.':'A text component preserves words and codes exactly, including leading zeros. It is not added to net pay.'}</div><div class="form-grid"><div class="field"><label for="component-name">Component name</label><input class="input" id="component-name" value="${esc(name)}" placeholder="e.g. Shift code" ${!isNew?'readonly':''}></div><div class="field"><label for="component-code">Stable code</label><input class="input" id="component-code" value="${esc(code)}" placeholder="e.g. SHIFT_CODE" ${!isNew?'readonly':''}></div><div class="field"><label for="component-example">Example value</label><input class="input" id="component-example" value="${esc(isNew?(money?'300000':'NIGHT'):r.sample)}" inputmode="${money?'decimal':'text'}" ${isNew?'':'readonly'}></div><div class="field"><label for="component-value-type">Value type</label><select id="component-value-type">${(money?['Money','Number']:['Text','Identifier']).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label for="component-storage">Where to keep it</label><select id="component-storage"><option value="contract">Contract component</option>${isNew?'<option value="scheme">Scheme only · no record write</option>':''}</select></div><div class="field"><label for="component-role">Payroll role</label><select id="component-role"><option>Information only</option>${money?'<option>Adds to net pay</option><option>Comes off net pay</option>':''}</select></div></div><div class="preview-sample"><div><div class="label">Incoming example</div><div class="value" id="component-preview-input">${esc(isNew?(money?'300000':'NIGHT'):r.sample)}</div></div><span style="color:var(--purple)">→</span><div><div class="label">Stored / displayed</div><div class="value num" id="component-preview-output">${money?(isNew?'300,000 ₫':Number.isFinite(Number(r.sample))?Number(r.sample).toLocaleString('en-US')+' ₫':'Not a numeric value'):esc(isNew?'NIGHT':r.sample)}</div></div></div><p class="small muted" style="margin-top:12px">Import writes to the chosen destination. Payroll can read the stored value under existing source rules. Saving this does not recompute past results.</p>`,`<small>${isNew?'Nothing is created until you save.':'Reuses '+esc(r.code)+'. Preview only; no live write.'}</small><div class="row">${btn('Cancel','close-modal')}${btn(isNew?'Create in demo':'Save contract component','save-component','primary')}</div>`);}
function updateComponentPreview(){const sample=$('#component-example')?.value||'',kind=$('#component-value-type')?.value||'Text',numeric=['Money','Number'].includes(kind);$('#component-preview-input').textContent=sample;$('#component-preview-output').textContent=numeric?(sample.trim()!==''&&Number.isFinite(Number(sample))?(kind==='Money'?Number(sample).toLocaleString('en-US')+' ₫':String(Number(sample))):'Enter a valid number'):sample;}
function saveComponent(){let m=modalState,r=current(),name=$('#component-name').value.trim(),code=$('#component-code').value.trim(),sample=$('#component-example').value,kind=$('#component-value-type').value,role=$('#component-role').value,store=$('#component-storage').value;if(!name||!code)return modalError('Give the component a name and stable code.');if(!/^[A-Z][A-Z0-9_]*$/.test(code))return modalError('Use a code starting with a letter, with capitals, numbers, and underscores.');if(m.isNew&&data.some(x=>x.code===code))return modalError('That code already exists. Choose a unique code.');if(['Money','Number'].includes(kind)&&(sample.trim()===''||!Number.isFinite(Number(sample))))return modalError('The example must be a valid number. Choose text to keep words or codes.');if(kind!=='Money'&&role!=='Information only')return modalError('Only a money value can be directly added to or taken off net pay. Choose Information only for a number.');snapshot();if(m.isNew){r={id:'new-'+Date.now(),letter:'NEW',name,vn:'New demo component',code,kind,sample,source:'None',field:'No source selected',destination:store==='contract'?'Contract · '+name:'Scheme input only',store:store==='contract'?(m.kind==='text'?'Contract text component':'Contract amount component'):'None',status:'unmapped',role,group:'New components'};data.push(r);selected=r.id}else{r.kind=kind;r.role=role;r.store=m.kind==='text'?'Contract text component':'Contract amount component';r.destination='Contract · '+r.name;if(r.status==='storage'||r.status==='type')r.status='mapped';completed.add(r.id)}closeModal(false);detailTab='storage';render();toast(m.isNew?'Component created in the demo. Choose a source next.':'Contract '+(m.kind==='text'?'text':'amount')+' component saved in the demo.',true)}

function sourcePreview(){const i=modalState?.value;if(i===null||i===undefined)return;const s=sources()[i],r=current();modalState={type:'source-confirm',value:i};openModal(r.source==='None'?'Connect this source?':'Replace the current source?',`<div class="change-preview"><div class="cp-row"><label>Incoming source</label><span>${esc(r.source)}</span><span>→</span><b>${esc(s[3])}</b></div><div class="cp-row"><label>Field</label><span>${esc(r.field)}</span><span>→</span><b>${esc(r.name)}</b></div></div><div class="note ${r.source==='None'?'':'warn'}" style="margin-top:16px">${r.source==='None'?'This gives the component an incoming value.': 'You are replacing a source, not adding an unranked second source. The live implementation must retain the engine’s precedence and explicitly report any conflict.'}</div>`,`<small>Record storage and payroll role remain as configured.</small><div class="row">${btn('Keep current','close-modal')}${btn('Save source in demo','source-save','primary')}</div>`)}
const transformed=(v,t)=>{const n=Number(v);return t.mode==='text'?String(v).trim():!Number.isFinite(n)?'Not a number':t.mode==='multiply'?String(n*Number(t.value)):t.mode==='divide'?(Number(t.value)===0?'Cannot divide by zero':String(n/Number(t.value))):String(Math.round(n*10**Number(t.value))/10**Number(t.value))};
function transform(){let r=current();if(r.source==='Calculated')return formula();modalState={type:'transform'};openModal('Transform this value',`<p class="module-note">Shape the incoming value for <b>${esc(r.name)}</b>. Preview the example before saving. Multi-input rules remain in the full Transformations tool.</p><div class="form-grid"><div class="field"><label for="transform-mode">Operation</label><select id="transform-mode"><option value="multiply">Multiply by</option><option value="divide">Divide by</option><option value="round">Round to decimal places</option><option value="text">Trim surrounding text spaces</option></select></div><div class="field"><label for="transform-value">Parameter</label><input class="input" id="transform-value" type="number" value="${r.kind==='Money'?'1':'2'}" step="any"></div><div class="field span2"><label for="transform-sample">Incoming example</label><input class="input" id="transform-sample" value="${esc(r.sample)}"></div></div><div class="preview-sample"><div><div class="label">Before</div><div class="value num" id="transform-before">${esc(r.sample)}</div></div><span>→</span><div><div class="label">After</div><div class="value num" id="transform-after">${esc(Number(r.sample)* (r.kind==='Money'?1:2))}</div></div></div><div class="note" style="margin-top:16px">A transform changes the incoming value. It does not decide storage or whether the value adds to net pay.</div>`,`<small>Advanced code would open the supported rule editor.</small><div class="row">${btn('Cancel','close-modal')}${btn('Save demo transform','transform-save','primary')}</div>`);if(r.transform){$('#transform-mode').value=r.transform.mode;$('#transform-value').value=r.transform.value;updateTransform()}else if(!Number.isFinite(Number(r.sample))){$('#transform-mode').value='text';updateTransform()}}
function updateTransform(){const t={mode:$('#transform-mode').value,value:$('#transform-value').value},v=$('#transform-sample').value;$('#transform-value').disabled=t.mode==='text';$('#transform-before').textContent=v;$('#transform-after').textContent=transformed(v,t)}
function editTreatment(){let r=current();modalState={type:'treatment-single'};openModal('How payroll treats this value',`<p class="module-note"><b>${esc(r.name)}</b> · ${esc(r.code)}. Type describes the value. Pay role describes how reports count it.</p><div class="form-grid"><div class="field"><label for="treatment-kind">Value type</label><select id="treatment-kind">${['Money','Number','Days','Hours','Percent','Text','Identifier','Date'].map(k=>`<option ${r.kind===k?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label for="treatment-role">Pay role</label><select id="treatment-role">${['Information only','Adds to net pay','Comes off net pay','Net pay outcome'].map(k=>`<option ${r.role===k?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label for="treatment-group">Group</label><input class="input" id="treatment-group" value="${esc(r.group)}"></div><div class="field"><label for="treatment-signal">Tells the run</label><select id="treatment-signal"><option>No special signal</option><option>Employee identifier</option><option>Paid days</option><option>Standard days</option></select></div></div><label class="checkline"><input type="checkbox" id="treatment-rollup" ${r.rollup?'checked':''}><span>Already included in another total<br><span class="muted small">Totals should count that parent line instead of this one.</span></span></label><div class="preview-sample"><div><div class="label">Currently displayed</div><div class="value num">${esc(format(r))}</div></div><span>→</span><div><div class="label">With this type</div><div class="value num" id="treatment-preview">${esc(format(r))}</div></div></div><div class="note" style="margin-top:16px">A non-money value cannot directly add to or come off net pay. Manual decisions must not be silently overwritten by reclassification. Existing stored payslip results require an explicit recompute.</div>`,`<small>This is scheme configuration, not a payslip edit.</small><div class="row">${btn('Cancel','close-modal')}${btn('Save demo treatment','treatment-save','primary')}</div>`)}
function formula(){openModal('Calculated in the scheme',`<p class="module-note">${esc(current().name)} is produced by a calculation. It does not need an incoming mapping.</p><div class="detail-block"><span class="label">Illustrative formula</span><code>CONTRACT_SALARY / STANDARD_DAYS * PAID_DAYS</code></div><div class="note">The real product should open this component in Formula Studio, with its dependencies and stored sample values. No formula is edited in this prototype.</div>`,btn('Back to mapping','close-modal'))}
function suggestions(){const rows=data.filter(r=>r.status==='suggested');modalState={type:'suggestions'};openModal('Review suggestions',`<p class="module-note">Review the reason, example, and conflicts before accepting. Batch acceptance stays available, with a concrete preview.</p>${rows.length?`<div class="table-scroll"><table class="mini-table"><thead><tr><th>Include</th><th>Proposed connection</th><th>Evidence</th></tr></thead><tbody>${rows.map(r=>`<tr><td><input type="checkbox" class="suggest-include" value="${r.id}" checked aria-label="Accept ${esc(r.name)}"></td><td><b>${esc(r.field)} → ${esc(r.name)}</b><span class="sub">${esc(r.source)} · ${esc(r.kind)}</span></td><td><span class="tag purple">${r.confidence||98}%</span><span class="sub">Exact heading · compatible type<br>Example: ${esc(r.sample)}<br>No existing accepted source to replace</span></td></tr>`).join('')}</tbody></table></div><div class="note" style="margin-top:16px">Only selected compatible rows at or above 90% will be accepted. Conflicts need a separate decision. This demo contains one illustrative suggestion.</div>`:'<div class="empty"><h3>No suggestions to review</h3><p>The demo suggestions are already resolved. Reset the demo to try again.</p></div>'}`,`<small>A percentage is evidence, not a guarantee.</small><div class="row">${btn('Cancel','close-modal')}${rows.length?btn('Accept selected ≥90%','suggestions-save','primary'):''}</div>`,true)}
const moduleNames={library:'All mapping tools',sources:'Files & systems',people:'Employee & contract',transform:'Transformations',treatment:'Component treatment',workforce:'Who is paid by what',cycles:'Mid ↔ end cycle',templates:'Mapping templates',review:'Components needing review'};
function module(v){if(v==='journey'){journeyView='overview';navigate('b');return}if(v==='review')return reviewList();if(v==='library')return library();let body='',foot=btn('Close','close-modal');modalState={type:'module',module:v};
 if(v==='sources')body=`<p class="module-note">Choose a source to inspect its fields. File maintenance belongs here rather than above every mapping.</p><div class="module-tabs"><button class="active" data-action="source-section:files">Spreadsheets</button><button data-action="source-section:systems">Connected systems</button></div><div id="source-section-body">${sourceModuleBody('files')}</div>`;

 if(v==='transform')body=`<p class="module-note">Keep the three-part rule model: fields read → rule → components fed. Edit one rule in context, then return to mapping.</p><div class="option-tile"><span class="key">ƒ</span><div><h4>Normalize an incoming value</h4><p>Multiply, divide, round, or trim text. Live example preview.</p></div>${btn('Try on selected component','transform','tiny')}</div><div class="option-tile"><span class="key">∑</span><div><h4>Multi-input overtime rule</h4><p>Illustrative: approved hours × hourly rate → overtime amount.</p></div>${btn('Inspect rule','multi-rule','tiny')}</div><div class="note" style="margin-top:16px">The production implementation keeps the existing rule editor, Python permissions, default-on-error behavior, and output bindings. The POC does not execute arbitrary code.</div>`;
 if(v==='treatment'){body=`<p class="module-note">Bulk treatment remains available. Select a component to edit value type, pay role, group, subtotal, and payroll signal together.</p><div class="table-scroll"><table class="mini-table"><thead><tr><th>Component</th><th>Type</th><th>Pay role</th><th>Group</th><th></th></tr></thead><tbody>${data.map(r=>`<tr><td>${esc(r.name)}</td><td><span class="tag">${esc(r.kind)}</span></td><td>${esc(r.role)}</td><td>${esc(r.group)}</td><td>${btn('Edit','treatment-row:'+r.id,'tiny')}</td></tr>`).join('')}</tbody></table></div><div class="actions-row">${btn('Preview reclassification','reclassify')}</div>`;}
 if(v==='workforce'){body=`<p class="module-note">Workforce assignment is a scheme-level decision. It should be reachable without competing with field-mapping tools.</p><div class="field"><label for="assignment-rule">Illustrative assignment rule</label><select id="assignment-rule"><option ${assignment==='Monthly payroll'?'selected':''}>Monthly payroll</option><option ${assignment==='Hourly payroll'?'selected':''}>Hourly payroll</option></select></div><div class="change-preview" style="margin-top:18px"><div class="cp-row"><label>Workforce</label><span>Demo employees</span><span>→</span><b id="assignment-preview">${esc(assignment)}</b></div></div><div class="note" style="margin-top:16px">This illustrates the tool’s new home. The production tool retains actual assignment rules and exceptions; this example assigns no real employees.</div>`;foot=`<small>No employee or payroll records are connected.</small><div class="row">${btn('Cancel','close-modal')}${btn('Save demo assignment','assignment-save','primary')}</div>`;}
 if(v==='cycles'){body=`<p class="module-note">Carry a mid-cycle value into an end-cycle component. The direction is explicit.</p><div class="form-grid"><div class="field"><label for="cycle-source">From · mid-cycle</label><select id="cycle-source"><option>Advance paid</option><option>Allowance paid early</option></select></div><div class="field"><label for="cycle-target">To · end-cycle</label><select id="cycle-target"><option>Advance deduction</option><option>Allowance adjustment</option></select></div></div><div class="note">Configure a carry-over link. This action does not create a pay run or pay anyone.</div><p class="small muted" style="margin-top:12px">Saved demo source: ${esc(cycleChoice)}</p>`;foot=`<small>Existing cycle behavior stays in the backend.</small><div class="row">${btn('Cancel','close-modal')}${btn('Save demo link','cycle-save','primary')}</div>`;}

function sourceModuleBody(kind){return kind==='files'?`<div class="option-tile"><span class="key">X</span><div><h4>${esc(importName||'No file selected')}</h4><p>Demo headings and examples only. Loading payroll data is a separate action.</p></div><span class="tag">Spreadsheet</span></div><div class="row wrap" style="margin-top:15px">${btn('Replace demo file','replace-file')}${btn('Download demo template','download-template')}${btn('Load as pay run…','payrun-preview')}${btn('Forget demo file','forget-file','quiet')}</div>`:`<div class="option-tile"><span class="key">S</span><div><h4>Demo time system</h4><p>Approved overtime · 1 illustrative endpoint.</p></div>${btn('Inspect fields','system-fields','tiny')}</div><p class="module-note" style="margin-top:16px">The real interface retains connector selection, endpoints, fetched fields, and last successful discovery. Source maintenance is kept away from routine mapping.</p>`}

 'download-template':()=>{const csv='Employee code,Full name,Nationality,Uniform allowance,Standard working days,Overtime hours,Department\n00017,Example employee,Vietnamese,300000,22,8,Operations\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='mapping-demo-template.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Fictional CSV template downloaded.')},
 'payrun-preview':()=>openModal('Load a pay run · separate step',`<p class="module-note">Keep this powerful action available, but separate it from reading headings and editing mappings.</p><div class="timeline"><div><b>1 · Confirm the file and period</b><p>Choose which payroll period the numbers belong to.</p></div><div><b>2 · Validate rows and identities</b><p>Check employee matches, missing values, and the active mappings.</p></div><div><b>3 · Review, then create</b><p>The production action creates a run only after explicit confirmation.</p></div></div><div class="note" style="margin-top:20px">This is a design preview. Pay-run creation is intentionally unavailable in the POC.</div>`,btn('Back to mapping','close-modal')),
 'system-fields':()=>openModal('Demo time system · fields',`<p class="module-note">An endpoint selector and fetched field catalog belong in the selected source’s detail.</p><div class="detail-block"><span class="label">Endpoint</span><b>Approved overtime · demo</b></div><table class="mini-table"><tr><th>Field</th><th>Example</th><th>Type</th></tr><tr><td>Approved overtime</td><td>8</td><td>Hours</td></tr><tr><td>Employee code</td><td>00017</td><td>Identifier</td></tr></table><div class="actions-row">${btn('Connect selected component','source','primary')}</div>`,btn('Close','close-modal')),
 'multi-rule':()=>openModal('Multi-input rule · design preview',`<div class="timeline"><div><b>Reads two fields</b><p>Approved overtime hours = 8<br>Hourly rate = 125,000 ₫</p></div><div><b>Applies a rule</b><p>Approved hours × hourly rate</p></div><div><b>Feeds a component</b><p>Overtime amount = 1,000,000 ₫</p></div></div><div class="note" style="margin-top:20px">The existing full rule editor remains the home for multi-input expressions, code rules, defaults and output bindings. This panel illustrates discoverability, not a new rule engine.</div>`,btn('Back to tools','module:transform')),
 reclassify:()=>openModal('Review proposed classification',`<p class="module-note">Inference should propose a change, explain it, and preserve manual choices.</p><div class="option-tile"><span class="key">M</span><div><h4>Standard working days</h4><p>Propose Days / Information only. Reason: name, numeric example, and attendance use.</p></div>${btn('Review','treatment-row:days','tiny')}</div><div class="note" style="margin-top:16px">A production review uses actual formula and type evidence. It must not overwrite every component with a default or alter stored payslips silently.</div>`,btn('Close','close-modal'))
};
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;const [k,...rest]=action.split(':'),v=rest.join(':');if(actions[action])return actions[action]();
 if(k==='prefer'){preferred=v;try{localStorage.setItem('mapping-design-preference',v)}catch{}render();toast('Direction '+v.toUpperCase()+' marked for review. Tell me in chat to approve it.');return}
 if(k==='select'){selected=v;render();return}
 if(k==='filter'){filter=v;render();return}
 if(k==='detail'){detailTab=v;render();return}
 if(k==='journey-select'){selected=v;journeyView='focus';render();return}
 if(k==='journey-view'){journeyView=v;render();return}
 if(k==='module'){module(v);return}
 if(k==='make'){kindForm(v);return}
 if(k==='component-kind'){const old={name:$('#component-name').value,code:$('#component-code').value,sample:$('#component-example').value,storage:$('#component-storage').value};const isNew=modalState.isNew;kindForm(v,isNew);$('#component-name').value=old.name;$('#component-code').value=old.code;$('#component-storage').value=old.storage;if(v==='text'||Number.isFinite(Number(old.sample))){$('#component-example').value=old.sample;updateComponentPreview()}return}
 if(k==='pick-destination'||k==='pick-source'){modalState.value=Number(v);$$('.pick-item',overlay).forEach(n=>n.classList.toggle('active',n===el));const next=$(k==='pick-source'?'#source-next':'#destination-next');next.disabled=false;return}
 if(k==='task'){inboxTask=v;selected=v;inboxStep=1;inboxChoice='';render();return}
 if(k==='task-choice'){inboxChoice=v;render();return}
 if(k==='module-inspect'){selected=v;detailTab='storage';closeModal(false);navigate('a');return}
 if(k==='treatment-row'){selected=v;editTreatment();return}
 if(k==='review-pick'){openReviewTask(v);return}
 if(k==='source-section'){$$('.module-tabs button',overlay).forEach(b=>b.classList.toggle('active',b===el));$('#source-section-body').innerHTML=sourceModuleBody(v);return}
 if(k==='overview-source'){const rows=data.filter(r=>r.source===v);openModal(esc(v)+' connections',`<div class="pick-list">${rows.map(r=>`<button class="pick-item" data-action="journey-source-pick:${r.id}"><span><b>${esc(r.name)}</b><span class="sub">${esc(r.field)} · ${esc(r.kind)}</span></span>${tag(r)}</button>`).join('')||'<div class="empty">No components in this source group.</div>'}</div>`,btn('Close','close-modal'));return}
 if(k==='journey-source-pick'){selected=v;journeyView='focus';closeModal(false);render();return}
});
document.addEventListener('input',event=>{const id=event.target.id;if(id==='workspace-search'){query=event.target.value;const p=event.target.selectionStart;render();const node=$('#workspace-search');node.focus();try{node.setSelectionRange(p,p)}catch{}return}if(id==='destination-search'){const q=event.target.value.toLowerCase();$$('#destination-list .pick-item').forEach(x=>x.hidden=!x.dataset.search.includes(q));return}if(['component-example','component-value-type'].includes(id))updateComponentPreview();if(id.startsWith('transform-'))updateTransform();});
document.addEventListener('change',event=>{let id=event.target.id;if(id==='component-value-type'){if(event.target.value==='Number')$('#component-role').value='Information only';updateComponentPreview()}if(id==='treatment-kind')$('#treatment-preview').textContent=format(current(),event.target.value);if(id==='assignment-rule')$('#assignment-preview').textContent=event.target.value;if(id==='transform-mode')updateTransform();});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&overlay.innerHTML){closeModal();return}if(event.key==='Tab'&&overlay.innerHTML){const nodes=$$('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea,a[href]',overlay).filter(n=>n.getClientRects().length);if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
page=['a','b','c','comparison'].includes(location.hash.slice(1))?location.hash.slice(1):'overview';render();
})();
</script>
</body>
</html>
