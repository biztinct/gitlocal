function render(){const name=state.page==='interviews'?'Hiring':state.page==='master'?'Settings':'Calendar';const crumb={calendar:'My calendar',interviews:'Interviews',connections:'My connections',preferences:'Preferences',master:'Connect · Calendars',research:'Design & research'}[state.page];document.getElementById('app').innerHTML=`<header class="top"><div class="brand">P</div><div class="top-title">${icon(name==='Hiring'?'hire':name==='Settings'?'settings':'calendar')}<b>${name}</b></div>${btn(icon('search')+'<span>Search screens and actions…</span><kbd>⌘ K</kbd>','search','top-search')}<span class="spacer"></span><label class="sr-only" for="persona">Preview permissions as</label><select id="persona" aria-label="Preview permissions as">${[['recruiter','Recruiter · Maya'],['interviewer','Interviewer · Nina'],['employee','Employee · Jordan'],['admin','Workspace admin']].map(([v,l])=>`<option value="${v}" ${v===state.persona?'selected':''}>${l}</option>`).join('')}</select><span class="avatar">${state.persona==='interviewer'?'NT':state.persona==='employee'?'JL':'MA'}</span></header><div class="workspace">${nav()}<main class="main"><div class="breadcrumb">${name}${icon('chevron')}<strong>${crumb}</strong><span style="margin-left:auto">Demo workspace</span></div><div class="content">${({calendar:calendarPage,interviews:interviewPage,connections:connectionsPage,preferences:preferencesPage,master:masterPage,research:researchPage}[state.page]||calendarPage)()}</div></main></div>`;}
function calendarPage(){const next=accessible().filter(e=>new Date(e.start)>=NOW).sort((a,b)=>a.start.localeCompare(b.start))[0];const count=accessible().filter(e=>localParts(e.start).date===TODAY).length;return `<div class="heading"><div><div class="eyebrow">Your day, together</div><h1>Calendar</h1><p>One place for your meetings, interviews and everything in between.</p></div><div class="heading-actions">${btn(icon('people')+'Find a time','schedule')}${btn(icon('plus')+'New event','new','primary')}</div></div><div class="summary"><div><span class="tile-icon">${icon('calendar')}</span><div><strong>${count} events today</strong><small>Wednesday, 28 October</small></div>${chip('Your schedule')}</div><div><span class="tile-icon">${icon('clock')}</span><div><strong>${next?'Next · '+esc(next.title):'Nothing coming up'}</strong><small>${next?time(next.start)+' · '+next.duration+' min · '+providerName(next.provider):'Connect your calendar for current availability'}</small></div></div><div><span class="tile-icon">${icon('link')}</span><div><strong>${Number(state.google)+Number(state.microsoft)} connected ${state.google&&state.microsoft?'accounts':'account'}</strong><small>${state.microsoft?'Google & Microsoft':'Google connected · Microsoft available'}</small></div>${btn(icon('arrow'),'connections','ghost','aria-label="Manage calendar connections"')}</div></div>${calendarShell()}`}
function interviewPage(){if(state.persona==='employee')return `<div class="empty">${icon('lock')}<h2>Hiring access is required</h2><p>Your Calendar still shows the events you are permitted to see.</p>${btn('Back to my calendar','calendar','primary')}</div>`;return `<div class="heading"><div><div class="eyebrow">Hiring workspace</div><h1>Interviews</h1><p>Coordinate the panel. Give every candidate a considered experience.</p></div><div class="heading-actions">${btn(icon('calendar')+'Open full calendar','calendar')}${btn(icon('plus')+'Schedule interview','schedule','primary',state.persona==='interviewer'?'disabled title="Recruiter permission required"':'')}</div></div><div class="tabs">${btn(icon('list')+'List','interview-list',state.interviewView==='list'?'active':'')}${btn(icon('calendar')+'Calendar','interview-calendar',state.interviewView==='calendar'?'active':'')}</div><div class="notice">${icon('info')}<div>This is the same calendar, focused on interviews. Availability checks also consider connected calendars, private busy blocks and panel working hours.</div></div>${state.interviewView==='calendar'?calendarShell():`<div class="card table-wrap"><table><thead><tr><th>Candidate / role</th><th>Interview</th><th>When · ${esc(state.zone)}</th><th>Panel</th><th></th></tr></thead><tbody>${accessible().filter(e=>e.type==='interview').map(e=>`<tr><td><b>${esc(e.title.split(' · ')[0])}</b><small>${esc(e.role)}</small></td><td>${esc(e.detail)}</td><td>${dayLabel(localParts(e.start).date)} · ${time(e.start)}</td><td>${e.attendees.length} people</td><td>${btn('View','event:'+e.id,'small')}</td></tr>`).join('')}</tbody></table></div>`}`}
function calendarShell(){return `<section class="calendar-shell" aria-label="Calendar"><aside class="calendar-side">${miniMonth()}<div class="section-label">Show on calendar</div>${Object.entries(categories).filter(([k])=>state.page!=='interviews'||k==='interview').filter(([k])=>state.persona!=='employee'||k!=='interview').map(([k,c])=>`<label class="filter"><input type="checkbox" data-source="${k}" ${state.sources.has(k)?'checked':''}>${c.label}<span class="dot" style="background:${c.color}"></span></label>`).join('')}<p class="source-note">Hiding an event here does not make that time available for booking.</p><div class="side-connections"><div class="section-label" style="margin-top:0">Connected calendars</div><div class="row"><span class="row"><span class="provider">G</span>Google</span><span class="status-dot ${state.google?'':'amber'}" title="${state.google?'Connected in sample':'Disconnected'}"></span></div><div class="row"><span class="row"><span class="provider ms">▦</span>Microsoft</span><small>${state.microsoft?'Connected':'Not connected'}</small></div>${btn('Manage connections '+icon('arrow'),'connections','ghost small')}<p class="source-note">Sample sync · just now<br>Only calendars shared with you.</p></div></aside><div class="calendar-main">${calendarToolbar()}<div id="calendar-results">${calendarView()}</div><div class="calendar-foot"><span>${icon('lock').replace('<svg','<svg style="width:11px;height:11px;vertical-align:middle"')} Details follow your access. Private events stay private.</span><span>${visible().filter(inPeriod).length} events · sample data</span></div></div></section>`}
function miniMonth(){const month=state.date.slice(0,7)+'-01',offset=(new Date(month+'T12:00:00Z').getUTCDay()+6)%7;const next=new Date(month+'T12:00:00Z');next.setUTCMonth(next.getUTCMonth()+1);const days=+dateAdd(next.toISOString().slice(0,10),-1).slice(-2);const w=weekStart(state.date);return `<div class="mini-head">${dayLabel(month,{month:'long',year:'numeric'})}<span class="row">${btn(icon('left'),'mini-prev','ghost icon-btn','aria-label="Previous month"')}${btn(icon('chevron'),'mini-next','ghost icon-btn','aria-label="Next month"')}</span></div><div class="mini">${['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:days},(_,i)=>{const d=month.slice(0,8)+String(i+1).padStart(2,'0');return btn(String(i+1),'date:'+d,d===state.date?'chosen':d>=w&&d<=dateAdd(w,4)?'inweek':'',`aria-label="${dayLabel(d,{day:'numeric',month:'long'})}"`)}).join('')}</div>`}
function calendarToolbar(){const [s,t]=period();const title=state.view==='month'?dayLabel(s,{month:'long',year:'numeric'}):s===t?dayLabel(s,{day:'numeric',month:'long',year:'numeric'}):`${dayLabel(s)} – ${dayLabel(t)} <span style="font-weight:400;color:var(--muted)">${t.slice(0,4)}</span>`;return `<div class="calendar-toolbar">${btn('Today','today','small')}${btn(icon('left'),'prev','icon-btn','aria-label="Previous period"')}${btn(icon('chevron'),'next','icon-btn','aria-label="Next period"')}<h2 class="calendar-title">${title}</h2><div class="segmented" aria-label="Calendar view">${[['day','Day'],['week','Week'],['month','Month'],['agenda','Agenda']].map(([v,l])=>btn(l,'view:'+v,v===state.view?'active':'',`aria-pressed="${v===state.view}"`)).join('')}</div></div><div class="toolbar-bottom"><label><span class="sr-only">Search events</span><input id="event-search" type="search" value="${esc(state.query)}" placeholder="Search ${state.page==='interviews'?'candidate, role…':'your events…'}"></label><div class="timezone">${icon('globe')}<label><span class="sr-only">Calendar timezone</span><select id="timezone">${[['Australia/Sydney','Sydney · AEDT'],['Asia/Ho_Chi_Minh','Ho Chi Minh City · ICT'],['Europe/London','London · GMT'],['UTC','UTC']].map(([v,l])=>`<option value="${v}" ${v===state.zone?'selected':''}>${l}</option>`).join('')}</select></label></div></div>`}
function calendarView(){if(state.view==='month')return monthView();if(state.view==='agenda')return agendaView();return weekView()}
function weekView(){const [s,t]=period(),days=Array.from({length:state.view==='day'?1:5},(_,i)=>dateAdd(s,i));const data=visible().filter(inPeriod);const minHour=Math.min(8,...data.map(e=>localParts(e.start).hour));const maxHour=Math.max(18,...data.map(e=>localParts(end(e)).hour+1));const hours=maxHour-minHour;const now=localParts(NOW.toISOString());return `<div class="calendar-scroll" style="--days:${days.length};--grid-min:${days.length===1?'0px':'574px'}"><div class="week-head"><div class="time-head">${state.zone==='Australia/Sydney'?'GMT+11':state.zone==='Asia/Ho_Chi_Minh'?'GMT+7':'GMT+0'}</div>${days.map(d=>`<div class="day-head ${d===now.date?'today':''}">${dayLabel(d,{weekday:'short'})}<b>${+d.slice(-2)}</b></div>`).join('')}</div><div class="all-day"><div>All day</div>${days.map(d=>`<div>${d===TODAY&&state.page!=='interviews'&&state.sources.has('deadline')?btn('Oliver · on leave (AM)','leave'):''}</div>`).join('')}</div><div class="week-body"><div class="hours">${Array.from({length:hours},(_,i)=>`<div class="hour">${String(i+minHour).padStart(2,'0')}:00</div>`).join('')}</div>${days.map(d=>`<div class="day-column ${d===now.date?'today':''}" style="height:${hours*60}px">${data.filter(e=>localParts(e.start).date===d).map(e=>{const p=localParts(e.start);return `<button class="event ${e.type}" data-action="event:${e.id}" style="top:${(p.hour-minHour)*60+p.minute}px;height:${Math.max(e.duration-3,33)}px" aria-label="${esc(e.title)}, ${p.time}, ${e.duration} minutes"><span class="event-time">${p.time} – ${time(end(e))}<span>${providerMark(e.provider)}</span></span><strong>${esc(e.title)}</strong>${e.duration>=55?`<span class="event-meta">${esc(e.detail)}</span>`:''}</button>`}).join('')}${d===now.date&&now.hour>=minHour&&now.hour<maxHour?`<div class="now-line" style="top:${(now.hour-minHour)*60+now.minute}px" title="Demo now: 28 October, 08:30 Sydney"></div>`:''}</div>`).join('')}</div>${data.length?'':`<div class="empty"><h3>No events in this view</h3><p>Try another date or clear your filters.</p></div>`}</div>`}
function monthCellCount(first){const d=new Date(first+'T12:00:00Z');const offset=(d.getUTCDay()+6)%7;d.setUTCMonth(d.getUTCMonth()+1);d.setUTCDate(0);return Math.ceil((offset+d.getUTCDate())/7)*7}
function monthView(){const first=state.date.slice(0,7)+'-01',start=weekStart(first),data=visible();return `<div class="month-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}${Array.from({length:monthCellCount(first)},(_,i)=>{const d=dateAdd(start,i);return `<div class="month-day ${d.slice(0,7)!==state.date.slice(0,7)?'outside':''} ${d===TODAY?'today':''}"><b>${+d.slice(-2)}</b>${data.filter(e=>localParts(e.start).date===d).map(e=>btn(`${time(e.start)} ${esc(e.title)}`,'event:'+e.id,'month-event',`title="${esc(e.title)}"`)).join('')}</div>`}).join('')}</div>`}
function agendaView(){const data=visible().filter(inPeriod).sort((a,b)=>a.start.localeCompare(b.start));const dates=[...new Set(data.map(e=>localParts(e.start).date))];return `<div class="agenda">${data.length?dates.map(d=>`<div class="agenda-day">${dayLabel(d,{weekday:'long',day:'numeric',month:'long'})}${d===TODAY?' · Today':''}</div>${data.filter(e=>localParts(e.start).date===d).map(e=>`<button class="agenda-event" data-action="event:${e.id}"><span class="time">${time(e.start)} – ${time(end(e))}</span><span class="dot" style="background:${categories[e.type].color}"></span><span class="event-info"><strong>${esc(e.title)}</strong><small>${esc(e.detail)}</small></span>${chip(providerName(e.provider),'gray')}${icon('chevron')}</button>`).join('')}`).join(''):`<div class="empty">${icon('calendar')}<h3>A little breathing room</h3><p>No events match these dates and filters.</p>${btn('Return to this week','today','ghost')}</div>`}</div>`}
function connectionsPage(){return `<div class="heading"><div><div class="eyebrow">Calendar · Personal</div><h1>Your calendar connections</h1><p>Bring your calendars together. Keep control of what you share and where you write.</p></div>${btn('Back to calendar','calendar')}</div><div class="notice">${icon('shield')}<div>Connecting an account does not share all its details with colleagues. Calendar sharing and Payobook permissions still apply. This preview simulates consent; it never opens a real account.</div></div><div class="cards">${['google','microsoft'].map(p=>connectionCard(p)).join('')}</div><div class="card"><h3>Where should new events live?</h3><p style="margin-top:5px">One destination per event. Invitations go out once, from its organiser.</p><div class="settings-row"><div><b>Default calendar for new meetings</b><p>Interview events also remain linked to their Hiring record.</p></div><select id="default-calendar" aria-label="Default calendar for new meetings"><option value="payobook" ${state.defaultCalendar==='payobook'?'selected':''}>Payobook calendar</option>${state.google&&state.googleEdit?`<option value="google" ${state.defaultCalendar==='google'?'selected':''}>Google · Maya’s work</option>`:''}${state.microsoft&&state.msEdit?`<option value="microsoft" ${state.defaultCalendar==='microsoft'?'selected':''}>Microsoft · Maya’s work</option>`:''}</select></div><div class="settings-row"><div><b>Calendars used to check conflicts</b><p>Separate from display filters. Only confirmed availability is bookable.</p></div></div>${['google','microsoft'].filter(p=>state[p]).map(p=>`<label class="filter"><input type="checkbox" data-conflict="${p}" ${state.checked[p]?'checked':''}>Check ${providerName(p)} before booking</label>`).join('')}</div><p class="source-note">Workspace setup is managed separately in Settings → Connect → Calendars. Disconnecting stops future sync; it does not delete provider events.</p>`}
function connectionCard(p){const connected=state[p];return `<div class="card"><div class="card-head"><span class="provider ${p==='microsoft'?'ms':''}">${providerMark(p)}</span><div><h3>${providerName(p)}</h3><p>${connected?'maya@example.test':'Connect your work account'}</p></div>${chip(connected?'Connected':'Not connected',connected?'green':'gray')}</div><p>${p==='google'?'See Google calendars shared with you, check availability and create Google Meet events.':'Bring in Outlook calendars and Teams meetings, subject to your Microsoft tenant’s permissions.'}</p>${connected?`<div class="settings-row"><div><b>${state.connectedCalendars[p].length} selected calendars</b><p>${state[p==='google'?'googleEdit':'msEdit']?'Edit your own events':'Read only · no provider edits'}</p></div>${btn('Manage','manage:'+p,'small')}</div><div class="settings-row"><span class="row"><span class="status-dot"></span><span>Sample sync · just now</span></span>${btn(icon('refresh')+'Sync','sync:'+p,'small')}</div><div class="settings-row">${btn('Disconnect','disconnect:'+p,'ghost small')}<span class="source-note">Your provider events stay intact.</span></div>`:`<div class="settings-row"><div><b>${state.master[p]?'Workspace ready':'Disabled by workspace admin'}</b><p>${state.master[p]?'You choose the calendars and access level.':'Ask your administrator to enable this provider.'}</p></div>${btn('Connect '+(p==='google'?'Google':'Microsoft'),'connect:'+p,'primary small',state.master[p]?'':'disabled')}</div>`}</div>`}
function preferencesPage(){return `<div class="heading"><div><div class="eyebrow">Calendar · Personal</div><h1>Scheduling preferences</h1><p>Make space for focused work and better conversations.</p></div>${btn('Back to calendar','calendar')}</div><div class="cards"><div class="card"><h3>Working time</h3><p style="margin:8px 0 20px">Preview availability uses Monday–Friday, 09:00–17:00 in each participant’s timezone.</p><div class="settings-row"><b>Your timezone</b><span>Sydney · Australia/Sydney</span></div><div class="settings-row"><b>Nina’s timezone</b><span>Ho Chi Minh City · ICT</span></div><div class="settings-row"><b>Minimum notice</b><span>24 hours</span></div><p class="source-note">These are fixed sample policies. Change duration and buffers in Find a time to see availability respond.</p></div><div class="card"><h3>Interview guardrails</h3><div class="settings-row"><b>Before and after each interview</b><span>15-minute buffer</span></div><div class="settings-row"><b>Maximum interviews per day</b><span>3 per interviewer</span></div><div class="settings-row"><b>Availability unknown</b><span class="chip amber">Do not auto-book</span></div>${btn(icon('people')+'Try Find a time','schedule','primary',`style="margin-top:20px"`)}</div></div>`}
function masterPage(){if(state.persona!=='admin')return `<div class="heading"><div><div class="eyebrow">Settings → Connect</div><h1>Calendar providers</h1><p>Workspace configuration is separate from your personal account.</p></div></div><div class="card" style="max-width:700px;padding:35px"><span class="chip gray">${icon('lock')} Workspace admin only</span><h2 style="margin:15px 0 10px">Master setup needs administrator access</h2><p>You can connect your own account once a provider is enabled. Provider secrets and organisation-wide policies are never available to ordinary users.</p><div class="row" style="margin-top:22px">${btn('My connections','connections','primary')}${btn('Preview as workspace admin','admin-demo')}</div></div>`;return `<div class="heading"><div><div class="eyebrow">Settings → Connect → Calendars</div><h1>Calendar providers</h1><p>Enable providers once. People connect their own accounts from Calendar.</p></div>${chip('Workspace administrator')}</div><div class="notice">${icon('info')}<div>Master setup enables the integration; it grants no access to an employee’s calendar. Effective access still depends on consent, provider sharing and Payobook record permissions.</div></div><div class="master-grid">${['google','microsoft'].map(p=>`<div class="card"><div class="card-head"><span class="provider ${p==='microsoft'?'ms':''}">${providerMark(p)}</span><h3>${providerName(p)}</h3>${chip(state.master[p]?'Enabled':'Disabled',state.master[p]?'green':'gray')}</div><label class="field">${p==='google'?'OAuth client ID':'Application (client) ID'}<input readonly value="${p==='google'?'demo-client.apps.googleusercontent.com':'00000000-demo-only-not-a-real-app'}"><small>Illustrative configuration. No secrets are collected by this preview.</small></label><label class="field">${p==='google'?'Allowed workspace domains':'Allowed tenant'}<input readonly value="${p==='google'?'example.test':'Example organisation · single tenant'}"></label><label class="field">Callback / redirect URL<input readonly value="Set from the deployed Odoo provider configuration"><small>Use the exact environment-specific callback supplied by the integration; do not copy a guessed URL.</small></label><div class="settings-row"><div><b>Read calendars by default</b><p>Ask for write access only when the user enables editing.</p></div>${icon('check')}</div><div class="settings-row"><div><b>Company availability</b><p>Demo workspace only · no cross-company sharing</p></div>${chip('Scoped','gray')}</div><div class="row" style="margin-top:20px">${btn(state.master[p]?'Disable for new connections':'Enable provider','master-toggle:'+p,'small')}${btn('View readiness checklist','readiness:'+p,'ghost small')}</div></div>`).join('')}</div><div class="card"><h3>Administration boundaries</h3><div class="flow"><div><b>1 · Master setup</b><p>Register app, store encrypted credentials, approve tenant/domain and permissions.</p></div><div><b>2 · Company opt-in</b><p>Choose which companies may use it. Keep credentials, records and event access correctly scoped.</p></div><div><b>3 · Personal consent</b><p>People connect accounts and choose calendars. Revoke or reconnect without an admin ticket.</p></div><div><b>4 · Runtime access</b><p>Check current source permissions on every read and write. Admin status alone is not calendar delegation.</p></div></div></div>`}
function researchPage(){return `<article class="research"><div class="research-hero"><div class="eyebrow">Design proposal · 28 October 2026</div><h1>One calendar across Payobook.<br>Context stays with the work.</h1><p>A common Calendar beside Home, with a focused Calendar tab in Hiring → Interviews. Master provider configuration lives in Settings → Connect; personal accounts and preferences live in Calendar. This preview is the design review, not a live integration.</p><div class="row" style="margin-top:21px">${btn('Explore the calendar','calendar','primary')}${btn('Try interview scheduling','schedule')}</div></div><h2>Recommended navigation</h2><div class="card"><div class="flow"><div><b>Main menu · Calendar</b><p>My calendar · Find a time · Connections · Preferences. Shared across authorised modules.</p></div><div><b>Hiring · Interviews</b><p>List / Calendar tabs over the same interview records. Candidate, role and panel context remains here.</p></div><div><b>Settings · Connect</b><p>Google / Microsoft master configuration, tenant consent, company enablement and integration health.</p></div><div><b>Each source module</b><p>Owns leave approvals, learning sessions and hiring deadlines. The calendar links back to the authoritative record.</p></div></div><p>Keep your requested Hiring order: Overview, Roles, Job boards, Applicants, Interviews, Offers, Resume bank, Insights, Set-up, Access & delegations. A second Hiring Calendar menu would duplicate Interviews; the shared main-menu Calendar covers the cross-module need.</p></div><h2>What leading products inform</h2><div class="cards"><div class="card"><h3>Ashby · Coordinate the whole panel</h3><p>Its scheduling workflow brings candidate availability, interviewer calendars, room availability and interviewer limits into the same decision. Adopt an availability view with transparent reasons a slot is unavailable, then review the candidate invitation.</p><a class="source" href="https://docs.ashbyhq.com/manually-scheduling-interviews" target="_blank" rel="noopener noreferrer">Ashby · Manually scheduling interviews ↗</a><a class="source" href="https://docs.ashbyhq.com/direct-booking-and-candidate-availability-links" target="_blank" rel="noopener noreferrer">Ashby · Booking and candidate availability ↗</a></div><div class="card"><h3>Greenhouse · Respect working preferences</h3><p>Personal calendar connection, timezones and working hours shape interview availability. Adopt a focused Interviews calendar, while checking conflicts across all relevant calendars. Interviewers see only their authorised candidates.</p><a class="source" href="https://support.greenhouse.io/hc/en-us/articles/28929396249115-Set-your-interview-availability" target="_blank" rel="noopener noreferrer">Greenhouse · Interview availability ↗</a><a class="source" href="https://support.greenhouse.io/hc/en-us/articles/36307427046555-Scheduling-overview" target="_blank" rel="noopener noreferrer">Greenhouse · Scheduling overview ↗</a></div><div class="card"><h3>Calendly · Protect the time around meetings</h3><p>Buffers reserve preparation and recovery time between appointments. Adopt before/after buffers and minimum notice. Display filters must not silently remove conflict checks; connected-calendar selection is a separate setting.</p><a class="source" href="https://calendly.com/help/how-to-use-buffers" target="_blank" rel="noopener noreferrer">Calendly · Buffers ↗</a></div><div class="card"><h3>Google & Outlook · Permission is granular</h3><p>Free/busy, event details, editing and delegation are different rights. Adopt explicit access labels, private busy blocks and disabled edits with an explanation. Connecting an account must not grant new visibility to colleagues.</p><a class="source" href="https://support.google.com/calendar/answer/37082?hl=en" target="_blank" rel="noopener noreferrer">Google Calendar · Sharing permissions ↗</a><a class="source" href="https://support.microsoft.com/en-us/outlook/sharing/share-and-access-a-calendar-with-edit-or-delegate-permissions-in-outlook" target="_blank" rel="noopener noreferrer">Outlook · Editor and delegate access ↗</a></div></div><h2>Rules that make a shared calendar trustworthy</h2><div class="card table-wrap"><table><thead><tr><th>Event / access</th><th>What appears</th><th>What the person can do</th></tr></thead><tbody><tr><td>Authorised interview</td><td>Candidate, stage, panel, RSVP and meeting details</td><td>Recruiter or authorised organiser may reschedule; assigned interviewer sees their own interview.</td></tr><tr><td>Provider event · free/busy only</td><td>“Busy” and a time range; no title, attendees or links</td><td>Use for conflict checking. Never open private metadata or edit.</td></tr><tr><td>Provider event · read only</td><td>Details permitted by its owner</td><td>View. Edit at source only if the provider grants rights independently.</td></tr><tr><td>Provider event · writable</td><td>Permitted details and effective edit rights</td><td>Edit on the original source when organiser/delegate rights allow; RSVP as attendee is distinct.</td></tr><tr><td>Leave / learning / deadline</td><td>Only details allowed by the source module</td><td>Open its source workflow. Do not move a leave approval by dragging a calendar card.</td></tr><tr><td>Private recurring event</td><td>Only permitted occurrence information</td><td>For writable events, choose occurrence or series and review invitees. Series editing is deferred in this POC.</td></tr></tbody></table><p class="source-note">Production rule: intersect company access, source record rules, effective provider permissions and operation-specific rights on the server. Admin setup is not delegated access. Demo personas illustrate the experience only; they are not an access-control implementation.</p></div><h2>Integration model and failure handling</h2><div class="cards"><div class="card"><h3>One event, one source of truth</h3><p>Keep one canonical event linked to its interview and provider identifiers. Google and Microsoft may both be connected, but an event has one writable destination. Suppress echoed updates and duplicate invitations. Match provider copies through durable IDs, not similar titles.</p><ul><li>Review changed times, attendees, source and notification impact before saving.</li><li>Recheck current permissions and availability immediately before booking.</li><li>Record reschedule reason, actor and audit history. External changes need recruiter review when intent is unknown.</li><li>Save UTC instants and IANA timezones; preserve recurrence exceptions and all-day dates.</li></ul></div><div class="card"><h3>Never mistake unknown for free</h3><p>Use provider change feeds with reconciliation and visible last-sync status. Expired consent, throttling or a failed availability request must produce “availability unknown”, not an empty calendar. Reconnect without duplicating events.</p><ul><li>Use idempotent writes, optimistic concurrency and a retry/outbox queue.</li><li>Handle provider deletion, cancellation, moved occurrences and revoked sharing.</li><li>Keep private information out of logs, notifications and unauthorised cached responses.</li><li>Disconnect revokes access and purges cached private metadata according to retention policy; provider events are preserved.</li></ul><a class="source" href="https://developers.google.com/workspace/calendar/api/guides/sync" target="_blank" rel="noopener noreferrer">Google · Incremental sync ↗</a><a class="source" href="https://learn.microsoft.com/en-us/graph/delta-query-events" target="_blank" rel="noopener noreferrer">Microsoft Graph · Calendar-view delta ↗</a><a class="source" href="https://learn.microsoft.com/en-us/graph/outlook-share-or-delegate-calendar" target="_blank" rel="noopener noreferrer">Microsoft Graph · Shared/delegated calendars ↗</a></div></div><h2>Payobook foundations and delivery sequence</h2><div class="card"><p>Repository review found native Calendar, Google and Microsoft dependencies, linked interview events, inbound calendar rescheduling/cancellation, provider free/busy checks and expiring candidate booking links. Existing booking selects one provider per invitation; a simultaneous cross-provider view, permission-safe aggregation and a consistent source-selection model need dedicated implementation and validation.</p><div class="milestone"><b>1</b><div><strong>Unified view & personal connections</strong><small>Server-enforced permissions, duplicate suppression, timezones, source links, reconnect states and admin setup. Pilot with test tenants.</small></div></div><div class="milestone"><b>2</b><div><strong>Safe edits & interview scheduling</strong><small>Current permission checks, concurrent booking protection, buffers, notification review, cancellations and audit history.</small></div></div><div class="milestone"><b>3</b><div><strong>Candidate and resource coordination</strong><small>Candidate availability requests, expiring self-booking links, rooms, panel pools, capacity preferences and recurring-series editing.</small></div></div><p style="margin-top:15px">Before production: verify Odoo connector behaviour for both providers together, OAuth scope and tenant consent requirements, multi-company isolation, recurring-event edits, mobile usability, retry recovery and the identity of the invitation organiser. No new provider permissions or real account access are requested by this prototype.</p></div><h2>Try these review journeys</h2><div class="cards"><div class="card"><h3>Calendar, permissions and editing</h3><p>Switch Week / Month / Agenda; change timezone; open Sofia’s interview; inspect a private Busy block; change persona to Interviewer or Employee. Reschedule an editable event and inspect the review step. Try a recurring event’s one-occurrence edit.</p></div><div class="card"><h3>Scheduling, connections and setup</h3><p>Find a time → change duration, buffers, room or the extra panellist → choose a valid slot → review → book in the demo. Connect Microsoft in read-only mode, then enable editing. Inspect Settings as a member and as an admin.</p></div></div><div class="notice">${icon('info')}<div><b>Prototype scope:</b> in-memory fictional events, simulated consent/sync, illustrative availability and permission personas. No actual OAuth, messages, provider writes, candidate links, drag-and-drop or recurrence-series edits. Reload resets the demo. Public preview contains no customer data.</div></div></article>`}

p((p,i)=>`<div class="attendee"><span class="avatar">${p.split(' ').map(x=>x[0]).join('')}</span><span>${p}${i===0?' <small style="margin-left:5px;color:var(--muted)">Organiser</small>':''}</span><small>${i===0?'Accepted':'Tentative'}</small></div>`).join('')}${e.type==='interview'?`<div class="section-label">Candidate</div><div class="review-summary"><b>${esc(e.title.split(' · ')[0])}</b><p>${esc(e.role)} · invitation accepted</p><p>Candidate timezone: Asia/Ho_Chi_Minh</p><p>${time(e.start,'Asia/Ho_Chi_Minh')} – ${time(end(e),'Asia/Ho_Chi_Minh')} local time</p></div>`:''}${!writable?`<div class="notice" style="margin-top:20px">${icon('lock')}<div>${['learning','deadline'].includes(e.type)?'This event belongs to its source workflow. Calendar changes must not bypass that workflow.':'You are not an authorised organiser/editor for this event. Contact its organiser to change the time.'}</div></div>`:''}<div class="section-label">Activity</div><p style="font-size:11px">${state.history.filter(h=>h.id===id).map(h=>esc(h.text)).join('<br>')||'Sample event · synced just now'}</p>`}</div><div class="drawer-foot">${writable?btn('Cancel event','cancel:'+id,'ghost')+btn(icon('calendar')+(e.type==='interview'?'Reschedule':'Edit event'),'edit:'+id,'primary'):btn('Done','close')}${['learning','deadline'].includes(e.type)?btn('View source preview','source:'+id,'primary'):''}</div>`,'drawer')}

function reviewEdit(id){const e=accessible().find(x=>x.id===id);if(!e||!canEdit(e))return;const form=document.getElementById('edit-form');if(!form.reportValidity())return;const start=localToISO(document.getElementById('edit-date').value,document.getElementById('edit-time').value);if(!start)return toast('That local time does not exist because the clocks change. Choose another time.');const stop=+new Date(start)+e.duration*60000;if(events.some(x=>x.id!==id&&!x.cancelled&&new Date(x.start)<stop&&new Date(end(x))>new Date(start)&&x.type!=='deadline'))return toast('That time overlaps a sample event. Choose another time.');state.pending={kind:'edit',id,start,title:document.getElementById('edit-title').value.trim(),reason:document.getElementById('edit-reason').value.trim()};modal('Review the change',`<div class="notice">${icon('info')}<div>In production this updates the original event and sends one update to attendees.</div></div><h3>${esc(e.title)}</h3><div class="review-summary"><div class="review-line"><span>From</span><b>${dayLabel(localParts(e.start).date)} · ${time(e.start)}</b></div><div class="review-line"><span>To</span><b>${dayLabel(localParts(start).date)} · ${time(start)}</b></div><div class="review-line"><span>Calendar</span><b>${providerName(e.provider)}</b></div><div class="review-line"><span>Notify</span><b>${e.type==='interview'?'Candidate + interview panel':'Event attendees'}</b></div>${e.recurring?'<div class="review-line"><span>Scope</span><b>This occurrence only</b></div>':''}</div><p>Reason: ${esc(state.pending.reason)}</p><p class="source-note">No message will be sent in this prototype. Time shown in ${esc(state.zone)}.</p>`,btn('Back','edit:'+id)+btn('Confirm in prototype','confirm-edit','primary'))}
function cancelEvent(id){const e=accessible().find(x=>x.id===id);if(!e||!canEdit(e))return;modal('Cancel this event?',`<h3>${esc(e.title)}</h3><p style="margin:12px 0">The event would be cancelled on ${providerName(e.provider)}${e.type==='interview'?' and in Hiring':''}. Its attendees would receive one cancellation.</p>${e.recurring?'<p>Only this occurrence is affected.</p>':''}<label class="field" style="margin-top:15px">Cancellation reason<textarea id="cancel-reason" required placeholder="Tell attendees why it is cancelled"></textarea></label><p class="source-note">This action changes sample data only.</p>`,btn('Keep event','event:'+id)+btn('Cancel in prototype','confirm-cancel:'+id,'primary'))}

function slots(){const result=[];const duration=state.duration,buffer=state.buffer;for(let minute=13*60;minute<=16*60;minute+=30){const hr=String(Math.floor(minute/60)).padStart(2,'0'),mi=String(minute%60).padStart(2,'0');const start=new Date(`2026-10-29T${hr}:${mi}:00+11:00`),finish=new Date(+start+duration*60000),a=+start-buffer*60000,b=+finish+buffer*60000;let reason='';if(state.panelExtra)reason='Oliver is at his daily interview limit';else if(state.expired.google&&state.checked.google)reason='Google availability is unknown';else if(state.expired.microsoft&&state.checked.microsoft)reason='Microsoft availability is unknown';else if(minute<13*60+60+buffer)reason='Nina is busy, including buffer';else if(minute+duration+buffer>17*60)reason='Outside candidate / panel availability';else if(state.room==='room'&&minute<15*60)reason='Studio 2 is occupied';else if(events.some(e=>!e.cancelled&&e.type!=='deadline'&&(e.provider==='payobook'||state.checked[e.provider])&&+new Date(e.start)<b&&+new Date(end(e))>a))reason='Existing meeting + buffer';result.push({start:start.toISOString(),end:finish.toISOString(),reason})}return result}
function drawSchedule(){const data=slots();if(!data.some(s=>s.start===state.selectedSlot&&!s.reason))state.selectedSlot=null;modal('Find a time for an interview',`<div class="scheduler"><div class="left"><div class="eyebrow">Candidate</div><h3>Mila Patel</h3><p style="font-size:11px;margin:4px 0 16px">Product Designer · Portfolio review</p><div class="person"><span class="avatar">MA</span><div><b>Maya Adams</b><small>Organiser · Sydney</small></div></div><div class="person"><span class="avatar">NT</span><div><b>Nina Tran</b><small>Interviewer · Ho Chi Minh City</small><div class="capacity"><i></i></div><small>1 of 3 interviews planned</small></div></div><label class="filter"><input type="checkbox" id="panel-extra" ${state.panelExtra?'checked':''}>Add Oliver · 3/3 interviews</label><div class="form-grid" style="margin-top:16px"><label class="field">Duration<select id="slot-duration">${[30,45,60].map(n=>`<option value="${n}" ${n===state.duration?'selected':''}>${n} min</option>`).join('')}</select></label><label class="field">Buffer each side<select id="slot-buffer">${[0,15,30].map(n=>`<option value="${n}" ${n===state.buffer?'selected':''}>${n} min</option>`).join('')}</select></label></div><label class="field">Location<select id="slot-room"><option value="video" ${state.room==='video'?'selected':''}>Google Meet</option><option value="room" ${state.room==='room'?'selected':''}>Studio 2 · in person</option></select></label><p class="source-note">24-hour minimum notice. Working hours: 09:00–17:00 in each person’s timezone. Capacity is a hard limit in this sample.</p></div><div><div class="row" style="justify-content:space-between"><h3>Thursday, 29 October</h3>${chip('Sydney · AEDT','gray')}</div><p style="font-size:11px;margin:8px 0">Candidate availability: 13:00–17:00 Sydney<br>09:00–13:00 Ho Chi Minh City</p><div class="availability"><span></span>${['13','', '14','', '15','', '16',''].map(x=>`<span>${x}</span>`).join('')}<span>Candidate</span>${Array(8).fill('<div class="cell"></div>').join('')}<span>Nina</span>${Array.from({length:8},(_,i)=>`<div class="cell ${i<2?'busy':''}"></div>`).join('')}<span>Maya</span>${Array.from({length:8},(_,i)=>`<div class="cell ${i===5||i===6?'busy':''}"></div>`).join('')}</div><div class="timeline-key"><span>■ Green · available</span><span>■ Grey · busy</span></div><div style="margin-top:15px;max-height:280px;overflow:auto">${data.map(s=>`<button class="slot ${s.reason?'blocked':state.selectedSlot===s.start?'selected':''}" data-action="slot:${s.start}" ${s.reason?'disabled':''}><span><b>${time(s.start,'Australia/Sydney')} – ${time(s.end,'Australia/Sydney')}</b><small>${s.reason||`${time(s.start,'Asia/Ho_Chi_Minh')} candidate local time · ${state.buffer} min buffer`}</small></span>${!s.reason?chip(state.selectedSlot===s.start?'Selected':'Available',state.selectedSlot===s.start?'':'green'):icon('lock')}</button>`).join('')}</div>${data.every(s=>s.reason)?'<p style="color:var(--amber);font-size:11px;margin-top:12px">No shared slots. Try a shorter interview, another room or removing the extra panellist.</p>':''}</div></div>`,btn('Cancel','close')+btn('Review invitation','review-booking','primary',state.selectedSlot?'':'disabled'),true)}
function reviewBooking(){const slot=slots().find(s=>s.start===state.selectedSlot&&!s.reason);if(!slot)return;const provider=state.google&&state.googleEdit?'google':'payobook';state.pending={kind:'booking',start:slot.start,duration:state.duration,provider,buffer:state.buffer,room:state.room};modal('Review the interview invitation',`<span class="chip green">${icon('check')} Sample panel and candidate are available</span><h2 style="margin:17px 0 5px">Mila Patel · Portfolio review</h2><p>Product Designer</p><div class="review-summary"><div class="review-line"><span>Date</span><b>Thursday, 29 October 2026</b></div><div class="review-line"><span>Your time · Sydney</span><b>${time(slot.start,'Australia/Sydney')} – ${time(slot.end,'Australia/Sydney')}</b></div><div class="review-line"><span>Candidate · Ho Chi Minh City</span><b>${time(slot.start,'Asia/Ho_Chi_Minh')} – ${time(slot.end,'Asia/Ho_Chi_Minh')}</b></div><div class="review-line"><span>Location</span><b>${state.room==='room'?'Studio 2':provider==='google'?'Google Meet · created on booking':'Video link to be added by organiser'}</b></div><div class="review-line"><span>Invitation organiser</span><b>Maya · ${providerName(provider)}</b></div><div class="review-line"><span>Recipients</span><b>Mila, Maya and Nina</b></div><div class="review-line"><span>Record</span><b>One interview, linked to Hiring</b></div></div><div class="notice">${icon('send')}<div>Live booking would recheck availability and send one invitation. This demo only adds a fictional calendar event.</div></div>`,btn('Back','schedule-back')+btn('Book in prototype','confirm-booking','primary'))}

document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;const colon=action.indexOf(':'),kind=colon<0?action:action.slice(0,colon),value=colon<0?'':action.slice(colon+1);if(['calendar','interviews','connections','preferences','master','research'].includes(kind))return movePage(kind);switch(kind){

 case 'prev':case 'next':{const sign=kind==='prev'?-1:1;if(state.view==='month'){const d=new Date(state.date.slice(0,7)+'-01T12:00:00Z');d.setUTCMonth(d.getUTCMonth()+sign);state.date=d.toISOString().slice(0,10)}else state.date=dateAdd(state.date,sign*(state.view==='day'?1:7));break}

 case 'date':state.date=value;break;

 case 'edit':return editEvent(+value);
 case 'review-edit':return reviewEdit(+value);
 case 'confirm-edit':{const p=state.pending,e=accessible().find(x=>x.id===p?.id);if(!e||!canEdit(e))return;e.start=p.start;e.title=p.title;state.history.push({id:e.id,text:'Rescheduled in demo · '+p.reason});close();render();return toast('Sample event updated. No invitations were sent.')}
 case 'cancel':return cancelEvent(+value);
 case 'confirm-cancel':{const e=accessible().find(x=>x.id===+value),field=document.getElementById('cancel-reason');if(!e||!canEdit(e)||!field.reportValidity())return;e.cancelled=true;state.history.push({id:e.id,text:'Cancelled in demo · '+field.value});close();render();return toast('Sample event cancelled. Provider calendars are unchanged.')}
 case 'leave':return modal('Oliver · on leave',`<span class="chip gray">Shared availability only</span><p style="margin-top:15px">Wednesday, 28 October · morning. Leave type, reason and supporting documents are hidden. Changes belong in the People leave workflow.</p>`,btn('Done','close'));
 case 'source':{const e=accessible().find(x=>x.id===+value);return modal('Source workflow preview',`<h3>${esc(e.title)}</h3><p style="margin-top:12px">This would open the authorised ${e.type==='learning'?'Learning session':'Hiring approval'} record in Payobook. Calendar display does not confer permission to approve or modify the source.</p>`,btn('Done','close'))}
 case 'connect':return openConnect(value);
 case 'manage':return openConnect(value,true);
 case 'confirm-connect':{const selected=[];if(document.getElementById('connect-primary').checked)selected.push('primary');if(document.getElementById('connect-team').checked)selected.push('team');if(!selected.length)return toast('Choose at least one calendar.');state[value]=true;state.expired[value]=false;state.connectedCalendars[value]=selected;state[value==='google'?'googleEdit':'msEdit']=selected.includes('primary')&&document.getElementById('connect-write').checked;if(value==='microsoft'){state.msHealthy=true;if(!events.some(e=>e.id===20))events.push({id:20,title:'Regional planning',type:'meeting',start:'2026-10-29T01:00:00Z',duration:60,detail:'Microsoft Teams · shared calendar',provider:'microsoft',owner:false});if(!events.some(e=>e.id===21))events.push({id:21,title:'Regional check-in',type:'meeting',start:'2026-10-28T05:15:00Z',duration:45,detail:'Microsoft Teams · my work',provider:'microsoft',owner:true})}if(state.defaultCalendar===value&&!state[value==='google'?'googleEdit':'msEdit'])state.defaultCalendar='payobook';close();render();return toast(providerName(value)+' connected in the demo. No real account was accessed.')}
 case 'disconnect':return modal('Disconnect '+providerName(value)+'?',`<p>Future sync would stop and cached private data would be removed according to policy. Events on ${providerName(value)} are not deleted. Linked Hiring records remain in Payobook.</p><p class="source-note">This preview changes connection status only.</p>`,btn('Keep connection','close')+btn('Disconnect sample','confirm-disconnect:'+value,'primary'));
 case 'confirm-disconnect':state[value]=false;state.checked[value]=false;state.expired[value]=false;if(state.defaultCalendar===value)state.defaultCalendar='payobook';close();render();return toast('Sample connection removed. Provider events were not deleted.');
 case 'sync':return modal('Connection health · '+providerName(value),`<div class="notice green">${icon('check')}<div>Sample connection is healthy. Last checked: just now.</div></div><p>A production sync would pull permitted changes and reconcile deleted events. It must not send invitations merely because a view refreshes.</p><p class="source-note">Use the failure simulation to review recovery behaviour.</p>`,btn('Simulate expired consent','expire:'+value)+btn('Done','close','primary'));
 case 'expire':state[value]=false;state.expired[value]=true;state.checked[value]=true;state.msHealthy=false;close();state.page='connections';render();return modal('Reconnect to restore availability',`<div class="notice amber">${icon('info')}<div>${providerName(value)} consent has expired in this simulation. Availability is unknown, so automatic booking cannot rely on it.</div></div><p>Existing invitations remain at the provider. Reauthorising must reconcile the same events, not create copies.</p>`,btn('Later','close')+btn('Reconnect sample account','connect:'+value,'primary'));
 case 'admin-demo':state.persona='admin';break;
 case 'master-toggle':state.master[value]=!state.master[value];render();return toast('Demo policy updated for new connections. Existing tokens are unchanged.');
 case 'readiness':return modal(providerName(value)+' readiness',`<div class="milestone"><b>1</b><div>Register the OAuth app<small>Exact environment callback, verified domain / tenant.</small></div></div><div class="milestone"><b>2</b><div>Store credentials securely<small>Encrypted server-side, restricted administrator access, rotation procedure.</small></div></div><div class="milestone"><b>3</b><div>Approve required permissions<small>Least privilege; separate read consent from write operations.</small></div></div><div class="milestone"><b>4</b><div>Test with a nonproduction account<small>Read, busy-only access, edit, cancellation, revoke, reconnect and isolation.</small></div></div><p class="source-note">This is a design checklist, not a connection health test.</p>`,btn('Done','close'));
 case 'schedule':return openSchedule();
 case 'schedule-back':return drawSchedule();
 case 'slot':state.selectedSlot=value;return drawSchedule();
 case 'review-booking':return reviewBooking();
 case 'confirm-booking':{const p=state.pending;if(!p||p.kind!=='booking'||!slots().some(s=>s.start===p.start&&!s.reason))return toast('Availability changed. Return to choose another slot.');events.push({id:Math.max(...events.map(e=>e.id))+1,title:'Mila Patel · Product Designer',type:'interview',start:p.start,duration:p.duration,detail:'Portfolio review · '+(p.room==='room'?'Studio 2':p.provider==='google'?'Google Meet':'Video link to be added'),provider:p.provider,owner:true,panel:true,attendees:['Maya Adams','Nina Tran'],role:'Product Designer'});state.date='2026-10-29';state.view='week';close();render();return toast('Interview added to the sample calendar. No invitation was sent.')}
 case 'new':return openNew();
 case 'confirm-new':{if(!document.getElementById('new-form').reportValidity())return;const date=document.getElementById('new-date').value;const title=document.getElementById('new-title').value.trim();if(!title)return toast('Enter an event title.');const start=localToISO(date,document.getElementById('new-time').value);if(!start)return toast('That local time does not exist because the clocks change. Choose another time.');events.push({id:Math.max(...events.map(e=>e.id))+1,title,type:'meeting',start,duration:+document.getElementById('new-duration').value,detail:'Personal event · no invitees',provider:document.getElementById('new-provider').value,owner:true,creatorPersona:state.persona});state.date=date;close();render();return toast('Personal sample event created. No invitation was sent.')}
}render()});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='persona'){state.persona=el.value;state.query='';close();render()}else if(el.id==='timezone'){state.zone=el.value;render()}else if(el.dataset.source){el.checked?state.sources.add(el.dataset.source):state.sources.delete(el.dataset.source);render()}else if(el.dataset.conflict){state.checked[el.dataset.conflict]=el.checked;toast('Conflict-check preferences updated in the demo.')}else if(el.id==='default-calendar'){state.defaultCalendar=el.value;toast('Default destination updated in the demo.')}else if(['slot-duration','slot-buffer','slot-room','panel-extra'].includes(el.id)){if(el.id==='slot-duration')state.duration=+el.value;if(el.id==='slot-buffer')state.buffer=+el.value;if(el.id==='slot-room')state.room=el.value;if(el.id==='panel-extra')state.panelExtra=el.checked;drawSchedule()}});
document.addEventListener('input',event=>{if(event.target.id==='event-search'){state.query=event.target.value;document.getElementById('calendar-results').innerHTML=calendarView();const count=document.querySelector('.calendar-foot span:last-child');if(count)count.textContent=visible().filter(inPeriod).length+' events · sample data'}});
document.addEventListener('keydown',event=>{if(event.key==='Escape')close();if((event.metaKey||event.ctrlKey)&&event.key==='k'){event.preventDefault();searchDialog()}if(event.key==='Tab'&&document.getElementById('overlay').children.length){const nodes=[...document.querySelectorAll('#overlay button:not([disabled]),#overlay input:not([disabled]),#overlay select,#overlay textarea,#overlay a[href]')].filter(e=>e.offsetParent!==null);if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
render();
</script>
</body>
