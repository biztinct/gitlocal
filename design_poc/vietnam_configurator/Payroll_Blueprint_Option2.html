function outputsPage(s){if(s.error)return `${head('04 / Outputs & formulas','See what your rules create.','Resolve the calculation issue below to review the final outputs.')}<div class="banner">${esc(s.error)}</div>${btn('Return to pay rules','journey-fix','primary')}`;const schema=s.schema;let rows=outputFilter==='inputs'?schema.inputs:schema.nodes.filter(n=>outputFilter==='all'?n.group!=='internal':outputFilter==='manual'?n.manual:n.group===outputFilter);return `${head('04 / Outputs & formulas','See what your rules create.','Review every output before testing or creating the schema. The Excel formulas below are the same formulas used for the sample calculation.')}<div class="flow"><span>${schema.inputs.length} inputs & parameters</span><i>→</i><span>${schema.components.length} components</span><i>→</i><span>${schema.nodes.length} Excel rules</span><i>→</i><span>Net pay & employer cost</span></div><div class="split"><label class="field" style="margin:0 0 16px">Show formulas<select data-output-filter aria-label="Show formulas">${[['outputs','Final payroll outputs'],['inputs','Inputs & parameters'],['earnings','Earnings'],['deductions','Deductions'],['benefits','Benefits / employer costs'],['helpers','Intermediate calculations'],['manual','Manual Excel edits'],['all','All visible formula rules']].map(([v,t])=>`<option value="${v}" ${outputFilter===v?'selected':''}>${t}</option>`).join('')}</select></label>${btn('Export Excel rule package','export','small')}</div><div class="tablewrap outputtable"><table><thead><tr><th>Component / output</th><th>${outputFilter==='inputs'?'Input meaning':'Excel formula'}</th><th>Sample value</th><th>Review</th></tr></thead><tbody>${rows.map(n=>`<tr><td><b>${esc(n.name||n.description)}</b><div class="code" style="margin-top:6px">${esc(n.code)}</div></td><td>${n.excel_formula?`<code class="excelinline">${esc(n.excel_formula)}</code>`:esc(n.description)}<div class="mini">${n.manual?'Manual edit preserved':n.excel_formula?'Generated from your settings':'Typed input / parameter'}</div></td><td class="num">${cash(s.values[n.code])}</td><td>${n.excel_formula?btn('Inspect / edit','formula','small',`data-code="${esc(n.code)}"`):pill(n.type,'gray')}</td></tr>`).join('')||'<tr><td colspan="4">No items in this view.</td></tr>'}</tbody></table></div><div class="banner info">Amounts are VND unless the payment output specifies USD. Inspect any formula to see its dependencies and compare manual edits with the guided version. The 32 gross-up helper steps are included in the export.</div>`}
function journeyReview(s){return reviewPage(s)+`<div class="card"><div class="split"><h2>Optional setup handoff</h2>${btn('Manage in Settings','journey-settings','small')}</div>${[['mapping','Source mapping'],['approvals','Approval matrix'],['payslip','Payslip mapping']].map(([k,t])=>`<div class="linkrow"><b>${t}</b>${statusPill(k)}</div>`).join('')}<p class="mini" style="margin-top:14px">These statuses travel with this schema. A skipped task remains available through its own Settings menu.</p></div>`}
function settingsModal(){settingsOrigin=true;modal('Settings · configuration workspace',`<div class="scopebar" style="margin-top:20px"><span>Company <b>${esc(bp.journey.company)}</b></span><span>Schema <b>${esc(bp.name)}</b></span></div><p style="margin-top:18px">Return here after creation to manage this schema’s configuration. Changes are local to this prototype.</p>${[['mapping','Source mapping','journey-mapping','Existing Mapping Studio / Mapping Canvas'],['approvals','Approval matrices','journey-approvals','Schema-specific workflow design'],['payslip','Payslip Studio','journey-payslip','Existing Payslip Studio layout editor']].map(([key,title,action,sub])=>`<div class="linkrow"><div><h3>${title}</h3><p>${sub}</p>${statusPill(key)}</div>${btn('Manage →',action,'small')}</div>`).join('')}<div class="banner info">In production these are separate menu entries scoped to the selected schema. Existing studios are reused; the approval-matrix menu and versioned model are proposed extensions.</div>`,btn('Return to configuration','close','primary'));}
function scope(){return `<div class="scopebar" style="margin:18px 0"><span>Company <b>${esc(bp.journey.company)}</b></span><span>Schema <b>${esc(bp.name)}</b></span></div>`}
function mappingModal(){const m=bp.journey.mapping,s=summary();if(s.error){toast(s.error);return}const options=s.schema.inputs.filter(i=>!i.code.startsWith('PARAM_')).map(i=>[i.code,i.code]);modal('Mapping Studio · source → schema',`${scope()}<div class="mappingheader"><div><div class="eyebrow">FROM</div><select data-mapping-source aria-label="Mapping source">${Object.entries(SAMPLE_FEEDS).map(([k,v])=>`<option value="${k}" ${m.source===k?'selected':''}>${v.label}</option>`).join('')}</select></div><div class="wirearrow">→</div><div><div class="eyebrow">TO</div><b>${esc(bp.name)}</b><div class="mini">Generated payroll inputs</div></div></div><p class="mini" style="margin-top:18px">Representative Mapping Canvas interaction using a synthetic feed. Connect each source field to a payroll input; validate the sample before saving.</p><div id="mappingFeedback" role="status"></div><div class="mappingrows">${m.rows.map((r,i)=>`<div class="mappingrow"><div>${field('Source field','journey.mapping.rows.'+i+'.field','text',[['','Choose source'],...Object.entries(SAMPLE_FEEDS[m.source].fields).map(([key,value])=>[key,key+' · '+value])])}</div><div class="wirearrow">→</div><div>${field('Payroll input','journey.mapping.rows.'+i+'.target','text',options)}</div><div>${field('Transform','journey.mapping.rows.'+i+'.transform','text',[['identity','As received'],['number','To number'],['thousands','Thousands → VND']])}</div>${btn('×','journey-map-remove','quiet',`data-index="${i}" aria-label="Remove mapping ${i+1}"`)}</div>`).join('')}</div><div class="row">${btn('+ Add mapping','journey-map-add','small')}${btn('Validate & try mapped sample','journey-map-test','small')}</div><div class="banner info">${m.rows.length} mapped fields are shown. Parameters remain in the rule pack. Bank account destinations use separate text lanes in the existing canvas; they are not numeric payroll inputs.</div><details><summary>Implementation connection</summary><p class="mini">Reuse the registered pb_mapping_studio action, MappingStudio and MappingCanvas. Pass pb_config, pb_mode and the source identity; preserve a return-to-wizard destination. No API is called by this HTML.</p></details>`,btn('Skip for now','journey-skip','',`data-key="mapping"`)+btn('Save mapping draft','journey-map-save','primary'));}
function approvalsModal(){const a=bp.journey.approvals;modal('Approval matrix · this schema',`${scope()}${field('Matrix name','journey.approvals.name')}<p class="mini">The 10 workbook rows describe different transaction workflows, not ten serial approvals for every payroll. Edit the roles and controls for each event.</p><label class="check"><input type="checkbox" data-path="journey.approvals.separation" ${a.separation?'checked':''}><span>Separate maker from reviewer and approver<small>Production enforcement must resolve distinct people, even when they hold multiple roles.</small></span></label><div id="approvalFeedback" role="status"></div><div class="approvalrows">${a.rows.map((r,i)=>`<div class="linkrow"><label class="row" style="align-items:flex-start"><input type="checkbox" data-path="journey.approvals.rows.${i}.enabled" ${r.enabled?'checked':''}><div><b>${esc(r.object)}</b><p>${esc(r.maker)} → ${esc(r.reviewer)} → ${esc(r.approver)}</p><div class="mini">${esc(r.sla)} · ${esc(r.threshold)}</div></div></label>${btn('Edit','journey-approval-edit','small',`data-index="${i}"`)}</div>`).join('')}</div>${btn('+ Add transaction rule','journey-approval-add','small')}<div class="banner info">Named users, delegates and limits may remain unassigned in a draft. They must resolve to authorized company users before this matrix can be activated. Workbook “Ready” flags are not approval evidence.</div>`,btn('Skip for now','journey-skip','',`data-key="approvals"`)+btn('Save matrix draft','journey-approval-save','primary'));}
function approvalEdit(i){const p='journey.approvals.rows.'+i,r=bp.journey.approvals.rows[i];modal('Approval rule · '+r.object,`${scope()}${field('Transaction / event',p+'.object')}<div class="grid2">${field('Maker role',p+'.maker')}${field('Reviewer role',p+'.reviewer')}${field('Final approver role(s)',p+'.approver')}${field('Final decision rule',p+'.decision','text',[['all','All selected approvers'],['any','Any one authorized approver'],['sequential','Approve in defined order']])}${field('Named assignee · optional draft identifier',p+'.assignee')}${field('Backup / delegate · optional',p+'.delegate')}${field('Threshold / limit · policy description',p+'.threshold')}${field('SLA / deadline',p+'.sla')}${field('If rejected',p+'.onReject','text',[['return','Return to maker with reason'],['stop','Stop this transaction']])}${field('Escalation owner / role',p+'.escalate')}</div>${field('Required evidence / control',p+'.evidence')}<div class="mini">Source: ${esc(r.source)}. Threshold text is a policy draft; the implementation must use typed conditions with units and currency. Named identifiers are not validated against live users here.</div>`,btn('Back to matrix','journey-approvals','primary'));}
function payslipModal(){const p=bp.journey.payslip;if(!p.rows.length)p.rows=seedPayslip(bp);modal('Payslip Studio · map the employee view',`${scope()}<div class="grid2">${field('Payslip language','delivery.language','text',[['both','Vietnamese + English'],['vi','Vietnamese'],['en','English']])}${field('Release payslip','delivery.release','text',[['confirmed','After payment confirmation'],['approved','After payroll approval · review policy']])}</div><p class="mini">Place outputs into sections and edit display labels. Layout changes do not rewrite payroll calculations.</p><div id="payslipFeedback" role="status"></div><div class="tablewrap"><table><thead><tr><th>Show</th><th>Component / label</th><th>Section</th><th>Hide zero</th></tr></thead><tbody>${p.rows.map((r,i)=>`<tr><td><input type="checkbox" aria-label="Show ${esc(r.code)} on payslip" data-path="journey.payslip.rows.${i}.show" ${r.show?'checked':''}></td><td><div class="code">${esc(r.code)}</div>${field('English label · '+r.code,'journey.payslip.rows.'+i+'.label')}${field('Vietnamese label · '+r.code,'journey.payslip.rows.'+i+'.labelVi')}</td><td>${selectHtml('journey.payslip.rows.'+i+'.section',[['earnings','Earnings'],['deductions','Deductions'],['benefits','Non-cash benefits'],['summary','Summary']],'Section for '+r.code)}</td><td><input type="checkbox" aria-label="Hide zero ${esc(r.code)}" data-path="journey.payslip.rows.${i}.hideZero" ${r.hideZero?'checked':''}></td></tr>`).join('')}</tbody></table></div><div class="row" style="margin-top:18px">${btn('Add newly included components','journey-payslip-sync','small')}${btn('Preview mapped payslip','journey-payslip-preview','small')}</div><details style="margin-top:20px"><summary>Implementation connection</summary><p class="mini">Reuse Formula Studio’s Payslip Studio: payslip_studio_data, move_component, create_section, update_section, reorder_sections and save_payslip_theme. Existing rule visibility/section fields are the persistent mapping. The HTML uses the same concepts without writing live records.</p></details>`,btn('Skip for now','journey-skip','',`data-key="payslip"`)+btn('Save payslip mapping draft','journey-payslip-save','primary'));}
function mappedPayslipPreview(){validatePayslip(bp);const s=summary();if(s.error)throw Error(s.error);const rows=bp.journey.payslip.rows.filter(r=>r.show&&(!r.hideZero||s.values[r.code]!==0));modal('Mapped payslip · synthetic preview',`${scope()}<div class="card"><h2>PHIẾU LƯƠNG / PAYSLIP</h2><p class="mini">SAMPLE-001 · September 2026 · Confidential</p>${[['earnings','Earnings / Thu nhập'],['deductions','Deductions / Khấu trừ'],['benefits','Benefits / Phúc lợi'],['summary','Summary / Tổng cộng']].map(([key,title])=>{const sec=rows.filter(r=>r.section===key);return sec.length?`<div class="sectiontitle">${title}</div><div class="receipt">${sec.map(r=>`<div><span>${esc(bp.delivery.language==='en'?r.label:bp.delivery.language==='vi'?r.labelVi||r.label:r.labelVi?r.labelVi+' / '+r.label:r.label)}</span><b>${cash(s.values[r.code])} VND</b></div>`).join('')}</div>`:''}).join('')}</div><div class="mini">Missing Vietnamese labels fall back to English in this demo and remain translation work for rollout. Net pay is a final result; summary lines are not added to the earnings section again.</div>`,btn('Back to Payslip Studio','journey-payslip','primary'));}
function importModal(){modal('Import Excel · review the definition',`${scope()}<div class="banner info">Design walkthrough: local .xlsx parsing is not connected in this HTML. Selecting a file records its name only. The example workbook below demonstrates the review and creates actual editable rules in the prototype.</div><label class="field">Select a workbook for the proposed import<input type="file" accept=".xlsx,.xls,.csv" data-import-file></label><div id="importFileStatus" class="mini">${esc(bp.journey.import.filename||'No file selected')}</div><div class="hero"><h2>Try an illustrative payroll workbook</h2><p>Four component rows demonstrate salary inputs, a fixed allowance, a contribution formula and PIT generated from the selected tax rules.</p>${btn('Review example workbook','journey-import-example','primary')}</div><div class="flow"><span>Select workbook</span><i>→</i><span>Choose sheets & headers</span><i>→</i><span>Classify inputs / rules</span><i>→</i><span>Validate formulas</span><i>→</i><span>Apply reviewed rows</span></div>`,btn('Back','close'));}
function importReview(){if(!importDraft.length)importDraft=stageSampleImport();modal('Review example workbook · before applying',`<p style="margin-top:20px">Illustrative data, not extracted from your selected file. The production review will show original sheet/cell provenance, formula support and unresolved references.</p><div id="importFeedback" role="status"></div>${importDraft.map((r,i)=>`<div class="card"><label class="row"><input type="checkbox" data-import-include="${i}" ${r.include?'checked':''}><b>${esc(r.name)}</b>${pill(r.formula?'EXCEL FORMULA':'GENERATE PIT')}</label><div class="code" style="margin-top:12px">${r.code}</div><label class="field">Formula · ${r.code}<input aria-label="Import formula ${r.code}" data-import-formula="${i}" value="${esc(r.formula)}" placeholder="Generated from tax settings"></label></div>`).join('')}<div class="banner">Applying replaces this schema’s current component draft and formula overrides. Tax settings remain. Unsupported formulas and missing dependencies are blocked.</div>`,btn('Back to import','journey-import')+btn('Validate & apply example','journey-import-apply','primary'));}
function guideModal(){modal('Design & implementation handoff',`<div class="card"><h2>Approved journey</h2><p>Start → Pay rules → Connect & finish → Outputs & formulas → Test → Review & create.</p><h2>One schema, reusable studios</h2><p>Source mapping and payslip mapping launch the existing editors with this schema selected. Approval matrices are company- and schema-specific. All three are optional during creation and managed later from their own Settings entries.</p><h2>Excel remains the rule language</h2><p>Guided controls generate Excel. Preserve manual overrides and their last-generated counterpart. Validate the dependency graph and execute the same formula for preview. Importing a payroll definition is distinct from mapping recurring payroll input data.</p><h2>Read the implementation blueprint</h2><p>The project contains <b>IMPLEMENTATION_HANDOFF.md</b> alongside <b>Payroll_Blueprint_Option2.html</b>. It documents exact source entry points, draft lifecycle, proposed contracts, security, migration, limitations and acceptance tests.</p><p><a href="IMPLEMENTATION_HANDOFF.md" download>Download the full implementation handoff ↗</a></p><h2>Prototype boundaries</h2><p>Settings, mapping, approvals and payslip layouts save in this browser. Source feeds and Excel-import review are illustrative. They do not query live users, connect APIs, parse uploaded workbooks or activate approvals.</p><div class="banner info">Use the Markdown handoff as the starting brief for the next implementation session. Re-check current repository code before applying the proposed changes.</div></div>`,btn('Model connections','connections')+btn('Close guide','close','primary'));}
function finishOptional(key){if(key==='mapping')validateMappings(bp);if(key==='approvals')validateApprovals(bp.journey.approvals);if(key==='payslip')validatePayslip(bp);bp.journey[key].status='configured';changed();drawer.close();render();toast('Saved for this schema. Manage later through Settings.');}
function journeyClick(e){const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
 // The existing click handler owns ordinary navigation. Intercept this one prerequisite.
 if(action==='next'&&bp.step===0&&bp.journey.start==='excel'&&bp.journey.import.status!=='sample_applied'){e.stopImmediatePropagation();toast('Review and apply the example import, or choose another starting point.');return}
 if(action==='next'&&bp.step===2){for(const key of ['mapping','approvals','payslip'])if(bp.journey[key].status==='not_started')bp.journey[key].status='skipped';save();}if(!action.startsWith('journey-'))return;e.stopImmediatePropagation();try{switch(action){case'journey-start':{const key=el.dataset.key;if(key===bp.journey.start){if(key==='excel')importModal();break}modal('Change your starting point?',`<p style="margin-top:20px">Switch to ${esc(key)}. This replaces ${bp.components.filter(c=>c.included).length} component settings and ${Object.keys(bp.overrides).length} manual formulas in this local draft. Mapping and payslip tasks return to Not started; the approval matrix is retained.</p>`,btn('Keep current draft','close')+btn('Use this starting point','journey-start-apply','primary',`data-key="${key}"`));break}case'journey-start-apply':applyStartingPoint(bp,el.dataset.key);changed();drawer.close();render();if(el.dataset.key==='excel')importModal();break;case'journey-paytab':bp.journey.payTab=el.dataset.key;save();render();window.scrollTo(0,0);break;case'journey-fix':bp.step=1;render();break;case'journey-settings':settingsModal();break;case'journey-guide':guideModal();break;case'journey-mapping':mappingModal();break;case'journey-approvals':approvalsModal();break;case'journey-payslip':payslipModal();break;case'journey-skip':bp.journey[el.dataset.key].status='skipped';changed();drawer.close();render();toast('Skipped. Your draft is kept for later in Settings.');break;case'journey-skip-all':for(const key of ['mapping','approvals','payslip'])if(bp.journey[key].status==='not_started')bp.journey[key].status='skipped';bp.step=3;changed();render();window.scrollTo(0,0);break;case'journey-map-add':bp.journey.mapping.rows.push({target:'',field:'',transform:'identity',required:true});bp.journey.mapping.status='draft';changed();mappingModal();break;case'journey-map-remove':bp.journey.mapping.rows.splice(Number(el.dataset.index),1);bp.journey.mapping.status='draft';changed();mappingModal();break;case'journey-map-test':{const values=validateMappings(bp);bp.sample.mappedInputs=values;bp.journey.mapping.validated=true;changed();render();drawer.querySelector('#mappingFeedback').innerHTML=`<div class="banner info">${Object.keys(values).length} sample values validated and applied to the employee preview. This does not verify a live feed.</div>`;break}case'journey-map-save':finishOptional('mapping');break;case'journey-approval-edit':approvalEdit(Number(el.dataset.index));break;case'journey-approval-add':bp.journey.approvals.rows.push({id:'custom_'+Date.now(),enabled:true,object:'New transaction',maker:'',reviewer:'',approver:'',assignee:'',delegate:'',threshold:'None',sla:'',evidence:'',decision:'all',onReject:'return',escalate:'Workflow owner',source:'User-defined'});bp.journey.approvals.status='draft';changed();approvalEdit(bp.journey.approvals.rows.length-1);break;case'journey-approval-save':finishOptional('approvals');break;case'journey-payslip-save':finishOptional('payslip');break;case'journey-payslip-preview':mappedPayslipPreview();break;case'journey-payslip-sync':{const codes=new Set(bp.journey.payslip.rows.map(r=>r.code));bp.journey.payslip.rows.push(...seedPayslip(bp).filter(r=>!codes.has(r.code)));bp.journey.payslip.status='draft';changed();payslipModal();break}case'journey-import':importModal();break;case'journey-import-example':importDraft=stageSampleImport();importReview();break;case'journey-import-apply':applySampleImport(bp,importDraft);changed();drawer.close();render();toast('Example workbook applied. Review its Excel rules in Outputs & formulas.');break;}}catch(err){toast(err.message);const feedback=drawer.querySelector('#mappingFeedback,#approvalFeedback,#payslipFeedback,#importFeedback');if(feedback)feedback.innerHTML=`<div class="banner">${esc(err.message)}</div>`}}
app.addEventListener('click',journeyClick,true);drawer.addEventListener('click',journeyClick,true);
function journeyChange(e){const el=e.target;if(el.hasAttribute('data-output-filter')){outputFilter=el.value;render()}if(el.hasAttribute('data-mapping-source')){bp.journey.mapping.source=el.value;bp.journey.mapping.rows=seedMappings(el.value);bp.journey.mapping.status='draft';delete bp.sample.mappedInputs;changed();mappingModal();render()}if(el.hasAttribute('data-import-file')){bp.journey.import.filename=el.files?.[0]?.name||'';save();drawer.querySelector('#importFileStatus').textContent=bp.journey.import.filename?bp.journey.import.filename+' selected. File content has not been parsed.':'No file selected.'}if(el.hasAttribute('data-import-include'))importDraft[Number(el.dataset.importInclude)].include=el.checked;}
app.addEventListener('change',journeyChange);drawer.addEventListener('change',journeyChange);drawer.addEventListener('input',e=>{if(e.target.hasAttribute('data-import-formula'))importDraft[Number(e.target.dataset.importFormula)].formula=e.target.value});
// Draft changes invalidate configured statuses until explicitly saved again.
const originalSetPath=setPath;setPath=function(path,value){originalSetPath(path,value);const task=path.split('.')[1];if(path.startsWith('journey.')&&['mapping','approvals','payslip'].includes(task)){bp.journey[task].status='draft';if(task==='mapping'){bp.journey.mapping.validated=false;delete bp.sample.mappedInputs;}save()}};
// Earlier optional setup is a local design contract, retained separately from calculation settings.
void settingsOrigin;
render();
</script></body></html>
