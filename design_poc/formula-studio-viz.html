<!DOCTYPE html>
<html lang="en" class="pal-indigo">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Formula Studio — Dependency Visualisation POC (A/B/C)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css"/>
<link rel="stylesheet" href="assets/palettes.css"/>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--pb-bg,#F4F5FB);color:#1E1B2E;height:100vh;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
.mono{font-family:"JetBrains Mono",monospace;}

:root{
  --i:#4F46E5; --i600:#4338CA; --i-deep:#312E81; --i-soft:#EEF0FF; --i-soft2:#E0E4FF; --i-border:#C7CBF5;
  --ink:#1E1B2E; --muted:#6B7280; --line:#E8E9F3; --line-soft:#F0F1F8; --bg:#F4F5FB;
  --amber:#B45309; --amber-soft:#FEF3C7; --green:#059669; --green-soft:#D1FAE5; --cyan:#0E7490; --cyan-soft:#E0F4F9;
  /* category palette */
  --cat-info:#0E7490; --cat-info-bg:#E0F4F9;
  --cat-earn:#4F46E5; --cat-earn-bg:#EEF0FF;
  --cat-ded:#B45309; --cat-ded-bg:#FEF3C7;
  --cat-total:#059669; --cat-total-bg:#D1FAE5;
}

/* ---------- shell ---------- */
.shell{display:flex;flex-direction:column;height:100vh;}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:16px;z-index:30;}
.cfg-name{font-size:17px;font-weight:800;letter-spacing:-.01em;}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--i-soft);color:var(--i600);}
.chip.cur{background:#EEF1F5;color:#64748B;}
.state-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px;background:var(--green-soft);color:var(--green);}
.state-pill .d{width:7px;height:7px;border-radius:50%;background:currentColor;}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.modeseg{display:inline-flex;gap:3px;background:#EEF1F5;border-radius:12px;padding:4px;}
.modeseg button{border:none;background:none;color:#64748B;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:700;}
.modeseg button.active{background:#fff;color:var(--i);box-shadow:0 1px 3px rgba(15,12,40,.14);}
.modeseg button .mt{font-size:10px;display:block;font-weight:600;color:#94A3B8;}
.modeseg button.active .mt{color:var(--i);}
.arrows-toggle{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;}
.arrows-toggle.on{color:var(--i);border-color:var(--i-border);background:var(--i-soft);}

.work{flex:1;display:grid;grid-template-columns:300px 1fr 320px;min-height:0;position:relative;}

/* arrow overlay spans outline+editor (first two columns) */
#arrowLayer{position:absolute;top:0;left:0;height:100%;pointer-events:none;z-index:18;overflow:visible;}
#arrowLayer path,#arrowLayer line{pointer-events:stroke;}

/* ---------- outline ---------- */
.outline{border-right:1px solid var(--line);background:#fff;overflow-y:auto;padding:12px;position:relative;}
.ol-head{padding:6px 8px 8px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
.ol-grp{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 8px 5px;}
.ol-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent;position:relative;transition:background .15s,border-color .15s,box-shadow .25s,opacity .25s;}
.ol-item:hover{background:#F6F7FB;}
.ol-item.active{background:var(--i-soft);border-color:var(--i-soft2);}
.ol-col{width:24px;height:24px;border-radius:6px;background:#EEF1F5;color:#64748B;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ol-item.active .ol-col{background:var(--i);color:#fff;}
.ol-nm{font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ol-typ{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;}
.ol-typ.input{background:var(--cyan-soft);color:var(--cyan);}.ol-typ.formula{background:var(--i-soft);color:var(--i600);}.ol-typ.constant{background:#EEF1F5;color:#64748B;}
/* dependency emphasis */
.ol-item.dep{box-shadow:-3px 0 0 0 var(--depc, var(--i)) inset, 0 4px 14px rgba(79,70,229,.10);border-color:var(--i-soft2);}
.ol-item.dep .ol-col{background:var(--depc,var(--i));color:#fff;}
.ol-item.pulse{animation:pulse .9s ease;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,70,229,.5);}100%{box-shadow:0 0 0 14px rgba(79,70,229,0);}}

/* ---------- editor card ---------- */
.editor{overflow-y:auto;padding:26px 30px;position:relative;}
.ed-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 3px rgba(15,12,40,.06);max-width:820px;margin:0 auto;overflow:hidden;position:relative;z-index:16;}
/* inline flowchart inside the card */
.fc-section{margin-top:22px;}
.fc-head{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
.fc-head-t{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.fc-legend-inline{display:inline-flex;gap:12px;align-items:center;font-weight:600;margin-left:auto;}
.fc-legend-inline .lg{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);}
.fc-legend-inline .lg .sw{width:10px;height:10px;border-radius:3px;}
.fc-max{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--i-border);background:var(--i-soft);color:var(--i);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700;}
.fc-max:hover{background:var(--i);color:#fff;}
.fc-max svg{width:14px;height:14px;}
.fc-inline{position:relative;max-height:400px;overflow:auto;border:1px solid var(--line);border-radius:14px;
  background:radial-gradient(circle at 1px 1px, rgba(99,102,241,.10) 1px, transparent 0) 0 0/22px 22px,#FCFCFE;}
body.sketchy .fc-inline{background:radial-gradient(circle at 1px 1px, rgba(99,102,241,.08) 1px, transparent 0) 0 0/24px 24px,#FCFCFE;}
.fc-inline svg.edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;}
.fc-stage{position:relative;}
.ed-card.target-glow{box-shadow:0 0 0 3px var(--i-soft2),0 18px 50px rgba(79,70,229,.16);}
.ed-hero{padding:22px 26px;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-start;gap:16px;}
.col-badge{width:46px;height:46px;border-radius:12px;background:var(--i);color:#fff;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ed-hero h2{font-size:20px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;}
.code-tag{font-size:11px;font-weight:700;background:#EEF1F5;color:#64748B;padding:3px 8px;border-radius:6px;margin-left:8px;}
.ed-hero .sub{color:var(--muted);font-size:13px;margin-top:3px;}
.valid-ok{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--green);}
.valid-ok svg{width:16px;height:16px;stroke:var(--green);fill:none;}
.ed-body{padding:22px 26px;}
.ed-label{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
/* formula chips (now IF/function aware) */
.formula-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:15px 16px;background:#FAFAFE;border:1.5px dashed var(--i-soft2);border-radius:14px;}
.fchip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:13px;font-weight:700;box-shadow:0 1px 2px rgba(15,12,40,.05);}
.fchip .ref{width:18px;height:18px;border-radius:5px;background:var(--i-soft);color:var(--i600);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.fchip.fnum{color:var(--cyan);} .fchip.ffunc{background:var(--i-deep);color:#fff;letter-spacing:.04em;}
.fop{font-size:16px;font-weight:800;color:var(--i);padding:0 1px;} .fparen{font-size:18px;font-weight:800;color:#94A3B8;} .fcomma{color:#94A3B8;font-weight:800;}
.flowbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--i-border);background:var(--i-soft);color:var(--i);border-radius:11px;padding:11px 16px;font-size:13.5px;font-weight:700;margin-top:18px;}
.flowbtn:hover{background:var(--i);color:#fff;}.flowbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;}
.explain{display:flex;gap:11px;margin-top:16px;padding:13px 16px;background:var(--cyan-soft);border-radius:12px;align-items:flex-start;}
.explain svg{width:18px;height:18px;stroke:#2563EB;flex-shrink:0;margin-top:1px;fill:none;}
.explain p{font-size:13px;color:#1E3A8A;line-height:1.5;} .explain b{font-weight:800;}

/* ---------- live preview (third column) ---------- */
.preview{border-left:1px solid var(--line);background:#fff;overflow-y:auto;padding:16px;position:relative;z-index:16;}
.tp-head{font-size:13px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.tp-sel{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;background:#FAFAFE;margin-bottom:12px;}
.tp-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:9px;font-size:13px;transition:background .2s,opacity .25s,box-shadow .25s;}
.tp-row .nm{font-weight:600;color:#475569;display:flex;align-items:center;gap:8px;min-width:0;}
.tp-row .nm .c{font-size:10px;font-weight:800;color:#94A3B8;width:18px;flex-shrink:0;}
.tp-row .nm span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tp-row .v{font-weight:700;flex-shrink:0;}
.tp-row.dep{background:var(--i-soft);box-shadow:-3px 0 0 0 var(--depc,var(--i)) inset;}
.tp-row.dep .nm .c{color:var(--depc,var(--i));}
.tp-row.outcome{background:var(--i-deep);}
.tp-row.outcome .nm,.tp-row.outcome .nm .c,.tp-row.outcome .v{color:#fff;}
.tp-row.outcome .v{font-weight:900;}

/* spotlight mode dims the rest */
body.spotlight .work.has-selection .ol-item:not(.dep):not(.active){opacity:.32;}
body.spotlight .work.has-selection .tp-row:not(.dep):not(.outcome){opacity:.30;}

/* ---------- flowchart modal ---------- */
.fc-scrim{position:fixed;inset:0;background:rgba(15,12,40,.55);display:none;align-items:center;justify-content:center;z-index:50;}
.fc-scrim.open{display:flex;}
.fc-modal{position:relative;width:min(940px,94vw);height:min(660px,90vh);background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(15,12,40,.4);display:flex;flex-direction:column;overflow:hidden;}
.fc-stack-2 .fc-modal{transform:scale(.96) translateY(0);} /* hint of stacking handled in JS */
.fc-top{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
.fc-top .ico{width:34px;height:34px;border-radius:9px;background:var(--i-soft);display:flex;align-items:center;justify-content:center;}
.fc-top .ico svg{width:18px;height:18px;stroke:var(--i);fill:none;}
.fc-top b{font-size:15px;font-weight:800;} .fc-top small{display:block;color:var(--muted);font-size:12px;}
.fc-crumbs{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);margin-left:6px;}
.fc-crumbs .cb{padding:3px 9px;border-radius:7px;background:#F4F5FB;cursor:pointer;}
.fc-crumbs .cb.cur{background:var(--i-soft);color:var(--i600);}
.fc-x{margin-left:auto;background:none;border:none;color:var(--muted);}.fc-x svg{width:20px;height:20px;stroke:currentColor;fill:none;}
.fc-legend{display:flex;gap:14px;padding:10px 22px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;}
.fc-legend .lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);}
.fc-legend .lg .sw{width:12px;height:12px;border-radius:4px;}
.fc-canvas{flex:1;position:relative;overflow:auto;background:
  radial-gradient(circle at 1px 1px, rgba(99,102,241,.10) 1px, transparent 0) 0 0/22px 22px;}
.fc-canvas svg.edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;}
.fc-node{position:absolute;transform:translate(-50%,-50%);z-index:2;}
.node-box{min-width:130px;max-width:200px;border-radius:12px;padding:11px 14px;background:#fff;border:2px solid var(--nc,#cbd5e1);box-shadow:0 6px 18px rgba(15,12,40,.10);text-align:center;}
.node-box .nlabel{font-size:13px;font-weight:800;color:#1E1B2E;}
.node-box .nsub{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.node-box .nval{font-size:14px;font-weight:800;margin-top:6px;color:var(--nc,#475569);font-family:"JetBrains Mono",monospace;}
.node-box.clickable{cursor:pointer;}
.node-box.clickable:hover{box-shadow:0 10px 26px rgba(79,70,229,.22);transform:translateY(-2px);}
.node-box .drill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;color:var(--i);margin-top:6px;}
.node-diamond{width:150px;height:96px;display:flex;align-items:center;justify-content:center;position:relative;}
.node-diamond .dmd{position:absolute;inset:0;background:#fff;border:2px solid var(--cat-ded);transform:rotate(45deg);border-radius:14px;box-shadow:0 6px 18px rgba(180,83,9,.16);}
.node-diamond .dtext{position:relative;text-align:center;font-size:12px;font-weight:800;color:var(--cat-ded);padding:0 6px;}
.node-result{background:var(--i-deep);border-color:var(--i-deep);}
.node-result .nlabel,.node-result .nsub,.node-result .nval{color:#fff;}
.edge-label{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);border-radius:7px;padding:2px 9px;font-size:11px;font-weight:800;z-index:3;}
.edge-label.yes{color:var(--green);border-color:var(--green-soft);} .edge-label.no{color:var(--amber);border-color:var(--amber-soft);}

/* mode A sketchy flavour on boxes */
body.sketchy .node-box{border-style:solid;box-shadow:3px 3px 0 rgba(15,12,40,.08);border-radius:14px 12px 13px 11px;}
body.sketchy .node-box .nlabel{font-family:"Caveat",cursive;font-size:17px;}
body.sketchy .fc-canvas{background:radial-gradient(circle at 1px 1px, rgba(99,102,241,.08) 1px, transparent 0) 0 0/24px 24px,#FCFCFE;}

.hintbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--i-deep);color:#fff;font-size:12.5px;font-weight:600;padding:9px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(15,12,40,.3);z-index:40;display:flex;gap:14px;align-items:center;}
.hintbar b{color:#A5B4FC;}
</style>
</head>
<body class="neural">
<div class="shell">
  <header class="topbar">
    <span class="cfg-name">VPTQ Mid Cycle</span>
    <span class="chip">🇻🇳 VN</span>
    <span class="chip cur">Currency ₫</span>
    <span class="state-pill"><span class="d"></span>Active</span>
    <div class="top-right">
      <button class="arrows-toggle on" id="arrowsToggle" onclick="toggleArrows()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        Dependency arrows
      </button>
      <div class="modeseg" id="modeseg">
        <button data-mode="sketchy" onclick="setMode('sketchy')">A<span class="mt">Sketchy</span></button>
        <button data-mode="neural" class="active" onclick="setMode('neural')">B<span class="mt">Neural Flow</span></button>
        <button data-mode="spotlight" onclick="setMode('spotlight')">C<span class="mt">Spotlight</span></button>
      </div>
    </div>
  </header>

  <div class="work" id="work">
    <svg id="arrowLayer"></svg>
    <!-- outline -->
    <div class="outline" id="outline"></div>
    <!-- editor -->
    <div class="editor" id="editor"></div>
    <!-- preview -->
    <div class="preview" id="preview"></div>
  </div>
</div>

<!-- flowchart modal -->
<div class="fc-scrim" id="fcScrim">
  <div class="fc-modal" id="fcModal">
    <div class="fc-top">
      <div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M10 6.5h6a1 1 0 0 1 1 1V14"/></svg></div>
      <div><b id="fcTitle">Formula flow</b><small id="fcSub">How this value is calculated</small></div>
      <div class="fc-crumbs" id="fcCrumbs"></div>
      <button class="fc-x" onclick="closeFlow()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="fc-legend">
      <span class="lg"><span class="sw" style="background:var(--cat-info)"></span>Input / info</span>
      <span class="lg"><span class="sw" style="background:var(--cat-earn)"></span>Earning</span>
      <span class="lg"><span class="sw" style="background:var(--cat-ded)"></span>Deduction / decision</span>
      <span class="lg"><span class="sw" style="background:var(--cat-total)"></span>Total</span>
      <span class="lg" style="margin-left:auto;color:var(--i)">▤ click a formula box to drill in</span>
    </div>
    <div class="fc-canvas" id="fcCanvas"></div>
  </div>
</div>

<div class="hintbar">
  <span>POC · <b>Formula Studio viz</b> — flip <b>A / B / C</b> top-right · selected = <b>AF</b> · click arrows or “View flowchart”.</span>
</div>

<script>
// ============== DATA (real VPTQ Mid Cycle subset; sample values chosen to make the IF flow non-trivial) ==============
const CAT = {
  info:{c:'var(--cat-info)',bg:'var(--cat-info-bg)',name:'Input / info'},
  earn:{c:'var(--cat-earn)',bg:'var(--cat-earn-bg)',name:'Earning'},
  ded:{c:'var(--cat-ded)',bg:'var(--cat-ded-bg)',name:'Deduction'},
  total:{c:'var(--cat-total)',bg:'var(--cat-total-bg)',name:'Total'},
};
const COMPONENTS = [
  // Inputs
  {col:'A',code:'TT',name:'TT',type:'input',cat:'info',grp:'Inputs',value:1},
  {col:'B',code:'MSNV',name:'MSNV',type:'input',cat:'info',grp:'Inputs',value:2405236},
  {col:'C',code:'HOTEN',name:'Họ và tên',type:'input',cat:'info',grp:'Inputs',value:0},
  {col:'F',code:'LNLT',name:'LN/LT',type:'input',cat:'info',grp:'Inputs',value:0},
  {col:'G',code:'MLHDLD',name:'Mức lương HĐLĐ',type:'input',cat:'earn',grp:'Inputs',value:9520000},
  {col:'K',code:'CDLNT',name:'Công đi làm ngày thường',type:'input',cat:'info',grp:'Inputs',value:11},
  {col:'O',code:'NLT',name:'Nghỉ Lễ/Tết',type:'input',cat:'info',grp:'Inputs',value:2},
  {col:'S',code:'CPCBD',name:'Công phụ cấp ban đêm',type:'input',cat:'info',grp:'Inputs',value:12},
  {col:'CA',code:'DTDP',name:'Là ĐT, ĐP PCCC, AT-VSV',type:'input',cat:'info',grp:'Inputs',value:1},
  // Earnings (formulas)
  {col:'H',code:'PCPCCC',name:'Phụ cấp (PCCC, ATVSV)',type:'formula',cat:'earn',grp:'Earnings',value:780000,formula:'=IF(CA1,780000,0)'},
  {col:'Y',code:'LNT',name:'Lương Ngày thường',type:'formula',cat:'earn',grp:'Earnings',value:4027692,formula:'=G1/26*K1'},
  {col:'AB',code:'LNLTET',name:'Lương ngày nghỉ Lễ Tết',type:'formula',cat:'earn',grp:'Earnings',value:732308,formula:'=G1/26*O1'},
  {col:'AF',code:'LPCBD',name:'Lương phụ cấp ban đêm',type:'formula',cat:'earn',grp:'Earnings',value:1426154,formula:'=IF(F1,0,(G1+H1)/26*S1*0.3)'},
  // Deductions
  {col:'AY',code:'BHXH',name:'BHXH',type:'formula',cat:'ded',grp:'Deductions',value:760000,formula:'=G1*0.08'},
  {col:'AZ',code:'BHYT',name:'BHYT',type:'formula',cat:'ded',grp:'Deductions',value:142800,formula:'=G1*0.015'},
  {col:'BA',code:'BHTN',name:'BHTN',type:'formula',cat:'ded',grp:'Deductions',value:95200,formula:'=G1*0.01'},
  {col:'BJ',code:'TTNCN',name:'Thuế TNCN',type:'formula',cat:'ded',grp:'Deductions',value:0,formula:'=BG1*0.05'},
  // Totals
  {col:'AV',code:'TTN',name:'Tổng thu nhập',type:'formula',cat:'total',grp:'Totals',value:16486154,formula:'=Y1+AB1+AF1+G1+H1'},
  {col:'BB',code:'TBHXH',name:'Tổng BHXH',type:'formula',cat:'total',grp:'Totals',value:998000,formula:'=AY1+AZ1+BA1'},
  {col:'BT',code:'TNK1',name:'Thực nhận kỳ 1',type:'formula',cat:'total',grp:'Totals',value:15488154,formula:'=AV1-BB1-BJ1'},
];
const BYCOL = Object.fromEntries(COMPONENTS.map(c=>[c.col,c]));
const GROUPS=['Inputs','Earnings','Deductions','Totals'];
let selectedCol='AF';
let arrowsOn=true;
let mode='neural';

const vnd=n=>(n===0?'₫0':'₫'+Math.round(n).toLocaleString('en-US'));
const sel=()=>BYCOL[selectedCol];
// direct dependency columns from a formula
function depCols(c){ if(!c||c.type!=='formula'||!c.formula) return []; const m=c.formula.match(/([A-Za-z]+)\d+/g)||[]; const out=[]; m.forEach(x=>{const col=x.replace(/\d+$/,'').toUpperCase(); if(BYCOL[col]&&!out.includes(col))out.push(col);}); return out; }

// ============== render outline ==============
function renderOutline(){
  const deps=depCols(sel());
  let h='<div class="ol-head">Components</div>';
  GROUPS.forEach(g=>{
    const items=COMPONENTS.filter(c=>c.grp===g); if(!items.length)return;
    h+=`<div class="ol-grp">${g}</div>`;
    items.forEach(c=>{
      const isDep=deps.includes(c.col);
      const cc=CAT[c.cat].c;
      h+=`<div class="ol-item ${c.col===selectedCol?'active':''} ${isDep?'dep':''}" data-col="${c.col}" style="${isDep?`--depc:${cc}`:''}" onclick="selectCol('${c.col}')">
        <span class="ol-col" style="${isDep?`background:${cc};color:#fff`:''}">${c.col}</span>
        <span class="ol-nm">${c.name}</span>
        <span class="ol-typ ${c.type}">${c.type}</span>
      </div>`;
    });
  });
  document.getElementById('outline').innerHTML=h;
}

// ============== render editor card (IF/function-aware chips) ==============
function chipHTML(formula){
  if(!formula) return '<span class="fchip src">From contract / import</span>';
  // tokenize: functions (letters followed by '('), cell refs (letters+digits), numbers, operators, parens, comma
  const re=/([A-Za-z]+)(?=\()|([A-Za-z]+\d+)|(\d+\.?\d*)|([+\-*/])|([()])|(,)/g;
  let m,out='',f=formula.replace(/^=/,'');
  const opg={'+':'+','-':'−','*':'×','/':'÷'};
  while((m=re.exec(f))){
    if(m[1]) out+=`<span class="fchip ffunc mono">${m[1]}</span>`;
    else if(m[2]){const col=m[2].replace(/\d+$/,'').toUpperCase();const r=BYCOL[col];out+=`<span class="fchip"><span class="ref">${col}</span>${r?r.name:col}</span>`;}
    else if(m[3]) out+=`<span class="fchip fnum mono">${(+m[3]).toLocaleString('en-US')}</span>`;
    else if(m[4]) out+=`<span class="fop">${opg[m[4]]}</span>`;
    else if(m[5]) out+=`<span class="fparen">${m[5]}</span>`;
    else if(m[6]) out+=`<span class="fcomma">,</span>`;
  }
  return out;
}
function renderEditor(){
  const c=sel();
  document.getElementById('editor').innerHTML=`
    <div class="ed-card target-glow" id="edCard">
      <div class="ed-hero">
        <div class="col-badge">${c.col}</div>
        <div style="flex:1"><h2>${c.name}<span class="code-tag mono">${c.code}</span></h2>
          <div class="sub">Column ${c.col} · ${c.type==='input'?'Input value':c.type==='constant'?'Fixed constant':'Calculated formula'}</div></div>
        <div class="valid-ok"><svg viewBox="0 0 24 24" stroke-width="2"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>Valid</div>
      </div>
      <div class="ed-body">
        <div class="ed-label">Formula</div>
        <div class="formula-line">${chipHTML(c.formula)}</div>
        <div class="explain"><svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
          <p>${c.name} ${c.type==='formula'?'is calculated from its dependencies (highlighted left &amp; right).':'is an input value.'}<br>For <b>File Sample 1</b> this evaluates to <b>${vnd(c.value)}</b>.</p></div>
        ${c.type==='formula'?`
        <div class="fc-section">
          <div class="fc-head">
            <span class="fc-head-t">Calculation flow</span>
            <span class="fc-legend-inline">
              <span class="lg"><span class="sw" style="background:var(--cat-info)"></span>input</span>
              <span class="lg"><span class="sw" style="background:var(--cat-earn)"></span>earning</span>
              <span class="lg"><span class="sw" style="background:var(--cat-ded)"></span>deduction</span>
              <span class="lg"><span class="sw" style="background:var(--cat-total)"></span>total</span>
            </span>
            <button class="fc-max" onclick="openFlow('${c.col}')" title="Expand flowchart">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
              Expand
            </button>
          </div>
          <div class="fc-inline" id="fcInline"></div>
        </div>`:''}
      </div>
    </div>`;
}

// ============== render preview (third column) ==============
function renderPreview(){
  const deps=depCols(sel());
  let h='<div class="tp-head">Live preview</div><div class="tp-sel">File Sample 1</div>';
  COMPONENTS.forEach(c=>{
    const isDep=deps.includes(c.col), isOut=c.col===selectedCol;
    const cc=CAT[c.cat].c;
    h+=`<div class="tp-row ${isDep?'dep':''} ${isOut?'outcome':''}" data-col="${c.col}" style="${isDep?`--depc:${cc}`:''}">
      <span class="nm"><span class="c">${c.col}</span><span class="t">${c.name}</span></span>
      <span class="v">${vnd(c.value)}</span></div>`;
  });
  document.getElementById('preview').innerHTML=h;
}

// ============== ARROWS ==============
let rc=null;
function drawArrows(){
  const layer=document.getElementById('arrowLayer');
  const work=document.getElementById('work');
  const card=document.getElementById('edCard');
  const outline=document.getElementById('outline');
  layer.innerHTML='';
  const c=sel();
  const deps=depCols(c);
  const wr=work.getBoundingClientRect();
  layer.setAttribute('width',wr.width); layer.setAttribute('height',wr.height);
  layer.style.width=wr.width+'px'; layer.style.height=wr.height+'px';
  if(!arrowsOn||!deps.length||!card){return;}
  const cardR=card.getBoundingClientRect();
  const olR=outline.getBoundingClientRect();
  const tx=cardR.left-wr.left+6;            // target x (card left)
  const n=deps.length;
  if(mode==='sketchy'&&window.rough){rc=rough.svg(layer);}
  deps.forEach((col,i)=>{
    const row=outline.querySelector(`.ol-item[data-col="${col}"]`);
    if(!row)return;
    const rr=row.getBoundingClientRect();
    // clamp source Y into outline visible band (handles scrolled-out deps)
    let sy=rr.top+rr.height/2-wr.top;
    const bandTop=olR.top-wr.top+8, bandBot=olR.bottom-wr.top-8;
    const clamped = sy<bandTop||sy>bandBot;
    sy=Math.max(bandTop,Math.min(bandBot,sy));
    const sx=olR.right-wr.left-6;
    const ty=cardR.top-wr.top + 40 + (cardR.height-70)*(n===1?0.5:i/(n-1));
    const color=CAT[BYCOL[col].cat].c.startsWith('var')?varColor(CAT[BYCOL[col].cat].c):CAT[BYCOL[col].cat].c;
    drawOne(layer,sx,sy,tx,ty,color,col,clamped,i);
  });
}
function varColor(v){const m=v.match(/var\((--[^)]+)\)/);return m?getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim()||'#4F46E5':v;}
function drawOne(layer,sx,sy,tx,ty,color,col,clamped,i){
  const NS='http://www.w3.org/2000/svg';
  const tipx=tx+3, basex=tx-13;               // land the head ON the card's left edge (layer sits above the card)
  const dx=basex-sx;
  const c1x=sx+dx*0.45, c2x=sx+dx*0.55;
  const d=`M ${sx} ${sy} C ${c1x} ${sy} ${c2x} ${ty} ${basex} ${ty}`;
  if(mode==='sketchy'&&rc){
    const node=rc.path(d,{stroke:color,strokeWidth:2.4,roughness:1.7,bowing:2});
    node.style.cursor='pointer'; node.addEventListener('click',()=>scrollToCol(col));
    layer.appendChild(node);
    const head=rc.polygon([[tipx,ty],[basex,ty-7],[basex,ty+7]],{fill:color,fillStyle:'solid',stroke:color,strokeWidth:1.2,roughness:1.3});
    head.style.cursor='pointer'; head.addEventListener('click',()=>scrollToCol(col));
    layer.appendChild(head);
  } else {
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',d); p.setAttribute('fill','none');
    p.setAttribute('stroke',color); p.setAttribute('stroke-width','2.6');
    p.setAttribute('stroke-linecap','round'); p.style.cursor='pointer';
    if(mode==='spotlight'){p.setAttribute('stroke-dasharray','7 6');p.style.animation='dash 1s linear infinite';}
    p.addEventListener('click',()=>scrollToCol(col));
    layer.appendChild(p);
    if(mode==='neural'){ // flowing dot
      const dot=document.createElementNS(NS,'circle');
      dot.setAttribute('r','3.6'); dot.setAttribute('fill',color);
      const am=document.createElementNS(NS,'animateMotion');
      am.setAttribute('dur',(3.6+i*0.5)+'s'); am.setAttribute('repeatCount','indefinite'); am.setAttribute('path',d);
      dot.appendChild(am); layer.appendChild(dot);
    }
  }
  // filled triangular arrowhead (visible in every mode)
  if(mode!=='sketchy'){
    const head=document.createElementNS(NS,'polygon');
    head.setAttribute('points',`${tipx},${ty} ${basex},${ty-7} ${basex},${ty+7}`);
    head.setAttribute('fill',color);
    head.style.cursor='pointer'; head.addEventListener('click',()=>scrollToCol(col));
    layer.appendChild(head);
  }
  if(clamped){ // small indicator that source is off-screen
    const t=document.createElementNS(NS,'circle');
    t.setAttribute('cx',sx);t.setAttribute('cy',sy);t.setAttribute('r','4');t.setAttribute('fill',color);
    layer.appendChild(t);
  }
}
function scrollToCol(col){
  const row=document.querySelector(`.outline .ol-item[data-col="${col}"]`);
  if(!row)return;
  row.scrollIntoView({behavior:'smooth',block:'center'});
  row.classList.add('pulse'); setTimeout(()=>row.classList.remove('pulse'),900);
}

// ============== FLOWCHART (stacked) ==============
// Hand-authored trees for the demo (real impl builds these from the parser AST).
function treeFor(col){
  const v=c=>BYCOL[c].value;
  if(col==='AF'){
    return {kind:'if', cat:'ded', label:'IF — is LN/LT set?', cond:{ref:'F'},
      yes:{kind:'val', cat:'earn', label:'0', value:0},
      no:{kind:'op', cat:'earn', label:'(G + H) ÷ 26 × S × 30%', value:v('AF'),
          children:[{kind:'ref',ref:'G'},{kind:'ref',ref:'H'},{kind:'ref',ref:'S'}]},
      result:{ref:'AF'}};
  }
  if(col==='H'){
    return {kind:'if', cat:'ded', label:'IF — is “Là ĐT, ĐP PCCC” set?', cond:{ref:'CA'},
      yes:{kind:'val', cat:'earn', label:'780,000', value:780000},
      no:{kind:'val', cat:'earn', label:'0', value:0},
      result:{ref:'H'}};
  }
  // generic linear formula -> operands feed a result
  const c=BYCOL[col]; const deps=depCols(c);
  return {kind:'op', cat:c.cat, label:c.formula.replace(/^=/,''), value:c.value,
    children:deps.map(d=>({kind:'ref',ref:d})), result:{ref:col}};
}
let fcStack=[];
function openFlow(col){ fcStack=[col]; document.getElementById('fcScrim').classList.add('open'); renderFlow(); }
function pushFlow(col){ fcStack.push(col); renderFlow(); }
function crumbTo(i){ fcStack=fcStack.slice(0,i+1); renderFlow(); }
function closeFlow(){ document.getElementById('fcScrim').classList.remove('open'); }
function nodeColor(cat){return varColor(CAT[cat].c);}

// modal (drill-down) wrapper
function renderFlow(){
  const col=fcStack[fcStack.length-1];
  const comp=BYCOL[col];
  document.getElementById('fcTitle').textContent=comp.name;
  document.getElementById('fcSub').textContent='Calculation flow · = '+vnd(comp.value)+' for File Sample 1';
  document.getElementById('fcCrumbs').innerHTML=fcStack.map((c,i)=>`<span class="cb ${i===fcStack.length-1?'cur':''}" onclick="crumbTo(${i})">${BYCOL[c].name}</span>`).join('<span>›</span>');
  const canvas=document.getElementById('fcCanvas');
  buildFlow(canvas, col, canvas.clientWidth||880, pushFlow);
}
// inline (in the editor card)
function renderInlineFlow(){
  const cont=document.getElementById('fcInline');
  if(!cont||!sel()||sel().type!=='formula')return;
  buildFlow(cont, selectedCol, Math.max(560,cont.clientWidth||620), openFlow);
}

// shared layout + render
function buildFlow(canvas, col, W, onDrill){
  const t=treeFor(col);
  canvas.innerHTML='<div class="fc-stage"><svg class="edges"></svg></div>';
  const stage=canvas.querySelector('.fc-stage');
  stage.style.minWidth=W+'px';
  const svg=stage.querySelector('svg.edges');
  const nodes=[], edges=[];
  const cx=W/2;
  function add(node){nodes.push(node);return node;}
  if(t.kind==='if'){
    add({id:'dec',x:cx,y:80,type:'diamond',cat:t.cat,label:t.label});
    // yes branch (left), no branch (right)
    const yes=t.yes, no=t.no;
    const lx=cx-230, rx=cx+150;
    add({id:'yes',x:lx,y:230,type:'box',cat:yes.cat,label:yes.label,sub:'then',value:yes.value});
    edges.push({from:'dec',to:'yes',label:'Yes',cls:'yes'});
    if(no.kind==='op'){
      add({id:'no',x:rx,y:230,type:'box',cat:no.cat,label:no.label,sub:'else',value:no.value});
      edges.push({from:'dec',to:'no',label:'No',cls:'no'});
      // operands feed the no box
      const ops=no.children; const span=Math.min(560,ops.length*180); const startx=rx - span/2 + 90;
      ops.forEach((o,i)=>{const r=BYCOL[o.ref];const ox=Math.max(90,Math.min(W-90,startx+i*180));
        add({id:'op'+i,x:ox,y:400,type:'box',cat:r.cat,label:r.name,sub:'Col '+o.ref,value:r.value,ref:o.ref,formula:r.type==='formula'});
        edges.push({from:'op'+i,to:'no'});});
    } else {
      add({id:'no',x:rx,y:230,type:'box',cat:no.cat,label:no.label,sub:'else',value:no.value});
      edges.push({from:'dec',to:'no',label:'No',cls:'no'});
    }
    // condition input feeds the decision (placed above it)
    const cr=BYCOL[t.cond.ref];
    add({id:'cond',x:cx,y:-60,type:'box',cat:cr.cat,label:cr.name,sub:'condition · Col '+t.cond.ref,value:cr.value,ref:t.cond.ref,formula:cr.type==='formula'});
  } else {
    // op tree: operands -> op -> result
    const ops=t.children; const span=Math.min(640,ops.length*180); const startx=cx-span/2+90;
    ops.forEach((o,i)=>{const r=BYCOL[o.ref];const ox=Math.max(90,Math.min(W-90,startx+i*180));
      add({id:'op'+i,x:ox,y:110,type:'box',cat:r.cat,label:r.name,sub:'Col '+o.ref,value:r.value,ref:o.ref,formula:r.type==='formula'});
      edges.push({from:'op'+i,to:'opn'});});
    add({id:'opn',x:cx,y:300,type:'box',cat:t.cat,label:t.label,sub:'compute',value:t.value});
  }
  // result node
  const resRef=t.result?t.result.ref:col;
  add({id:'res',x:cx,y:t.kind==='if'?540:470,type:'result',cat:BYCOL[resRef].cat,label:BYCOL[resRef].name,sub:'result',value:BYCOL[resRef].value});
  if(t.kind==='if'){ edges.push({from:'yes',to:'res'}); edges.push({from:'no',to:'res'}); edges.push({from:'cond',to:'dec'}); }
  else edges.push({from:'opn',to:'res'});

  // normalize: shift so min y >= 50
  let minY=Math.min(...nodes.map(n=>n.y));
  const offY=50-minY; nodes.forEach(n=>n.y+=offY);
  let maxY=Math.max(...nodes.map(n=>n.y));
  stage.style.minHeight=(maxY+120)+'px';

  // render nodes
  const byId={};
  nodes.forEach(n=>{byId[n.id]=n;
    const el=document.createElement('div'); el.className='fc-node'; el.style.left=n.x+'px'; el.style.top=n.y+'px';
    const color=nodeColor(n.cat);
    if(n.type==='diamond'){
      el.innerHTML=`<div class="node-diamond"><div class="dmd" style="border-color:${color}"></div><div class="dtext" style="color:${color}">${n.label}</div></div>`;
    } else if(n.type==='result'){
      el.innerHTML=`<div class="node-box node-result"><div class="nsub">${n.sub}</div><div class="nlabel">${n.label}</div><div class="nval">${vnd(n.value)}</div></div>`;
    } else {
      const drill=n.formula?`<div class="drill">▤ open formula</div>`:'';
      el.innerHTML=`<div class="node-box ${n.formula?'clickable':''}" style="--nc:${color};border-color:${color}">
        ${n.sub?`<div class="nsub">${n.sub}</div>`:''}<div class="nlabel">${n.label}</div>
        <div class="nval">${vnd(n.value)}</div>${drill}</div>`;
      if(n.formula) el.querySelector('.node-box').addEventListener('click',()=>onDrill(n.ref));
    }
    stage.appendChild(el);
  });
  // render edges after layout (nodes have size); defer a tick
  requestAnimationFrame(()=>{
    svg.setAttribute('width',stage.scrollWidth); svg.setAttribute('height',stage.scrollHeight);
    svg.innerHTML='';
    const rcL=(mode==='sketchy'&&window.rough)?rough.svg(svg):null;
    edges.forEach(e=>{
      const a=byId[e.from], b=byId[e.to]; if(!a||!b)return;
      const ax=a.x, ay=a.y+ (a.type==='diamond'?48:34);
      const bx=b.x, by=b.y- (b.type==='diamond'?48:34);
      const d=`M ${ax} ${ay} C ${ax} ${(ay+by)/2} ${bx} ${(ay+by)/2} ${bx} ${by}`;
      const color=nodeColor(a.cat);
      if(rcL){ svg.appendChild(rcL.path(d,{stroke:color,strokeWidth:2,roughness:1.6,bowing:2})); }
      else{
        const p=document.createElementNS('http://www.w3.org/2000/svg','path');
        p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',color);
        p.setAttribute('stroke-width','2');p.setAttribute('opacity','.55');
        if(mode==='neural'){p.setAttribute('stroke-dasharray','5 5');p.style.animation='dash 3s linear infinite';}
        svg.appendChild(p);
      }
      if(e.label){
        const lab=document.createElement('div'); lab.className='edge-label '+(e.cls||'');
        lab.textContent=e.label; lab.style.left=((ax+bx)/2)+'px'; lab.style.top=((ay+by)/2)+'px';
        stage.appendChild(lab);
      }
    });
  });
}

// ============== controls ==============
function selectCol(col){ selectedCol=col; renderAll(); }
function toggleArrows(){ arrowsOn=!arrowsOn; document.getElementById('arrowsToggle').classList.toggle('on',arrowsOn); drawArrows(); }
function setMode(m){
  mode=m; document.body.className=m;
  [...document.querySelectorAll('#modeseg button')].forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  document.getElementById('work').classList.toggle('has-selection',!!sel());
  drawArrows(); renderInlineFlow();
  if(document.getElementById('fcScrim').classList.contains('open')) renderFlow();
}
function renderAll(){
  renderOutline(); renderEditor(); renderPreview();
  document.getElementById('work').classList.toggle('has-selection',!!sel());
  requestAnimationFrame(()=>{ drawArrows(); renderInlineFlow(); });
}
// keyframes for dash via JS (since not in static css)
const st=document.createElement('style'); st.textContent='@keyframes dash{to{stroke-dashoffset:-26;}}'; document.head.appendChild(st);

document.getElementById('outline').addEventListener('scroll',()=>requestAnimationFrame(drawArrows));
document.getElementById('editor').addEventListener('scroll',()=>requestAnimationFrame(drawArrows));
window.addEventListener('resize',()=>requestAnimationFrame(drawArrows));
window.addEventListener('load',()=>setTimeout(renderAll,60));
renderAll();
</script>
