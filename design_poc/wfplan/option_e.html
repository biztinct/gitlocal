<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boardroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
  :root{
    --ink:#1E1B2E; --ink-2:#4B4866; --muted:#64748B; --line:#E2E8F0; --canvas:#F4F5FB; --card:#FFFFFF;
    --primary:#5A4BB0; --primary-deep:#4A3D96; --primary-soft:#EDEAF8; --primary-soft2:#CBC2EE; --primary-dark:#241F52;
    --money:#2E7D4F; --money-soft:#E6F4EC; --info:#2563EB; --info-soft:#E8EFFD; --warn:#D97706; --warn-soft:#FDF1E1; --rose:#DC2668; --rose-soft:#FCE7EF; --teal:#0F766E; --teal-soft:#E0F2F1;
    --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
    --shadow:0 1px 2px rgba(30,27,46,.04),0 8px 24px rgba(30,27,46,.06);
  }
  *{box-sizing:border-box}
  html{color-scheme:light}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding-bottom:140px}
  button,input,select{font-family:inherit;font-size:inherit;color:inherit}
  h1,h2,h3{margin:0;text-wrap:balance}
  .num{font-variant-numeric:tabular-nums}
  .ic{width:18px;height:18px;flex:none}
  .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .sub{color:var(--muted);font-weight:600}

  /* top bar */
  .top{height:58px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800}
  .brand .mark{width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:13px}
  .crumb{color:var(--muted);font-weight:600;white-space:nowrap}.crumb b{color:var(--ink)}
  .spacer{flex:1}
  .name{border:1px solid transparent;border-radius:10px;padding:7px 10px;font-weight:800;min-width:170px;background:transparent}
  .name:hover,.name:focus{border-color:var(--line);background:var(--canvas);outline:0}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap;user-select:none}
  .btn:hover{background:var(--primary-soft)} .btn:disabled{opacity:.4;cursor:default}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-deep)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
  .btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
  .btn.hold{border-color:var(--primary-soft2);color:var(--primary-deep)} .btn.hold.on{background:var(--primary);color:#fff}
  .btn:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .modes{display:inline-flex;background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
  .modes button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-weight:700;cursor:pointer;color:var(--muted);display:inline-flex;gap:6px;align-items:center;font-size:13px;white-space:nowrap}
  .modes button .ic{width:14px;height:14px}
  .modes button.on{background:var(--primary);color:#fff}

  .wrap{max-width:1500px;margin:0 auto;padding:18px 20px 0;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-width:0}

  /* hero row */
  .hero{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:16px;align-items:stretch}
  @media (max-width:1100px){.hero{grid-template-columns:minmax(0,1fr)}}
  .river-card{padding:18px 22px 10px;position:relative}
  .river-card .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .river-card h1{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
  .river-card h1 .tail{display:block;font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-top:4px}
  #river{width:100%;height:auto;aspect-ratio:1000/400;display:block;overflow:visible;font-family:inherit;margin-top:8px;touch-action:none}
  #river text{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
  #river text.in{stroke:none}
  #river .rib{transition:d .45s cubic-bezier(.4,0,.2,1),opacity .2s}
  #river .rib:hover{opacity:.85!important}
  #river .node{transition:y .45s cubic-bezier(.4,0,.2,1),height .45s cubic-bezier(.4,0,.2,1);cursor:pointer}
  #river.dragging .node,#river.dragging .rib{transition:none}
  #river .node.hot{stroke:var(--ink);stroke-width:2}
  #river .node.grab{cursor:ns-resize}
  #river .handle{fill:#fff;stroke:var(--primary);stroke-width:2;cursor:ns-resize;opacity:0;transition:opacity .15s}
  #river g:hover .handle,#river .handle.show{opacity:1}
  #river .nl{font-size:13px;font-weight:800;fill:var(--ink)}
  #river .nv{font-size:12px;font-weight:700;fill:var(--muted);font-variant-numeric:tabular-nums}
  #river .col{font-size:11px;font-weight:800;fill:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  #river .ghost{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;opacity:.45;pointer-events:none}
  .river-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;flex-wrap:wrap}
  .river-foot .ic{width:14px;height:14px}
  .hero-r{display:grid;grid-template-rows:auto 1fr;gap:16px;min-width:0}
  .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px}
  .kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--canvas)}
  .kpi small{color:var(--muted);font-weight:700;font-size:11px}
  .kpi b{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .delta{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;width:max-content;margin-top:4px;background:#EEF1F6;color:var(--ink-2)}
  .delta.good{background:var(--money-soft);color:var(--money)} .delta.bad{background:var(--rose-soft);color:var(--rose)}
  .delta .ic{width:12px;height:12px}

  /* goals */
  .goals{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .goals h2{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
  .goal-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
  .goal-row label{font-weight:700;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
  .goal-row label .ic{width:14px;height:14px;color:var(--primary)}
  .goal-in{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:0 8px;height:32px;font-weight:800}
  .goal-in input{border:0;background:transparent;width:74px;text-align:right;font-weight:800;outline:0}
  .goal-in small{color:var(--muted);font-weight:700}
  .goal-in.off{opacity:.55}
  .goal-status{font-size:12px;font-weight:700;border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start;line-height:1.4}
  .goal-status .ic{width:14px;height:14px;margin-top:2px}
  .g-ok{background:var(--money-soft);color:var(--money)} .g-gap{background:var(--warn-soft);color:#92400E}
  .sugg{display:grid;gap:6px}
  .sugg .s{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:7px 8px 7px 10px;font-weight:700;font-size:12px;cursor:default;transition:border-color .15s,background .15s}
  .sugg .s:hover{border-color:var(--primary-soft2);background:#FAFAFE}
  .sugg .s small{display:block;color:var(--muted);font-weight:600;font-size:11px}
  .sugg .s b{color:var(--money);white-space:nowrap} .sugg .s b.bad{color:var(--rose)}
  .sugg .s .btn{padding:4px 8px;font-size:11px}

  /* board */
  .board{padding:16px 20px 14px}
  .board-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:10px}
  .board-head h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .lane{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px dashed var(--primary-soft2);border-radius:12px;background:#FAFAFE;margin-bottom:10px;flex-wrap:wrap;min-height:44px}
  .lane .lab{font-weight:800;font-size:12px;color:var(--primary-deep);display:inline-flex;align-items:center;gap:6px;margin-right:4px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-weight:700;font-size:12px;animation:pop .25s ease}
  .chip .imp{color:var(--muted);font-weight:700;font-size:11px}
  .chip .x{border:0;background:transparent;color:#94A3B8;cursor:pointer;display:grid;place-items:center;width:22px;height:22px;border-radius:50%}
  .chip .x:hover{background:var(--rose-soft);color:var(--rose)}
  .lane .hint{color:var(--muted);font-weight:600;font-size:12px}
  .months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
  @media (max-width:1300px){.months{grid-template-columns:repeat(6,minmax(0,1fr))}}
  @media (max-width:640px){.months{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .mo{display:flex;flex-direction:column;border-radius:12px;border:1px solid var(--line);background:var(--canvas);min-height:150px;transition:border-color .15s,background .15s;position:relative}
  .mo.over{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
  .mo.loss{background:#FFF6F9;border-color:#F5C6D6}
  .mo-head{padding:8px 8px 6px;display:flex;flex-direction:column;gap:5px}
  .mo-head .m{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:12px}
  .mo-head .tet{font-size:9px;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:2px 5px;font-weight:800}
  .mo-head .pbar{height:36px;display:flex;align-items:flex-end;gap:2px}
  .mo-head .pbar i{flex:1;border-radius:4px 4px 2px 2px;background:var(--money);transition:height .4s cubic-bezier(.2,.8,.2,1);min-height:2px}
  .mo-head .pbar i.ghost{background:#CBD5E1;opacity:.7} .mo-head .pbar i.neg{background:var(--rose)}
  .mo-head .pv{font-size:11px;font-weight:800;color:var(--money)} .mo.loss .pv{color:var(--rose)}
  .mo-body{flex:1;padding:0 6px 6px;display:flex;flex-direction:column;gap:5px}
  .mo-body .drop{flex:1;border-radius:8px;min-height:30px;display:grid;place-items:center;color:#B8BFCC;font-size:11px;font-weight:700;text-align:center;padding:4px;border:1px dashed transparent}
  .mo.over .drop{border-color:var(--primary-soft2);color:var(--primary)}
  .mv{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--primary));border-radius:10px;padding:7px 8px 7px 9px;font-size:12px;font-weight:700;line-height:1.3;cursor:grab;position:relative;animation:pop .25s ease}
  .mv:hover{box-shadow:0 8px 18px rgba(90,75,176,.14);border-color:var(--primary-soft2)}
  .mv.drag{opacity:.4}
  .mv .t{display:flex;align-items:center;gap:6px}.mv .t .ic{width:14px;height:14px;color:var(--c,var(--primary))}
  .mv .d{color:var(--muted);font-weight:600;font-size:11px;margin-top:2px}
  .mv .imp{margin-top:5px;font-size:11px;font-weight:800;display:flex;gap:4px}
  .mv .imp span{border-radius:6px;padding:2px 6px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .mv .imp .good{background:var(--money-soft);color:var(--money)} .mv .imp .bad{background:var(--rose-soft);color:var(--rose)} .mv .imp .ic{width:11px;height:11px}
  .mv .tools{position:absolute;top:5px;right:5px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
  .mv:hover .tools,.mv:focus-within .tools{opacity:1}
  .mv .tools button{border:0;background:var(--card);width:20px;height:20px;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .mv .tools button:hover{color:var(--primary);background:var(--primary-soft)} .mv .tools .ic{width:12px;height:12px}
  @keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

  /* stage + rail */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:0;overflow:hidden}
  @media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}.rail{flex-direction:row;overflow-x:auto;border-left:0;border-top:1px solid var(--line)}}
  .stage-main{padding:18px 22px 16px;min-width:0}
  .stage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:8px;flex-wrap:wrap}
  .stage-head h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .stage-head p{margin:2px 0 0;color:var(--muted);font-weight:600;font-size:12px;max-width:70ch}
  .stage-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chart{min-height:250px}
  .rail{border-left:1px solid var(--line);background:#FAFAFE;display:flex;flex-direction:column;padding:10px}
  .rail button{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:transparent;border-radius:11px;padding:10px 10px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-2);text-align:left;white-space:nowrap}
  .rail button .ic{width:16px;height:16px;color:var(--muted)}
  .rail button:hover{background:var(--primary-soft)}
  .rail button.on{background:var(--card);border-color:var(--line);color:var(--primary-deep);box-shadow:var(--shadow)}
  .rail button.on .ic{color:var(--primary)}
  .rail .badge{margin-left:auto;font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px;background:var(--rose-soft);color:var(--rose)}
  .rail .badge.ok{background:var(--money-soft);color:var(--money)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media (max-width:900px){.split{grid-template-columns:1fr}}
  .caption{color:var(--muted);font-weight:600;font-size:12px;margin-top:8px}
  .key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
  .key i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:2px}
  .key i.dash{background:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 6px)}
  .warns{display:grid;gap:8px}
  .warn{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;font-weight:600;font-size:13px;line-height:1.4}
  .warn .ic{margin-top:1px}
  .w-ok{background:var(--money-soft);color:var(--money)} .w-warn{background:var(--warn-soft);color:#92400E} .w-crit{background:var(--rose-soft);color:#9F1239}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid #F1F5F9;font-weight:600;white-space:nowrap}
  td.r,th.r{text-align:right} tr.cur td{background:var(--primary-soft)}
  .tbl{overflow-x:auto}
  .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .cmp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:8px}
  @media (max-width:900px){.cmp-grid{grid-template-columns:1fr}}
  .cmp-grid h3{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
  .room-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  @media (max-width:900px){.room-grid{grid-template-columns:1fr}}
  .room{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .room .t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;margin-bottom:6px}
  .room .t i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .room .r{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink-2);padding:3px 0}
  .room .r b{color:var(--money);font-weight:800;white-space:nowrap}
  .room .r b.bad{color:var(--rose)}
  .room .r button{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:2px 7px;font-size:11px;font-weight:700;cursor:pointer}
  .room .r button:hover{background:var(--primary-soft)}

  /* drawer */
  .drawer{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(30,27,46,.08)}
  .drawer .in{max-width:1500px;margin:0 auto;padding:12px 20px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
  @media (max-width:900px){.drawer .in{grid-template-columns:1fr}}
  .drawer.min .in>*{display:none} .drawer.min .in .dhead{display:flex}
  .dhead{display:flex;align-items:center;gap:10px;grid-column:1/-1;font-weight:800;font-size:13px}
  .dhead .btn{margin-left:auto}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .tab .ic{width:13px;height:13px}
  .tab:hover{background:var(--primary-soft)} .tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .sent{font-size:18px;font-weight:700;line-height:2;letter-spacing:-.01em;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;min-height:40px}
  .sent .k{color:var(--muted);font-weight:600}
  .blank{display:inline-flex;align-items:center;border-bottom:2px solid var(--primary-soft2);background:var(--primary-soft);border-radius:8px 8px 2px 2px;padding:0 4px;color:var(--primary-deep);transition:background .15s}
  .blank:hover,.blank:focus-within{background:#E3DEF7;border-bottom-color:var(--primary)}
  .blank input,.blank select{border:0;background:transparent;font-weight:800;font-size:18px;color:var(--primary-deep);outline:0;padding:0 2px;cursor:pointer;appearance:none;-webkit-appearance:none;line-height:1.6}
  .blank input[type=number]{width:3.6ch;text-align:center;-moz-appearance:textfield}
  .blank input[type=number]::-webkit-inner-spin-button{display:none}
  .blank .ic{width:14px;height:14px;color:var(--primary);opacity:.7}
  .preview{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:12px;color:var(--ink-2)}
  .preview .pill{border-radius:999px;padding:3px 9px;background:#EEF1F6;display:inline-flex;gap:5px;align-items:center}
  .preview .good{background:var(--money-soft);color:var(--money)} .preview .bad{background:var(--rose-soft);color:var(--rose)}
  .comp-right{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .dials{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;grid-column:1/-1}
  @media (max-width:1100px){.dials{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .dial{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .dial .t{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12px;color:var(--ink-2)}
  .dial .t .ic{width:13px;height:13px;color:var(--primary)}
  .dial .v{font-size:16px;font-weight:800;margin:2px 0;color:var(--primary-deep)} .dial .v.zero{color:var(--muted)} .dial .v.neg{color:var(--rose)}
  .dial select{width:100%;border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-weight:700;font-size:12px;margin-bottom:4px}
  input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent;margin:0;width:100%}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--primary-soft2)}

<script>
/* ===================================================================
   WFPLAN proof-of-concept core — shared by option A/B/C.
   Money is held internally in ₫ millions (M). 1,000 M = ₫1 B.
   Everything here is deliberately plain: a CEO can read the outputs,
   an engineer can read the model. VN statutory numbers are the real
   2026 ones, simplified to averages per role.
   =================================================================== */
window.WF = (() => {
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  // ---- The company (mirrors the Payobook Vietnam demo: 4,502 people) ----
  const DIVS = [
    {key:'mfg', name:'Manufacturing', color:'#2a78d6', revenue:true, roles:[
      {key:'op',  name:'Operators',          n:760, pay:10.8, ot:24, night:0.35},
      {key:'tl',  name:'Team leads',         n:140, pay:15.5, ot:16, night:0.35},
      {key:'qc',  name:'Quality inspectors', n:60,  pay:14.2, ot:12, night:0.20},
      {key:'sup', name:'Supervisors',        n:40,  pay:22.0, ot:0,  night:0.20}]},
    {key:'ret', name:'Retail', color:'#eb6834', revenue:true, roles:[
      {key:'ss',  name:'Store staff',        n:640, pay:12.6, ot:14, night:0},
      {key:'ca',  name:'Cashiers',           n:120, pay:9.4,  ot:10, night:0},
      {key:'sm',  name:'Store managers',     n:82,  pay:24.0, ot:0,  night:0},
      {key:'me',  name:'Merchandisers',      n:60,  pay:16.0, ot:6,  night:0}]},
    {key:'con', name:'Construction', color:'#1baf7a', revenue:true, roles:[
      {key:'sw',  name:'Site workers',       n:560, pay:12.4, ot:30, night:0.15},
      {key:'fm',  name:'Foremen',            n:120, pay:18.0, ot:20, night:0.15},
      {key:'en',  name:'Site engineers',     n:80,  pay:22.0, ot:10, night:0},
      {key:'sa',  name:'Safety officers',    n:40,  pay:16.0, ot:8,  night:0}]},
    {key:'log', name:'Logistics', color:'#eda100', revenue:true, roles:[
      {key:'dr',  name:'Drivers',            n:400, pay:13.5, ot:28, night:0.40},
      {key:'wh',  name:'Warehouse staff',    n:220, pay:10.5, ot:20, night:0.30},
      {key:'di',  name:'Dispatchers',        n:50,  pay:15.0, ot:12, night:0.30},
      {key:'fs',  name:'Fleet supervisors',  n:30,  pay:21.0, ot:0,  night:0}]},
    {key:'it',  name:'IT', color:'#e87ba4', revenue:false, roles:[
      {key:'eng', name:'Engineers',          n:380, pay:28.0, ot:4,  night:0},
      {key:'sen', name:'Senior engineers',   n:120, pay:42.0, ot:2,  night:0},
      {key:'pm',  name:'Project managers',   n:60,  pay:38.0, ot:0,  night:0},
      {key:'sp',  name:'Support staff',      n:40,  pay:16.0, ot:8,  night:0}]},
    {key:'cor', name:'Corporate', color:'#008300', revenue:false, roles:[
      {key:'ad',  name:'Admin',              n:180, pay:14.0, ot:2,  night:0},
      {key:'fh',  name:'Finance & HR',       n:160, pay:26.0, ot:2,  night:0},
      {key:'sa',  name:'Sales',              n:100, pay:30.0, ot:0,  night:0},
      {key:'mg',  name:'Managers',           n:60,  pay:48.0, ot:0,  night:0}]},
  ];
  const DIV = Object.fromEntries(DIVS.map(d => [d.key, d]));

  // ---- Vietnam statutory (2026), simplified ----
  const K = {
    allowance: 0.12,      // meal / transport / phone, share of base
    insCap: 46.8,         // ₫46.8M cap for SI/HI (20 × base salary)
    erRate: 0.235,        // employer: SI 17.5 + HI 3 + UI 1 + union 2
    eeRate: 0.105,        // employee: SI 8 + HI 1.5 + UI 1
    otMult: 1.5,          // weekday overtime multiplier
    nightPrem: 0.30,      // night-shift premium on the base hour
    personalDed: 11,      // ₫11M personal deduction / month
    depDed: 4.4 * 0.9,    // ₫4.4M per dependent × 0.9 avg dependents
  };
  const PIT = [[5,0.05],[10,0.10],[18,0.15],[32,0.20],[52,0.25],[80,0.30],[Infinity,0.35]];
  function pitOn(taxable) {
    if (taxable <= 0) return 0;
    let tax = 0, prev = 0;
    for (const [cap, rate] of PIT) {
      const slice = Math.min(taxable, cap) - prev;
      if (slice <= 0) break;
      tax += slice * rate; prev = cap;
    }
    return tax;
  }

  // ---- The knobs (state) ----
  function defaultState() {
    return {
      divs: Object.fromEntries(DIVS.map(d => [d.key, {
        delta: 0,                 // people added (+) or removed (−)
        month: 3,                 // month (1-12) the change lands
        raise: null,              // % override, null = follow company raise
        roles: Object.fromEntries(d.roles.map(r => [r.key, 0])),  // per-role delta
      }])),
      raise: 0,          // company-wide raise, %
      raiseMonth: 4,     // month raise starts
      otFactor: 1,       // overtime vs today (1 = same)
      nightFactor: 1,    // night work vs today
      workDays: 24,      // paid working days / month
      bonusMonths: 1,    // Tet 13th-month
      attrition: 12,     // % of people who leave per year
      backfill: true,    // replace leavers?
      recruitCost: 1,    // months of pay per hire (agency, onboarding)
      severance: 1.5,    // months of pay per person let go
      revenue: 2200000,  // ₫M / year  (₫2,200 B)
      otherCosts: 260000,// ₫M / year non-people costs
      revenueFollows: false, // does revenue grow with revenue-earning staff?
    };
  }

  // ---- The engine ----
  function compute(s) {
    const months = [];
    const byDiv = {};
    let revHeadsBase = 0, revHeads = new Array(12).fill(0);
    const totals = { hires:0, cuts:0, leavers:0 };
    for (const d of DIVS) {
      byDiv[d.key] = { name:d.name, color:d.color, heads:new Array(12).fill(0), cost:new Array(12).fill(0), baseCost:0, headsToday:0 };
    }
    for (let m = 0; m < 12; m++) {
      const row = { m, heads:0, base:0, allow:0, ot:0, night:0, erc:0, bonus:0, oneOff:0, eeIns:0, pit:0, takeHome:0, total:0 };
      for (const d of DIVS) {
        const ds = s.divs[d.key];
        const raisePct = (ds.raise == null ? s.raise : ds.raise);
        for (const r of d.roles) {
          // two kinds of change: a division-wide delta (spread across roles) landing at ds.month,
          // and a per-role delta (number, or {n, month}) landing at its own month
          // a role delta may be a number (lands at ds.month), {n, month}, or an array of {n, month} (option D)
          const rd = ds.roles[r.key];
          const rdl = Array.isArray(rd) ? rd : [typeof rd === 'object' && rd ? rd : { n: rd || 0, month: ds.month }];
          const divShare = ds.delta * (r.n / d.roles.reduce((a, x) => a + x.n, 0));
          let n = r.n + ((m + 1) >= ds.month ? divShare : 0) + rdl.reduce((a, x) => a + ((m + 1) >= x.month ? x.n : 0), 0);
          const aRate = s.attrition / 100 / 12;
          const leaversThisMonth = r.n * aRate;
          if (!s.backfill) n -= r.n * (1 - Math.pow(1 - aRate, m + 1));
          n = Math.max(0, n);
          const pay = r.pay * (1 + ((m + 1) >= s.raiseMonth ? raisePct / 100 : 0));
          const base = n * pay;
          const allow = base * K.allowance;
          const hourly = pay / (s.workDays * 8);
          const ot = n * hourly * K.otMult * r.ot * s.otFactor;
          const night = base * K.nightPrem * r.night * s.nightFactor;
          const erc = n * Math.min(pay, K.insCap) * K.erRate;
          const bonus = m === 0 ? base * s.bonusMonths : 0;
          let oneOff = 0;
          const land = (delta, month) => {
            if ((m + 1) !== month || !delta) return;
            if (delta > 0) { oneOff += delta * pay * s.recruitCost; totals.hires += delta; }
            else { oneOff += -delta * pay * s.severance; totals.cuts += -delta; }
          };
          land(divShare, ds.month); rdl.forEach(x => land(x.n, x.month));
          if (s.backfill) { oneOff += leaversThisMonth * pay * s.recruitCost; }
          totals.leavers += leaversThisMonth;
          const eeInsPP = Math.min(pay, K.insCap) * K.eeRate;
          const grossPP = pay + allow / Math.max(n,1e-9) + (n ? ot / n : 0) + (n ? night / n : 0);
          const pitPP = pitOn(grossPP - eeInsPP - K.personalDed - K.depDed);
          const eeIns = n * eeInsPP, pit = n * pitPP;
          const gross = base + allow + ot + night;
          const total = gross + erc + bonus + oneOff;
          row.heads += n; row.base += base; row.allow += allow; row.ot += ot; row.night += night;
          row.erc += erc; row.bonus += bonus; row.oneOff += oneOff; row.eeIns += eeIns; row.pit += pit;
          row.takeHome += gross - eeIns - pit; row.total += total;
          byDiv[d.key].heads[m] += n; byDiv[d.key].cost[m] += total;
          if (m === 0) byDiv[d.key].headsToday += r.n;
          if (d.revenue) { revHeads[m] += n; if (m === 0) revHeadsBase += r.n; }
        }
      }
      row.gross = row.base + row.allow + row.ot + row.night;
      months.push(row);
    }
    // revenue + profit
    const seasonal = [0.86,0.78,0.95,1.0,1.02,1.04,1.02,1.03,1.05,1.08,1.1,1.07]; // mild VN seasonality, sums to 12
    for (let m = 0; m < 12; m++) {
      const row = months[m];
      let rev = s.revenue / 12 * seasonal[m];
      if (s.revenueFollows) rev *= revHeads[m] / revHeadsBase;
      row.revenue = rev;
      row.other = s.otherCosts / 12;
      row.profit = rev - row.total - row.other;
      row.margin = rev ? row.profit / rev : 0;
    }
    const sum = k => months.reduce((a, r) => a + r[k], 0);
    const year = {
      cost: sum('total'), gross: sum('gross'), base: sum('base'), allow: sum('allow'), ot: sum('ot'), night: sum('night'),
      erc: sum('erc'), bonus: sum('bonus'), oneOff: sum('oneOff'), eeIns: sum('eeIns'), pit: sum('pit'), takeHome: sum('takeHome'),
      revenue: sum('revenue'), other: sum('other'), profit: sum('profit'),
      headsEnd: months[11].heads, headsAvg: sum('heads') / 12,
      peakMonth: months.reduce((b, r) => r.total > months[b].total ? r.m : b, 0),
    };
    year.margin = year.revenue ? year.profit / year.revenue : 0;
    year.costPerHead = year.cost / 12 / year.headsAvg;
    year.peopleShare = year.revenue ? year.cost / year.revenue : 0;
    for (const d of DIVS) byDiv[d.key].year = byDiv[d.key].cost.reduce((a, b) => a + b, 0);
    return { months, year, byDiv, totals };
  }

  let _base = null;
  const baseline = () => _base || (_base = compute(defaultState()));

  // ---- Goal seek: how far can one knob go before margin drops below target? ----
  function maxHeadsForMargin(s, divKey, targetMargin) {
    let lo = 0, hi = 4000;
    const test = n => { const t = clone(s); t.divs[divKey].delta = n; return compute(t).year.margin >= targetMargin; };
    if (!test(0)) return 0;
    while (lo < hi) { const mid = Math.ceil((lo + hi) / 2); if (test(mid)) lo = mid; else hi = mid - 1; }
    return lo;
  }
  function maxRaiseForMargin(s, targetMargin) {
    let lo = 0, hi = 60;
    const test = p => { const t = clone(s); t.raise = p; return compute(t).year.margin >= targetMargin; };
    if (!test(0)) return 0;
    while (hi - lo > 0.1) { const mid = (lo + hi) / 2; if (test(mid)) lo = mid; else hi = mid; }
    return Math.floor(lo * 2) / 2;
  }
  const clone = o => JSON.parse(JSON.stringify(o));
  const roleSum = ds => Object.values(ds.roles).reduce((a, v) => a + (Array.isArray(v) ? v.reduce((b, x) => b + x.n, 0) : (typeof v === 'object' && v ? v.n : v)), 0);

  // ---- Formatting (₫, plain) ----
  const fmt = {
    money(v, opts = {}) {
      const sign = v < 0 ? '−' : (opts.plus && v > 0 ? '+' : '');
      const a = Math.abs(v);
      if (a >= 1000) return `${sign}₫${(a / 1000).toLocaleString('en', { maximumFractionDigits: a >= 100000 ? 0 : 1 })} B`;
      if (a >= 1) return `${sign}₫${a.toLocaleString('en', { maximumFractionDigits: a >= 100 ? 0 : 1 })} M`;
      return `${sign}₫${(a * 1000).toLocaleString('en', { maximumFractionDigits: 0 })} K`;
    },
    int(v, opts = {}) { const sign = v < 0 ? '−' : (opts.plus && v > 0 ? '+' : ''); return sign + Math.round(Math.abs(v)).toLocaleString('en'); },
    pct(v, opts = {}) { const p = v * 100; const sign = p < 0 ? '−' : (opts.plus && p > 0 ? '+' : ''); return `${sign}${Math.abs(p).toFixed(opts.d ?? 1)}%`; },
    pts(v) { const p = v * 100; return `${p < 0 ? '−' : '+'}${Math.abs(p).toFixed(1)} pt`; },
    month: i => MONTHS_LONG[i - 1],
  };

  // ---- Number animation ----
  function animateNumber(el, to, format, ms = 420) {
    const from = el._v ?? to;
    el._v = to;
    if (from === to) { el.textContent = format(to); return; }
    const t0 = performance.now();
    const tick = t => {
      const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      el.textContent = format(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  // ---- Lucide icons (stroke only, no emoji) ----
  const ICONS = {
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    'user-plus': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/>',
    'user-minus': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="22" x2="16" y1="11" y2="11"/>',
    wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
    'trending-up': '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
    'trending-down': '<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>',
    clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
    minus: '<path d="M5 12h14"/>',
    sparkles: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>',

  const icon = (name, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;

  // ---- The plain-language summary sentence ----
  function describe(s, r, b) {
    const parts = [];
    let hires = 0, cuts = 0;
    const hireBits = [], cutBits = [];
    for (const d of DIVS) {
      const ds = s.divs[d.key];
      const tot = ds.delta + roleSum(ds);
      if (tot > 0) { hires += tot; hireBits.push(`${fmt.int(tot)} in ${d.name}`); }
      if (tot < 0) { cuts += -tot; cutBits.push(`${fmt.int(-tot)} in ${d.name}`); }
    }
    if (hires) parts.push(`hiring ${hireBits.join(', ')}`);
    if (cuts) parts.push(`letting go ${cutBits.join(', ')}`);
    if (s.raise) parts.push(`a ${s.raise}% raise from ${fmt.month(s.raiseMonth)}`);
    if (s.otFactor !== 1) parts.push(`${s.otFactor > 1 ? 'more' : 'less'} overtime (${fmt.pct(s.otFactor - 1, { plus: true, d: 0 })})`);
    if (s.nightFactor !== 1) parts.push(`${s.nightFactor > 1 ? 'more' : 'fewer'} night shifts (${fmt.pct(s.nightFactor - 1, { plus: true, d: 0 })})`);
    if (s.bonusMonths !== 1) parts.push(`${s.bonusMonths === 0 ? 'no Tet bonus' : s.bonusMonths + ' months of Tet bonus'}`);
    if (!s.backfill) parts.push('not replacing leavers');
    if (s.attrition !== 12) parts.push(`${s.attrition}% of people leaving a year`);
    const dCost = r.year.cost - b.year.cost, dProfit = r.year.profit - b.year.profit;
    if (!parts.length) return { lead: 'This is your company today.', tail: `${fmt.int(b.year.headsEnd)} people cost ${fmt.money(b.year.cost)} a year and you keep ${fmt.money(b.year.profit)} profit — a ${fmt.pct(b.year.margin)} margin.` };
    const lead = 'With ' + (parts.length > 1 ? parts.slice(0, -1).join(', ') + ' and ' + parts.slice(-1) : parts[0]) + ',';
    const tail = `your yearly people cost ${dCost >= 0 ? 'rises' : 'falls'} by ${fmt.money(Math.abs(dCost))} to ${fmt.money(r.year.cost)}, and profit ${dProfit >= 0 ? 'goes up' : 'goes down'} ${fmt.money(Math.abs(dProfit))} — margin ${fmt.pct(b.year.margin)} → ${fmt.pct(r.year.margin)}.`;
    return { lead, tail };
  }

  // ---- Watch-outs (what could bite) ----
  function warnings(s, r, b) {
    const w = [];
    if (r.year.margin < 0.10) w.push({ level: 'crit', text: `Margin falls to ${fmt.pct(r.year.margin)} — below the 10% floor. Cut ${fmt.money(0.10 * r.year.revenue - r.year.profit)} of cost or add revenue.` });
    else if (r.year.margin < 0.15) w.push({ level: 'warn', text: `Margin at ${fmt.pct(r.year.margin)} is thin. Anything under 15% leaves little room for a slow quarter.` });
    const worst = r.months.reduce((a, m) => m.profit < a.profit ? m : a, r.months[0]);
    if (worst.profit < 0) {
      const hiresThen = r.months[worst.m].oneOff > r.months[worst.m].base * 0.02;
      const why = worst.m === 0 ? (hiresThen ? 'the Tet bonus and new hires land in the same month. Move the hires later and it recovers.' : 'the Tet bonus is paid this month. It is normal; make sure the cash is there.') : (hiresThen ? 'hiring and severance costs land together this month. Spread them out.' : 'costs outrun revenue this month.');
      w.push({ level: 'crit', text: `${fmt.month(worst.m + 1)} loses money (${fmt.money(worst.profit)}) — ${why}` });
    }
    const hireMonths = DIVS.filter(d => (s.divs[d.key].delta + roleSum(s.divs[d.key])) > 0).map(d => s.divs[d.key].month);
    if (hireMonths.length && r.totals.hires > 150) w.push({ level: 'warn', text: `${fmt.int(r.totals.hires)} new hires is a lot to recruit at once — roughly ${Math.ceil(r.totals.hires / 25)} recruiter-months of work. Spread them over two or three months.` });
    if (s.raise >= 12) w.push({ level: 'warn', text: `A ${s.raise}% raise is well above the market average of 7–9%. Great for keeping people; check the ${fmt.money(r.year.cost - b.year.cost)} yearly bill.` });
    if (s.attrition >= 20) w.push({ level: 'warn', text: `${s.attrition}% leaving a year means re-hiring ${fmt.int(r.totals.leavers)} people — ${fmt.money(r.totals.leavers * 15 * s.recruitCost)} in recruiting cost alone.` });
    if (s.otFactor >= 1.5) w.push({ level: 'warn', text: `Overtime at ${fmt.pct(s.otFactor - 1, { plus: true, d: 0 })} vs today brushes the 40 h/month legal cap for factory roles. Hiring may be cheaper.` });
    if (!w.length) w.push({ level: 'ok', text: 'Nothing to worry about. Margin, cash and hiring pace all look healthy.' });
    return w;
  }

  // ---- Tiny SVG chart kit ----
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const nice = max => { const p = Math.pow(10, Math.floor(Math.log10(max))); const n = max / p; const s = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10; return s * p; };

  function tooltip(container) {
    let t = container.querySelector('.wf-tip');
    if (!t) { t = document.createElement('div'); t.className = 'wf-tip'; container.appendChild(t); }
    return t;
  }

  // Line/area chart: series = [{name, values[12], color, dash, area}]
  function lines(container, { series, fmtY = fmt.money, x = MONTHS, band, baseline0 = true, h = 220 }) {
    container.innerHTML = ''; container.classList.add('wf-chart');
    const W = container.clientWidth || 600, H = h, P = { l: 56, r: 24, t: 18, b: 28 };
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', height: H }, container);
    const all = series.flatMap(s => s.values).concat(band ? [band.lo, band.hi] : []);
    let max = Math.max(...all), min = Math.min(0, ...all);
    if (!baseline0) min = Math.min(...all);
    const span = nice((max - min) * 1.15 || 1); max = min + span;
    const X = i => P.l + (W - P.l - P.r) * i / (x.length - 1);
    const Y = v => P.t + (H - P.t - P.b) * (1 - (v - min) / (max - min));
    for (let i = 0; i <= 4; i++) {
      const v = min + (max - min) * i / 4, y = Y(v);
      el('line', { x1: P.l, x2: W - P.r, y1: y, y2: y, class: 'wf-grid' }, svg);
      el('text', { x: P.l - 8, y: y + 4, class: 'wf-ax', 'text-anchor': 'end' }, svg).textContent = fmtY(v);
    }
    if (min < 0) el('line', { x1: P.l, x2: W - P.r, y1: Y(0), y2: Y(0), class: 'wf-zero' }, svg);
    x.forEach((m, i) => { el('text', { x: X(i), y: H - 8, class: 'wf-ax', 'text-anchor': 'middle' }, svg).textContent = m; });
    if (band) el('rect', { x: P.l, y: Y(band.hi), width: W - P.l - P.r, height: Y(band.lo) - Y(band.hi), class: 'wf-band' }, svg);
    series.forEach(s => {
      const pts = s.values.map((v, i) => `${X(i)},${Y(v)}`);
      if (s.area) el('path', { d: `M${X(0)},${Y(Math.max(min,0))} L${pts.join(' L')} L${X(x.length - 1)},${Y(Math.max(min,0))} Z`, fill: s.color, opacity: 0.10 }, svg);
      el('path', { d: 'M' + pts.join(' L'), fill: 'none', stroke: s.color, 'stroke-width': s.dash ? 2 : 2.5, 'stroke-dasharray': s.dash ? '5 5' : '', 'stroke-linejoin': 'round', class: 'wf-line' }, svg);
      const last = s.values.length - 1;
      el('circle', { cx: X(last), cy: Y(s.values[last]), r: 4, fill: s.color, stroke: '#fff', 'stroke-width': 2 }, svg);
    });
    // hover
    const cross = el('line', { y1: P.t, y2: H - P.b, class: 'wf-cross', opacity: 0 }, svg);
    const dots = series.map(s => el('circle', { r: 5, fill: s.color, stroke: '#fff', 'stroke-width': 2, opacity: 0 }, svg));
    const tip = tooltip(container);
    const hit = el('rect', { x: P.l, y: P.t, width: W - P.l - P.r, height: H - P.t - P.b, fill: 'transparent' }, svg);
    hit.addEventListener('mousemove', ev => {
      const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * W / r.width;
      const i = Math.max(0, Math.min(x.length - 1, Math.round((px - P.l) / (W - P.l - P.r) * (x.length - 1))));
      cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('opacity', 1);
      series.forEach((s, k) => { dots[k].setAttribute('cx', X(i)); dots[k].setAttribute('cy', Y(s.values[i])); dots[k].setAttribute('opacity', 1); });
      tip.innerHTML = `<b>${x[i]}</b>` + series.map(s => `<div><i style="background:${s.color}"></i>${s.name} <span>${fmtY(s.values[i])}</span></div>`).join('');
      tip.style.opacity = 1; tip.style.left = Math.min(r.width - 170, X(i) * r.width / W + 12) + 'px'; tip.style.top = (ev.clientY - r.top - 10) + 'px';
    });
    hit.addEventListener('mouseleave', () => { cross.setAttribute('opacity', 0); dots.forEach(d => d.setAttribute('opacity', 0)); tip.style.opacity = 0; });
  }

  // Grouped bars: cats[], series=[{name, values, color}]
  function bars(container, { cats, series, fmtY = fmt.money, h = 220, colors }) {
    container.innerHTML = ''; container.classList.add('wf-chart');
    const W = container.clientWidth || 600, H = h, P = { l: 56, r: 12, t: 18, b: 28 };
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', height: H }, container);
    const max = nice(Math.max(...series.flatMap(s => s.values)) * 1.15 || 1);
    const Y = v => P.t + (H - P.t - P.b) * (1 - v / max);
    for (let i = 0; i <= 4; i++) { const v = max * i / 4, y = Y(v); el('line', { x1: P.l, x2: W - P.r, y1: y, y2: y, class: 'wf-grid' }, svg); el('text', { x: P.l - 8, y: y + 4, class: 'wf-ax', 'text-anchor': 'end' }, svg).textContent = fmtY(v); }
    const gw = (W - P.l - P.r) / cats.length, bw = Math.min(28, (gw * 0.7) / series.length);
    const tip = tooltip(container);
    cats.forEach((c, i) => {
      const cx = P.l + gw * i + gw / 2;
      el('text', { x: cx, y: H - 8, class: 'wf-ax', 'text-anchor': 'middle' }, svg).textContent = c;
      series.forEach((s, k) => {
        const x = cx - (series.length * bw + (series.length - 1) * 2) / 2 + k * (bw + 2);
        const v = s.values[i], y = Y(v);
        const rect = el('rect', { x, y, width: bw, height: Math.max(0, Y(0) - y), rx: 4, fill: colors ? colors[i] : s.color, opacity: s.ghost ? 0.35 : 1, class: 'wf-bar' }, svg);
        rect.addEventListener('mousemove', ev => { const r = svg.getBoundingClientRect(); tip.innerHTML = `<b>${c}</b><div><i style="background:${colors ? colors[i] : s.color}"></i>${s.name} <span>${fmtY(v)}</span></div>`; tip.style.opacity = 1; tip.style.left = Math.min(r.width - 170, ev.clientX - r.left + 12) + 'px'; tip.style.top = (ev.clientY - r.top - 10) + 'px'; });
        rect.addEventListener('mouseleave', () => tip.style.opacity = 0);
      });
    });
  }

  // Waterfall: start {label,value}, steps [{label,value}], end label
  function waterfall(container, { start, steps, endLabel, fmtY = fmt.money, h = 240, upColor = '#DC2668', downColor = '#2E7D4F', totalColor = '#5A4BB0' }) {
    container.innerHTML = ''; container.classList.add('wf-chart');
    const W = container.clientWidth || 600, H = h, P = { l: 56, r: 12, t: 18, b: 40 };
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', height: H }, container);
    const items = [{ label: start.label, value: start.value, total: true }];
    let run = start.value;
    steps.forEach(s => { items.push({ label: s.label, value: s.value, from: run }); run += s.value; });
    items.push({ label: endLabel, value: run, total: true });
    const vals = items.flatMap(i => i.total ? [i.value] : [i.from, i.from + i.value]);
    const lo = Math.min(0, ...vals), hiV = Math.max(...vals);
    const min = lo, max = min + nice((hiV - lo) * 1.1 || 1);
    const Y = v => P.t + (H - P.t - P.b) * (1 - (v - min) / (max - min));
    for (let i = 0; i <= 4; i++) { const v = min + (max - min) * i / 4, y = Y(v); el('line', { x1: P.l, x2: W - P.r, y1: y, y2: y, class: 'wf-grid' }, svg); el('text', { x: P.l - 8, y: y + 4, class: 'wf-ax', 'text-anchor': 'end' }, svg).textContent = fmtY(v); }
    const gw = (W - P.l - P.r) / items.length, bw = Math.min(56, gw * 0.62);
    const tip = tooltip(container);
    items.forEach((it, i) => {
      const cx = P.l + gw * i + gw / 2;
      const a = it.total ? 0 : it.from, b = it.total ? it.value : it.from + it.value;
      const y1 = Y(Math.max(a, b)), y2 = Y(Math.min(a, b));
      const color = it.total ? totalColor : (it.value >= 0 ? upColor : downColor);
      const r = el('rect', { x: cx - bw / 2, y: y1, width: bw, height: Math.max(2, y2 - y1), rx: 4, fill: color, class: 'wf-bar' }, svg);
      if (!it.total && i < items.length - 1) el('line', { x1: cx + bw / 2, x2: cx + gw - bw / 2, y1: Y(b), y2: Y(b), class: 'wf-connector' }, svg);
