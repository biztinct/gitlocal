<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boardroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
  :root{
    --ink:#1E1B2E; --ink-2:#4B4866; --muted:#64748B; --line:#E2E8F0; --canvas:#F4F5FB; --card:#FFFFFF;
    --primary:#5A4BB0; --primary-deep:#4A3D96; --primary-soft:#EDEAF8; --primary-soft2:#CBC2EE; --primary-dark:#241F52;
    --money:#2E7D4F; --money-soft:#E6F4EC; --info:#2563EB; --info-soft:#E8EFFD; --warn:#D97706; --warn-soft:#FDF1E1; --rose:#DC2668; --rose-soft:#FCE7EF; --teal:#0F766E; --teal-soft:#E0F2F1;
    --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
    --shadow:0 1px 2px rgba(30,27,46,.04),0 8px 24px rgba(30,27,46,.06);
    --panel-w:340px;
  }
  *{box-sizing:border-box}
  html{color-scheme:light}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
  body.has-max{overflow:hidden}
  button,input,select{font-family:inherit;font-size:inherit;color:inherit}
  h1,h2,h3{margin:0;text-wrap:balance}
  .num{font-variant-numeric:tabular-nums}
  .ic{width:18px;height:18px;flex:none}
  .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .sub{color:var(--muted);font-weight:600}

  /* top bar */
  .top{height:58px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px;position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800}
  .brand .mark{width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:13px}
  .crumb{color:var(--muted);font-weight:600;white-space:nowrap}.crumb b{color:var(--ink)}
  .spacer{flex:1}
  .name{border:1px solid transparent;border-radius:10px;padding:7px 10px;font-weight:800;min-width:160px;background:transparent}
  .name:hover,.name:focus{border-color:var(--line);background:var(--canvas);outline:0}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap;user-select:none}
  .btn:hover{background:var(--primary-soft)} .btn:disabled{opacity:.4;cursor:default}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-deep)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
  .btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
  .btn.icon{padding:7px;border-radius:9px}
  .btn.hold{border-color:var(--primary-soft2);color:var(--primary-deep)} .btn.hold.on{background:var(--primary);color:#fff}
  .btn:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .seg{display:inline-flex;background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;border-radius:9px;padding:6px 11px;font-weight:700;cursor:pointer;color:var(--muted);display:inline-flex;gap:6px;align-items:center;font-size:13px;white-space:nowrap}
  .seg button .ic{width:14px;height:14px}
  .seg button:hover{background:var(--primary-soft)}
  .seg button.on{background:var(--primary);color:#fff}
  .seg.tiny button{padding:6px 7px}
  .seg.tiny button.on{background:var(--primary-soft);color:var(--primary-deep)}

  /* workspace: main + dockable panel */
  .app{display:grid;gap:0;max-width:1560px;margin:0 auto;align-items:start}
  .app[data-dock="right"]{grid-template-columns:minmax(0,1fr) var(--panel-w)}
  .app[data-dock="left"]{grid-template-columns:var(--panel-w) minmax(0,1fr)}
  .app[data-dock="left"] .panel{order:-1}
  .app[data-dock="right"][data-panel="closed"]{grid-template-columns:minmax(0,1fr) 56px}
  .app[data-dock="left"][data-panel="closed"]{grid-template-columns:56px minmax(0,1fr)}
  .app[data-dock="top"],.app[data-dock="bottom"]{grid-template-columns:minmax(0,1fr)}
  .app[data-dock="bottom"]{padding-bottom:190px}
  .app[data-dock="bottom"][data-panel="closed"]{padding-bottom:56px}
  @media (max-width:1100px){.app[data-dock="right"],.app[data-dock="left"]{grid-template-columns:minmax(0,1fr)!important}.app[data-dock="left"] .panel,.app[data-dock="right"] .panel{order:0;position:static!important;max-height:none!important}}
  .wrap{padding:16px 18px 24px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr);min-width:0;container-type:inline-size;container-name:main}
  @media (max-width:1500px){.crumb{display:none}.top .lbl{display:none}}
  .ctools .btn{display:inline-flex;width:auto;height:auto;border:1px solid var(--primary-soft2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-width:0;position:relative}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .ctools{display:flex;gap:4px;flex:none}
  .ctools button{border:1px solid transparent;background:transparent;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
  .ctools button:hover{background:var(--primary-soft);color:var(--primary-deep);border-color:var(--primary-soft2)}
  .ctools .ic{width:15px;height:15px}
  .card.collapsed .cbody{display:none}
  .card .csum{display:none;color:var(--muted);font-weight:600;font-size:13px;margin-top:6px}
  .card.collapsed .csum{display:block}
  .card.max{position:fixed;inset:14px;z-index:35;overflow:auto;box-shadow:0 30px 80px rgba(30,27,46,.35);border-radius:20px}
  .card.max .cbody{display:block}
  .max-backdrop{position:fixed;inset:0;background:rgba(36,31,82,.35);z-index:34;backdrop-filter:blur(3px);display:none}
  body.has-max .max-backdrop{display:block}

  /* panel */
  .panel{background:var(--card);border-left:1px solid var(--line);min-width:0;display:flex;flex-direction:column;position:sticky;top:58px;max-height:calc(100vh - 58px);overflow:auto}
  .app[data-dock="left"] .panel{border-left:0;border-right:1px solid var(--line)}
  .app[data-dock="top"] .panel{position:sticky;top:58px;z-index:14;border-left:0;border-bottom:1px solid var(--line);max-height:none;overflow:visible}
  .app[data-dock="bottom"] .panel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:14;border-left:0;border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(30,27,46,.08);max-height:60vh}
  .phead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800;font-size:13px;position:sticky;top:0;background:var(--card);z-index:2}
  .phead .ic{color:var(--primary)}
  .phead .ctools{margin-left:auto}
  .pbody{padding:14px;display:grid;gap:12px;align-content:start}
  .app[data-dock="top"] .pbody,.app[data-dock="bottom"] .pbody{max-width:1524px;margin:0 auto;width:100%;grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .app[data-dock="top"] .pbody>.full,.app[data-dock="bottom"] .pbody>.full{grid-column:1/-1}
  .app[data-panel="closed"] .pbody,.app[data-panel="closed"] .phead .ptitle{display:none}
  .app[data-panel="closed"] .panel{align-items:center}
  .app[data-panel="closed"][data-dock="right"] .phead,.app[data-panel="closed"][data-dock="left"] .phead{flex-direction:column;border:0;padding:10px 6px;gap:6px}
  .app[data-panel="closed"] .phead .ctools{margin:0;flex-direction:column}
  .app[data-panel="closed"][data-dock="top"] .phead,.app[data-panel="closed"][data-dock="bottom"] .phead{padding:8px 18px}
  .app[data-panel="closed"] .pmodes{display:flex}
  .pmodes{display:none;gap:4px}
  .app[data-panel="closed"][data-dock="right"] .pmodes,.app[data-panel="closed"][data-dock="left"] .pmodes{flex-direction:column}
  .pmodes button{border:1px solid transparent;background:transparent;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
  .pmodes button.on{background:var(--primary-soft);color:var(--primary-deep)}
  .pmodes button:hover{background:var(--primary-soft)}
  .pmodes .ic{width:16px;height:16px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .tab .ic{width:13px;height:13px}
  .tab:hover{background:var(--primary-soft)} .tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .sent{font-size:18px;font-weight:700;line-height:2;letter-spacing:-.01em;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;min-height:40px}
  .sent .k{color:var(--muted);font-weight:600}
  .blank{display:inline-flex;align-items:center;border-bottom:2px solid var(--primary-soft2);background:var(--primary-soft);border-radius:8px 8px 2px 2px;padding:0 4px;color:var(--primary-deep);transition:background .15s;max-width:100%}
  .blank:hover,.blank:focus-within{background:#E3DEF7;border-bottom-color:var(--primary)}
  .blank input,.blank select{border:0;background:transparent;font-weight:800;font-size:18px;color:var(--primary-deep);outline:0;padding:0 2px;cursor:pointer;appearance:none;-webkit-appearance:none;line-height:1.6;max-width:100%}
  .blank input[type=number]{width:3.6ch;text-align:center;-moz-appearance:textfield}
  .blank input[type=number]::-webkit-inner-spin-button{display:none}
  .blank .ic{width:14px;height:14px;color:var(--primary);opacity:.7}
  .preview{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:12px;color:var(--ink-2)}
  .preview .pill{border-radius:999px;padding:3px 9px;background:#EEF1F6;display:inline-flex;gap:5px;align-items:center}
  .preview .good{background:var(--money-soft);color:var(--money)} .preview .bad{background:var(--rose-soft);color:var(--rose)}
  .comp-right{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .app[data-dock="top"] .comp-right,.app[data-dock="bottom"] .comp-right{align-items:flex-end}
  .dials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .app[data-dock="top"] .dials,.app[data-dock="bottom"] .dials{grid-template-columns:repeat(6,minmax(0,1fr))}
  @media (max-width:1100px){.app[data-dock="top"] .dials,.app[data-dock="bottom"] .dials{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .dial{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .dial .t{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12px;color:var(--ink-2)}
  .dial .t .ic{width:13px;height:13px;color:var(--primary)}
  .dial .v{font-size:16px;font-weight:800;margin:2px 0;color:var(--primary-deep)} .dial .v.zero{color:var(--muted)} .dial .v.neg{color:var(--rose)}
  .dial select{width:100%;border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-weight:700;font-size:12px;margin-bottom:4px}
  input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent;margin:0;width:100%}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--primary-soft2)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--primary);margin-top:-6px;box-shadow:0 2px 6px rgba(90,75,176,.35);cursor:grab}
  input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--primary-soft2)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--primary)}
  .touch-help{display:grid;gap:8px}
  .app[data-dock="top"] .touch-help,.app[data-dock="bottom"] .touch-help{grid-template-columns:repeat(3,minmax(0,1fr))}
  .touch-help div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:12px;color:var(--ink-2);line-height:1.4}
  .touch-help .ic{color:var(--primary);margin-top:1px}
  .touch-help b{display:block;color:var(--ink);font-size:13px}

  /* hero */
  .hero{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:14px;align-items:stretch}
  .river-card{padding:16px 20px 10px}
  .river-card h1{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
  .river-card h1 .tail{display:block;font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-top:4px}
  #river{width:100%;height:auto;aspect-ratio:1000/400;display:block;overflow:visible;font-family:inherit;margin-top:6px;touch-action:none}
  .card.max #river{aspect-ratio:auto;height:calc(100vh - 220px);max-height:720px}
  #river text{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
  #river text.in{stroke:none}
  #river .rib{transition:d .45s cubic-bezier(.4,0,.2,1),opacity .2s}
  #river .rib:hover{opacity:.85!important}
  #river .node{transition:y .45s cubic-bezier(.4,0,.2,1),height .45s cubic-bezier(.4,0,.2,1);cursor:pointer}
  #river.dragging .node,#river.dragging .rib{transition:none}
  #river .node.hot{stroke:var(--ink);stroke-width:2}
  #river .node.grab{cursor:ns-resize}
  #river .handle{fill:#fff;stroke:var(--primary);stroke-width:2;cursor:ns-resize;opacity:0;transition:opacity .15s}
  #river g:hover .handle,#river .handle.show{opacity:1}
  #river .nl{font-size:13px;font-weight:800;fill:var(--ink)}
  #river .nv{font-size:12px;font-weight:700;fill:var(--muted);font-variant-numeric:tabular-nums}
  #river .col{font-size:11px;font-weight:800;fill:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  #river .lead{stroke:#B8BFCC;stroke-width:1;fill:none}
  #river .ghost{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;opacity:.45;pointer-events:none}
  .river-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;flex-wrap:wrap}
  .river-foot .ic{width:14px;height:14px}
  .hero-r{display:grid;grid-template-rows:auto 1fr;gap:14px;min-width:0}
  .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px}
  .kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--canvas)}
  .kpi small{color:var(--muted);font-weight:700;font-size:11px}
  .kpi b{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .delta{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;width:max-content;margin-top:4px;background:#EEF1F6;color:var(--ink-2)}
  .delta.good{background:var(--money-soft);color:var(--money)} .delta.bad{background:var(--rose-soft);color:var(--rose)}
  .delta .ic{width:12px;height:12px}
  .goals{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .goals h2{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
  .goal-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
  .goal-row label{font-weight:700;font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:8px;line-height:1.3}
  .goal-row label .ic{width:14px;height:14px;color:var(--primary)}
  .goal-in{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:0 8px;height:32px;font-weight:800}
  .goal-in input{border:0;background:transparent;width:74px;text-align:right;font-weight:800;outline:0}
  .goal-in small{color:var(--muted);font-weight:700}
  .goal-in.off{opacity:.55}
  .goal-status{font-size:12px;font-weight:700;border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start;line-height:1.4}
  .goal-status .ic{width:14px;height:14px;margin-top:2px}
  .g-ok{background:var(--money-soft);color:var(--money)} .g-gap{background:var(--warn-soft);color:#92400E}
  .sugg{display:grid;gap:6px}
  .sugg .s{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:7px 8px 7px 10px;font-weight:700;font-size:12px;transition:border-color .15s,background .15s}
  .sugg .s:hover{border-color:var(--primary-soft2);background:#FAFAFE}
  .sugg .s small{display:block;color:var(--muted);font-weight:600;font-size:11px}
  .sugg .s b{color:var(--money);white-space:nowrap} .sugg .s b.bad{color:var(--rose)}
  .sugg .s .btn{padding:4px 8px;font-size:11px}

  /* board */
  .board{padding:14px 18px 12px}
  .board h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .lane{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px dashed var(--primary-soft2);border-radius:12px;background:#FAFAFE;margin:10px 0;flex-wrap:wrap;min-height:44px}
  .lane .lab{font-weight:800;font-size:12px;color:var(--primary-deep);display:inline-flex;align-items:center;gap:6px;margin-right:4px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-weight:700;font-size:12px;animation:pop .25s ease}
  .chip .imp{color:var(--muted);font-weight:700;font-size:11px}
  .chip .x{border:0;background:transparent;color:#94A3B8;cursor:pointer;display:grid;place-items:center;width:22px;height:22px;border-radius:50%}
  .chip .x:hover{background:var(--rose-soft);color:var(--rose)}
  .lane .hint{color:var(--muted);font-weight:600;font-size:12px}
  .months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
  .mo{display:flex;flex-direction:column;border-radius:12px;border:1px solid var(--line);background:var(--canvas);min-height:150px;transition:border-color .15s,background .15s;position:relative}
  .card.max .mo{min-height:300px}
  .mo.over{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
  .mo.loss{background:#FFF6F9;border-color:#F5C6D6}
  .mo-head{padding:8px 8px 6px;display:flex;flex-direction:column;gap:5px}
  .mo-head .m{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:12px}
  .mo-head .tet{font-size:9px;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:2px 5px;font-weight:800}
  .mo-head .pbar{height:36px;display:flex;align-items:flex-end;gap:2px}
  .mo-head .pbar i{flex:1;border-radius:4px 4px 2px 2px;background:var(--money);transition:height .4s cubic-bezier(.2,.8,.2,1);min-height:2px}
  .mo-head .pbar i.ghost{background:#CBD5E1;opacity:.7} .mo-head .pbar i.neg{background:var(--rose)}
  .mo-head .pv{font-size:11px;font-weight:800;color:var(--money)} .mo.loss .pv{color:var(--rose)}
  .mo-body{flex:1;padding:0 6px 6px;display:flex;flex-direction:column;gap:5px}
  .mo-body .drop{flex:1;border-radius:8px;min-height:30px;display:grid;place-items:center;color:#B8BFCC;font-size:11px;font-weight:700;text-align:center;padding:4px;border:1px dashed transparent}
  .mo.over .drop{border-color:var(--primary-soft2);color:var(--primary)}
  .mv{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--primary));border-radius:10px;padding:7px 8px 7px 9px;font-size:12px;font-weight:700;line-height:1.3;cursor:grab;position:relative;animation:pop .25s ease}
  .mv:hover{box-shadow:0 8px 18px rgba(90,75,176,.14);border-color:var(--primary-soft2)}
  .mv.drag{opacity:.4}
  .mv .t{display:flex;align-items:center;gap:6px}.mv .t .ic{width:14px;height:14px;color:var(--c,var(--primary))}
  .mv .d{color:var(--muted);font-weight:600;font-size:11px;margin-top:2px}
  .mv .imp{margin-top:5px;font-size:11px;font-weight:800;display:flex;gap:4px}
  .mv .imp span{border-radius:6px;padding:2px 6px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .mv .imp .good{background:var(--money-soft);color:var(--money)} .mv .imp .bad{background:var(--rose-soft);color:var(--rose)} .mv .imp .ic{width:11px;height:11px}

<script>
(() => {
  const W = window.WF, F = W.fmt, $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  W.injectCss();
  // a few extra Lucide glyphs for layout controls
  const EXTRA = { 'panel-left': '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>', 'panel-right': '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/>', 'panel-top': '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/>', 'panel-bottom': '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 15h18"/>', maximize: '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>', minimize: '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>', 'chevron-up': '<path d="m18 15-6-6-6 6"/>', 'chevron-down': '<path d="m6 9 6 6 6-6"/>', 'app-window': '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 4v4"/><path d="M2 8h20"/><path d="M6 4v4"/>', 'layout-grid': '<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>', 'rows': '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 12h18"/>' };
  const I = (name, cls = '') => EXTRA[name] ? `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${EXTRA[name]}</svg>` : W.icon(name, cls);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const TYPES = { hire: { label: 'Hire', icon: 'user-plus', monthly: true }, cut: { label: 'Let go', icon: 'user-minus', monthly: true }, raise: { label: 'Pay raise', icon: 'trending-up', monthly: true }, ot: { label: 'Overtime', icon: 'clock' }, night: { label: 'Night shifts', icon: 'moon' }, tet: { label: 'Tet bonus', icon: 'gift' }, leave: { label: 'Leavers', icon: 'users' } };
  const PLAN_COLORS = ['#5A4BB0', '#0F766E', '#D97706', '#2563EB', '#DC2668', '#7C3AED'];

  // ---------- plan + ui state ----------
  const fresh = () => ({ name: 'My 2026 plan', moves: [], revenue: 2200000, other: 260000, follows: false, goals: { margin: { on: true, v: 15 }, profit: { on: false, v: 450 }, cost: { on: false, v: 1500 }, heads: { on: false, v: 4600 } } });
  let P = fresh(), hist = [], redo = [], nextId = 1, mode = 'sentences', view = 'months', peek = null, showToday = false, ghostMove = null;
  let comp = { type: 'hire', month: 3, n: 100, div: 'con', role: '', pct: 5, factor: 0.8, tet: 1, attr: 12, backfill: true };
  let UI = { dock: 'right', panel: 'open', collapsed: {}, max: null, dlg: { layout: 'tabs', panes: ['months', 'people', 'divisions', 'why'], tab: 'months' } };
  try { Object.assign(UI, JSON.parse(localStorage.getItem('wfplan.boardroom.ui') || '{}')); UI.max = null; } catch (e) {}
  const saveUI = () => { try { localStorage.setItem('wfplan.boardroom.ui', JSON.stringify(UI)); } catch (e) {} };

  const baseState = () => { const s = W.defaultState(); s.revenue = P.revenue; s.otherCosts = P.other; s.revenueFollows = P.follows; return s; };
  function share(div, n) { const roles = W.DIV[div].roles, tot = roles.reduce((a, r) => a + r.n, 0); const raw = roles.map(r => n * r.n / tot), out = raw.map(Math.floor); let rest = Math.round(n) - out.reduce((a, b) => a + b, 0); raw.map((v, i) => [v - out[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rest > 0) { out[i]++; rest--; } }); return roles.map((r, i) => [r.key, out[i]]); }
  function toState(moves, plan = P) {
    const s = W.defaultState(); s.revenue = plan.revenue; s.otherCosts = plan.other; s.revenueFollows = plan.follows;
    for (const d of W.DIVS) for (const r of d.roles) s.divs[d.key].roles[r.key] = [];
    for (const m of moves) {
      if (m.type === 'hire' || m.type === 'cut') { const n = m.type === 'hire' ? m.n : -m.n; const parts = m.role ? [[m.role, n]] : share(m.div, Math.abs(n)).map(([k, v]) => [k, n < 0 ? -v : v]); parts.forEach(([k, v]) => { if (v) s.divs[m.div].roles[k].push({ n: v, month: m.month }); }); }
      else if (m.type === 'raise') { s.raise = m.pct; s.raiseMonth = m.month; } else if (m.type === 'ot') s.otFactor = m.factor; else if (m.type === 'night') s.nightFactor = m.factor; else if (m.type === 'tet') s.bonusMonths = m.tet; else if (m.type === 'leave') { s.attrition = m.attr; s.backfill = m.backfill; }
    }
    return s;
  }
  let S, R, B;
  function calc() { S = toState(P.moves); R = W.compute(S); B = W.compute(baseState()); }
  const snap = () => { hist.push(JSON.stringify(P)); if (hist.length > 60) hist.shift(); redo = []; };
  function apply(fn, msg) { snap(); fn(); render(); if (msg) toast(msg); }
  function undo() { if (!hist.length) return; redo.push(JSON.stringify(P)); P = JSON.parse(hist.pop()); render(); }
  function redoIt() { if (!redo.length) return; hist.push(JSON.stringify(P)); P = JSON.parse(redo.pop()); render(); }

  // ---------- words ----------
  const roleName = (div, role) => role ? W.DIV[div].roles.find(r => r.key === role).name : 'people';
  function title(m) { switch (m.type) { case 'hire': return `Hire ${F.int(m.n)} ${roleName(m.div, m.role)}`; case 'cut': return `Let go ${F.int(m.n)} ${roleName(m.div, m.role)}`; case 'raise': return `${m.pct}% raise for everyone`; case 'ot': return `Overtime ${F.pct(m.factor - 1, { plus: true, d: 0 })} vs today`; case 'night': return `Night shifts ${F.pct(m.factor - 1, { plus: true, d: 0 })} vs today`; case 'tet': return m.tet === 0 ? 'No Tet bonus this year' : `${m.tet} month${m.tet === 1 ? '' : 's'} of Tet bonus`; case 'leave': return `${m.attr}% leave a year, ${m.backfill ? 'replaced' : 'not replaced'}`; } }
  const detail = m => (m.type === 'hire' || m.type === 'cut') ? W.DIV[m.div].name : m.type === 'raise' ? `from ${F.month(m.month)}` : 'all year';
  const color = m => (m.type === 'hire' || m.type === 'cut') ? W.DIV[m.div].color : m.type === 'raise' ? '#5A4BB0' : '#64748B';
  function impact(m) { const w = W.compute(toState(P.moves.filter(x => x.id !== m.id))); return { cost: R.year.cost - w.year.cost, profit: R.year.profit - w.year.profit, pts: R.year.margin - w.year.margin }; }
