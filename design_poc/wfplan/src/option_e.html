<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boardroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
  :root{
    --ink:#1E1B2E; --ink-2:#4B4866; --muted:#64748B; --line:#E2E8F0; --canvas:#F4F5FB; --card:#FFFFFF;
    --primary:#5A4BB0; --primary-deep:#4A3D96; --primary-soft:#EDEAF8; --primary-soft2:#CBC2EE; --primary-dark:#241F52;
    --money:#2E7D4F; --money-soft:#E6F4EC; --info:#2563EB; --info-soft:#E8EFFD; --warn:#D97706; --warn-soft:#FDF1E1; --rose:#DC2668; --rose-soft:#FCE7EF; --teal:#0F766E; --teal-soft:#E0F2F1;
    --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
    --shadow:0 1px 2px rgba(30,27,46,.04),0 8px 24px rgba(30,27,46,.06);
  }
  *{box-sizing:border-box}
  html{color-scheme:light}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding-bottom:140px}
  button,input,select{font-family:inherit;font-size:inherit;color:inherit}
  h1,h2,h3{margin:0;text-wrap:balance}
  .num{font-variant-numeric:tabular-nums}
  .ic{width:18px;height:18px;flex:none}
  .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .sub{color:var(--muted);font-weight:600}

  /* top bar */
  .top{height:58px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800}
  .brand .mark{width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:13px}
  .crumb{color:var(--muted);font-weight:600;white-space:nowrap}.crumb b{color:var(--ink)}
  .spacer{flex:1}
  .name{border:1px solid transparent;border-radius:10px;padding:7px 10px;font-weight:800;min-width:170px;background:transparent}
  .name:hover,.name:focus{border-color:var(--line);background:var(--canvas);outline:0}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap;user-select:none}
  .btn:hover{background:var(--primary-soft)} .btn:disabled{opacity:.4;cursor:default}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-deep)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
  .btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
  .btn.hold{border-color:var(--primary-soft2);color:var(--primary-deep)} .btn.hold.on{background:var(--primary);color:#fff}
  .btn:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .modes{display:inline-flex;background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
  .modes button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-weight:700;cursor:pointer;color:var(--muted);display:inline-flex;gap:6px;align-items:center;font-size:13px;white-space:nowrap}
  .modes button .ic{width:14px;height:14px}
  .modes button.on{background:var(--primary);color:#fff}

  .wrap{max-width:1500px;margin:0 auto;padding:18px 20px 0;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-width:0}

  /* hero row */
  .hero{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:16px;align-items:stretch}
  @media (max-width:1100px){.hero{grid-template-columns:minmax(0,1fr)}}
  .river-card{padding:18px 22px 10px;position:relative}
  .river-card .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .river-card h1{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
  .river-card h1 .tail{display:block;font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-top:4px}
  #river{width:100%;height:auto;aspect-ratio:1000/400;display:block;overflow:visible;font-family:inherit;margin-top:8px;touch-action:none}
  #river text{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
  #river text.in{stroke:none}
  #river .rib{transition:d .45s cubic-bezier(.4,0,.2,1),opacity .2s}
  #river .rib:hover{opacity:.85!important}
  #river .node{transition:y .45s cubic-bezier(.4,0,.2,1),height .45s cubic-bezier(.4,0,.2,1);cursor:pointer}
  #river.dragging .node,#river.dragging .rib{transition:none}
  #river .node.hot{stroke:var(--ink);stroke-width:2}
  #river .node.grab{cursor:ns-resize}
  #river .handle{fill:#fff;stroke:var(--primary);stroke-width:2;cursor:ns-resize;opacity:0;transition:opacity .15s}
  #river g:hover .handle,#river .handle.show{opacity:1}
  #river .nl{font-size:13px;font-weight:800;fill:var(--ink)}
  #river .nv{font-size:12px;font-weight:700;fill:var(--muted);font-variant-numeric:tabular-nums}
  #river .col{font-size:11px;font-weight:800;fill:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  #river .ghost{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;opacity:.45;pointer-events:none}
  .river-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;flex-wrap:wrap}
  .river-foot .ic{width:14px;height:14px}
  .hero-r{display:grid;grid-template-rows:auto 1fr;gap:16px;min-width:0}
  .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px}
  .kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--canvas)}
  .kpi small{color:var(--muted);font-weight:700;font-size:11px}
  .kpi b{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .delta{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;width:max-content;margin-top:4px;background:#EEF1F6;color:var(--ink-2)}
  .delta.good{background:var(--money-soft);color:var(--money)} .delta.bad{background:var(--rose-soft);color:var(--rose)}
  .delta .ic{width:12px;height:12px}

  /* goals */
  .goals{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  .goals h2{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
  .goal-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
  .goal-row label{font-weight:700;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
  .goal-row label .ic{width:14px;height:14px;color:var(--primary)}
  .goal-in{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:0 8px;height:32px;font-weight:800}
  .goal-in input{border:0;background:transparent;width:74px;text-align:right;font-weight:800;outline:0}
  .goal-in small{color:var(--muted);font-weight:700}
  .goal-in.off{opacity:.55}
  .goal-status{font-size:12px;font-weight:700;border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start;line-height:1.4}
  .goal-status .ic{width:14px;height:14px;margin-top:2px}
  .g-ok{background:var(--money-soft);color:var(--money)} .g-gap{background:var(--warn-soft);color:#92400E}
  .sugg{display:grid;gap:6px}
  .sugg .s{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:7px 8px 7px 10px;font-weight:700;font-size:12px;cursor:default;transition:border-color .15s,background .15s}
  .sugg .s:hover{border-color:var(--primary-soft2);background:#FAFAFE}
  .sugg .s small{display:block;color:var(--muted);font-weight:600;font-size:11px}
  .sugg .s b{color:var(--money);white-space:nowrap} .sugg .s b.bad{color:var(--rose)}
  .sugg .s .btn{padding:4px 8px;font-size:11px}

  /* board */
  .board{padding:16px 20px 14px}
  .board-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:10px}
  .board-head h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .lane{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px dashed var(--primary-soft2);border-radius:12px;background:#FAFAFE;margin-bottom:10px;flex-wrap:wrap;min-height:44px}
  .lane .lab{font-weight:800;font-size:12px;color:var(--primary-deep);display:inline-flex;align-items:center;gap:6px;margin-right:4px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-weight:700;font-size:12px;animation:pop .25s ease}
  .chip .imp{color:var(--muted);font-weight:700;font-size:11px}
  .chip .x{border:0;background:transparent;color:#94A3B8;cursor:pointer;display:grid;place-items:center;width:22px;height:22px;border-radius:50%}
  .chip .x:hover{background:var(--rose-soft);color:var(--rose)}
  .lane .hint{color:var(--muted);font-weight:600;font-size:12px}
  .months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
  @media (max-width:1300px){.months{grid-template-columns:repeat(6,minmax(0,1fr))}}
  @media (max-width:640px){.months{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .mo{display:flex;flex-direction:column;border-radius:12px;border:1px solid var(--line);background:var(--canvas);min-height:150px;transition:border-color .15s,background .15s;position:relative}
  .mo.over{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
  .mo.loss{background:#FFF6F9;border-color:#F5C6D6}
  .mo-head{padding:8px 8px 6px;display:flex;flex-direction:column;gap:5px}
  .mo-head .m{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:12px}
  .mo-head .tet{font-size:9px;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:2px 5px;font-weight:800}
  .mo-head .pbar{height:36px;display:flex;align-items:flex-end;gap:2px}
  .mo-head .pbar i{flex:1;border-radius:4px 4px 2px 2px;background:var(--money);transition:height .4s cubic-bezier(.2,.8,.2,1);min-height:2px}
  .mo-head .pbar i.ghost{background:#CBD5E1;opacity:.7} .mo-head .pbar i.neg{background:var(--rose)}
  .mo-head .pv{font-size:11px;font-weight:800;color:var(--money)} .mo.loss .pv{color:var(--rose)}
  .mo-body{flex:1;padding:0 6px 6px;display:flex;flex-direction:column;gap:5px}
  .mo-body .drop{flex:1;border-radius:8px;min-height:30px;display:grid;place-items:center;color:#B8BFCC;font-size:11px;font-weight:700;text-align:center;padding:4px;border:1px dashed transparent}
  .mo.over .drop{border-color:var(--primary-soft2);color:var(--primary)}
  .mv{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--primary));border-radius:10px;padding:7px 8px 7px 9px;font-size:12px;font-weight:700;line-height:1.3;cursor:grab;position:relative;animation:pop .25s ease}
  .mv:hover{box-shadow:0 8px 18px rgba(90,75,176,.14);border-color:var(--primary-soft2)}
  .mv.drag{opacity:.4}
  .mv .t{display:flex;align-items:center;gap:6px}.mv .t .ic{width:14px;height:14px;color:var(--c,var(--primary))}
  .mv .d{color:var(--muted);font-weight:600;font-size:11px;margin-top:2px}
  .mv .imp{margin-top:5px;font-size:11px;font-weight:800;display:flex;gap:4px}
  .mv .imp span{border-radius:6px;padding:2px 6px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .mv .imp .good{background:var(--money-soft);color:var(--money)} .mv .imp .bad{background:var(--rose-soft);color:var(--rose)} .mv .imp .ic{width:11px;height:11px}
  .mv .tools{position:absolute;top:5px;right:5px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
  .mv:hover .tools,.mv:focus-within .tools{opacity:1}
  .mv .tools button{border:0;background:var(--card);width:20px;height:20px;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .mv .tools button:hover{color:var(--primary);background:var(--primary-soft)} .mv .tools .ic{width:12px;height:12px}
  @keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

  /* stage + rail */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:0;overflow:hidden}
  @media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}.rail{flex-direction:row;overflow-x:auto;border-left:0;border-top:1px solid var(--line)}}
  .stage-main{padding:18px 22px 16px;min-width:0}
  .stage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:8px;flex-wrap:wrap}
  .stage-head h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .stage-head p{margin:2px 0 0;color:var(--muted);font-weight:600;font-size:12px;max-width:70ch}
  .stage-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chart{min-height:250px}
  .rail{border-left:1px solid var(--line);background:#FAFAFE;display:flex;flex-direction:column;padding:10px}
  .rail button{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:transparent;border-radius:11px;padding:10px 10px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-2);text-align:left;white-space:nowrap}
  .rail button .ic{width:16px;height:16px;color:var(--muted)}
  .rail button:hover{background:var(--primary-soft)}
  .rail button.on{background:var(--card);border-color:var(--line);color:var(--primary-deep);box-shadow:var(--shadow)}
  .rail button.on .ic{color:var(--primary)}
  .rail .badge{margin-left:auto;font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px;background:var(--rose-soft);color:var(--rose)}
  .rail .badge.ok{background:var(--money-soft);color:var(--money)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media (max-width:900px){.split{grid-template-columns:1fr}}
  .caption{color:var(--muted);font-weight:600;font-size:12px;margin-top:8px}
  .key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
  .key i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:2px}
  .key i.dash{background:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 6px)}
  .warns{display:grid;gap:8px}
  .warn{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;font-weight:600;font-size:13px;line-height:1.4}
  .warn .ic{margin-top:1px}
  .w-ok{background:var(--money-soft);color:var(--money)} .w-warn{background:var(--warn-soft);color:#92400E} .w-crit{background:var(--rose-soft);color:#9F1239}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid #F1F5F9;font-weight:600;white-space:nowrap}
  td.r,th.r{text-align:right} tr.cur td{background:var(--primary-soft)}
  .tbl{overflow-x:auto}
  .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .cmp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:8px}
  @media (max-width:900px){.cmp-grid{grid-template-columns:1fr}}
  .cmp-grid h3{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
  .room-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  @media (max-width:900px){.room-grid{grid-template-columns:1fr}}
  .room{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .room .t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;margin-bottom:6px}
  .room .t i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .room .r{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink-2);padding:3px 0}
  .room .r b{color:var(--money);font-weight:800;white-space:nowrap}
  .room .r b.bad{color:var(--rose)}
  .room .r button{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:2px 7px;font-size:11px;font-weight:700;cursor:pointer}
  .room .r button:hover{background:var(--primary-soft)}

  /* drawer */
  .drawer{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(30,27,46,.08)}
  .drawer .in{max-width:1500px;margin:0 auto;padding:12px 20px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
  @media (max-width:900px){.drawer .in{grid-template-columns:1fr}}
  .drawer.min .in>*{display:none} .drawer.min .in .dhead{display:flex}
  .dhead{display:flex;align-items:center;gap:10px;grid-column:1/-1;font-weight:800;font-size:13px}
  .dhead .btn{margin-left:auto}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .tab .ic{width:13px;height:13px}
  .tab:hover{background:var(--primary-soft)} .tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .sent{font-size:18px;font-weight:700;line-height:2;letter-spacing:-.01em;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;min-height:40px}
  .sent .k{color:var(--muted);font-weight:600}
  .blank{display:inline-flex;align-items:center;border-bottom:2px solid var(--primary-soft2);background:var(--primary-soft);border-radius:8px 8px 2px 2px;padding:0 4px;color:var(--primary-deep);transition:background .15s}
  .blank:hover,.blank:focus-within{background:#E3DEF7;border-bottom-color:var(--primary)}
  .blank input,.blank select{border:0;background:transparent;font-weight:800;font-size:18px;color:var(--primary-deep);outline:0;padding:0 2px;cursor:pointer;appearance:none;-webkit-appearance:none;line-height:1.6}
  .blank input[type=number]{width:3.6ch;text-align:center;-moz-appearance:textfield}
  .blank input[type=number]::-webkit-inner-spin-button{display:none}
  .blank .ic{width:14px;height:14px;color:var(--primary);opacity:.7}
  .preview{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:12px;color:var(--ink-2)}
  .preview .pill{border-radius:999px;padding:3px 9px;background:#EEF1F6;display:inline-flex;gap:5px;align-items:center}
  .preview .good{background:var(--money-soft);color:var(--money)} .preview .bad{background:var(--rose-soft);color:var(--rose)}
  .comp-right{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .dials{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;grid-column:1/-1}
  @media (max-width:1100px){.dials{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .dial{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .dial .t{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12px;color:var(--ink-2)}
  .dial .t .ic{width:13px;height:13px;color:var(--primary)}
  .dial .v{font-size:16px;font-weight:800;margin:2px 0;color:var(--primary-deep)} .dial .v.zero{color:var(--muted)} .dial .v.neg{color:var(--rose)}
  .dial select{width:100%;border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-weight:700;font-size:12px;margin-bottom:4px}
  input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent;margin:0;width:100%}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--primary-soft2)}
