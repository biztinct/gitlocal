# Owner-retired tenant. Do not restore proxying or deploy ABM without a new request.
server {
    listen 443 ssl;
    server_name abm.payobook.com;
    ssl_certificate /etc/letsencrypt/live/pb-tenant-abm.payobook.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pb-tenant-abm.payobook.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    return 410 '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ABM is retired</title><body><main><h1>ABM is retired</h1><p>This payroll environment is no longer active.</p></main></body></html>';
}
server {
    listen 80;
    server_name abm.payobook.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 410 'ABM is retired. This payroll environment is no longer active.\n'; }
}
