# Include inside the existing payobook.com TLS server. Host-only API ingress.
location ^~ /_internal/recruit-cv/ {
    allow 127.0.0.1;
    allow ::1;
    allow 3.104.113.197;
    deny all;
    client_max_body_size 6m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 185s;
    proxy_send_timeout 185s;
    proxy_next_upstream off;
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:18080/;
    access_log off;
}
