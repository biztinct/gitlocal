# Installed at /etc/nginx/pb-domains/jobs.rize.farm.d/rize.conf (included by the
# pb-domain-attach block). jobs.rize.farm = Rize's public careers site + the
# candidate portal; the staff app lives on people.rize.farm (same database).
location = / { return 302 /jobs; }
location ~ ^/(odoo|bizapp)(/|$) { return 302 https://people.rize.farm$request_uri; }
