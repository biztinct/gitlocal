# Payobook — attendance machines on a plain (non-TLS) connection (CLOCK D12)
#
# Deployed to /etc/nginx/snippets/pb-clock-plain.conf and included as the FIRST
# location of every port-80 server (the apex `_`, `pb-wildcard`, every
# pb-tenant-<host>.conf that pb-tenant-cert writes). Keep the two in step.
#
# WHY: some attendance machines (ZK firmware 2015-2019) cannot negotiate a
# modern TLS chain. They may then send to http://<tenant>.payobook.com/iclock/…
# and ONLY that path is passed through; every other port-80 request still
# redirects to HTTPS. The application refuses a plain request unless the
# company switched "Allow a plain connection" on (pb_clock_allow_plain), and
# tells it apart by the X-Forwarded-Proto header set here. Only a serial, a
# number on the machine, a time and a verify type ever travel this way.
#
# The port-80 server must NOT carry a server-level `return` — that runs before
# any location is chosen. Its redirect lives in `location / { return 301 … }`.
location ^~ /iclock/ {
    proxy_pass http://127.0.0.1:8069;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
    client_max_body_size 4m;
    proxy_read_timeout 60s;
    proxy_redirect off;
    access_log /var/log/nginx/iclock-plain-access.log;
}
